human_notes: |
  차별화: 요양 중 '간병료'와 치유 후 '간병급여'가 서로 다른 제도인데 1일 금액표에
  53,060원·46,250원이 양쪽에 동시에 등장해 생기는 혼동을, 법 제61조 제1항 "치유 후"
  요건으로 갈라서 한 표로 대조한다. 기존 산재 글(장해급여·휴업급여)이 다루지 않은 공백.
  주의: 금액 고시 원문(hwp)은 본문 확인 불가 → 법제처 생활법령정보 2026-09-15 기준으로
  출처·기준일을 명시하고, 확정 금액은 공단 확인 안내 문장을 넣는다.
  장해등급 요건은 계통(신경·정신·흉복부 장기 / 두 눈·두 팔·두 다리)별로 다르므로 뭉개지 말 것.
