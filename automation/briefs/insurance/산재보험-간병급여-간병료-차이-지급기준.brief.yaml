must_cover:
  - 간병급여는 "치유 후" 급여라는 법 제61조 제1항 요건(요양급여 수급자 + 치유 + 실제 간병)
  - 요양 중 간병료(시행규칙 제11·12조)와 치유 후 간병급여(법 제61조)의 분리 — 지급 시점·근거·등급 체계가 다름
  - 같은 금액(53,060원·46,250원)이 두 제도에 동시에 등장하는 이유와 혼동 해소
  - 간병급여 대상 요건 — 상시(장해 1급 계통별), 수시(장해 2급·조정 1급)
  - 간병급여 1일 금액 — 전문간병인 상시/수시, 가족·그 밖의 간병인 상시/수시, 수시는 상시의 3분의 2(시행령 제59조 제3항)
  - 요양 중 간병료 1~3등급 금액 + 2명 이상 동시 간병 20% 가산, 중환자실·회복실 기간 제외
  - 실제 지출액이 기준보다 적으면 실제 지출액만 지급(시행령 제59조 제4항), 재요양 기간 중 미지급(제5항)
  - 청구 서류(간병급여청구서·간병요구도 평가 소견서)와 제출처, 소멸시효 3년(법 제112조)
  - 정보 기준일 명시 — 금액은 법제처 생활법령정보 2026-09-15 기준

required_sources:
