human_notes: |
  차별화: 통상적 경로 일탈·중단 예외 사례 표 + 자차/대중교통/도보 케이스별 인정 여부 매트릭스.
  기준연도 2026 최신 유지 — 출퇴근재해 조항은 2018.1.1 시행이므로 시행 시점과 현행 기준을 혼동하지 말 것.
  "자차 출퇴근은 산재 안 된다", "회사가 신청해줘야 한다"는 통념 반박 단락 필수.
  일탈·중단 예외는 '일상생활에 필요한 행위' 요건 충족 여부가 핵심 — 개인 심부름·유흥 목적과 구분해 설명.
