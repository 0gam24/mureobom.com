  - 경로 일탈·중단은 원칙적 불인정, 단 일상생활상 필요 행위(생필품 구입·병원 진료·자녀·장애인 등하교·위탁 등)는 예외 인정
  - 신청 절차 — 근로복지공단에 요양급여 신청, 출퇴근 경위·경로 입증 방법
  - 흔한 오해 교정 — 자차 출퇴근 대상 여부, 회사 안내 없어도 근로자가 직접 신청 가능 여부

