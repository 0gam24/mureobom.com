human_notes: |
  차별화: 등급별 점수구간 × 이용 가능 급여 × 본인부담률을 한 표로 묶어, 우리 부모님이 몇 등급이면 무엇을 받는지 한눈에.
  기발행 '노인장기요양보험-신청자격' 글과 명확히 분리 — 저 글은 신청 자격·절차, 이 글은 판정 기준·등급·급여에만 집중(자격 자체는 반복 서술하지 말고 링크로 넘길 것).
  검수 포인트: 등급 점수구간(1등급 95점 이상 등)은 시행령·시행규칙 최신 개정 기준으로 대조. 본인부담률·월 한도액은 연도별로 바뀌니 2026 기준 확인.
  자주 틀리는 통념: (1) '신청하면 무조건 등급이 나온다'(점수 미달 시 등급 외), (2) 5등급과 인지지원등급을 혼동 — 점수구간·이용 급여가 다름을 표로 구분.
