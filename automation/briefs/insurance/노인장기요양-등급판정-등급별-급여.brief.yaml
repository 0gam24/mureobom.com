id: insurance-노인장기요양-등급판정-등급별-급여
cluster: insurance
status: published            # draft → approved(사람) → published(자동)

target_query: "노인장기요양보험 등급판정 기준 1등급 5등급 인지지원등급 급여"
search_intent: 정보형     # 등급 기준·점수구간·등급별 혜택을 이해하려는 의도

signal:                  # 스캐너 산출(읽기 전용, 원문 아님)
  score: 45.0
  trend_momentum: 0.47
  question_volume: 0.52
  cluster_fit: 1.0
  freshness: 0.5

must_cover:
  - 등급판정 절차 흐름: 인정신청 → 공단 직원 방문(인정)조사 → 의사소견서 → 등급판정위원회 심의·판정
  - 장기요양인정점수 산정(심신상태 기능 영역 조사 → 요양인정점수)과 등급 구간 표 — 1등급 95점 이상, 2등급 75~95점 미만, 3등급 60~75점 미만, 4등급 51~60점 미만, 5등급(치매특별등급) 45~51점 미만, 인지지원등급(경증치매) 45점 미만
  - 등급별 심신상태 개요(전적으로 도움 필요 ~ 부분적 도움, 5등급·인지지원등급의 치매 관련 요건)
  - 등급별 이용 가능 급여 — 재가급여(방문요양·방문목욕·방문간호·주야간보호·단기보호·복지용구), 시설급여(요양시설 입소 1~2등급 원칙, 3~5등급 예외 인정), 인지지원등급은 주야간보호 등 일부 급여로 제한
  - 월 한도액·본인부담률(재가 15%, 시설 20%, 감경 대상 별도)과 인정 유효기간·갱신
  - (오해 바로잡기) 신청자격(65세 이상 또는 65세 미만 노인성 질병)과 '등급을 받는 것'은 별개 — 신청해도 점수 미달이면 등급 외
  - (오해 바로잡기) 5등급(치매특별등급)과 인지지원등급(경증치매)은 점수구간·이용 급여가 다르다는 구분

required_sources:        # 공식 1차 출처(법령·기관)만. 개인 블로그/커뮤니티 원문 금지. 0건이면 발행 차단
  - "노인장기요양보험법 제15조(등급판정 등)·제17조 및 시행령 제7조(등급판정 기준) (국가법령정보센터)"
  - "노인장기요양보험법 시행규칙 (장기요양인정 점수·등급 구간) (국가법령정보센터)"
  - "국민건강보험공단 노인장기요양보험 등급판정 안내 (longtermcare.or.kr)"

