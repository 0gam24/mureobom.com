human_notes: |
  차별화: 기발행 산재 6편은 모두 "다친 근로자가 받는 급여"(휴업·장해·유족·출퇴근·신청절차)
  쪽이고, 보험료를 내는 쪽의 할인 제도인 산재예방요율제는 327편 중 단 한 편도 다루지
  않았다(예방요율·재해예방활동·개별실적요율 전부 0건). 게다가 2026년 10월 8일 시행
  개정으로 "중대재해 → 인정취소 → 할인분 소급 재산정"이 새로 생겼고, 부칙 적용례가
  시행일 이후 발생분으로 끊기는 점은 어디에도 정리돼 있지 않다. 이 한 편의 정보 이득은
  (1) 취소 사유 3가지가 결과가 전부 다르다는 점, (2) 중대재해인데도 취소에서 빠지는
  재해 목록(시행령 + 고시 두 겹), (3) 부칙 적용례 날짜 경계다.
  인하율 퍼센트(흔히 인용되는 20%·10%)는 시행령 계산식이 이미지로만 공개돼 1차 출처로
  확인되지 않았으므로 쓰지 않는다. 법정 상한인 "100분의 30의 범위"와 중복 시 더 높은
  인하율 적용(시행령 제18조의2 제3항)까지만 쓴다. 금액 추정·개별 사업장 요율 계산 금지.
  특정 사업장의 산재 책임·과태료·형사책임 판단은 하지 않는다(법률 자문 금지).
