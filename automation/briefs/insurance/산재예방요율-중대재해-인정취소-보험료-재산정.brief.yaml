  cluster_fit: 1.0
  freshness: 1.0

must_cover:
  - 산재예방요율이 무엇인가 - 50명 미만 제조업·임업·위생 및 유사서비스업·하수도업 사업장이 재해예방활동을 인정받으면 다음 보험연도 산재보험료율을 법정 30% 범위에서 인하받는 특례(징수법 제15조 제5항, 시행령 제15조 제4항)
  - 인정받는 재해예방활동 2종과 인정기간 - 위험성평가 실시(3년), 사업주교육 이수 + 산재예방계획 수립(1년) (시행령 제18조의2 제1항·제18조의3 제1항)
  - 2026년 10월 8일 시행 개정의 핵심 - 중대재해로 인정이 취소된 경우도 할인받은 기간 산재보험료를 다시 산정해 부과(징수법 제15조 제9항, 법률 제21532호)
  - 개정 전후 차이 - 종전에는 거짓·부정한 방법으로 인정받은 경우만 재산정 부과 대상이었다
  - 부칙 적용례 - 2026년 10월 8일 이후 인정기간 중 발생한 중대재해부터 적용(법률 제21532호 부칙 제2조)
  - 중대재해의 범위 - 사망자 1명 이상 / 3개월 이상 요양 부상자 동시 2명 이상 / 부상자·직업성 질병자 동시 10명 이상(산업안전보건법 제2조 제2호, 시행규칙 제3조)
  - 취소 대상에서 빠지는 재해 - 행사 중·특수장소·요양 중·제3자 행위·출퇴근 사고(시행령 제18조의5 제1항) + 고시가 정한 방화·폭행·도로 교통사고·천재지변·진폐증 등(산재예방요율제 운영에 관한 규정 제11조 제2항)
  - 취소 사유별 결과가 다르다 - 제8항 제3호 사유(산업재해 공표 사업장·위험성평가 기준 미유지)는 재산정 부과가 아니라 인정기간비율로 다음 보험연도 요율 산정(제10항)
  - 취소일과 후속 제한 - 인정취소일은 취소사유 발생일, 취소된 사업주는 취소일부터 1년간 재해예방활동 신청 불가(고시 제11조 제1항·제8항)
  - 사업주가 지금 확인할 것 - 인정기간 남은 날짜, 위험성평가 인정기준 유지 여부, 통지서 수령 시 대응 경로(안전보건공단 광역본부·지사, 근로복지공단)

required_sources:
  - "고용보험 및 산업재해보상보험의 보험료징수 등에 관한 법률 제15조(보험료율의 특례) · 국가법령정보센터 (law.go.kr)"
  - "같은 법 법률 제21532호(2026.4.7. 일부개정) 개정이유 및 부칙 · 국가법령정보센터 (law.go.kr)"
  - "같은 법 시행령 제15조·제18조의2·제18조의3·제18조의4·제18조의5 · 국가법령정보센터 (law.go.kr)"
  - "산업안전보건법 제2조 제2호 및 시행규칙 제3조(중대재해의 범위) · 국가법령정보센터 (law.go.kr)"
  - "산재예방요율제 운영에 관한 규정(고용노동부 고시) · 국가법령정보센터 (law.go.kr)"

