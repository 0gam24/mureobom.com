must_cover:
  - 개편의 축 자체 - 법률 제21472호(2026.3.17 공포)가 고용보험 및 산업재해보상보험의 보험료징수 등에 관한 법률을 개정해, 보험료 산정 기준을 "전년도 월평균보수"에서 "해당 연도의 월 보수"로 바꾸고 근로복지공단이 근로자의 국세소득 자료를 보험료 산정에 활용할 수 있게 했다는 점. 개정이유 원문("사업주가 소득 자료가 포함된 국세신고와 별개로 근로복지공단에 고용·산재보험료 산정을 위한 근로자 보수를 따로 신고하여야 하는 불편을 줄이기 위하여")을 출발점으로 삼는다
  - 시행일과 부칙 적용례 - 국가법령정보센터 기준 시행일(확인 필요: 2027.1.1로 표시됨)과 부칙의 적용례·경과규정. 어느 보험연도 보험료부터 새 방식이 적용되는지, 시행 전 기간분 정산은 종전 규정으로 처리되는지를 부칙 원문으로 확인한다. 부칙을 확인하지 못하면 적용 범위를 추정해 쓰지 말고 "원문 확인 필요"로 남긴다
  - 종전 구조가 왜 불편했는지의 구체 - 현행은 월별보험료를 전년도 월평균보수로 먼저 부과하고, 다음 해 3월 15일까지 보수총액을 신고받아 실제 보수와의 차액을 정산하는 개념상 2단계 구조다(부과 → 사후 정산). 연중 임금이 오르거나 내리면 그 해 보험료가 실제 소득과 어긋나 있다가 정산 때 한꺼번에 추가 납부·환급으로 돌아온다는 점이 체감 포인트. 조문 번호와 신고기한은 반드시 원문으로 확인하고, 확인 못 한 조문 번호는 쓰지 않는다
  - 바뀌면 무엇이 달라지는가 - 해당 연도 월 보수를 기준으로 부과하므로 보험료가 실제 소득을 그 해에 반영하고, 사후 정산으로 생기던 목돈 추가 납부·환급의 진폭이 줄어든다는 방향. 다만 "정산이 완전히 없어진다", "보수총액 신고가 폐지된다"는 단정은 조문으로 확인되지 않으면 쓰지 말고, 확인된 범위(산정 기준 변경 + 국세자료 활용 근거 마련)까지만 서술한다
  - 건강보험·국민연금의 기존 방식과의 대비 - 건강보험 직장가입자는 보수월액으로 부과하고 다음 해 연말정산 방식으로 정산하며, 국민연금은 기준소득월액을 매년 7월에 조정한다. 사회보험 4종이 "실소득 반영 시점"을 각각 다르게 잡고 있고, 이번 개정이 고용·산재를 그 가운데 어디로 옮기는지의 좌표를 보여주는 것이 이 글의 핵심 정보 이득
  - 근로자가 체감하는 지점 - 고용보험료는 근로자와 사업주가 나누어 부담하므로 산정 기준이 바뀌면 급여에서 공제되는 월 금액의 움직임도 달라진다(산재보험료는 사업주 전액 부담이라 근로자 공제와 무관하다는 구분을 분명히). 어느 쪽 부담인지 헷갈리는 지점을 바로잡는다
  - 지금 할 수 있는 확인 - 고용·산재보험 토탈서비스에서 본인의 보험료 부과 내역과 정산 내역을 확인하는 경로 수준으로만 안내하고, 화면 단계나 메뉴명을 확인 없이 단정하지 않는다

