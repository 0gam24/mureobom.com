human_notes: |
  차별화: 고용·산재보험료를 다루는 글은 전부 "요율 몇 퍼센트, 누가 부담"에서
  끝난다. 이 글의 축은 요율이 아니라 "보험료를 무엇으로 계산하는가"가 법률
  제21472호로 전년도 월평균보수에서 해당 연도 월 보수로 옮겨간다는 사실이다.
  요율이 그대로여도 산정 기준이 바뀌면 월 공제액의 움직임과 정산 진폭이 달라진다
  는 점을 설명한 글이 거의 없다.

  두 번째 축: 사회보험 4종의 "실소득 반영 시점" 좌표계. 건강보험은 보수월액 +
  다음 해 연말정산, 국민연금은 매년 7월 기준소득월액 조정, 고용·산재는 전년도
  월평균보수 + 다음 해 정산이었다. 이번 개정이 고용·산재를 어디로 옮기는지를
  한 표로 보여주는 것이 유일한 정보 이득이다. 인포그래픽은 이 좌표 표로 간다.

  세 번째 축: 부담 주체 구분. 고용보험료는 근로자·사업주 분담이라 산정 기준
  변경이 급여 공제에 닿지만, 산재보험료는 사업주 전액 부담이라 근로자 공제와
  무관하다. 이 둘을 한 덩어리로 "고용·산재보험료"라 부르면서 생기는 오해를
  명확히 가른다.

  주의: 이미 발행된 insurance/산재예방요율-중대재해-인정취소-보험료-재산정
  (법률 제21532호, 2026.10.8 시행)과 다른 개정이다. 두 법률 번호를 혼동하지 마라.
  제21532호는 재해예방활동 인정 취소 시 산재보험료 재산정이고, 이 글의 주제는
  제21472호다. 재해예방요율 이야기로 번지지 마라(카니발리제이션).

  확인 못 한 것: 부칙 적용례, 보수총액 신고 의무의 존속 여부, 월별보험료 산정
  조문 번호. 전부 원문으로 확인한 범위 안에서만 쓴다. "보수총액 신고 폐지",
  "정산 폐지" 같은 단정은 조문 확인 없이는 금지. 개인별 보험료 금액을 계산해
  주거나 유불리를 단정하지 마라(일반정보 고지 유지).
