human_notes: |
  차별화: 납부예외·납부유예·미납·면제 4개념을 한 표로 구분 + "예외 기간은
  추납으로 메우지 않으면 그대로 연금 손실"이라는 실질 불이익을 수치 예시로 각인.
  기준연도(2026) 명시. 납부예외 1회 최대 3년·사유 지속 시 연장은 자주 틀리는 통념이니
  법령·공단 안내로 재확인. "납부예외 = 면제/봐주는 것"이라는 오해를 첫 단락에서 반박.
  지역가입자가 소득 없어도 자동으로 빠지지 않고 신청·확인이 필요한 케이스를 놓치지 말 것.
