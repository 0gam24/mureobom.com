human_notes: |
  차별화: 기발행 장기요양 3편(등급판정·본인부담금 감경·신청자격)은 모두 "한도 안에서
  얼마 쓰나"를 다루지만, 가족휴가제는 유일하게 월 한도액 밖에서 쓰는 급여라는 점을
  정면에 세운다. 단기보호를 급여 종류 나열로만 스쳐 지나간 기존 글과 검색의도가 겹치지
  않는 롱테일.
  2026년 확대분(연 12일·종일방문요양 24회)은 보건복지부 보도자료로 확인된 수치만 쓴다.
  확인 못 한 기관별 수가·일당 금액은 쓰지 말고 공단 조회 경로로 넘긴다.
  돌봄 대상자 건강 상태에 대한 의학적 판단·개인 맞춤 조언 금지.
