  - 가족휴가제가 무엇인가 - 중증·치매 수급자 가족의 돌봄 공백을 메우는 별도 급여라는 정의
  - 핵심 차별점 - 월 이용 한도액과 무관하게 별도로 쓸 수 있다는 점(한도 소진과 무관)
  - 2026년 확대 내용 - 이용 가능일수 연 11일에서 연 12일(단기보호 11일→12일, 종일방문요양 22회→24회)
  - 단기보호와 종일방문요양의 차이(기관 입소 보호 vs 12시간 이상 가정 방문)와 선택 기준
  - 이용 대상 범위 - 중증(1·2등급) 또는 치매 수급자 기준
  - 신청·이용 절차(장기요양기관과 급여계약, 공단 지사 문의 경로)와 본인부담률 15%·감경 대상
  - 2026년 등급별 재가급여 월 한도액 증액(1만 8,920원~24만 7,800원)과 가족휴가제의 관계
  - 흔한 오해 바로잡기 - 한도액을 다 써도 가족휴가제는 남아 있다 / 신청서 따로 내는 제도가 아니다

