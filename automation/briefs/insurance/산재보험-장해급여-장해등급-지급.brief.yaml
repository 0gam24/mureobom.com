human_notes: |
  차별화: 장해보상연금 vs 일시금 선택 등급 구분표 + 평균임금 기준 등급별 지급일수 + 장해등급 재판정 제도.
  기준연도 2026, 지급액은 '평균임금 × 등급별 일수' 구조만 설명하고 구체 금액 단정은 피할 것(평균임금 개인차).
  자주 틀리는 통념: 낮은 등급도 무조건 일시금이 아니며 등급대별 연금/일시금 선택권 존재, '치유'는 완치가 아니라
  치료효과 더 기대 어려운 상태로 증상 고정 시점을 뜻한다는 점 명확히.
