must_cover:
  - 장해급여 개념 - 치유(치료 종결) 후에도 남은 신체 장해에 대한 보상이라는 점과 '치유' 시점의 의미
  - 장해등급 체계 - 제1급부터 제14급까지 부위별·정도별로 결정되는 방식(시행령 별표 기준)
  - 장해보상연금 vs 장해보상일시금 선택 기준 - 등급별 연금/일시금 구분, 중증(상위등급)은 연금 원칙
  - 지급액 산정 - 평균임금 × 등급별 지급일수(연금일수/일시금일수) 구조
  - 신청 절차 - 장해진단·장해급여 청구·근로복지공단 장해등급 심사 흐름
  - 재요양·장해등급 재판정 제도 - 재판정 대상 등급과 등급 변경 시 급여 조정
  - 흔한 오해 정리 - 등급이 낮으면 무조건 일시금인지, 연금과 일시금 중복 여부 등 통념 바로잡기

