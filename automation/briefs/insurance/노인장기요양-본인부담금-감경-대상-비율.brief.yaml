  표·인포그래픽으로 명확히. 감경 대상은 건강보험료 순위 등 기준·고시로 바뀌므로 법령·복지로 원문 기준 명시.
  개인별 감경 여부·비율은 소득·재산에 따라 달라 단정 금지, 국민건강보험공단(장기요양)·복지로 확인 안내.
  출처 도메인 제약: 공단(nhis)·복지부(mohw) 화이트리스트 미포함 → law.go.kr 법령 + bokjiro.go.kr 안내로 검증.
