human_notes: |
  차별화: 언론은 "월 1,100원 오른다"만 반복한다. 이 글은 (1) 고지서에 실제로 찍히는
  값은 소득 대비 0.9994%가 아니라 건강보험료 대비 13.90%라는 2중 표기 구조를 풀어
  본인 공제액을 직접 계산하게 하고, (2) 같은 회의에서 1·2등급 재가급여 한도액이
  15% 올라 보험료 상승률(5.78%)보다 급여 확대폭이 큰 구간이 있다는 비대칭을 숫자로
  대조한다. 기발행 장기요양 4편(신청자격·등급판정·본인부담금 감경·가족휴가제)은 모두
  "한도 안에서 무엇을 받나"이고 보험료율·고지서 계산을 다룬 글은 없다.
  주의: 기발행 4대보험 글이 2026년 장기요양을 건강보험료의 12.95%로 적고 있으나
  보건복지부 보도자료 기준 2026년은 소득 대비 0.9448%다. 신규 글은 보도자료 수치만 쓴다.
  3~5등급 한도액은 보도자료 본문에 없으므로 확인되지 않으면 쓰지 않는다(인상폭 범위만 인용).
  개인 맞춤 세무·의학 판단 금지. 돌봄 필요도에 대한 의학적 조언 금지.
