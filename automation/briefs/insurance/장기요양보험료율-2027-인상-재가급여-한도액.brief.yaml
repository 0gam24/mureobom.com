must_cover:
  - 2027년 소득 대비 장기요양보험료율 0.9994%(2026년 0.9448%, 전년대비 5.78% 인상) 확정 사실과 결정 주체·일자(제5차 장기요양위원회, 2026년 10월 30일)
  - 요율이 두 가지로 표기되는 이유 - 고지서에 찍히는 값은 건강보험료 대비 13.90%이고, 소득 대비 0.9994%는 건강보험료율 7.19%를 곱해 환산한 값이라는 구조
  - 직장가입자 본인부담 계산 - 보수월액 기준 2026년과 2027년 공제액 비교(절반은 사업주 부담)
  - 세대당 월평균 보험료 1만 9,029원에서 2만 129원으로 1,100원 증가
  - 보험료만 오르는 게 아니라는 반대쪽 - 1·2등급 재가급여 월 한도액 인상(1등급 251만 2,900원→289만 1,400원, 2등급 233만 1,200원→268만 2,300원), 등급별 인상폭 2만 3,880원~37만 8,500원
  - 방문요양(3시간) 월 이용 가능 횟수 변화 - 1등급 44회→48회, 2등급 40회→45회
  - 함께 조정된 수가·가산 - 종일방문요양 17만 7,680원→20만 6,030원, 간호사 방문 가산 3,000원→5,000원, 도서·벽지 교통비 30% 인상, 휴일 가산 60%
  - 적용 시점과 지역가입자·피부양자에게 미치는 영향, 본인부담률 15%(재가) 구조상 한도액 인상이 본인부담에 주는 영향
  - 확인 경로 - 공단 자격·보험료 조회와 재가급여 계산기로 본인 금액 확인

