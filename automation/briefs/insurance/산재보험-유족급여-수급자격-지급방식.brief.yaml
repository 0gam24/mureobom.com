  - 유족보상일시금 선택 가능 경우와 연금과의 관계(연금 수급권자가 없을 때 등)
  - 신청 방법·창구(근로복지공단)와 필요 서류, 소멸시효
  - 흔한 오해(산재 유족급여와 국민연금 유족연금 중복 수령 가능 여부, 사망이 업무상 재해로 인정돼야 한다는 점) 바로잡기

