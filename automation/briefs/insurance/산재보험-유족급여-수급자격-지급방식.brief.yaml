human_notes: |
  차별화: '산재 유족급여(유족보상연금)'와 '국민연금 유족연금'을 첫머리에서 명확히 분리하고
  (가장 흔한 혼동), 수급권자 순위·생계요건을 체크리스트로, 유족보상연금 지급 구조(기본금액+가산금액)를
  표 한 장으로 정리한다. 기존 산재 글(신청·휴업급여·장해급여)과 겹치지 않게 '사망 시 유족급여'에만 집중.
  중복 수령 가능 여부는 오해 바로잡기로 정확히 서술(산재 유족급여는 국민연금 유족연금과 별개 제도).
  급여기초연액·가산율 등 수치는 최신 산재보험법 시행령 기준으로만 명시, 창작 금지. 단정적 지급 확정 약속 금지.
