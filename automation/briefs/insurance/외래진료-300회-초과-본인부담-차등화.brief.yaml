human_notes: |
  차별화: 기발행 306편에서 "차등화"·"365회"·"300회" 문자열 0건(grep 확인). 그리고 이 사안을 다룬
  기사 수십 건은 전부 "300회 넘으면 90%"라는 헤드라인 한 줄에서 멈춘다. 이 글의 각도는 두 가지다.
  (1) 대상 규모를 숫자로 먼저 닫아준다 — 4,840만 명 중 7,765명(약 0.016%). "병원 자주 가는데 나도?"
      라는 불안이 실제로는 거의 전부 기우라는 것을 통계로 해소하고, 그 다음에 진짜 해당되는 소수가
      확인해야 할 것으로 넘어간다. 기사들은 이 분모를 거의 싣지 않는다.
  (2) 진짜 비용은 90%가 아니라 '상한제가 받아주지 않는다'는 점이다. 공단 안내 원문에 차등화 90%
      진료건이 본인부담상한제 산정에서 제외된다고 명시돼 있다. 평소라면 소득 1분위 90만원, 10분위
      843만원을 넘는 본인부담은 사후환급으로 돌아오는데 이 부담분은 그 계산에 들어가지 않는다.
      이게 제도의 실제 설계 의도이자 대중 보도에 빠져 있는 지점 — 이 글의 핵심 정보 이득.
  정보 이득 추가:
  (3) 2026년과 2027년의 기준이 다르다는 이중 구간. 지금 진료받는 2026년분은 365회 기준이고
      300회는 2027-01-01 진료분부터다. 지금 "300회 넘었으니 90%"라고 오해하지 않도록 분리.
  (4) 예외가 당연제외 + 심의예외 2단이라는 구조. 당연제외 목록에 없어도 과다의료이용심의위원회
      경로가 남아 있다는 점을 분리해 설명.
  검수 포인트:
  - 2026-09-08 보도자료 첨부 PDF 원문 5쪽 전문을 추출해 수치를 직접 대조했다. 기사 인용 금지,
    복지부 원문 수치만 사용.
  - OECD 비교는 2024년 17.9회 / 6.6회만 쓴다. 2024-06-30 자료의 2021년 15.7회 / 5.9회와 혼용 금지.
  - 상한제 제외 문구는 공단이 현행 '365회 초과'로 표기 중이다. 2027년 300회로 바뀐 뒤의 문구는
    아직 게시되지 않았으므로 "현재 공단 안내는 365회 초과 기준으로 적혀 있다"로 사실만 적고
    2027년 이후를 단정하지 마라.
  - law.go.kr이 JS 렌더링이라 시행령 별표2 조문 원문을 확인하지 못했다. 별표 호·목 번호,
    횟수 산정 제외 진료 목록, 의료급여 적용 여부, 심의위원회 신청 절차·서류는 미확인이므로
    본문에 쓰지 마라(research.yaml not_verified 참조).
  - 공포 전 단계임을 정확히 표기 — "국무회의 의결(2026-09-08), 관보 게재를 거쳐 공포 예정".
    이미 공포·확정된 것처럼 쓰지 마라.
  - 의료 이용을 줄이라는 권유·훈계 톤 금지. 제도 설명과 절차만. 개인 의학적 판단 단정 금지.
  - 카니발리제이션 대조 완료: insurance 54편 중 본인부담상한제 2편은 '환급금 받기'가 의도이고
    이 글은 '과다 외래이용 시 부담 증가'로 별개. 건강보험-산정특례는 예외 대상 설명에서
    내부링크로 연결.
