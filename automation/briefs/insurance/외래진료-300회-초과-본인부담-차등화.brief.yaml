must_cover:
  - 현행 기준과 개정 기준의 구분 — 2026년 진료분은 연 365회 초과(2024-07-01 시행), 2027-01-01부터 연 300회 초과
  - 적용 시작 회차가 '301회째 외래진료부터'라는 점 (300회까지는 평소 본인부담률)
  - 횟수 산정 기간이 매해 1월 1일~12월 31일로 리셋된다는 점
  - 연 300회가 주당 약 6회 수준이라는 체감 환산
  - 실제 대상 규모 — 2025년 외래 이용자 약 4,840만 명 중 300회 초과 7,765명, 초과자 연평균 약 344.7회, 연 1,775회 극단 사례
  - 당연 제외 대상 — 아동, 임산부, 산정특례 대상 중 중증장애인, 중증·희귀·중증난치질환으로 해당 질환 치료를 받는 환자
  - 당연 제외에 해당하지 않아도 공단 과다의료이용심의위원회가 의학적 필요성을 심의해 예외를 인정할 수 있다는 2단 구조
  - 핵심 정보 이득 — 90% 부담분은 본인부담상한제 산정에서 제외되어 사후환급으로 되돌아오지 않는다(공단 안내 원문 기준)
  - 2026년 본인부담상한액 분위별 금액을 대비로 제시해 '상한제가 받아주지 않는다'의 무게를 보여줄 것
  - 한국 1인당 연간 외래 17.9회(2024) vs OECD 평균 6.6회 — 개정 배경
  - 같은 개정령의 곁가지 두 건 — 2026-12-24 요양급여내역 확인시스템(심평원 위탁, CT·MRI 우선), 2026-10-01 정산 추가보험료 분할납부 문턱 완화(보수월액보험료 하한액 이상, 2026년 본인부담분 1만 80원)
  - 통념 바로잡기 — "병원 자주 가면 다 90% 낸다"(아님, 300회 초과분만), "만성질환자는 무조건 걸린다"(산정특례 해당 질환 치료는 제외)

