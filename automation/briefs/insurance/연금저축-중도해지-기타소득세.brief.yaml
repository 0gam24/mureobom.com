must_cover:
  - 연금저축 중도해지 시 세금 구조 — 세액공제 받은 납입액 + 운용수익에 기타소득세 16.5%(지방세 포함) 부과
  - 왜 불이익인가 — 그동안 받은 세액공제(13.2%·16.5%) 혜택을 사실상 반환하는 셈
  - 세액공제 받지 않은 납입액은 과세 제외 — 한도 초과 납입분 등은 세금 없이 인출 가능
  - 부득이한 사유(천재지변·사망·해외이주·파산·질병 등) 인출은 연금소득세(3.3~5.5%) 저율 분리과세
  - 중도해지 대신 대안 — 납입 중지, 담보대출, 계좌이전(연금저축 간 이전)으로 세제 유지
  - 소득세법상 근거 — 연금계좌 세제, 기타소득 분리과세 조항

required_sources:        # 공식 1차 출처만. 0건이면 발행 차단
  - "소득세법 제20조의3·제21조·제64조의4 등 연금계좌 및 기타소득 과세 (국가법령정보센터 law.go.kr)"
