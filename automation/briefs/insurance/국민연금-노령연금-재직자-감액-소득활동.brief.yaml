human_notes: |
  차별화: '연금 받으면서 일하면 깎이나?'라는 소득활동 감액(국민연금법 제63조의2)을 정면으로 다룸.
  기발행 '조기수령-감액률'(수급 앞당김 감액)과 원인·조항이 다름을 명확히 구분.
  A값 초과소득월액 구간별 감액률(5~25%, 1/2 상한)을 표/인포그래픽으로. 수급개시 후 5년 한시 적용 강조.
  연기연금과의 선택 관계 안내(감액 대신 가산). 구체 감액액은 개인별 상이 → 단정 금지, 공단 확인 안내.
