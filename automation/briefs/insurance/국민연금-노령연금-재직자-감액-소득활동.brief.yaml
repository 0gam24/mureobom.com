must_cover:
  - 소득활동에 따른 노령연금 감액(재직자 노령연금) 제도의 근거(국민연금법 제63조의2)와 적용 대상 기간(수급개시연령 ~ 이후 5년간)
  - 감액 기준선(A값, 연금 수급 전 3년간 전체 가입자 평균소득월액)과 '초과소득월액' 개념
  - 초과소득월액 구간별 감액률 구조(구간별 5%~25%, 최대 노령연금액의 1/2 한도)
  - 감액 대상 소득의 범위(근로소득·사업소득 합산, 사업소득에서 필요경비 공제 후 기준) 및 제외되는 소득(이자·배당·연금 등)
  - 감액을 피하거나 늦추는 선택지(연기연금 신청으로 감액 대신 가산) 개요
  - 흔한 오해 바로잡기("연금 받으면서 일하면 연금이 아예 끊긴다", "소득이 조금만 있어도 절반 깎인다")

required_sources:         # 공식 1차 출처만. WebFetch 화이트리스트 도메인. 0건이면 발행 차단
  - "국민연금법 제63조의2(소득활동에 따른 노령연금액) / 시행령 (국가법령정보센터 law.go.kr)"
  - "국민연금공단 소득활동에 따른 노령연금·재직자 노령연금 안내 (국민연금공단 nps.or.kr)"
  - "국민연금공단 연기연금·노령연금 급여 안내 (국민연금공단 nps.or.kr)"

