  - 국민연금 연계감액(A급여 연계 감액) 원리 - 왜 국민연금 수급액이 기초연금에 영향을 주는가
  - 감액 대상 기준(국민연금 급여액이 기준연금액의 일정 배수를 넘을 때 감액 시작)
  - 감액 산식과 하한(기초연금이 기준연금액의 최소 50%까지만 감액되고 그 아래로는 안 깎임)
  - 부가연금액 등 소득역전방지 감액과 국민연금 연계감액의 구분
  - "국민연금 많으면 기초연금 한 푼도 못 받는다"는 오해 반박(최소 지급 보장)

