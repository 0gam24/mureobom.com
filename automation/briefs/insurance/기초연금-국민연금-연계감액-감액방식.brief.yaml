human_notes: |
  차별화: "국민연금 많으면 기초연금 못 받는다"는 통념을 연계감액 산식+하한(최대 50%
  감액, 최소 지급 보장)으로 정면 반박. 기발행 기초연금-수급자격(선정기준액 관점)과
  달리 '국민연금과의 연계로 얼마나 깎이는가'에만 초점. 연도별로 바뀌는 기준연금액·
  선정기준액은 2026 최신값 명시하되 단정적 수령액 약속 금지, 복지로 모의계산 연결.
