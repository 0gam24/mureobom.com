must_cover:
  - 피보험자격 확인청구 제도의 정의와 존재 이유(사업주 신고 누락·오류로 근로자가 고용보험 혜택에서 배제되지 않도록 하는 구제 장치)
  - 근거 조문 확정 표기 — 고용보험법상 피보험자격 확인 조항과 시행규칙 서식 근거(researcher가 조문 번호를 1차 출처로 확정한 뒤에만 기재)
  - 청구 사유 3유형(취득·상실 신고 누락 / 피보험기간 정정 / 상실사유 등 신고사항 변경)
  - 청구권자와 청구 시점(재직 중·퇴사 후 모두 가능한지, 사업장 폐업·사업주 연락두절 시에도 가능한지)
  - 처리 기관(근로복지공단)·처리 기간·수수료·신청 경로(인터넷·방문·팩스·우편)와 필요 서류
  - 소급 인정 범위의 한계(신청일 기준 소급 3년 원칙)와 그 근거 — 1차 출처로 확인되지 않으면 단정하지 말고 공단 확인 안내로 대체
  - 입증 자료로 무엇이 쓰이는지(근로계약서, 급여이체 내역, 근무 사실을 보여주는 객관적 자료 등)
  - 확인청구가 인정된 뒤 이어지는 효과(피보험단위기간 산입 → 실업급여 수급요건 충족 여부 판단으로 연결)와 소급분 보험료 처리
  - 적용 제외 근로자(고용보험 자체가 적용되지 않는 경우)와 확인청구로도 해결되지 않는 사례 구분
  - 통념 바로잡기("사업주가 동의해야만 가능하다", "퇴사했으면 이미 늦었다")

