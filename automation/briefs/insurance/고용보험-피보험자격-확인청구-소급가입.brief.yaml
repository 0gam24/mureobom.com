human_notes: |
  차별화: 기발행 실업급여 7편은 전부 "고용보험에 이미 가입돼 있다"를 전제로 한다. 이 글은 그 전제가
  깨진 사람(사업주가 신고를 누락한 근로자)이 쓸 수 있는 유일한 구제 절차를 다룬다. 사이트 내에서
  실업급여 수급요건의 선행 조건을 설명하는 글이 없다는 공백을 정확히 메우는 각도.
  검수 포인트:
  - 근거 조문 번호가 출처마다 갈린다(정부24 안내는 고용보험법 제11조 제1항·시행규칙 제12조를 제시,
    통용 설명은 제17조를 인용). researcher가 law.go.kr 조문 원문으로 확정하기 전에는 조문 번호를
    본문에 쓰지 않는다. 확정 못 하면 조문 번호 없이 제도 명칭과 소관 기관만 서술한다.
  - "소급 3년"은 널리 통용되지만 1차 출처 확인 전에는 단정 금지. 확인되면 근거와 함께, 확인 안 되면
    "기간 제한이 있으므로 공단에 확인" 수준으로만 서술.
  - 개별 사건의 인정 여부를 단정·보장하지 않는다(F-*). "청구하면 반드시 소급된다" 류 표현 금지,
    사실관계·입증자료에 따라 달라진다는 원칙만 서술하고 근로복지공단(1588-0075) 확인 안내로 마무리.
  - 사업주를 상대로 한 법적 조치·처벌 수위는 이 글의 범위 밖. 확인청구 절차에 집중한다.
