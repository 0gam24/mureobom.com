human_notes: |
  차별화: 연계 지급연령을 '65세'로 뭉뚱그리는 2차 자료와 달리, 부칙 제3조의 출생연도별 연령표(1952년 이전 60세부터 1969년 이후 65세)와 그 단서(직역 퇴직연금수급연령이 더 높으면 연계퇴직연금만 늦게 시작)를 조문으로 제시해 '국민연금 몫과 직역연금 몫의 개시 시점이 갈릴 수 있다'는 실제 판단 지점을 다룬다.
  정보 이득 2개 이상: (1) 연계대상 기간에서 임의계속가입·군복무·출산 크레딧 기간이 제외된다는 제7조①1호 괄호 조항 — 합산해도 10년이 안 되는 이유가 여기서 나온다. (2) 반납금 분할 60회·복리·연체이자 정기예금 최고금리 2배·6개월 미납 시 취하 간주라는 시행령 수치.
  주의: 연계노령연금 지급연령이 국민연금 노령연금 개시연령과 같은 스케줄이라는 점을 확인했으므로 '연계하면 5년 늦어진다'는 식의 오류를 쓰지 않는다.
