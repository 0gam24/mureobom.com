  - "연계 신청 시점 2가지와 각 전제조건(연금연계법 제8조①1호·2호), 이미 퇴직급여를 받은 경우 반납 후 신청(제8조②)"
  - "연계기간 10년(군인연금 복무기간 포함 시 20년) + 출생연도별 지급연령(부칙 제3조)"
  - "부칙 제3조 단서: 직역연금 퇴직연금수급연령이 더 높으면 연계퇴직연금 개시가 늦어져 두 급여 개시 시점이 갈린다"
  - "연계대상 기간에서 제외되는 국민연금 기간: 임의계속가입(제13조)·군복무크레딧(제18조)·출산크레딧(제19조), 중복기간 제외(제7조②)"
  - "연계노령연금액 산정: 국민연금 가입기간 10년 미만이면 기본연금액 × 가입기간/20 (제11조2호)"
  - "반납금 납부 조건: 분할 60회 이내·65세 전 완납(시행령 제3조③), 복리(제9조), 연체이자 정기예금 최고금리의 2배(제5조②), 6개월 이상 미납 시 연계신청 취하 간주(법 제8조④)"
  - "연계 신청의 소멸시효 중단 효력(제8조의3), 재직기간 합산 인정 시 종전 연계 취소(제8조의2)"
  - "연계기간 10년 미달로 지급연령 도달 시 반환일시금·퇴직일시금 + 이자(제19조)"
  - "2021.8.17 개정 적용례: 직역연금 퇴직일이 2016년 1월 2일 이후인 사람부터(부칙 제2조)"
