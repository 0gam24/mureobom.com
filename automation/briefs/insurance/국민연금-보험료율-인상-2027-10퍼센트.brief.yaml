human_notes: |
  차별화: 보험료율 인상을 다루는 글은 대부분 "9%에서 13%까지 오른다"는 연도별
  표 한 장에서 끝난다. 이 글의 축은 표가 아니라 "같은 0.5%p가 가입자 유형에
  따라 체감 증가분이 두 배 차이 난다"는 비대칭이다. 사업장가입자는 절반만
  부담하므로 0.25%p, 지역·임의가입자는 전액이라 0.5%p가 그대로 온다. 이걸
  기준소득월액 구간별 금액으로 환산해 보여준 글이 사실상 없다.

  두 번째 축: 요율 인상과 기준소득월액 상·하한 조정이 서로 다른 달에 움직인다는
  점. 요율은 1월 1일, 상·하한은 7월 1일이다. 상한 구간 가입자는 요율 인상분이
  상한액 기준으로 고정되고, 7월에 상한이 또 오르면 한 해에 두 번 부담이 바뀐다.
  이 두 축이 겹치는 좌표를 설명하는 것이 유일한 정보 이득이다. 인포그래픽은
  연도별 요율 계단 + 유형별 본인부담 비율 대비로 간다.

  주의: 이미 발행된 insurance/국민연금-기준소득월액-7월-조정은 상·하한 조정이
  주제이고 본문에 요율을 9%로 적고 있다(2026년 9.5% 이전 시점 기준). 이 글은
  요율 자체의 연도별 변경이 주제이므로 검색의도가 다르다. 다만 그 글을 내부링크로
  끌어와 9% 서술과 충돌하게 만들지 마라. 임의가입 글(9.5% 명시)과 4대보험 요율
  글로 연결한다.

  확인 못 한 것: 부칙 조문 번호와 연도별 1천분의 수치, 소득대체율 43%의 적용
  범위(소급 여부), 직장가입자 급여 공제 체감 시점. 전부 원문으로 확인한 범위
  안에서만 쓴다. 개인별 보험료를 확정 금액으로 계산해 주거나 가입·탈퇴 유불리를
  단정하지 마라(일반정보 고지 유지). 연금 수령액이 요율 인상분에 비례해 늘어난다는
  단정도 금지.
