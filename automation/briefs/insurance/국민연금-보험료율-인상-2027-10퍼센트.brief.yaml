must_cover:
  - 숫자의 출발점 - 국민연금법 제88조는 사업장가입자의 기여금·부담금을 각각 기준소득월액의 1천분의 65(합계 13%), 지역·임의·임의계속가입자를 1천분의 130(13%)으로 규정한다. 조문에 적힌 13%는 최종 도달점이고, 연도별로 실제 적용되는 비율은 부칙 경과조치가 따로 정한다는 구조를 먼저 세운다. 부칙 조문 번호와 연도별 1천분의 수치는 국가법령정보센터 원문으로 확인하고, 확인하지 못한 연도 수치는 쓰지 않는다
  - 연도별 경로 - 1998년부터 2025년까지 9%로 고정돼 있던 보험료율이 2026년 9.5%로 올라 매년 0.5%p씩 8년간 인상되어 2033년 13%에 도달한다(국민연금공단 연금보험료 안내). 따라서 2027년 적용 비율은 10.0%다. 2033년 13%를 2027년 수치로 오해하는 지점을 분명히 가른다
  - 가입자 유형별 본인 부담의 차이 - 사업장가입자는 요율의 절반만 본인이 내므로 2026년 4.75%에서 2027년 5.0%로 0.25%p만 늘지만, 지역·임의·임의계속가입자는 전액 본인 부담이라 0.5%p가 그대로 늘어난다. 같은 0.5%p 인상인데 체감 증가분이 두 배 차이 난다는 것이 이 글의 1차 정보 이득. 산재보험처럼 사업주 전액 부담이 아니라는 점도 구분
  - 기준소득월액을 대입한 증가분 계산 - 기준소득월액 구간별로 2026년 대비 2027년 월 보험료가 얼마 늘어나는지 표로 보여준다(사업장가입자 본인부담과 지역가입자 전액부담 두 열). 계산은 기준소득월액 × 요율이라는 단일 공식만 쓰고, 개인별 금액을 단정하지 말고 예시임을 명시한다
  - 상·하한에 걸린 가입자는 증가분이 고정된다 - 기준소득월액 상한액을 넘는 소득자는 상한액 기준으로만 부과되므로 요율 인상에 따른 증가분도 상한액 기준으로 고정된다. 2026.7.1~2027.6.30 적용 상·하한액(하한 41만원, 상한 659만원)을 근거로 상한 구간 가입자의 증가분을 계산한다. 2027년 7월에 상·하한이 다시 조정되면 요율 인상과 부과 기준 조정이 한 해에 두 번 겹친다는 점이 두 번째 정보 이득
  - 요율만 오른 것이 아니다 - 같은 개정으로 소득대체율이 41.5%에서 43%로 함께 올랐다. 다만 소득대체율 인상이 전체 가입기간에 소급되는지, 인상 이후 가입기간에만 적용되는지를 조문·공식 안내로 확인해 그 범위까지만 쓴다. 확인되지 않으면 범위를 추정해 쓰지 말고 더 내는 쪽만 서술한다
  - 적용 시점과 이미 낸 보험료 - 인상된 요율은 해당 연도 보험료부터 적용되고 과거에 낸 보험료가 소급 인상되지는 않는다. 직장가입자가 급여 공제로 체감하는 시점을 원문으로 확인한 범위에서만 서술하고, 공제·납부 월을 확인 없이 단정하지 않는다
  - 지금 확인할 수 있는 것 - 본인의 기준소득월액이 얼마로 잡혀 있는지 확인하는 경로(공단 안내 수준)와, 소득이 상·하한에 걸리는지 여부가 증가분을 좌우한다는 점만 안내한다. 화면 단계나 메뉴명을 확인 없이 쓰지 않는다

