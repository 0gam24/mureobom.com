human_notes: |
  차별화: 세율표만 나열하는 타 사이트와 달리 "주택 수에 들어가느냐/빠지느냐" 판정을
  포함·제외 대조표로 정리(분양권·입주권·주거용 오피스텔·공시가 1억 이하·상속 5년 이내).
  중과 여부를 좌우하는 핵심은 세율 숫자가 아니라 세대 합산 주택수 판정임을 전면에 배치.
  2020.7.10 대책 이후 중과 체계·2020.8.12 분양권 주택수 포함 시점 기준연도 명시.
  가장 자주 틀리는 통념: "개인별 계산"(→ 세대 합산), "오피스텔은 무조건 제외"(→ 주거용은
  주택수 포함, 다만 자기 취득세율 자체는 4%), 조정대상지역 지정·해제 변동은 취득 시점
  기준으로 판정한다는 점 검수 시 최신 조정대상지역 현황과 함께 확인.
