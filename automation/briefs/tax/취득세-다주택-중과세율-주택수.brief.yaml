  - 주택 수 산정에서 제외되는 것(공시가격 1억원 이하 저가주택, 상속개시 5년 이내 상속주택, 가정어린이집·사원용 주택 등)
  - 중과 제외·일시적 2주택 특례(종전주택 처분기한 내 처분 시 1주택 세율 적용)
  - 흔한 오해(개인별 아닌 세대 합산 / 무주택 배우자·미혼 30세 미만 자녀도 세대 판정 영향)

