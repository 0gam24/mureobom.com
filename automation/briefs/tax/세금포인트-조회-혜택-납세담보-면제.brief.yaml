human_notes: |
  차별화: 기발행 306편 전체에서 "세금포인트" 문자열이 0건(grep 확인). 그리고 대중 기사·블로그는
  이 제도를 "아쿠아리움 30% 할인" 같은 쿠폰 목록으로만 소비한다. 이 글은 축을 뒤집어 세금포인트를
  '자금난이 왔을 때 담보 없이 납부기한을 늘릴 수 있는 한도'로 읽게 만든다 — 할인쿠폰의 가치는
  수천 원이지만 담보면제는 보유 포인트 x 10만원이라 자릿수가 다르다.
  정보 이득 3가지:
  (1) 담보면제는 무조건 혜택이 아니라 '납부기한 등의 연장 승인 요건 충족'이 선행조건인 조건부
      혜택이다 — 포인트가 쌓여 있어도 연장 사유가 없으면 열리지 않는다는 점을 분리해 설명.
  (2) 연 1,000포인트 한도 x 5년 유효기간 = 최대 5,000포인트, 담보면제 환산 5억원이 제도 산술 상한.
      이 계산은 국세청이 표로 제시한 값이 아니라 확인된 두 수치의 산술 유도이므로 본문에서 '계산해
      보면'으로 명시하고 공식 한도로 단정하지 않는다.
  (3) 부여 기준이 '자진납부세액'이라 고지·독촉으로 낸 세금은 쌓이지 않는다 — 많이 낸 사람이
      자동으로 받는 적립금이라는 통념과 실제 구조의 차이.
  검수 포인트:
  - 국세청이 확인해 준 수치만 쓴다. 정책브리핑 계열 2차 자료에서 본 "매년 3월 50점 한도"는
    2026-09-17 보도자료(연 1,000포인트·유효기간 5년)와 상충하므로 채택하지 않았다.
  - 담보면제 한도를 "5억원"으로 단정 표기 금지(위 (2) 참조). 산술 유도로만 서술.
  - law.go.kr이 이 세션 네트워크에서 응답하지 않아 국세징수법 조문 원문을 확인하지 못했다.
    조문 번호·연장 최대기간 등 미확인 수치는 본문에 쓰지 않고, 연장 요건은 국세청 안내 문구
    수준으로만 다룬다.
  - 포인트로 세액 자체가 줄어든다는 오해를 부르는 표현 금지(감면·환급 아님).
  - 체납 관련 혜택은 체납을 조장하는 톤이 되지 않도록 '이미 체납이 생긴 경우의 구제 절차'로 서술.
  - 개별 사안 단정 금지, "관할 세무서 확인" 일반정보 고지 유지.
  - 카니발리제이션 대조 완료: _published_slugs.txt tax 93건 + grep -il "세금포인트" 0건.
    tax/국세환급금-미수령-조회-신청은 환급금(내 돈 돌려받기), 이 글은 포인트(담보·할인 권리)로 별개.
