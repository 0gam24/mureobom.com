  - 고지·독촉에 따라 낸 세금이 아니라 '자진납부' 세액이 기준이라는 점(부여 기준의 핵심 오해)
  - 조회·사용 경로 — 홈택스·손택스 My홈택스 세금포인트, 모바일 쿠폰 발급 절차
  - 금전 가치가 가장 큰 혜택은 납세담보 면제 — 신청가능금액 = 보유 포인트 x 10만원
  - 담보면제의 3가지 요건(신청일 현재 체납액 없음, 최근 2년 체납 등 고려해 조세 일실 우려 없음,
    납부기한 등의 연장 승인 요건 충족)과 이것이 조건부 혜택이라는 구조
  - 담보면제 신청서류 — 세금포인트 사용신청서 + 납부기한 등 연장신청서를 세무서 제출
  - 소액체납자 재산 매각유예 — 체납 1천만원 이하, 보유 포인트 x 10만원
  - 연 1,000포인트 한도와 5년 유효기간에서 나오는 담보면제 환산 상한 계산(산술 유도임을 명시)
  - 2026년 신규 확대분 — 씨라이프 부산·코엑스아쿠아리움 입장료 30% 할인 10포인트(본인 포함 최대 4인,
    4인이면 40포인트, 2026-09-11 시행), 넷마블게임박물관 입장료 1천원 할인 1포인트(본인 한정 1일 1회, 2026-10-01 시행)
  - 기존 혜택군과 필요 포인트 — 할인 쇼핑몰, 인천공항 비즈니스센터(5포인트), 세법교실 우선수강(3포인트),
    관광지·박물관·영화관 할인쿠폰(1~15포인트), 출입국 우대카드(모범납세자 100포인트 이상)
  - 사용한 포인트는 환원되지 않는다는 점과 혜택 간 중복 제한
  - 흔한 통념 바로잡기("세금 많이 내면 자동으로 돌려받는 돈", "포인트로 세금을 깎는다",
    "고지서로 낸 세금도 쌓인다")

