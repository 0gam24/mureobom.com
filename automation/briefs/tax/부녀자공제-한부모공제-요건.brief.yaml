id: tax-부녀자공제-한부모공제-요건
cluster: tax
status: published         # compliance 게이트 통과 (KST 2026-08-13)

target_query: "연말정산 부녀자공제 한부모공제 요건 중복"
search_intent: 정보형      # 두 추가공제 자격 확인 + 중복 적용 여부

signal:
  score: 58.0
  trend_momentum: 0.35
  question_volume: 0.52
  cluster_fit: 1.0
  freshness: 0.48

must_cover:
  - 부녀자공제 요건(소득세법 제51조 제1항) — 종합소득금액 3천만원 이하 + (배우자 있는 여성) 또는 (배우자 없고 기본공제 부양가족 있는 세대주 여성)
  - 부녀자공제 공제액 — 연 50만원
  - 한부모공제 요건 — 배우자가 없고 기본공제 대상 직계비속·입양자가 있는 사람(성별 무관, 소득제한 없음)
  - 한부모공제 공제액 — 연 100만원
  - 중복 적용 안 됨 — 부녀자공제와 한부모공제 동시 해당 시 한부모공제만 적용(더 큰 쪽)
  - 두 공제의 소득요건 차이(부녀자는 3천만원 이하 제한, 한부모는 제한 없음)와 흔한 오해 바로잡기

required_sources:
  - "소득세법 제51조(추가공제), 국가법령정보센터"
  - "국세청 연말정산 종합안내 — 인적공제(추가공제) 항목"

