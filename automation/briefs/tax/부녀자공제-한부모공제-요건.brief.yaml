human_notes: |
  차별화: 부녀자공제와 한부모공제를 나란히 놓고 요건·금액·소득제한을 표로 대조,
  "둘 다 되면 둘 다 받나?"라는 핵심 질문에 '한부모만 적용(중복배제)'을 명확히.
  종합소득금액 3천만원 기준(총급여 약 4천만원 근처)의 의미를 오해 없이 설명.
  단정적 절세 약속 금지, 신고 시점 현행 법령 확인 권고.
