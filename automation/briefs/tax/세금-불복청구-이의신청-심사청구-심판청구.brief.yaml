human_notes: |
  차별화: 기존 90편의 tax 글은 "세금을 어떻게 계산·신고하나"에 몰려 있고, 부과된 뒤 다투는
  절차를 다룬 글이 한 편도 없다. 이 글은 90일이라는 단일 기한을 축으로 과세 전(30일)과
  과세 후(90일)를 갈라 놓고, 세 갈래 경로의 선택이 되돌릴 수 없는 지점(이의신청을 거치면
  감사원 심사청구 불가, 심사·심판 중복 불가)을 판단표로 제시한다.
  검수 포인트:
  - 기간·결정기간은 전부 조문으로 확정 표기. 추정 금지.
  - 집행부정지(제57조)는 실무에서 가장 큰 오해라 반드시 본문에 넣는다. 다만 "압류를 막을 수
    있다"는 식의 단정 금지, 예외적 집행정지는 재결청 판단 사항으로만 서술.
  - 승소 가능성·인용률 추정, 개별 사건 판단, 세무대리인 알선성 표현 금지.
  - 지방세(재산세·취득세)는 지방세기본법 소관이라 절차가 다르다는 점만 경계로 짚고
    수치는 확인된 국세 기준만 쓴다.
