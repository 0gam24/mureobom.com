id: tax-세금-불복청구-이의신청-심사청구-심판청구
cluster: tax
status: published        # compliance 전 룰 통과 2026-09-08 KST (승인: 클라우드 루틴 06 mureobom 07:00 실행)

target_query: "세금 고지서가 억울할 때 이의신청 심사청구 심판청구 중 무엇을 언제까지 해야 하나"
search_intent: 절차형      # 어느 경로를 골라 며칠 안에 무엇을 제기할지 판단 목적

signal:                   # topic-queue stale(2026-06-11 생성) 대체 수동 선정, 집계 수치만
  score: 58
  trend_momentum: 0.35
  question_volume: 0.55
  cluster_fit: 0.95       # tax boost 1.10 반영 전 원값
  freshness: 0.5

must_cover:
  - 불복의 근거와 대상(국세기본법 제55조), 불복 대상에서 빠지는 처분(통고처분·과태료·감사원 심사청구 거친 처분)
  - 과세 "전" 단계인 과세전적부심사(제81조의15)와 과세 "후" 불복의 구분, 각각의 기산점과 기간
  - 경로 3가지(이의신청 경유 / 바로 심사·심판 / 감사원 심사청구)와 중복 제기 금지 규정
  - 기간: 이의신청·심사청구·심판청구 각 90일, 과세전적부심사 30일, 행정소송 90일 불변기간
  - 결정기간: 이의신청 30일(항변 시 60일), 심사청구 90일, 과세전적부심사 30일, 재조사 결정 후 60일
  - 필요적 전치주의(제56조) — 심사청구나 심판청구를 거치지 않으면 행정소송 제기 불가
  - 집행부정지 원칙(제57조) — 불복해도 징수·압류는 그대로 진행된다는 점과 예외적 집행정지 요건
  - 경정청구(제45조의2, 5년)와 불복(90일)의 성격 차이 — 기한을 넘긴 뒤 남는 선택지
  - 국선대리인 제도(제59조의2) 소득·재산·청구세액 기준과 제외 세목
  - 흔한 통념 바로잡기("일단 이의신청부터 해야 한다", "불복하면 납부가 멈춘다", "기간은 넉넉하다")

required_sources:         # 공식 1차 출처만. WebFetch 화이트리스트 도메인. 0건이면 발행 차단
  - "국세기본법 제55조·제56조·제57조·제59조의2·제61조·제65조·제66조·제68조·제81조의15 (국가법령정보센터 law.go.kr)"
  - "국세기본법 제45조의2 경정 등의 청구 (law.go.kr)"
  - "국세청 납세자권익24 불복청구·국선대리인 안내 (nts.go.kr)"

