human_notes: |
  차별화: 부가세 면세사업자만 대상인 '사업장현황신고'(2월 10일)를 정면으로. 기발행 부가세/종소세 신고 글과
  신고 종류·대상·기한이 명확히 다름. 면세라 신고 안 해도 된다는 통념을 무신고 가산세(의료·약사업 등 0.5%)로 반박.
  가산세율·기한은 조문·국세청 안내 그대로 인용, 특정 세무대리 서비스 추천 금지. 연도 바뀌는 기한은 '다음 해 2월 10일'로 서술.
