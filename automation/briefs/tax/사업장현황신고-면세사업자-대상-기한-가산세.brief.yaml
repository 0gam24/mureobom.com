id: tax-사업장현황신고-면세사업자-대상-기한-가산세
cluster: tax
status: published        # 스케줄 실행 = 운영자 '오늘 3편 발행' 즉석 승인 (2026-08-21 KST). 기존 tax 후보(연금저축·IRP)가 기발행 insurance 글과 near-duplicate로 판명되어 대체 선정. compliance 전 게이트 통과.

target_query: "사업장현황신고 면세사업자 대상 기한 신고방법 미신고 가산세"
search_intent: 절차형      # 면세사업자가 언제까지 무엇을 어떻게 신고하는지 + 미신고 불이익 확인

signal:                   # topic-queue stale 대체 수동 선정 근사 추정치, 집계 수치만
  score: 60
  trend_momentum: 0.46
  question_volume: 0.55
  cluster_fit: 1.0        # tax boost 1.10 반영 전 원값
  freshness: 0.5

must_cover:
  - 사업장현황신고의 개념과 근거(소득세법 제78조), 부가가치세 면세사업자가 대상인 이유(면세라 부가세 신고가 없어 매출·시설현황을 별도 신고)
  - 신고 대상(병·의원, 학원, 농·축·수산물 등 부가가치세 면세 개인사업자)과 대상이 아닌 경우(과세사업자·법인 등) 구분
  - 신고 기한(다음 해 2월 10일까지)과 신고 항목(수입금액, 시설현황, 매입·매출처별 계산서합계표 등), 신고 방법(홈택스 전자신고·서면)
  - 무신고·과소신고 시 불이익(의료업·수의업·약사업 등 일부 업종의 사업장현황 무신고·과소신고 가산세 0.5%)과 계산서합계표 미제출 가산세 등
  - 사업장현황신고와 5월 종합소득세 신고의 관계(현황신고가 종소세 신고의 기초자료), 흔한 오해 바로잡기
  - "면세라 신고할 게 없다", "종합소득세만 내면 된다"는 통념 바로잡기

required_sources:         # 공식 1차 출처만. WebFetch 화이트리스트 도메인. 0건이면 발행 차단
  - "소득세법 제78조(사업장 현황신고) / 시행령 (국가법령정보센터 law.go.kr)"
  - "국세청 사업장현황신고 안내 (국세청 nts.go.kr / 홈택스 hometax.go.kr)"
  - "소득세법(사업장현황 신고불성실 가산세 관련 조항) (국가법령정보센터 law.go.kr)"

