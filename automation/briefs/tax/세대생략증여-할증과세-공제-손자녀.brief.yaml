human_notes: |
  차별화: 기발행 증여 글(증여재산공제·가족계좌이체·부담부증여·이월과세)은 모두 '부모↔자녀' 축이고,
  이 글은 '조부모→손주 세대생략'이라는 별개 각도 + 30% 할증이라는 고유 논점. 할증률(30%·미성년 20억
  초과 40%)과 대습 예외를 정확히, 유불리는 단정 대신 조건별로 서술. 절세 확정 약속 금지(F-*).
  수치는 2026 현행 상증세법·국세청 기준으로 확정.
