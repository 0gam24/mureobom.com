must_cover:
  - 세대생략증여 개념(조부모가 자녀를 건너뛰고 손자녀에게 직접 증여)과 활용 이유
  - 할증과세: 상증세법 제57조, 직계비속에게 증여 시 증여세 산출세액의 30% 할증(수증자가 미성년자이고 증여재산가액 20억원 초과 시 40%)
  - 할증 제외(대습) 사유: 증여자의 최근친 직계비속이 사망하여 그 사망자의 직계비속이 증여받는 경우
  - 증여재산공제: 직계존속이 직계비속에게 증여 시 5,000만원(수증자가 미성년자면 2,000만원), 10년 합산 개념
  - 유불리 판단(부모 거쳐 두 번 증여세 vs 한 번에 세대생략 후 30% 할증) 및 흔한 오해 바로잡기

required_sources:         # 공식 1차 출처만(법령·기관). 0건이면 발행 차단
  - "상속세 및 증여세법 제57조(직계비속에 대한 증여의 할증과세) (국가법령정보센터)"
  - "상속세 및 증여세법 제53조(증여재산 공제) (국가법령정보센터)"
  - "국세청 증여세 안내(할증과세·증여재산공제·세율)"

