human_notes: |
  차별화: 기발행 302편 전체에서 "의무발행업종" 문자열이 0건이다(grep 확인). 기존
  tax/현금영수증-소득공제-발급은 소비자의 연말정산 공제율·한도만 다루는 글이라 검색의도가
  정반대다. 이 글은 "발급하는 쪽(의무발행업종 사업자)의 의무와 제재" + "못 받은 쪽(소비자)의
  신고·포상금"을 한 축에서 판정 가능하게 만든다. 특히 대중 설명에서 뭉개지는 세 가지를
  분리한다 — (1) 가맹점 가입의무 위반과 발급의무 위반은 가산세가 따로 매겨진다, (2) 상대방이
  요청하지 않아도·인적사항을 몰라도 발급의무가 살아 있고 그때는 국세청 지정번호로 자진발급한다,
  (3) 발급의무는 가맹점 가입 여부와 무관하게 업종·금액 기준으로 생긴다.
  검수 포인트:
  - 가산세율·거래금액 기준·자진발급 기한·포상금 지급률과 한도는 국세청 안내와 법령 조문으로
    확정 표기한다. 연도별로 바뀌는 항목은 확인한 기준일을 본문에 명시하고, 확인 못 한 수치는 쓰지 않는다.
  - 의무발행업종 목록은 시행령 별표 3의3이 매년 개정되므로 전체 나열 대신 확인 방법과 대표 업종군,
    "내 업종이 포함되는지 확인하는 경로"로 서술한다. 업종 코드 추측 금지.
  - 탈세·회피 요령으로 읽힐 표현 금지. 신고 포상금은 제도 안내로만 다루고 금액 기대를 부추기지 않는다.
  - 개별 사안 단정 금지, "관할 세무서·세무대리인 확인" 일반정보 고지 유지.
  - 카니발리제이션 대조 완료: _published_slugs.txt tax 92건 + grep -il "의무발행" 0건.
    전자세금계산서 의무발급 글은 세금계산서 제도라 발급수단이 다르다.
