  - "소득세법 제81조의9(현금영수증 발급 불성실 가산세) (국가법령정보센터 law.go.kr)"
  - "소득세법 시행령 별표 3의3 현금영수증 의무발행업종 (국가법령정보센터 law.go.kr)"

