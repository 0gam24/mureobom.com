must_cover:
  - 의무발행업종의 정의와 범위(소득세법 시행령 별표 3의3), 가맹점 가입의무와 발급의무의 구분
  - 건당 10만원 이상 현금거래는 상대방이 요청하지 않아도, 인적사항을 몰라도 발급의무가 생기는 구조
  - 인적사항을 모를 때의 자진발급 절차 — 거래일로부터 5일 이내, 국세청 지정번호(010-000-1234)
  - 미발급 가산세(소득세법 제81조의9) 세율과 계산 기준, 착오·누락분을 기한 내 자진발급했을 때의 감면
  - 현금영수증가맹점 미가입 가산세와 발급의무 위반 가산세가 별개로 매겨지는 구조
  - 발급의무가 면제되거나 제외되는 경우(거래금액 기준 미만, 세금계산서·계산서를 이미 발급한 거래 등)
  - 소비자 쪽 대응 — 미발급·발급거부 신고 방법, 신고 가능 기한, 포상금 지급률과 한도
  - 신고와 별개로 소비자의 소득공제는 어떻게 인정되는지(신고분 처리)
  - 흔한 통념 바로잡기("손님이 안 달라고 하면 안 줘도 된다", "계좌이체는 현금이 아니다",
    "현금영수증가맹점에 가입 안 했으면 의무도 없다")

