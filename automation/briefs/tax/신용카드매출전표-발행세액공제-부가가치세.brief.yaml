human_notes: |
  차별화: 발행세액공제 = 개인사업자(법인 제외)·직전연도 공급가액 10억 이하 대상, 공제율(현행 1.0%)·연간 한도(현 1,000만원)·납부세액 한도 내 공제(환급 아님)·간이과세자 적용 방식·세금계산서 발급의무자와의 관계를 한 표로 정리. '신용카드 소득공제'(근로자 소비공제)와의 구분 표 필수.
  검수 포인트 1: 공제율 1.0%·한도 1,000만원은 연장·특례로 바뀌는 항목 — 반드시 2026년 적용 기준을 법령/국세청에서 재확인. 과거 1.3% 우대율(한시)과 혼동 금지.
  검수 포인트 2: '환급'이 아니라 '납부세액 한도 내 공제'라는 점을 명확히. 낼 세금이 없으면 공제 소멸.
  검수 포인트 3: 법인사업자·직전연도 공급가액 10억 초과 개인사업자는 대상 아님을 첫 단락에서 짚어 잘못된 기대를 차단.
