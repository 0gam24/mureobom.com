  note: "manual-pick / 신규 사업자 세제, 기존 tax 슬러그와 의미중복 없음"

must_cover:
  - 발행세액공제의 정의와 근거(부가가치세법 제46조): 신용카드·현금영수증 등으로 매출을 발행하면 납부세액에서 일정 비율을 빼주는 제도
  - 적용 대상: 개인사업자(법인 제외) 중 직전연도 공급가액(재화·용역 공급대가) 10억원 이하 소매·음식·숙박 등 대상 업종
  - 공제율과 연간 한도: 현행 공제율 1.0%, 연간 한도 1,000만원(연도별 한시 특례 여부 2026 기준 명시)
  - 납부세액 한도 내에서만 공제(환급 아님) — 낼 세금이 없으면 공제도 없음
  - 간이과세자의 발행세액공제 적용 방식과 세금계산서 발급의무 사업자와의 관계
  - 흔한 혼동 바로잡기: 근로자 '신용카드 소득공제'(소비 공제)와 사업자 '발행세액공제'(매출 공제)는 전혀 다른 제도
  - 신고 시 반영 위치(부가가치세 확정신고서 공제세액 항목)와 실무 유의점

required_sources:        # 공식 1차 출처만. 블로그·비공식 게시판 금지. 0건이면 발행 차단
  - "부가가치세법 제46조 (신용카드등의 사용에 따른 세액공제 특례) — 국가법령정보센터 law.go.kr 조문 렌더 URL"
  - "국세청 부가가치세 안내 / 홈택스 신고도움 (nts.go.kr)"
  - "부가가치세법 시행령 해당 조문 — 국가법령정보센터 (대상 업종·한도 확인용)"

