target_query: "신용카드매출전표등 발행세액공제 한도 대상 2026 개인사업자 간이과세자"
search_intent: 정보형     # 제도 이해가 우선(공제율·대상·한도), 신고 시 반영 절차는 부수

signal:                  # 운영자 수동 선정(스캐너 미경유). 읽기 전용, 원문 아님
  score: 62.0
  trend_momentum: 0.45
  question_volume: 0.50
  cluster_fit: 1.0
