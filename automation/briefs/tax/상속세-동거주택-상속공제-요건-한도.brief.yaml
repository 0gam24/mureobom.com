must_cover:
  - 동거주택 상속공제가 무엇인지(부모를 모시고 한집에서 오래 산 무주택 상속인의 주거 안정을 위한 상속세 공제)
  - 공제 요건 4가지(피상속인과 상속인이 상속개시일 이전 10년 이상 계속 동거 / 그 기간 계속 1세대 1주택 / 상속개시일 현재 무주택인 상속인이 상속 / 상속인이 직계비속·그 배우자 등 대상)
  - 10년 동거 기간 계산(상속인이 미성년인 기간 제외, 징집·취학·질병요양 등 부득이한 사유로 동거 못 한 기간은 동거로 보지 않되 계속 동거 요건은 중단으로 보지 않음)
  - 공제액과 한도(동거주택가액[부수토지 포함, 담보채무 차감]의 100%, 최대 6억원)
  - 1세대 1주택 판정과 예외로 인정되는 일시적 2주택 등의 사유
  - 다른 상속공제(배우자공제·일괄공제)와의 관계 및 중복 적용 여부
  - 흔한 오해(동거만 하면 무조건 되는 것 아님 / 상속인이 유주택이면 배제 / 형제간 지분 상속 시 요건 충족자만 적용)

required_sources:        # 공식 1차 출처만. 신호는 집계 수치만. 0건이면 발행 차단
  - "상속세 및 증여세법 제23조의2(동거주택 상속공제) / 시행령 제20조의2 (국가법령정보센터 law.go.kr)"
  - "국세청 상속세 안내(상속공제) / 국세청 세금절약 가이드 (nts.go.kr / hometax.go.kr)"
  - "찾기쉬운 생활법령정보 상속세 공제 (easylaw.go.kr)"

