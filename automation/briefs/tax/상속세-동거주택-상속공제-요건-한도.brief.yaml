human_notes: |
  차별화: 배우자공제·일괄공제만 다루는 기존 상속세 글과 달리 '부모 모시고 산 무주택 자녀'라는
  구체 상황에 특화. 10년 동거 요건의 함정(미성년 기간 제외, 부득이한 사유 기간 처리)과
  '상속인 본인이 무주택이어야 한다'는 핵심 요건을 표로 정리 — 이 부분이 실무에서 가장 많이
  걸리는 지점. 공제 한도 6억원과 담보채무 차감 후 주택가액 100% 공제라는 계산 구조를 예시로.
  검수 포인트: 요건 4가지를 상증법 제23조의2 확정 조문으로만 서술, '동거하면 된다'식 단정 금지.
  1세대 1주택 예외 사유와 6억 한도는 현행 조문 기준으로 확인. 자문이 아닌 일반정보 고지 유지.
