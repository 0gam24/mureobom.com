human_notes: |
  차별화: "3일 전"과 "10일 전"이라는 서로 다른 두 기한을 조문으로 갈라주고, 승인 기간에는 납부지연가산세가 아예 붙지 않는다는 점(시행령 제13조)까지 연결한 글.
  대부분의 기존 콘텐츠가 '징수유예'라는 옛 명칭으로 뭉뚱그려 설명하지만 현행법은 고지 전(제14조 납부고지의 유예)과 고지 후(제13조 납부기한등의 연장)를 나눈다. 이 구분을 축으로 잡을 것.
  묵시적 승인(신청일부터 10일 내 무통지 시 승인 간주)은 검색 결과에서 거의 다루지 않는 실질 정보 — 핵심 정보 이득 지점.
  체납이 이미 시작된 뒤의 압류·매각 유예는 이 글 범위 밖(세금포인트 글로 내부링크).
  세액 감면·탕감 제도가 아니라 기한을 미루는 제도라는 점을 분명히 할 것. 단정적 약속 표현 금지.
  루틴 실행(2026-09-22 KST)에 따른 즉석 승인.
