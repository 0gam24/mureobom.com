must_cover:
  - "납부기한등의 연장(국세징수법 제13조)과 납부고지의 유예(제14조)가 갈리는 지점은 이미 확정된 납부기한을 미루는가, 세무서장이 앞으로 할 납부고지를 미루는가이다. 제2조 제1항 제1호가 납부기한을 법정납부기한과 지정납부기한으로 나누므로 고지서를 받은 적 없는 자진신고납부자도 제13조 대상이다"
  - 연장 사유 4가지(재난·도난 / 사업 현저한 손실·부도·도산 우려 / 본인·동거가족 6개월 이상 치료나 상중 / 시행령 제11조 추가 사유)
  - 두 개의 기한이 따로 있다는 점 — 신청 마감은 만료일 3일 전(시행령 제14조), 묵시적 승인은 만료일 10일 전 신청이 조건(법 제13조⑤·제14조⑤)
  - 연장 기간 원칙 9개월, 특별재난지역 등은 2년(시행령 제12조), 6개월 초과 시 분납 설계
  - 승인 기간 동안 납부지연가산세를 부과하지 않음(시행령 제13조) — 미신청 시 부담과 대비
  - 담보 요구 원칙과 면제 사유(법 제15조 단서·시행령 제16조)
  - 취소 사유와 취소 시 같은 국세에 대해 재연장 불가(법 제16조③)

required_sources:
