  - 공제액 구조 — 청년등상시근로자/청년등외상시근로자 구분 × 기업규모(중소·중견·그 외) × 비교 기준연도(직전·전전·전전전) × 수도권 안팎
  - 중소기업이 아닌 내국인의 최소고용증가인원수(중견 5명, 그 외 10명) 차감 구조
  - 상시근로자에서 빠지는 사람(임원, 최대주주·특수관계인, 1년 미만 근로자, 월 60시간 미만 단시간근로자, 4대보험·원천징수 미확인자)
  - 청년등상시근로자의 범위(청년 정규직 15~34세·병역기간 최대 6년 차감, 장애인, 60세 이상, 경력단절 근로자)
  - 정규직 전환 공제(제4항)·육아휴직 복귀자 공제(제5항)와 2년 내 근로관계 종료 시 추징(제7항)
  - 제3항(구 사후관리 조항) 삭제 <2025.12.23>가 제1항 공제에 갖는 의미
