human_notes: |
  차별화: 2025.12.23 개정으로 2026 과세연도부터 적용되는 '직전 3개 과세연도 중 1개 이상 대비 증가' 판정과
  비교 기준연도별 차등 공제액 표를 조문 그대로 복원한다. 시중 정보 대부분이 여전히 구 규정(직전 연도 대비 +
  2·3년차 추가공제 + 사후관리 추징)을 설명하고 있어, 조문 기준 정리 자체가 정보 이득이다.
  검수 포인트:
  - 공제 금액·연도·인원 기준은 조특법 제29조의8 및 시행령 제26조의8 조문으로만 확정 표기(추측 금지).
  - 제3항 삭제(2025.12.23) 사실을 정확히 표기하되, 제7항(정규직 전환·육아휴직 복귀자 2년 내 종료 시 추징)은
    그대로 유효하므로 혼동 없게 분리 서술.
  - '수도권' 정의는 시행령 제26조의8에서 확인되지 않았으므로, 확인 못 한 정의는 쓰지 말고
    조문 문언(수도권 밖의 지역에서 증가한 경우)까지만 서술.
  - 절세 단정·금액 보장 표현 금지, "개별 사안은 관할 세무서·세무대리인 확인" 일반정보 고지 유지.
  - 상시근로자 수 계산식(월평균)은 시행령 제11조의2 제8항 준용 — 준용 사실만 쓰고 미확인 계산식은 쓰지 않는다.
