human_notes: |
  차별화: 피상속인·상속인·가업 3주체 요건을 각각 체크리스트로 분리하고,
  경영 기간(10/20/30년)별 공제한도를 표 한 장으로 정리한다.
  "공제받으면 끝"이 아니라 사후관리(고용·지분·자산 유지) 위반 시 추징된다는 점을
  핵심 오해 바로잡기로 강조 — 실무에서 가장 많이 놓치는 지점.
  기존 상속세 글(면제한도·배우자공제·연부연납)과 겹치지 않게 '가업상속공제'에만 집중.
  구체 금액·요건은 최신 상증세법 조문 기준 명시, 단정적 절세 약속 금지(금융표현 가드).
