must_cover:
  - 스톡옵션(주식매수선택권) 과세의 2단계 구조 — (1) 행사 시점 '행사이익'(행사가와 시가의 차액)에 대한 과세, (2) 이후 주식 처분 시 양도소득세
  - 행사이익의 소득 구분 — 재직 중 행사 시 근로소득, 퇴직 후 행사 시 기타소득(소득세법 기준)으로 구분되는 원칙
  - 벤처기업 주식매수선택권 행사이익 비과세·과세특례(조세특례제한법 제16조의2·제16조의3·제16조의4) 개요 — 비과세 한도(연간 한도), 납부 특례(분할납부·5년 분할), 양도소득 과세특례 선택 제도의 존재와 요건 골격
  - 비상장·상장 여부 및 처분 시 양도소득세 과세 여부(대주주·비상장 주식 양도소득 과세 원칙)
  - 원천징수·연말정산·종합소득세 신고와의 관계(근로소득이면 회사 원천징수, 퇴직 후 기타소득이면 신고 필요)
  - 흔한 오해(행사만 하고 팔지 않으면 세금이 없는 줄 안다 / 무조건 양도소득으로 분류되는 줄 안다 / 모든 스톡옵션이 비과세인 줄 안다) 교정

