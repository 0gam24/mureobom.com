human_notes: |
  차별화: 스타트업·벤처 종사자 대상 '스톡옵션 세금 언제·어떻게 내나'를 2단계 과세(행사이익→양도)로 정리 + 벤처특례(비과세·분할납부·양도특례)를 골격만 정확히.
  법령 조문 번호(조특법 16조의2/3/4)는 반드시 law.go.kr 현행 조문으로 확인 후 인용. 한도 금액·연도는 개정 잦으니 단정적 수치는 조문 확인된 것만.
  '절세 확정'·'세금 안 냄' 같은 단정 금지 — 요건 충족 여부에 따라 달라짐을 명시. 투자 권유·종목 언급 절대 금지(정보형).
