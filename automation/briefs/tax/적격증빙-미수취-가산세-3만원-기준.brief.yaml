must_cover:
  - 이 글의 축이 되는 두 관문 구조 — 사업 관련 지출이 (1) 필요경비로 인정되는지(소득세법 제27조)와 (2) 적격증빙을 받았는지(제160조의2 제2항)는 서로 다른 관문이다. 간이영수증만 있어도 사업 관련성이 소명되면 필요경비 자체는 부인되지 않을 수 있지만, 적격증빙을 받지 않은 금액에는 별도의 가산세가 붙는다. "증빙 없으면 경비도 못 넣는다"는 통념과 법 구조의 차이를 먼저 정리할 것
  - 지출증명 수취·보관 의무의 근거 — 소득세법 제160조의2 제2항. 사업자가 사업과 관련해 다른 사업자로부터 재화·용역을 공급받고 대가를 지급하는 경우 받아 보관해야 하는 증빙의 종류(신용카드매출전표·현금영수증·세금계산서·계산서 등)를 조문이 열거하는 구조. 같은 조 제3항의 보관 기간(확인된 경우에만)
  - 가산세의 근거와 율 — 소득세법 제81조의6(증명서류 수취 불성실 가산세). 적격증빙을 받지 않거나 사실과 다르게 받은 금액의 100분의 2. **중요: 이 2%는 '세액의 2%'가 아니라 '미수취 거래금액의 2%'다.** 조문의 계산 대상이 금액인지 세액인지 researcher가 조문 문구로 확인해 명시할 것. 통념상 가산세를 세액 기준으로 생각하는 사람이 많아 체감 금액이 완전히 달라지는 지점
  - 3만원 기준이 어디서 오는지 — 소득세법 시행령 제208조의2. 거래 건당 금액이 일정액을 넘는 경우에만 적격증빙 수취 의무가 생긴다는 구조와 그 기준금액, 그리고 그 금액이 부가가치세를 포함한 금액인지 여부. 금액 기준과 부가세 포함 여부 모두 시행령 문구로 확인된 것만 쓸 것. 확인되지 않으면 금액을 쓰지 않는다
  - 적용에서 빠지는 사업자 — 제81조의6 단서. 소규모사업자와 소득금액을 추계로 신고하는 사업자는 이 가산세를 적용하지 않는다는 구조. '소규모사업자'의 정의가 조문 또는 시행령 어디에서 어떻게 정해지는지 확인하고, 정의 요건(신규사업자·직전 과세기간 수입금액 기준 등)은 확인된 범위만 기재. 추계신고자가 빠지는 이유(경비율로 소득을 계산하므로 개별 증빙을 전제하지 않는다)의 구조적 설명
  - 수취 의무 자체가 면제되는 거래 — 시행령 제208조의2가 열거하는 예외 거래 중 생활에서 자주 만나는 것들(사업자가 아닌 개인과의 거래, 금융·보험 용역, 원천징수 대상 사업소득, 택시·항공 등 운송용역, 입장권·승차권 등). 이 거래는 간이영수증이나 영수증만 있어도 가산세 대상이 아니라는 점. **열거 항목은 researcher가 시행령 본문에서 확인한 호만 쓰고, 기억에 의존한 추가 열거 금지**
  - 법인도 같은 구조인지 — 법인세법의 지출증명서류 수취·보관 의무와 미수취 가산세 조항(제116조 및 가산세 조항)을 확인해 개인사업자와 율·기준이 같은지 다른지 한 줄로 정리. 확인 못 하면 법인 부분은 쓰지 않는다
  - 실제 판단으로 쓰는 계산 — 3만원 초과 지출인데 간이영수증만 받은 상황에서 선택지는 두 가지다. (가) 경비에 넣지 않는다 (나) 경비에 넣고 2% 가산세를 받는다. 지출액 100만원·적용세율을 가정해 (가)의 세금 증가분과 (나)의 가산세를 나란히 계산해 보여줄 것. 적용세율이 2%보다 높은 구간이면 경비로 넣는 쪽이 세부담이 작다는 결론이 산술로 드러나야 한다. 세율은 가정임을 명시하고, 허위 증빙을 만들라는 식으로 읽히지 않게 할 것
  - 혼동하기 쉬운 다른 가산세와의 경계 — 영수증 수취명세서 관련 가산세, 무기장가산세, 부가가치세 매입세액 불공제는 모두 별개 제도다. 특히 부가가치세에서 매입세액을 공제받지 못하는 것과 소득세에서 증빙 가산세를 맞는 것은 세목이 다른 별개 결과라는 점. 매입세액 공제 쪽 상세는 내부 링크로 넘긴다
  - 결론은 본문 재나열이 아닌 실행 순서 — 거래 전 단계에서 무엇을 요청해야 하는지(사업자 지출용 현금영수증, 사업용 카드 사용, 세금계산서 요청), 이미 간이영수증만 받은 건은 신고 단계에서 어떻게 처리할지의 판단 순서. 건당 금액을 쪼개 기준 아래로 맞추는 식의 회피 서술 금지
  - 정보 기준일 명시 — 본문 서두에 어느 시점 시행 법령을 대조했는지 적고, 기준금액·율은 개정될 수 있으므로 신고 시점 확인을 권고

