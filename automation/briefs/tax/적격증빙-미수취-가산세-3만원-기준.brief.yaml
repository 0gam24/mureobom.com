human_notes: |
  차별화: 사업자가 가장 자주 겪는 상황(3만원 넘는 지출에 간이영수증만 받았다)을 "경비 인정"과
  "증빙 가산세"라는 두 개의 독립된 관문으로 분리해 설명한다. 핵심 정보 이득은 두 가지다.
  첫째, 소득세법 제81조의6의 2%가 세액이 아니라 미수취 거래금액 기준이라는 점. 둘째, 그래서
  적용세율이 2%를 넘는 구간이면 경비를 포기하는 쪽이 오히려 세부담이 크다는 산술 결론.
  시중 콘텐츠는 "증빙 없으면 경비 처리 안 된다"로 뭉개거나 2%만 던지고 끝내서, 납세자가 실제로
  해야 하는 비교 판단을 세우지 못한다.
  기존 글 대조(코퍼스 319편): tax/사업소득-필요경비-인정범위는 제27조·제33조·시행령 제55조의
  경비 인정 범위와 추계 대비 기장 유불리를 다루고 적격증빙은 "갖추면 안전하다"는 한 문단 언급뿐,
  3만원 기준·2% 가산세·제81조의6은 전혀 없다. tax/종합소득세-가산세는 무신고·과소신고·납부지연·
  무기장 4종만 다루고 증명서류 수취 불성실 가산세는 없다. tax/부가가치세-매입세액-불공제-항목은
  부가세법 제39조의 매입세액 불공제이고 세목·결과가 다르다. '증빙불비', '제81조의6', '제160조의2',
  '제208조의2'는 전 코퍼스에 0건. 카니발리제이션 없음.
  주의: fabrication-zero. 기준금액(3만원), 부가세 포함 여부, 예외 거래 열거, 소규모사업자 정의는
  전부 law.go.kr 조문에서 확인된 것만 쓴다. law.go.kr 조문 페이지가 JS 렌더로 WebFetch에서 본문이
  비는 사례가 반복되므로, 확인 실패한 항목은 숫자를 쓰지 말고 "시행령에서 정한다"는 구조만 서술하고
  신고 시점 확인을 권고한다. 확인된 출처가 must_cover의 (3)(4)(5) 중 하나라도 못 덮으면 발행 보류.
  톤: 세무 대리 자문으로 읽히지 않게 한다. "이렇게 하면 걸리지 않는다", "안전하다" 단정 금지.
  거래 분할로 기준금액을 피하는 요령, 증빙을 사후에 만드는 방법은 서술 금지(제81조의6은 사실과
  다르게 받은 경우도 대상이며, 거짓 증빙은 부정행위 가산세 영역). 일반정보 고지 유지.
