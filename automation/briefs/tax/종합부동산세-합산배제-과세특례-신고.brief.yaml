human_notes: |
  차별화: 9월 16~30일 신고창구에서 실제로 갈리는 세 제도(합산배제 / 주택 수 산정 제외 / 공동명의
  1주택자 특례)를 분리해 "내 주택은 어느 신고서인가"를 판정 가능하게 만든다. 특히 상속주택·소형 신축주택·
  준공후 미분양·인구감소지역 주택은 대중 설명에서 흔히 '합산배제'로 뭉뚱그려지지만 실제로는 주택 수 산정
  제외(세율·1세대1주택 판정) 제도이고 신청서 서식도 다르다. 기발행 tax/종합부동산세-부과기준-세율은
  부과기준·세율 개요글로 합산배제를 H2 한 절로만 언급하므로 검색의도가 겹치지 않는다.
  여기에 재신고 불필요 규칙의 예외(향교·종교단체는 매년 제출)와 사후 추징(경감세액 + 이자상당가산액)까지.
  검수 포인트:
  - 합산배제 유형별 공시가격·면적·의무임대기간 수치는 국세청 안내·시행령 조문으로 확정 표기(추측 금지).
  - 부부공동명의 특례는 "무조건 유리"가 아니라 기본공제 18억 vs 12억+고령·장기보유 공제 비교 구조로 서술.
    유리·불리 단정 금지, 모의계산 안내로 처리.
  - 절세 단정·보장 표현 금지, "개별 사안은 관할 세무서·세무대리인 확인" 일반정보 고지 유지.
  - 카니발리제이션 대조 완료: _published_slugs.txt tax 92건 중 합산배제 전용 글 없음(grep 확인).
