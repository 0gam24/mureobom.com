must_cover:
  - 신고 기간(9월 16일~9월 30일)과 이 신고가 12월 종부세 고지에 반영되는 구조
  - 합산배제 임대주택 유형별 요건(전용면적·주택수·공시가격·의무임대기간·임대료 5% 증액제한)
  - 합산배제 사원용주택등(시행령 제4조: 사원용주택·기숙사·미분양주택·어린이집용 주택 등)
  - "합산배제(과세표준 제외)"와 "주택 수 산정 제외(세율·1세대1주택 판정)"의 구분 — 상속주택·소형
    신축주택·준공후 미분양·인구감소지역 주택은 합산배제가 아니라 주택 수 산정 제외 제도
  - 과세특례(부부공동명의 1주택자 특례, 1세대1주택 판단 시 주택수 산정 제외, 향교·종교단체)
  - 최초 신고 후 변동이 없으면 재신고 불필요, 변동 시 변동신고 필요
  - 의무임대기간·임대료 증액제한 미준수 시 경감세액 + 이자상당가산액 추징
  - 흔한 통념 바로잡기("등록임대면 자동 합산배제", "한 번 신고하면 끝", "공동명의 특례는 무조건 유리")

