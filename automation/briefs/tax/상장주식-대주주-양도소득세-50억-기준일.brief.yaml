target_query: "국내 상장주식 대주주 양도소득세 기준 종목당 50억 판정 기준일"
search_intent: "정보형"
signal:
  score: 0.0
  trend_momentum: 0.0
  question_volume: 0.0
  cluster_fit: 0.93
  freshness: 0.0
  note: "큐 stale(2026-06-11)·네이버 API 키 없음. tax 98편 코퍼스 갭 분석으로 수동 선정 — 국내 상장주식 양도세 대주주 판정은 미커버(기존 해외주식 글은 대주주 요건 없는 전면과세라 검색의도가 분리됨)"
must_cover:
  - "과세 구조의 출발점: 국내 상장주식을 장내에서 판 소액주주는 양도소득세 비과세, '대주주'에 해당할 때만 과세 (소득세법 제94조①3호 가목 체계)"
  - "대주주 판정의 두 갈래와 OR 구조: ① 지분율 요건(코스피·코스닥·코넥스 시장별로 기준이 다름) ② 종목당 보유 시가총액 요건 — 둘 중 하나만 걸려도 대주주. 시장별 지분율 %와 보유금액 기준선은 리서처가 시행령 제157조 현행 조문으로 확정"
  - "판정 기준일: 직전 사업연도 종료일 현재 보유 상태로 판정 → 12월 결산법인은 그해 말일 기준. 기준일 이후 매도해도 해당 과세기간 내내 대주주 지위가 유지되는 타이밍 구조가 이 글의 핵심 (기준일 정의·예외는 리서처 확인 대상)"
  - "합산 범위: 과거 가족(특수관계인) 지분 합산 방식에서 본인 기준 판정으로 바뀐 경위와, 현행 조문에서 여전히 합산되는 범위(법인 등)가 어디까지인지 — 개정 시점과 현행 범위는 리서처가 시행령 부칙·개정이유로 확정"
  - "세율과 공제: 과세표준 3억원 경계의 20%/25% 2단 구간, 지방소득세가 별도로 10% 부가되는 실효 부담, 기본공제 연 250만원의 적용 단위 — 수치·중소기업 특례 여부는 소득세법 제104조로 리서처 확인"
  - "신고 기한 사슬: 반기별 예정신고(양도일이 속한 반기의 말일부터 2개월 이내 취지)와 다음 해 확정신고 — 정확한 기한과 확정신고 생략 가능 여부는 리서처 확인"
  - "대주주가 아니어도 과세되는 경우: 장외 매도(장내 거래가 아닌 양도)와 비상장주식은 대주주 여부와 무관하게 과세 대상에 들어간다는 점 (K-OTC 등 예외 취급 포함 여부 확인)"
  - "구조로 교정할 흔한 오해 2가지: (ㄱ) '종목당 50억이면 무조건 과세' — 양도차익이 아니라 보유 기준이고 지분율 갈래가 따로 있다 (ㄴ) '연말에 팔면 피할 수 있다' — 기준일 보유 상태 판정이라 기준일 전 처분과 기준일 후 처분의 효과가 전혀 다르다. 증권거래세는 대주주 여부·손익과 무관하게 매도 시 별도로 부과된다는 점도 함께"
