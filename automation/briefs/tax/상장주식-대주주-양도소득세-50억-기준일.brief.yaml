compliance:
  ymyl: true
  disclaimer: true
  note: "투자 권유·매도 타이밍 조언 금지. 과세 요건과 신고 기한만 조문 근거로 서술하고, '연말 전에 파세요' 류의 행동 유도 표현은 쓰지 않는다. 개별 보유 현황에 따른 대주주 해당 여부 판정은 국세상담센터 126 안내로 연결"
geo:
  faq_pairs_min: 3
human_notes: |
  차별화: 연말 하루(직전 사업연도 종료일)의 보유 상태가 다음 과세기간 1년치 과세 여부를
  결정한다는 '기준일' 구조를 중심축으로 잡는다. 여기에 (1) 지분율 요건과 종목당 보유금액
  요건 중 하나만 걸려도 대주주가 되는 OR 구조, (2) 대주주가 아니어도 과세되는 장외 매도·
  비상장주식 예외를 붙여, 금액 기준선 하나만 나열하는 일반 콘텐츠와 정보 이득을 벌린다.
  검수 포인트 1 — 시행령 제157조는 개정이 잦다. 반드시 [시행 2026.10.1.] 현행 조문으로
  시장별 지분율 %·종목당 보유금액 기준선·기준일 정의를 확인하고, 폐지되거나 유예된 과거
  개정안 수치를 현행으로 적지 않도록 한다. brief 본문에는 수치를 단정해 두지 않았다.
  검수 포인트 2 — '가족 합산 폐지'는 본인 기준 전환이지 모든 합산의 소멸이 아니다. 현행
  조문에서 남아 있는 합산 범위를 개정 시점과 함께 명시해야 통념 교정이 성립한다.
  검수 포인트 3 — tax 98편 대조 결과 해외주식-양도소득세-신고(대주주 요건 없는 전면과세),
  금융소득종합과세-기준-2천만원(이자·배당 소득), 스톡옵션-주식매수선택권-행사이익-과세
  (근로·기타소득)와 검색의도가 분리됨을 확인. 세 글은 내부링크로만 연결하고 본문에서
  해외주식 과세 구조를 길게 재설명하지 않는다.
