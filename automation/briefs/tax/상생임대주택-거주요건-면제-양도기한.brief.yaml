must_cover:
  - 2026년 10월 1일부터 생긴 양도 기한 자체 - 대통령령 제36737호(2026.9.30 공포, 2026.10.1 시행)가 소득세법 시행령 제155조의3제1항 각 호 외의 부분을 개정해 거주요건 면제를 "양도 기한 내 양도한 경우"에만 적용하도록 제한했다는 점. 그 전에는 요건만 채우면 양도 시점에 아무 제한이 없었다는 대비가 이 글의 출발점
  - 양도 기한 두 갈래 계산법 - 원칙은 ①상생임대차계약에 따른 임대기간 종료일부터 1년이 지난 날 과 ②2029년 12월 31일 중 이른 날, 예외는 임대기간이 2026년 12월 31일 전에 종료되는 경우 2027년 12월 31일. 임대 종료 시점별로 실제 기한을 날짜로 환산한 예시를 제시(예: 2026년 11월 종료 → 2027.12.31 / 2027년 6월 종료 → 2028년 6월 / 2029년 3월 종료 → 2029.12.31이 더 이르므로 2029.12.31)
  - 올해 말에 겹치는 두 기한의 구분 - 상생임대차계약 체결기한 2026년 12월 31일(계약을 맺을 수 있는 마지막 날, 제34990호로 2024.12.31에서 연장된 현행)과 양도 기한(팔아야 하는 날)은 전혀 다른 기한이다. 이 둘을 같은 날짜로 혼동하는 것이 가장 위험한 오해
  - 특례 기본 요건 4종과 "실제 임대기간으로 판정"의 함의 - ①직전 임대차계약은 주택 취득 후 임대인이 직접 체결한 계약이어야 하고 그 계약으로 1년 6개월 이상 실제 임대, ②보증금 또는 임대료 인상률 5% 이내 신규(갱신) 계약, ③상생임대차계약에 따른 실제 임대기간 2년 이상, ④양도 시점에 1세대1주택. 계약기간이 아니라 실제 임대기간 기준이므로 조기 퇴거로 2년에 못 미치면 특례 배제(국세청 질의회신 취지)
  - 임대개시 시점 다주택자와 면제 범위의 경계 - 2022.8.2 대통령령 제32830호로 임대개시 시점 1주택자 요건과 기준시가 9억원 이하 요건이 폐지돼 다주택자도 상생임대차계약을 체결할 수 있지만, 면제되는 것은 최종적으로 양도되는 1주택의 거주요건뿐이고 양도 시점에는 1세대1주택이어야 한다는 점. 1세대1주택 비과세 2년 거주요건과 장기보유특별공제(표2) 거주기간 요건이 함께 면제된다는 혜택 범위도 함께
  - 임차인이 바뀌어도 되는지, 전세와 월세를 바꾸면 5%를 어떻게 보는지 - 임차인 변경은 무방하고, 전세↔월세 전환 시 전환율은 10%와 기준금리+2% 중 낮은 비율 적용(기획재정부 10문10답)
  - 2026.10.1 개정이 이미 체결한 상생임대차계약에도 적용되는지 - 부칙 적용례를 반드시 확인해야 하는 항목(researcher 필수 확인). 부칙을 확인하지 못하면 적용 범위를 추정해 쓰지 말고 "부칙 확인 필요" 수준으로만 처리
  - 신고 단계 - 소득세법 시행규칙 별지 제83호의4서식 「상생임대주택에 대한 특례적용신고서」(2022.3.18 신설)를 양도소득세 신고 시 제출

