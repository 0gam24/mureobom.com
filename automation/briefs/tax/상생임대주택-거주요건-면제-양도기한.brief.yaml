human_notes: |
  차별화: 상생임대주택을 다루는 글은 전부 "5% 이내 인상·2년 임대" 요건 설명에서
  끝나는데, 2026년 10월 1일부터는 요건을 다 채워도 양도 기한을 넘기면 거주요건
  면제가 사라진다. 기한이 두 갈래(임대기간 종료일+1년 vs 2029.12.31 중 이른 날,
  임대기간이 2026.12.31 전 종료면 2027.12.31)이고 하필 체결기한 2026.12.31과
  겹쳐 혼동하기 쉽다. 임대 종료 시점을 축으로 "언제까지 팔아야 하는가"를 날짜로
  환산해주는 표가 이 글의 유일한 정보 이득이다.

  두 번째 축: 체결기한과 양도기한은 다른 기한이라는 분리. 2026년 12월 31일은
  "계약을 맺을 수 있는 마지막 날"이고, 양도기한은 "팔아야 하는 날"이다. 같은
  연말 날짜라서 하나로 뭉개는 서술이 많을 것으로 보이니 표에서 열을 분리한다.

  세 번째 축: "실제 임대기간" 판정. 직전 계약 1년 6개월, 상생 계약 2년 모두
  계약기간이 아니라 실제로 임대한 기간으로 본다. 조기 퇴거·공실로 기간이 모자라면
  특례가 통째로 날아가고, 그러면 양도 기한 논의 자체가 무의미해진다.

  주의: 개인별 비과세 가능 여부나 절세 유불리를 단정하지 마라(일반정보 고지 유지).
  조정대상지역 지정 현황은 수시로 바뀌므로 특정 지역을 단정하지 마라. 같은
  대통령령 제36737호로 바뀐 일시적 2주택 종전주택 처분기한 3년→2년,
  수도권 밖 준공 후 미분양주택 취득기한 1년 연장, 조정대상지역 민간매입임대아파트
  중과배제 한정은 "같은 개정으로 함께 바뀐 것" 맥락 한 줄로만 언급하고 주제로
  확장하지 마라(tax/일시적-2주택-비과세-요건과 카니발리제이션).

  확인 못 한 것: 2026.10.1 개정의 부칙 적용례. 이미 체결한 상생임대차계약에 어떻게
  적용되는지는 부칙 원문을 확인하기 전에는 추정해 쓰지 마라. 검증 범위를 넘는
  수치·조문·날짜를 새로 만들지 마라.
