must_cover:
  - 비과세 근로소득의 개념 — 소득세법 제12조 제3호, 세전 급여에서 제외돼 세금·4대보험 기준에 영향
  - 식대 비과세 한도 — 월 20만 원(현물 급식과 병행 시 처리), 소득세법 시행령 제17조의2
  - 출산·보육수당(6세 이하 자녀) 비과세 한도 — 월 20만 원, 소득세법 제12조 제3호 및 시행령
  - 자가운전보조금(본인 차량 업무사용) 비과세 한도 — 월 20만 원, 요건(실비 미지급 등)
  - 그 밖의 대표 비과세 항목 — 생산직 야간근로수당, 연구보조비·취재수당, 국외근로소득 등 개괄
  - 흔한 오해 — 비과세는 연말정산 공제와 다름, 한도 초과분은 과세, 4대보험 산정과의 관계

required_sources:           # 공식 1차 출처만. 0건이면 발행 차단
  - "소득세법 제12조(비과세소득) 제3호 (국가법령정보센터)"
  - "소득세법 시행령 제17조의2(식대 등)·제12조(비과세 근로소득의 범위) (국가법령정보센터)"
  - "국세청 연말정산/원천징수 비과세 항목 안내 (nts.go.kr, 렌더 확인 가능한 페이지만)"

