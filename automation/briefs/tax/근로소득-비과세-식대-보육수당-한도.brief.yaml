human_notes: |
  차별화: 급여명세서에 찍히는 비과세 항목별 '월 한도'를 표 하나로 묶고, 식대·보육수당이
  2023~2024년 각각 월 10만→20만 원으로 상향된 현행 기준을 조문으로 확정. '비과세=공제'라는
  통념을 바로잡고, 비과세가 4대보험 부과기준(보수)에도 영향을 준다는 실무 포인트 포함.
  숫자는 소득세법 제12조·시행령 제17조의2로만 확정하고 연도별 개정 가능성 명시.
  단정적 절세 약속 금지, 일반정보 고지. 슬러그 중복 없음(전 클러스터 _published_slugs.txt 대조 완료).
