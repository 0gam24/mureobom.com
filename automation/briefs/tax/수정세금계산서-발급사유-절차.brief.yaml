human_notes: |
  차별화: 발급사유 6~7가지를 '작성방법(음수 1장 vs 증감분 1장)'과 '발급기한'까지 한 표로 묶어, 실무자가 자기 상황에 맞는 행을 바로 찾게 함.
  계약해제(작성일자=계약해제일) vs 공급가액 변동·증감(작성일자=증감사유 발생일)의 작성일자 차이를 표에서 명확히 구분할 것.
  착오정정 기한을 "확정신고기한 다음날부터 1년"으로 정확히 명시 — "즉시 해야 한다"는 통념 바로잡기.
  기준 법령은 부가가치세법 시행령 제70조 현행(2026) 조문으로 대조, 사유별 발급기한 최신 여부 확인.
