id: tax-수정세금계산서-발급사유-절차
cluster: tax
status: published            # draft → approved(사람) → published(자동)

target_query: "수정세금계산서 발급사유 작성방법 발급기한 가산세"
search_intent: 절차형     # 사유 판별 + 작성·발급 절차를 함께 원함

signal:                  # 스캐너 산출(읽기 전용, 원문 아님)
  score: 45.5
  trend_momentum: 0.48
  question_volume: 0.56
  cluster_fit: 1.0        # 가중 1.10 (tax cluster_fit_boost)
  freshness: 0.5

must_cover:
  - 수정세금계산서의 정의(당초 발급한 세금계산서의 기재사항에 착오·변경 등이 있을 때 수정하여 발급하는 것)
  - 부가가치세법 시행령 제70조 제1항 발급사유 유형별 정리 — 처음 공급한 재화의 환입, 계약 해제로 재화·용역이 공급되지 않은 경우, 계약해지 등으로 공급가액에 추가·차감(증감)이 발생한 경우, 내국신용장·구매확인서가 과세기간 종료 후 25일 이내 개설·발급된 경우, 필요적 기재사항 등이 착오 또는 착오 외 사유로 잘못 적힌 경우, 세율을 잘못 적용한 경우, 착오로 이중 발급하거나 면세 등 발급대상이 아닌 거래에 발급한 경우
  - 사유별 작성방법(당초분을 (-)로 1장 vs 증감분만 1장, 비고란·작성일자 기재 방식)
  - 사유별 발급기한(환입·해제·증감은 사유 발생일, 착오정정·세율오류 등은 확정신고기한 다음날부터 1년, 과세표준·세액 경정 전까지 등)
  - 수정발급 시 가산세·수정신고 여부(기한 내 정상 수정발급이면 가산세 회피되는 원리)
  - 전자세금계산서로 수정발급하는 실무 흐름
  - 자주 놓치는 케이스 — 계약해제(작성일자=계약해제일) vs 공급가액 변동/증감(작성일자=증감사유 발생일)의 작성일자 차이, "착오정정은 무조건 즉시"라는 오해와 실제 1년 기한

required_sources:        # 공식 1차 출처만. 블로그·커뮤니티 아님. 0건이면 발행 차단
  - "부가가치세법 시행령 제70조(수정세금계산서 또는 수정전자세금계산서의 발급) (국가법령정보센터)"
  - "부가가치세법 제32조(세금계산서 등) (국가법령정보센터)"
  - "국세청 수정세금계산서 발급방법 안내 (홈택스 / 국세청 누리집)"

internal_links:
