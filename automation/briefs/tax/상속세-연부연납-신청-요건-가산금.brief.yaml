id: tax-상속세-연부연납-신청-요건-가산금
cluster: tax
status: published         # compliance 게이트 통과 (KST 2026-08-14)

target_query: "상속세 연부연납 신청 요건 기간 가산금"
search_intent: 절차형      # 나눠 낼 수 있는 요건 + 신청 절차 + 이자 부담

signal:
  score: 57.0
  trend_momentum: 0.44
  question_volume: 0.46
  cluster_fit: 1.10
  freshness: 0.52

must_cover:
  - 연부연납 개념 — 상속세를 여러 해에 걸쳐 나눠 내는 제도(분납과 구분, 분납은 2개월 내 2회)
  - 신청 요건 — 납부세액 2,000만원 초과 + 납세담보 제공 + 신고·납부기한 내 신청서 제출
  - 연부연납 기간 — 원칙 최대 10년(연부연납 허가일부터), 가업상속재산은 특례로 더 긴 기간
  - 매 회분 납부 방식 — (신고 시 1회분 납부 후) 허가받은 기간 동안 매년 분할 납부, 각 회분 최소금액 요건
  - 연부연납 가산금 — 남은 세액에 국세환급가산금 이자율 수준의 가산금이 붙는다(2026 적용 이자율 개념 설명, 정확한 율은 국세청 고시 참조)
  - 납세담보 종류 — 금전·국공채·토지·건물·납세보증보험증권 등
  - 흔한 오해 바로잡기 — "무이자 분할"이 아니라 가산금이 붙는다, 분납과 연부연납은 다른 제도

required_sources:
  - "상속세 및 증여세법 제71조 연부연납, 국가법령정보센터"
  - "상속세 및 증여세법 시행령(연부연납 가산금 이자율·기간), 국가법령정보센터"
  - "국세청 상속세 연부연납 안내"

