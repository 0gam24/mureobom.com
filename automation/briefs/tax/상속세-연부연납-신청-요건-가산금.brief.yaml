human_notes: |
  차별화: "상속세가 부담돼 한 번에 못 낼 때"를 검색하는 사람에게 분납(2개월)과
  연부연납(최대 10년)을 한 표로 구분해주고, 요건(2천만원 초과·담보·기한 내 신청)과
  가산금(무이자 아님)을 정확히. 정확한 이자율 수치는 국세청 고시 변동이 있으므로
  "고시 이자율 기준" 프레임으로 단정 회피.
  단정적 절세 약속 금지. 개별 상황 상담은 세무 전문가 안내 문구로 마무리.
