human_notes: |
  차별화: "직권 환급에서 빠졌으면 귀속연도별로 언제까지 되돌릴 수 있는가"라는 구제 축으로 쓴다.
  2026.11.03. 국세청이 2021~2025년 귀속을 검토해 기본공제 누락분을 직권 환급한 사건을 기점으로,
  (1) 직권 환급의 범위와 그 밖의 경우를 구분하고, (2) 누락(과다납부)과 중복(과소신고)이 반대 방향으로
  갈리는 진단법을 주고, (3) 경정청구 귀속연도별 시한표로 되돌릴 수 있는 구간을 계산해 보여준다.
  카니발리제이션 교정(2026-11-10, quality-gate 1차 채점 84점 REVISE 지적): 초안 brief는
  "기존 글은 기본공제를 지나가듯 언급만 하므로 검색의도가 겹치지 않는다"고 적었으나 이는 사실과 다르다.
  tax/해외주식-양도소득세-신고에는 전용 H2 "기본공제 250만원은 어떻게 적용되나요?"와 FAQ
  "종목마다 받나요, 아니면 1년에 한 번인가요?"가 있고 summary에도 "국내·해외 합산 연 250만원"이
  들어가 있으며, tax/상장주식-대주주-양도소득세-50억-기준일도 같은 명제를 서술한다. 따라서
  "합산 연 250만원 한 번"은 이미 2회 발행된 명제이므로 이 글의 차별화 축으로 쓸 수 없다.
  합산 적용은 전제로만 짧게 확인하고 해외주식 글로 넘기며, 제목·summary·첫 화면·첫 H2는 전부
  구제 축(직권 환급 범위 + 경정청구 시한)으로 둔다.
  주의: 보도자료 상세 페이지(nttSn=1355828)를 실제로 열어 인원 4,687명·총액 21억 원·1인당 최대
  79만 원·귀속 2021~2025년·환급일 11월 3일·계산 예시를 1차 출처로 확인했다. 다만 "1인당 최대
  79만 원"과 예시의 79만원이 같은 사안이라고 단정하지 않는다(보도자료가 예시를 최대 사례로 명시하지
  않음). 환급가산금 연 3.1%와 세율 30%는 예시 안의 값으로만 쓰고 현재 이율·세율로 일반화하지 않는다.
  소득세법 제94조 제1항 제1호·제2호·제5호·제6호 문언은 미확인이므로 '파생상품'·'신탁 수익권'을
  국세청 안내 용어로 귀속시키지 않는다. 가산세율 숫자, 특정 연도 예정신고 날짜, 2026년 귀속분 직권
  환급, 홈택스 메뉴 경로 추가, "최고 1,250만원"(레거시 서식 페이지) 모두 금지.
  경정청구 시한표는 확정신고기한(다음 해 5월 31일)을 법정신고기한으로 본 자체 계산임을 본문에 명시하고,
  공휴일 연장·예정신고 기산점 미확인 사실도 함께 적는다. 종목 추천·수익률 언급·절세 권유 금지,
  개인 맞춤 세무 자문 금지, 일반정보 고지 유지.
