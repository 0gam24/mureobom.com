must_cover:
  - 기본공제의 소득별 구분 — 양도소득 기본공제는 소득별로 각각 연 250만원이고, 주식등 양도소득은 부동산 등 양도소득과 별개 그룹이다
  - 핵심 교정 지점 — 국내주식과 국외주식은 2020.1.1. 이후 양도분부터 손익통산이 허용되면서 기본공제도 "국내·국외 각각 연 250만원"에서 "국내·국외 합산 연 250만원"으로 바뀌었다(국세청 안내 문언). 둘 다 양도해도 250만원이 한 번만 적용된다
  - 누락이 생기는 구조 — 예정신고를 증권사별·종목별·국내외별로 여러 번 하면 신고서마다 기본공제를 어떻게 반영했는지 흩어진다. 반대로 합산 적용을 모르고 두 번 넣으면 과소신고가 된다
  - 확정신고 의무 — 같은 과세기간에 주식등을 2회 이상 양도해 합산 재계산이 필요한 경우 다음 해 5월 확정신고로 정산한다는 구조(1차 출처로 확인된 범위에서만 서술)
  - 국세청 직권 경정 환급 — 2026.11.03. 국세청 보도자료 "주식 양도소득 기본공제 누락분, 국세청이 먼저 찾아 돌려드립니다."(자본거래관리과). 납세자 신청 없이도 신고내용을 검토해 누락분을 반영해 환급한다는 취지. 구체 인원·금액은 1차 출처(보도자료 원문)로 확인되지 않으면 쓰지 않는다
  - 직권 환급 대상이 아닐 때의 경로 — 경정청구(국세기본법 제45조의2) 기한과 기산점. 법정신고기한 다음 날부터 몇 년인지 조문으로 확인하고, 연도별로 언제까지 가능한지 자체 계산 예시를 만든다
  - 환급금 확인 방법 — 국세환급금통지서 발송과 홈택스·손택스 환급금 조회 경로(확인된 범위만)
  - 사칭·사기 주의 — 국세청은 환급을 이유로 계좌 비밀번호·카드번호·송금을 요구하지 않는다는 안내
  - 미등기양도자산은 기본공제 적용 배제(부동산 등 쪽 단서)와 주식등 쪽에는 해당하지 않는다는 구분
  - 정보 기준일 명시. 확인 못 한 수치·조문·금액은 쓰지 않는다

