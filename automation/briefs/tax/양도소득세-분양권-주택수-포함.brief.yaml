  - 분양권 자체를 양도할 때의 세율(2021.6.1 이후 양도분 60%·70% 단기 중과)과 주택수 포함 논점의 구분
  - 조합원입주권과 분양권의 차이 한 줄(둘 다 주택수 포함이나 근거·취득경로가 다름) — 혼동 방지
  - 흔한 오해 바로잡기("분양권은 아직 집이 아니라 주택수에 안 잡힌다", "모든 분양권이 주택수에 포함된다")

