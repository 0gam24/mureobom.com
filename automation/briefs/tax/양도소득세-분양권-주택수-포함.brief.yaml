human_notes: |
  차별화: 기발행 '1세대1주택-비과세'(주택 기준)·'일시적-2주택'과 달리 '분양권이 주택수에 잡히는지'라는
  단일 논점을 취득시기(2021.1.1) 기준으로 정면으로 다룸. 취득 시기별 적용 차이를 표/인포그래픽으로.
  분양권 '주택수 포함'과 분양권 '양도 시 세율(60/70%)'을 명확히 분리(둘 다 자주 혼동). 조합원입주권과의
  구분 한 줄. 개인별 비과세 가부는 세대·보유·취득시기에 따라 달라 단정 금지, 국세청·세무서 확인 안내.
