human_notes: |
  차별화: 필요경비 인정 vs 불인정 항목 대조표 + 2018.4 적격증빙 요건 + 환산취득가액.
  자본적지출(인정)과 수익적지출(불인정)의 경계 사례를 표로 명확히 대비 — 다른 사이트가
  뭉뚱그리는 지점. 도배·장판·대출이자·보유세가 '경비 아님'인 이유를 근거와 함께.
  검수 포인트: 2018.4.1 적격증빙 의무화 기준연도 정확히 표기. 환산취득가액은
  개념 안내 수준까지만(가산세·적용요건 남용 금지). "이렇게 하면 세금 줄인다"식
  단정적 절세 약속 금지 — 일반정보 고지 유지.
