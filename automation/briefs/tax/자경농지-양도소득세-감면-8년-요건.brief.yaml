  - 대상 농지에서 제외되는 경우(주거·상업·공업지역 편입, 환지예정지 지정 등)
  - 흔한 오해(소유만 8년으로는 안 됨, 실제 자경 입증 필요, 상속·증여 시 경작기간 통산 규칙)

