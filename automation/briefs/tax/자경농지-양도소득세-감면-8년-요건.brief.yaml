human_notes: |
  차별화: '재촌'과 '자경' 두 요건을 각각 표로 분해하고, 경작기간에서 빠지는 해(총급여
  3,700만원·사업소득 기준 초과 연도) 규칙을 구체 수치로 명시. 감면 한도 1억/2억 구조를
  과세기간 합산 예시로 시각화. "8년 갖고만 있으면 세금 없다"는 통념을 실제 자경 입증
  필요로 반박. 인포그래픽: 재촌·자경·한도 3요건 체크 다이어그램.
  단정적 절세 약속 금지(감면 여부는 개별 요건 충족 여부에 달림). 외부 커뮤니티 원문 저장 금지.
