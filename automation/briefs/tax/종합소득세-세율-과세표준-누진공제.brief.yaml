human_notes: |
  차별화: 기발행 세율 글은 전부 재산 관련 세금(취득세·종부세·재산세)이고, 종합소득세 기본세율표(6~45% 8구간)를 다룬 글은 없음. 누진세 구조를 "전체 소득에 최고세율 일괄 적용이 아니다"라는 오해 반박으로 각도 확보. 과세표준 x 세율 - 누진공제 공식과 구간별 계산 예시를 표로 시각화.
  세율표·누진공제액은 소득세법 제55조 원문으로 대조. 지방소득세 10% 별도는 지방세법 근거로 "국세 + 지방소득세" 분리 서술.
  단정적 절세 약속 금지, 일반 정보 프레임(W/F 게이트).
