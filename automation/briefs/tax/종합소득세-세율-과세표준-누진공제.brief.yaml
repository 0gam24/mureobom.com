  - 누진공제액의 의미와 "과세표준 x 세율 - 누진공제" 계산 공식
  - 과세표준 = 종합소득금액 - 소득공제 라는 위치(세율 적용 대상)
  - 지방소득세 10% 별도 부과로 실제 부담 세율은 세율의 1.1배
