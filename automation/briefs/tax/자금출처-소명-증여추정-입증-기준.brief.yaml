human_notes: |
  차별화: "자금출처는 100% 다 증명해야 한다"는 통념을 법령 문구로 정면에서 깨고, 상증세법 시행령 제34조
  제1항 단서의 미입증 허용 한도(취득가액 20% vs 2억원 중 적은 금액)를 **취득가액별로 계산 가능한 규칙**으로
  옮겨 놓는다. 취득가액 10억원이 두 값의 교차점이라는 구조(그 아래는 비례 확대, 그 위는 2억원 고정)는
  전 코퍼스 316편에 없고, 시중 콘텐츠도 대개 숫자표만 옮겨 적는다.
  두 번째 축은 정정이다. 널리 복사되는 '연령·세대주별 증여추정 배제기준 금액표'는 법령이 아니라
  시행령 제34조 제2항이 국세청장에게 위임한 행정 내부 기준(국세청 훈령)이며 개정으로 변한다. 이 글은
  그 금액을 옮겨 적지 않고 위임 구조만 정확히 알려 준다 — WebFetch로 훈령 본문(law.go.kr 행정규칙)이
  JS 렌더로 확인되지 않았고, 정책브리핑에서 주택 배제기준 하향 계획이 언급된 이력이 있어 기억에 의존한
  숫자는 오보 위험이 크다. fabrication-zero 원칙에 따라 미확인 수치는 쓰지 않는다.
  기존 글 대조: tax/가족간-계좌이체-증여세-비과세-한도는 계좌이체가 증여인지와 증여재산공제 한도,
  tax/증여세-면제한도-증여재산공제는 공제액과 10년 합산, tax/부담부증여-양도세-증여세는 채무 인수 시
  세목 분리, tax/상속세-사전증여재산-합산-10년은 상속 시 합산. '취득자금 미입증액을 얼마까지 허용하나'라는
  검색의도를 해결한 글은 316편 중 0편이고 '증여추정'은 전 코퍼스에 단어 자체가 없다.
  주의: 개별 사안 판정으로 읽히지 않게 할 것. 자력 취득 인정 여부는 사실판단이므로 "이 정도면 안전하다"
  단정 금지, "조사를 피할 수 있다"류 표현 금지. 조사 회피·소명 우회 요령으로 읽히는 서술 금지 —
  법정 기준을 정확히 알려 준다는 톤 유지. 일반정보 고지 유지.
