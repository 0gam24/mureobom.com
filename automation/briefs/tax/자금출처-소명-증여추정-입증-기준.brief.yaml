must_cover:
  - 소명 요구의 법적 근거 위치 — 상속세 및 증여세법 제45조 제1항(재산 취득자금)과 제2항(채무 상환자금)이 "직업·연령·소득·재산 상태로 볼 때 자력으로 취득·상환했다고 인정하기 어려운 경우"를 증여로 **추정**한다는 구조. 세금을 매기는 근거 규정이 아니라 사실관계를 뒤집어 놓는 규정이라는 점
  - 추정이라는 말의 실제 효과 — 과세관청이 증여 사실을 하나하나 밝히지 않아도 되고, 반대 사실을 내놓는 쪽이 납세자가 된다. 다만 제45조 제3항은 "출처에 관한 충분한 소명이 있는 경우" 추정을 적용하지 않는다고 명시해 반증의 문이 법에 열려 있다는 점
  - 법이 자금출처로 인정하는 항목 3가지 — 상증세법 시행령 제34조 제1항 각 호: (1) 신고하였거나 과세받은 소득금액 (2) 신고하였거나 과세받은 상속 또는 수증재산의 가액 (3) 재산을 처분한 대가로 받은 금전이나 부채를 부담하고 받은 금전으로 해당 재산 취득에 직접 사용한 금액. "통장에 있던 돈"이 아니라 **신고·과세 이력이나 처분·차입 사실로 연결되는 돈**만 자금출처가 된다는 해석
  - 이 글의 핵심 — **전액을 증명해야 하는 것이 아니다.** 상증세법 시행령 제34조 제1항 단서는 입증되지 않는 금액이 (취득재산 가액 또는 채무 상환금액의 100분의 20에 상당하는 금액)과 (2억원) 중 **적은 금액**에 미달하면 증여추정에서 제외한다고 규정. 즉 법정 허용 미입증 한도가 존재
  - 그 허용 한도의 두 구간 구조 — 취득가액 10억원까지는 20% 쪽이 작아 한도가 취득가액에 비례해 커지고, 취득가액 10억원을 넘으면 2억원 쪽이 작아 한도가 2억원으로 고정된다는 전환점. 취득가액별 허용 미입증액을 직접 계산해 판정 가능하게 만들 것(인포그래픽으로 시각화)
  - 계산 판정 예시 2~3건 — 예: 취득가액 5억원이면 허용 미입증액 1억원(20%), 6억원 중 5억원을 소명하면 미입증 1억원으로 20%(1.2억) 미달이라 추정 배제. 반대로 취득가액 20억원이면 한도는 2억원으로 고정되므로 18억원 이상을 소명해야 한다는 식. 단서 문구가 "미달하는 경우를 제외한다"이므로 한도와 **같은 금액**은 배제 대상이 아니라는 경계까지 짚을 것
  - 인터넷에 도는 "증여추정 배제기준 금액표"의 법적 위치 — 시행령 제34조 제2항은 재산취득일·채무상환일 전 10년 이내 자금 합계액이 5천만원 이상인 경우로서 연령·직업·재산상태·사회경제적 지위 등을 고려해 **국세청장이 정하는 금액**을 따르도록 위임하고 있다. 즉 연령·세대주별 금액표는 법령 본문이 아니라 국세청 훈령(상속세 및 증여세 사무처리규정)에 있는 행정 내부 기준이고, 개정으로 바뀔 수 있다. **구체 금액은 이 글에 적지 않고 국세청 상담(126)·관할세무서 확인 사항으로 처리한다.** 표를 안전선으로 믿는 통념과, 법령에 박혀 있는 20%·2억원 규칙을 구분하는 것이 이 글의 축
  - 채무 상환도 같은 잣대 — 제45조 제2항. 대출을 갚은 자금 역시 자력 상환으로 보기 어려우면 상환 시점에 그 상환자금을 증여받은 것으로 추정. 집을 살 때만 조심하면 된다는 오해를 깨는 지점
  - 차명계좌 리스크 — 제45조 제4항. 금융실명법 제3조에 따라 실명이 확인된 계좌에 있는 재산은 **명의자가 취득한 것으로 추정**하고 제1항을 적용한다. 부모가 자녀 명의 계좌에 넣어둔 돈이 자녀의 취득으로 먼저 추정된다는 순서
  - 소명하지 못하면 붙는 것 — 증여세 본세에 국세기본법 제47조의2 무신고가산세(일반 100분의 20, 부정행위 100분의 40)와 제47조의4 납부지연가산세가 더해진다. 증여세 신고기한(상증세법 제68조)도 함께 제시. 납부지연가산세의 일일 이자율은 시행령 위임 사항이므로 researcher가 확인한 값만 쓰고, 확인 못 하면 율을 쓰지 않는다
  - 언제까지 물어볼 수 있는지 — 국세기본법 제26조의2 제4항: 상속세·증여세 부과제척기간은 10년, 부정행위·무신고·거짓신고·누락신고는 15년. 같은 조 제5항의 특례(타인 명의 취득·명의신탁 등 부정행위로 포탈한 경우 상속·증여가 있음을 안 날부터 1년, 단 재산가액 50억원 이하는 제외). "몇 년 지나면 끝"이라는 계산이 위험한 이유
  - 결론은 재나열이 아닌 준비 순서 — 취득 전에 소득·처분·차입 각각을 어떤 서류로 연결해 둘지, 차입이면 왜 상환 흐름까지 남겨야 하는지. 자력 취득 여부는 판정이므로 서류가 있어도 결과가 달라질 수 있다는 한계 명시

