human_notes: |
  차별화: "세무조사 선정 제외"를 혜택 소개가 아니라 11월 한 달짜리 달력 문제로 재구성 —
  제출(11월)과 이행(다음 해 실제 투자) 사이에 요건이 두 번 걸리는 구조, 그리고 선정 제외가
  수시조사를 막아주지 않는다는 경계선을 명시한다.
  확인 못 한 올해분 기준비율·제출 마감일은 절대 추정해 쓰지 말고, "그 해 공지로 확정"으로
  처리한다. 고용 요건 신설 여부도 1차 출처로 확인되지 않으면 쓰지 않는다.
  사업자 독자 대상이므로 개인 맞춤 세무자문으로 읽히지 않게 일반정보 고지 유지.
