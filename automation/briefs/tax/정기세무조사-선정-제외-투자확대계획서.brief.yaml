target_query: "정기 세무조사 대상 선정 제외 투자확대계획서 11월 제출"
search_intent: 절차형      # "안 받으려면 무엇을 언제 내야 하나" + 대상 확인

signal:                   # WebSearch 폴백 선정(스캐너 미실행) — 집계 판단값만
  score: 0.0
  source: websearch_fallback
  freshness: 1.0
  cluster_fit: 1.0

must_cover:
  - 정기조사 대상 선정 기준 3축(순환조사 수입금액 기준·장기미조사·신고성실도)과 비정기(수시)조사의 구분
  - 선정 제외(세정지원) 유형 목록 — 투자확대기업·스타트업·사회적기업·수출중소기업 등 각 유형의 확인된 요건
  - 투자확대계획서 경로: 제출 시기(매년 11월, 홈택스)·제출만으로 끝나지 않고 '계획 이행'까지가 요건인 구조
  - 체납 없음·관련 법령 준수라는 부가 요건이 실제로 당락을 가르는 지점
  - 선정 제외가 '모든 세무조사 면제'가 아니라는 점(수시조사·혐의 기반 조사는 별개)
  - 올해분 기준비율·제출기간은 그 해 국세청 공지로 확정되는 구조라는 점(확인 못 한 수치는 쓰지 않음)

required_sources:
  - "국세청 — 개인사업자 정기조사 선정기준(선정 제외 세정지원 유형 포함)"
  - "국세기본법 제81조의6(세무조사 대상자 선정) 등 조사 선정 근거 조문"
  - "국세청 보도자료·공지사항(투자확대계획서 제출 안내)"

