target_query: "간이지급명세서 근로소득 제출기한 반기 매월 전환 2027년 지급분"
search_intent: 절차형     # 내가 언제 내야 하는지 + 주기가 언제 바뀌는지를 함께 확인하려는 의도

signal:                  # WebSearch 폴백 선정(스캐너 큐 2026-06-11 생성으로 stale). 집계 성격 메모만
  score: 0.0
