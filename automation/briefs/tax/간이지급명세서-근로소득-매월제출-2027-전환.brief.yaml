  cluster_fit: 1.0

must_cover:
  - 소득 종류별 제출 주기가 다르다는 점 — 근로소득 간이지급명세서는 현재 반기, 사업소득·인적용역 기타소득 간이지급명세서와 일용근로소득 지급명세서는 매월
  - 근로소득 간이지급명세서 기본 제출기한 — 지급일이 속하는 반기의 마지막 달의 다음 달 말일
  - 제출 주기 전환 시점 — 2027년 1월 지급분부터 매월 제출(국세청 안내 기준). "2026년부터 매월"이라는 2차 정보와 어긋나는 지점을 1차 출처로 교정
  - 제출 대상자 범위 — 상용근로자에게 근로소득을 지급하는 자. 일급·시급이라도 동일 고용주에게 3개월 이상(건설공사 종사자 1년 이상) 계속 고용되면 상용근로자로 봄
  - 지급 시기 의제 — 귀속연도 근로소득을 12월 말까지 지급하지 않으면 12월 지급분으로 작성. 휴업·폐업·해산은 그 달의 다음 달 말일
  - 가산세 구조 — 미제출 0.25%, 기한 후 제출 0.125%. 지연제출 인정 기간이 현재 3개월에서 2027년 1월 1일 이후 1개월로 축소
  - 불분명·사실과 다른 금액이 총 지급액의 5% 이하면 가산세 미부과(2027년 1월 1일 이후 적용 개정 내용)
  - 중복적용 배제의 범위 — 원천징수대상 사업소득·인적용역 관련 기타소득에서 둘 다 미제출·불분명이면 지급명세서 가산세 1%만 적용(연말정산 사업소득은 중복 적용 대상). 근로소득 포함 여부는 1차 출처로 확인되지 않아 근로소득으로 일반화하지 않는다
  - 미제출 가산세 한시 특례 — 종전 제출기한까지 제출하면 미제출 가산세 면제. 2027년 1월 1일부터 2027년 12월 31일 지급 상용근로소득, 소규모 사업자는 2028년 12월 31일까지. 이때 소규모 사업자는 직전연도 상시 종업원 20명 이하 반기별 원천세 납부자로, 세액공제 대상 범위와 다름
  - 소규모 사업자 세액공제 — 2027년 1월 1일부터 2028년 12월 31일, 소득자 인원수 × 200원, 연 한도 일반 300만원·세무회계법인 600만원, 최소 1만원
  - 가산세 한도 — 국세기본법 제49조 법문대로 의무위반 종류별 각각 5천만원(중소기업기본법상 중소기업이 아닌 기업은 1억원), 고의적 위반은 한도 적용 제외. 적용기간·적용방법은 대통령령 위임사항이므로 "과세기간 단위"로 단정하지 않는다
  - 정보 기준일 명시 + 확정 전 개정사항을 단정하지 않는 서술

required_sources:        # 공식 1차 출처만. 0건이면 발행 차단
  - "국세청 간이지급명세서(근로소득) 제출기한 적용 사례 — 제출주기·가산세·한시 특례·세액공제 안내"
  - "국세청 간이지급명세서(거주자의 사업소득) 안내 — 매월 제출 주기"
  - "국세청 간이지급명세서(거주자의 기타소득) 안내 — 인적용역 기타소득 매월 제출"
  - "국세청 일용근로소득 지급명세서 안내 — 매월 제출"
  - "국세청 원천세 지급명세서 제출 안내 — 소득자료별 제출기한 비교"
  - "국세청 가산세 안내 — 지급명세서·간이지급명세서 제출 불성실 가산세율과 한도"
  - "소득세법 제164조의3(간이지급명세서의 제출) — 국가법령정보센터"

