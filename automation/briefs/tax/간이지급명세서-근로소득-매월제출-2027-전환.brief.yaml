human_notes: |
  차별화: "간이지급명세서는 소득 종류마다 제출 주기가 따로 돌아가고, 근로소득만 아직 반기인데
  그 예외가 2027년 1월 지급분에 끝난다"는 주기 전환 축으로 쓴다. 시중 자료가 "2026년부터 매월"로
  엇갈리게 적어 둔 상태라, 국세청 안내 문언으로 전환 시점을 고정하는 것 자체가 정보 이득이다.
  대부분의 글이 '기한과 가산세율' 나열에서 끝나는데, 이 글은 (1) 소득 종류별 주기 대조표,
  (2) 2027년 1월에 하반기 반기분 제출과 첫 매월분 제출이 겹치는 구조, (3) 지연제출 인정 기간이
  3개월에서 1개월로 줄어드는 변화, (4) 종전 기한까지 내면 미제출 가산세를 면제하는 한시 특례와
  그 특례의 소규모 사업자 정의가 세액공제 쪽 정의와 다르다는 점까지 짚어 실무 마찰 지점을 만든다.
  주의: 소득세법 제164조의3 조문 본문을 WebFetch로 확인하지 못하면 조문 번호만 참조로 두고
  수치·문언은 국세청 안내 문구 범위에서만 쓴다. 전환 시점은 국세청 안내 기준임을 본문에 명시하고
  "무조건"·"확정" 같은 단정 표현을 쓰지 않는다. 홈택스 화면 경로·전화번호는 확인한 범위만.
  개인 맞춤 세무 자문·절세 권유 금지(일반정보 고지 유지).
  리서치 교정(2026-11-06): 가산세 한도 금액 방향을 법문대로 수정(중소기업 5천만원 / 중소기업이
  아닌 기업 1억원 — 초안이 반대로 적었음). 중복적용 배제는 사업소득·인적용역 기타소득 범위로 한정.
  소득세법 제164조의3 조문 본문은 law.go.kr JS 렌더링으로 미확인 → 조문 번호 참조만 허용, 문언 인용 금지.
  국세기본법 제49조 제2항의 한도 적용기간은 대통령령 위임까지만 확인 → 적용기간 서술 금지.
