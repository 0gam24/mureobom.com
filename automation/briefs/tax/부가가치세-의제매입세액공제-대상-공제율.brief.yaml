human_notes: |
  차별화: 업종별 공제율·과세표준 대비 한도율 비교표 + 매입세액 불공제와 의제매입세액공제 구분표 + 2026년 최신 한도율 기준.
  검수 포인트:
  - 공제율은 업종(음식점업·제조업·기타)과 개인/법인에 따라 다르니 표로 정리하고 연도 기준 명시.
  - 한도율은 개정이 잦은 항목(과세표준 구간별·법인 여부별). 2026년 부가가치세법 시행령 기준으로 확인.
  - "면세 농산물을 사면 전부 공제된다"는 통념은 오류 — 과세사업 원재료 사용·적격 증빙·한도 요건을 모두 충족해야 함.
