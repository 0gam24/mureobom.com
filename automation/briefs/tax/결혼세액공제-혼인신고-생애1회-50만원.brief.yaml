must_cover:
  - "조세특례제한법 제92조의 공제 구조 — 거주자가 2026년 12월 31일 이전에 혼인신고를 한 경우 1회에 한정하여 혼인신고를 한 날이 속하는 과세기간의 종합소득산출세액에서 50만원을 공제한다. 적용 대상은 2024년부터 2026년까지의 혼인신고분"
  - "1인당 50만원이므로 부부 두 사람이면 합계 최대 100만원(국세청 보도자료 기준). '최대'라는 단어가 붙는 이유를 아래 한계와 연결"
  - "세액공제의 구조적 한계 — 산출세액에서 빼는 방식이라 결정세액이 이미 0인 쪽(면세점 이하 소득, 다른 공제로 세액이 소진된 경우)은 50만원을 전액 활용하지 못한다. 결과적으로 부부 합계 100만원이 항상 성립하지 않고 한 사람만 실제 혜택을 보는 경우가 생긴다"
  - "기준일은 결혼식이 아니라 혼인신고일 — 조문이 '혼인신고를 한 날이 속하는 과세기간'이라고 정하므로 12월 예식·이듬해 1월 신고면 공제 귀속 연도가 달라진다. 현행 조문상 2026년이 마지막 적용 연도이고 2026-12-31까지 신고해야 하며, 2027년 이후 신고분은 현행 조문 대상이 아니다(연장 여부는 향후 세법개정 사안이므로 단정하지 말 것)"
  - "생애 1회 — 2024년이나 2025년 혼인신고로 이미 적용받았다면 2026년 혼인신고에는 다시 적용되지 않는다"
  - "증여세 혼인 증여재산공제(1억원)와 완전히 별개 제도 — 소득세 세액공제(조세특례제한법 제92조)와 증여재산공제(상속세 및 증여세법)는 근거법·계산 방식이 다르고, 요건을 각각 충족하면 둘 다 적용될 수 있다"
  - "적용 창구가 둘 — 근로소득자는 연말정산에서, 프리랜서·사업자는 이듬해 5월 종합소득세 확정신고에서 공제한다. 창구를 놓쳤을 때의 경정청구 가능성은 일반 절차 범위로만 언급"

required_sources:
