human_notes: |
  차별화: "50만원 준다"에서 멈추는 기존 글과 달리, 세액공제가 산출세액에서 빼는 구조라 결정세액 0인 배우자는 50만원을 다 못 쓴다는 점(= 부부 합계 100만원이 항상 성립하지 않음)과 기준일이 결혼식이 아닌 혼인신고일이라는 점을 조문 문구로 갈라주는 글.
  핵심 정보 이득 지점은 "최대 100만원"의 '최대'다. 검색 결과 대부분이 100만원을 단정적으로 쓰지만, 한쪽이 면세점 이하거나 다른 공제로 세액이 소진되면 실제 환급 효과는 그만큼 줄어든다. 이 구조를 표로 갈라줄 것.
  두 번째 축은 귀속 연도. 12월 예식·1월 혼인신고 케이스는 실제로 흔한데 공제 연도가 달라진다. 2026년이 현행 조문상 마지막 적용 연도라 2026-12-31 신고 마감이 함께 강조돼야 한다.
  자주 틀리는 통념 2건: (1) 결혼세액공제와 증여세 혼인공제 1억원을 같은 제도로 섞어 쓰는 오류, (2) 결혼식 날짜를 기준일로 보는 오류.
  2027년 이후 연장·재도입 여부는 향후 세법개정 사안이므로 예측·단정 금지. 확인되지 않은 소득 요건·나이 요건·재혼 제한을 추가하지 말 것(조문에 없음).
  세액 환급을 약속하는 단정 표현 금지. 실제 효과는 각자의 결정세액에 따라 달라진다는 점을 유지.
  루틴 실행(2026-09-25 KST)에 따른 즉석 승인.
