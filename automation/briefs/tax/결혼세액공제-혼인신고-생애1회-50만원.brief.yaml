  - "조세특례제한법 제92조 신설 관련 제정·개정이유 (국가법령정보센터 제정·개정이유)"
  - "국세청 보도자료 「꿀 같은 신혼, 최대 100만원의 결혼세액공제도 잊지 마세요」 (2025-01-19, 원천세과)"
  - "소득세법 산출세액·세액공제 적용 순서 및 결정세액 규정 (국가법령정보센터) — 공제 한도가 결정세액에 갇히는 구조 확인용"
