  통합한도 1억원(혼인+출산 합산)과 기존 5천만원 합산 시 최대 1억5천만원 구조를 표로 정리.
  '각각 1억씩 2억'·'무조건 비과세' 통념 반박. 세율·절세 단정 금지, 신고 의무 안내는 사실 위주.
