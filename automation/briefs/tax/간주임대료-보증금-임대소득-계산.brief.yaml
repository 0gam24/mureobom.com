must_cover:
  - 간주임대료란 무엇인가(임대보증금·전세금에 일정 이율을 곱해 임대료로 간주해 총수입금액에 산입하는 제도) 및 도입 취지
  - 주택 임대 간주임대료 요건 — 부부합산 3주택 이상 + 보증금 합계 3억원 초과분에 대해 과세(소형주택 제외 요건 포함)
  - 상가 등 비주거용 부동산 임대 — 보증금에 대해 간주임대료 계산(주택의 3주택 요건과 무관하게 적용)
  - 계산식 — (보증금적수 - 임대용부동산 건설비상당액적수) × 정기예금이자율 ÷ 365 (- 해당 금융수익 차감), 기장(장부) 신고와 추계 신고의 차이
  - 정기예금이자율은 기획재정부령 고시로 매년 변동 가능 — 최신 연도 기준 확인 필요, 특정 수치를 적을 때는 반드시 근거연도 표기
  - 흔한 오해 교정 — "전세는 월세가 아니니 세금이 없다" / "보증금은 무조건 과세된다" 두 통념 모두 바로잡기

required_sources:        # 공식 1차 출처만(화이트리스트 도메인). 0건이면 발행 차단
  - "소득세법 제25조(총수입금액 계산의 특례) 및 소득세법 시행령 제53조 (국가법령정보센터 law.go.kr) — 간주임대료 계산 근거"
