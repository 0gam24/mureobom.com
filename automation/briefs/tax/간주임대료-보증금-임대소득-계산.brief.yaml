human_notes: |
  차별화: 주택(부부합산 3주택·보증금 3억 초과) vs 상가(요건 무관) 간주임대료를 한 표로 구분 + 전세보증금도 과세될 수 있다는 오해 교정 + 정기예금이자율 연도별 변동 주의.
  정기예금이자율 최신 수치는 반드시 근거 연도와 함께만 기재 — 연도 없이 단정 금지.
  개인별 세액 단정 금지(일반정보 고지 유지). 소형주택 제외 요건은 기준면적·기준시가 조건이 개정될 수 있으니 최신 기준연도 확인.
  주택은 3억 초과분·상가는 요건 없이 전액 대상이라는 차이를 표에서 명확히.
