must_cover:
  - 분납(분할납부) 제도 개요 — 납부할 세액이 1천만원을 초과하면 일부를 납부기한 경과 후 2개월 이내에 나눠 낼 수 있음(소득세법 제77조)
  - 분납 가능 금액 기준(납부세액 2천만원 이하: 1천만원 초과분 / 2천만원 초과: 세액의 50% 이하)과 계산 예시
  - 분납 대상 세액 범위(종합소득세 본세 기준, 가산세·감면분추가납부세액 포함 여부와 농어촌특별세 별도 분납)
  - 신청 방법(홈택스 전자신고 시 분납 금액 입력, 서면신고 시 신고서 분납란 기재 — 별도 승인신청 아님)
  - 중간예납세액 분납 가능 여부와 지방소득세(소득분)는 별도로 지자체에 분납 신청한다는 점
  - 분납과 헷갈리는 제도 구분(납부기한 연장·징수유예·연부연납과 다름) 및 미납 시 납부지연가산세

required_sources:        # 공식 1차 출처만. 신호는 집계 수치만. 0건이면 발행 차단
  - "소득세법 제77조(분납) 및 시행령 제140조 (국가법령정보센터 law.go.kr)"
  - "국세청 종합소득세 신고·납부 안내 / 분납 안내 (nts.go.kr)"

