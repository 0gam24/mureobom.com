target_query: "종합소득세 분납 분할납부 기준 1천만원 신청방법 납부기한 2개월"
search_intent: 절차형     # 얼마부터 나눌 수 있는지 + 어떻게 신청하는지 함께 원함

signal:                  # 스캐너 산출(읽기 전용, 원문 아님 — 집계 수치만)
