human_notes: |
  차별화: '납부세액 1천만원 초과'라는 문턱과 '2천만원 이하 vs 초과'로 갈리는 분납 가능액을
  숫자 예시(예: 1,500만원 → 500만원 분납 / 3,000만원 → 1,500만원 분납)로 명확히. 분납은
  별도 승인 신청이 아니라 신고서에 금액만 기재하면 된다는 점(자주 하는 오해)을 강조. 납부기한
  연장·징수유예·상속세 연부연납과 혼동하지 않도록 구분표. 지방소득세(소득분)는 국세청이 아니라
  지자체(위택스)에 별도 분납 신청함을 명시. "세금 안 내도 된다"가 아니라 '나눠 내는 것'임을 분명히.
  검수 포인트: 2개월(종전 45일에서 개정) 분납기한, 1천만원 문턱, 50% 기준 정확히. 농어촌특별세
  분납 규정은 개념 수준까지만. 단정적 절세 약속 금지 — 일반정보 고지 유지.
