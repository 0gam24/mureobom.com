must_cover:
  - 대손세액공제 개념(회수 못한 외상매출의 이미 납부한 매출세액을 확정신고 시 매출세액에서 차감)
  - 대손 확정 사유 목록(부가가치세법 시행령상: 소멸시효 완성, 파산·강제집행, 부도발생일부터 6개월 경과 어음·수표, 회수기일 6개월 경과 30만원 이하 채권 등)
  - 공제 가능 기간(공급일부터 10년이 지난 날이 속하는 과세기간 확정신고 기한까지)
  - 공제세액 계산식(대손금액 × 10/110)과 계산 예시
  - 확정신고 시에만 가능(예정신고에서는 공제 불가)
  - 대손금 회수 시 세액 재가산(회수한 과세기간 매출세액에 다시 가산)
  - 공급받은 사업자의 대응(대손확정 시 매입세액 차감, 폐업 전 대손처분)
  - 신청 서류(대손세액공제신고서 + 대손 사실 증명서류)
  - 흔한 오해 바로잡기(단순 미수·연체는 대손 아님, 법정 사유 충족·확정 필요)

