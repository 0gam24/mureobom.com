human_notes: |
  차별화: 외상 부가세를 못 받은 공급자가 이미 납부한 매출세액을 돌려받는 '대손세액공제'에 집중 — 기발행 부가세 글(신고기간·조기환급·예정고지·전자세금계산서)과 겹치지 않음. 대손 확정 사유·공제 시기(확정신고)·계산식(×10/110)·회수 시 재가산·공급받은 자의 매입세액 차감까지 공급자/공급받는자 대칭 구조로.
  검수 포인트: 공제 기간은 '공급일부터 10년이 지난 날이 속하는 과세기간 확정신고 기한까지'가 최신 기준 — 과거 5년 기준으로 잘못 쓰지 않도록 확인.
  자주 틀리는 통념: 단순 미수·연체금은 대손이 아니며 법정 사유로 '대손 확정'되어야 공제 가능. 예정신고에서는 공제 불가(확정신고 전용)라는 점 강조.
