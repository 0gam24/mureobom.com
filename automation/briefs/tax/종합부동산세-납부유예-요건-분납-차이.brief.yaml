human_notes: |
  차별화: 기존 종부세 글 2편은 '세액을 어떻게 계산하나'(부과기준·세율)와 '9월에 무엇을 신고하나'(합산배제)를 다룬다. 이 글은 12월 고지서를 받은 뒤 남은 두 선택지를 비용 기준으로 가른다. 분납은 무이자·6개월·신청은 납부기한까지, 납부유예는 담보 필요·취소 시 연 1천분의 31 이자상당가산액·신청은 만료 3일 전까지. 같은 '납부유예'라는 말을 쓰는 국세징수법 제14조 납부고지 유예와도 다른 제도라는 점을 구분한다.
  틀리기 쉬운 지점: 요건 제2호만 택일(60세 또는 5년 보유)이고 나머지 3호는 전부 충족해야 한다. 소득 요건의 괄호 한정 조건이 자주 누락된다. 유예 기간 납부지연가산세 면제를 '무이자'로 오해하기 쉽다.
  확인 못 한 항목: 국세청 홈페이지의 납부유예 전용 안내 페이지는 열린 범위에서 확인되지 않아 출처에 넣지 않았다. 담보 제공의 세부 방법(종류·평가)도 조문 위임 범위를 넘어 확인하지 못했으므로 본문에서 단정하지 않는다.
