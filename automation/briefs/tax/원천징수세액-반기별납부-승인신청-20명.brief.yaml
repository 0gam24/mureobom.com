human_notes: |
  차별화: "반기별 납부는 자동이 아니라 신청·승인 사항이고, 신청 창구가 반기 직전월 한 달뿐"이라는
  절차 리스크를 중심축으로 삼는다. 대부분의 글이 '20명 이하면 반기납부 가능' 수준에서 끝나는데,
  이 글은 (1) 20명 기준이 특정 시점이 아니라 직전 연도 매월 말일 평균이라는 산정 방식,
  (2) 통지가 없으면 승인 간주라는 조문 효과, (3) 반기납부에서도 제외되어 매월 내야 하는 세액이
  따로 있다는 점까지 조문 단위로 짚어 정보 이득을 만든다.
  11월 공개 = 12월 신청 창구 직전이라는 타이밍을 본문 기준일과 함께 명시.
  주의: 승인 통지 기한을 특정 날짜로 단정하지 말고 조문 문언("신청일이 속하는 반기의 다음 달 말일")
  그대로 쓴다. 확인하지 못한 홈택스 화면 경로·전화번호·연도별 개정 사항은 쓰지 않는다.
  단정적 절세 권유·개인 맞춤 자문 금지(일반정보 고지 유지).
