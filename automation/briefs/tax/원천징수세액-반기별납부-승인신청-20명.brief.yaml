  seasonality: 1.0       # 반기별 납부 신청 창구가 12월 1개월로 한정 → 11월 검색 수요 상승 구간
  cluster_fit: 1.0

must_cover:
  - 원칙 납부기한(징수일이 속하는 달의 다음 달 10일)과 반기별 납부기한(반기 마지막 달의 다음 달 10일 = 7월 10일·1월 10일) 대조
  - 대상 요건 — 직전 연도 상시고용인원 20명 이하, 금융·보험업 제외, 종교단체는 별도 호로 포함
  - 상시고용인원 산정 방식 — 직전 연도 1월부터 12월까지 매월 말일 현재 인원의 평균인원수(특정 시점 인원이 아님)
  - 신청 기간 — 반기별로 납부하려는 반기의 직전월 1일부터 말일까지(상반기 적용은 12월, 하반기 적용은 6월). 창구를 놓치면 다음 반기로 밀림
  - 승인 구조 — 관할세무서장이 신고·납부 성실도 등을 고려해 결정, 신청일이 속하는 반기의 다음 달 말일까지 통지, 기한 내 통지가 없으면 승인된 것으로 봄
  - 반기별 납부에서 제외되어 매월 납부해야 하는 원천징수세액(법인세법 제67조 처분 상여·배당·기타소득 등)
  - 신청 서식 — 소득세법 시행규칙 별지 제21호의2서식(원천징수세액반기별납부승인신청서)
  - 실무 판단 — 납부 횟수가 줄는 대신 한 번에 내는 금액이 커지므로 자금 계획이 필요하다는 점(일반적 유의, 단정적 권유 금지)

required_sources:        # 공식 1차 출처만. 0건이면 발행 차단
  - "소득세법 제128조(원천징수세액의 납부) — 국가법령정보센터"
  - "소득세법 시행령 제186조(원천징수세액의 반기별 납부) — 국가법령정보센터"
  - "소득세법 시행규칙 별지 제21호의2서식(원천징수세액반기별납부승인신청서) — 국가법령정보센터"
  - "소득세법 시행규칙 별지 제21호서식(원천징수이행상황신고서, 귀속연월 매월·반기 구분) — 국가법령정보센터"

