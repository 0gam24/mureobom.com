target_query: "원천징수세액 반기별 납부 승인 신청 기간 상시고용인원 20명 이하"
search_intent: 절차형     # 대상 여부 확인 + 신청 절차·기한을 함께 원함

signal:                  # WebSearch 폴백 선정(스캐너 큐 stale). 집계 성격 메모만
  score: 0.0
