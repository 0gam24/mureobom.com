human_notes: |
  차별화: 기발행 양도세 4편(1세대1주택 비과세·장기보유특별공제·필요경비·분양권 주택수)은 전부
  국세 양도소득세의 과세표준과 세율만 다룬다. 이 글은 그 세금을 낸 뒤에도 남아 있는 별개
  신고 의무(양도소득분 개인지방소득세)를 단독으로 다룬다. 핵심 각도는 "기한이 2개월 늦다"는
  단순 사실이 아니라, 그 2개월이 만드는 세 가지 실무 함정이다.
  (1) 국세 신고를 끝낸 사람은 끝났다고 믿고 두 달을 흘려보낸다.
  (2) 지방세법 제103조의5 제4항·제5항은 지자체가 납부서를 보내면 그 납부로 신고를 간주해
      주는데, 이 간주 규정을 "안 오면 안 내도 된다"로 거꾸로 읽는 오해가 퍼져 있다.
  (3) 세율을 "국세의 10%"로 외우면 지방세법이 독자 표준세율을 두고 있고 조례로 ±50%까지
      가감할 수 있다는 사실을 놓친다.
  양도차손이어도 신고 의무가 남는다는 점(제103조의5 제2항)은 검색 결과 상위에서 거의 다뤄지지
  않아 정보 이득이 큰 지점이다. 수치는 전부 국가법령정보센터 조문 원문으로 사전 확인 완료
  (무신고가산세 20%·40%, 징수 하한 2천원, 1천분의 70·60 등).
  계산 예시는 2026년 8월 양도분 달력(국세 10/31 토요일 → 11/2 월요일, 지방 12/31 목요일)만
  쓰고, 2027년 3월 1일 전후로 넘어가는 예시는 공휴일 판정 리스크가 있어 쓰지 않는다.
