  note: "WebSearch 폴백 선정(큐 2026-06-11 생성으로 stale, approved brief 잔여 0건). 10월 중 양도한 사람의 국세 예정신고기한이 12월 31일, 지방소득세분은 그 2개월 뒤로 갈라지는 시점이라 계절성 있음. 기존 tax 99편 중 지방소득세 단독 주제 0건."

must_cover:
  - 양도세와 양도소득분 지방소득세는 별개 신고 의무이고 기한이 다르다는 구조 (지방세법 제103조의5 제1항, 국세 예정신고기한 + 2개월)
  - 기한 계산 규칙 3분기 (부동산 등은 양도일이 속하는 달의 말일부터 2개월, 주식등은 반기 말일부터 2개월, 부담부증여 채무액분은 3개월 — 소득세법 제105조 제1항 각 호) 뒤에 각각 2개월을 더한 날이 지방소득세 기한
  - 실제 달력 예시 (2026년 8월 부동산 양도분은 국세 10월 31일이 토요일이라 11월 2일, 지방소득세는 12월 31일 목요일)
  - 양도차익이 없거나 양도차손이어도 신고 의무가 남는다는 점 (지방세법 제103조의5 제2항, 소득세법 제105조 제3항)
  - 납부서를 받아 기한 내 납부하면 신고·납부한 것으로 본다는 간주 규정 (지방세법 제103조의5 제4항·제5항) — 납부서가 안 오면 스스로 신고해야 한다는 반대 함의
  - 확정신고 쪽 기한도 2개월 늦다는 점 (국세 5월 1일~5월 31일 → 지방소득세는 2개월을 더한 날, 지방세법 제103조의7 제1항)
  - 예정신고를 했으면 확정신고 생략 가능하지만 누진세율 대상 자산을 2회 이상 양도한 해는 예외 (지방세법 제103조의7 제3항, 소득세법 제110조 제4항)
  - 세율이 "국세의 10%"가 아니라 지방세법이 별도로 정한 표준세율이라는 점 (제103조의3 제1항, 1년 미만 보유 주택 1천분의 70·분양권 1천분의 60 등)
  - 지자체가 조례로 표준세율을 ±50% 범위에서 가감할 수 있다는 점 (제103조의3 제4항)
  - 안 하면 붙는 것 (지방세기본법 제53조 제1항 무신고가산세 20%, 제2항 부정행위 40%)
  - 징수 하한 (지방세법 제103조의60, 고지서 1장당 2천원 미만이면 징수하지 않음)
  - 관할을 틀려도 신고 효력은 유지된다는 점 (제103조의5 제1항 후문)

required_sources:
  - "지방세법 제103조의5(과세표준 예정신고와 납부) — 국가법령정보센터"
