id: tax-성실신고확인-대상-혜택-가산세
cluster: tax
status: published        # draft → approved(사람) → published(자동)

target_query: "성실신고확인제도 대상 혜택 가산세"
search_intent: 절차형     # 내가 대상인지 확인(정보) + 혜택·미제출 불이익 절차 확인

signal:                  # 수동 선정 집계 추정치(읽기 전용, 원문 아님)
  score: 72.0
  trend_momentum: 0.5
  question_volume: 0.48
  cluster_fit: 1.0        # tax_boost 1.10 적용 전 원값
  freshness: 0.5

must_cover:
  - 성실신고확인제도 개념과 성실신고확인서 제출 의무(개인사업자 대상, 확인 후 신고)
  - 대상 업종별 수입금액 3구간 기준(도소매·농업 등 / 제조·음식·숙박 등 / 서비스업, 소득세법 제70조의2·시행령 제133조)
  - 제출 시 혜택(신고·납부기한 6/30 연장, 의료비·교육비 세액공제, 성실신고확인비용 세액공제 60% 한도)
  - 미제출 시 불이익(성실신고확인서 미제출 가산세 = 산출세액의 5%, 세무조사 선정 가능성 상승)
  - 확인 주체(세무사·회계사·세무법인)와 확인 절차·기한
  - 개인→법인 전환 시 성실신고확인 대상 승계 유의(간략)

required_sources:        # 공식 1차 출처(법령·기관)만. 0건이면 발행 차단
  - "소득세법 제70조의2 성실신고확인서 제출 (국가법령정보센터 law.go.kr)"
  - "소득세법 시행령 제133조 성실신고확인 대상 수입금액 기준 (law.go.kr)"
  - "국세청 성실신고확인제 안내 (nts.go.kr)"

internal_links:
  - tax/간편장부-복식부기-차이-대상
  - tax/사업소득-필요경비-인정범위

compliance:
  medical_legal_financial_advice_disclaimer: true  # 일반정보 고지 삽입 (AdSense YMYL 정책 친화)

geo:
  faq_schema: true
  faq_pairs_min: 4
  llms_txt: true

human_notes: |
  차별화: 업종별 수입금액 3구간 기준 표 + 혜택 vs 미제출 가산세(산출세액 5%) 대조 + '내가 대상인가' 자가진단 흐름.
  대상 수입금액 기준은 개정 이력이 있으니 2026 귀속(2026 신고분) 최신 기준 명시.
  "성실신고확인 대상이면 세무조사를 무조건 받는다"는 통념은 오해 — 조사 '선정 가능성'과 구분해 서술.
  기한 연장(6/30)은 확인서 제출자 한정임을 명확히(일반 종소세 5/31과 혼동 주의).
