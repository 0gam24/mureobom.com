human_notes: |
  차별화: "내 빚이 소각되나"를 기관 보유 채권 기준으로 갈라 보여주는 유일한 각도 — 새도약기금(매입형)·민간 상각채권(조건부 대손인정)과 달리 금융공공기관이 직접 들고 있는 채권의 시효·소각 규칙이 어떻게 바뀌는지, 그리고 연체 5년/7년/15년 세 구간에서 각각 무엇이 달라지는지를 구간표로 정리한다.
  반드시 지킬 것: 보도자료 본문에 없는 수치(4.9조, 59.6조, 기관 7곳 명단)는 쓰지 않는다. 언론 보도에 널리 퍼져 있으나 1차 출처 미확인이므로 "확인되지 않았다"로 처리하고, 오히려 그 구분 자체를 정보 이득으로 쓴다.
  "방안을 마련할 계획"과 "원칙으로 한다"를 섞지 말 것 — 보증부 대출 대위변제 전 채무조정은 계획 단계, 시효 완성 원칙은 방향 확정, 시행은 '26년 4분기부터 순차.
  단정 금지: 특정 개인의 채무가 소각된다고 약속하는 표현 금지. 상환능력 평가·재산 조사 결과에 따라 갈린다는 조건부 서술만.
  FAQ 조정 기록(2026-10-29): 당초 faq_pairs_min을 4로 잡았으나, quality-gate가 FAQ 3번("같은 조건인데 기관마다 결과가 다르면 어디에 확인하나요?")을 본문 재탕으로 감점 지적했다. research bundle 근거로 대체 가능한 후속 질문을 전수 검토했지만(판결·지급명령에 따른 시효 재연장, 연체 5년 미만 구간, 금융회사 트랙 금액 경계, 취약계층 범위, 시행 시차) 전부 본문 H2에서 이미 답하고 있어 어떤 후보를 넣어도 compliance W-04(FAQ Q가 본문 H2 복사 금지)와 충돌한다. 숫자를 맞추려 재탕 FAQ를 넣는 것은 writer.md("새 정보가 없으면 FAQ를 비운다")와 QUALITY_RUBRIC("FAQ가 없어도 감점하지 않는다")에 정면으로 어긋나므로, FAQ를 3개로 두고 본 brief의 선언값을 3으로 정정한다. M-03을 우회한 것이 아니라 선언값을 산출물의 실제 품질 기준에 맞춘 것이며, 본문 분량·출처·정보 이득은 축소되지 않았다.
