must_cover:
  - 바뀌는 축은 "상환능력 중심 시효관리체계로 전환" — 연체 5년 최초 소멸시효 도래 시점에 상환능력을 평가하고, 능력이 없으면 시효 완성을 원칙으로 한다는 구조
  - 심사 없이 바로 시효가 완성되는 사회적 취약계층 범위(기초생활수급자·장애인연금수급자·생계지원금을 받는 국가유공자)와 "연체 금액과 관계없이"라는 조건
  - 연체 15년 2차 소멸시효 도래 채권은 재산 은닉 등 특별한 사유가 없으면 소각, 15년 이상 장기 부실채권은 내년 하반기까지 단계적 정리
  - 연체 5~7년·5천만원 이하 1차 시효 도과 채권은 기관별 계획에 따라 심사 후 자체 소각 또는 캠코 매각·정리, 회수 실익 있는 재산 보유·은닉은 제외
  - 보증부 대출의 "골든타임" 변화 — 현재는 대위변제(연체 후 3~6개월) 이후에만 채무조정이 가능하나 대위변제 전 신청·상각 전 원금 감면 허용 방안을 마련할 계획(확정 아님)
  - 시행 시기의 정확한 표현 — 관계기관 협의·기관별 내규 개정을 거쳐 '26년 4분기부터 순차 시행. 오늘 당장 전 기관 일괄 적용이 아니라는 점
  - 신청 창구가 없는 제도라는 점(기관이 보유 채권을 직접 심사·정리) + 채무자가 지금 실제로 할 수 있는 확인 행동
  - 새도약기금(매입형)·민간 금융사 조건부 대손인정과 적용 대상이 어떻게 갈리는지 경계 정리
  - 보도에서 돌던 수치(4.9조 소각·59.6조 잔액·대상 기관 7곳)는 보도자료 본문에 없다는 점 — 확인된 것과 확인되지 않은 것의 구분

