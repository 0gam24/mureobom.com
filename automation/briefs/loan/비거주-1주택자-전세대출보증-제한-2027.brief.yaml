human_notes: |
  차별화: 기발행 「전세자금대출-보증-hf-hug-차이」는 HF·HUG 보증 구조 비교를, 「특례전세자금보증-유형-한도-일반전세-차이」는
  특례 16개 유형 한도를, 「다주택자-주담대-만기연장-제한-예외」는 주담대 쪽 만기연장 제한을 다룬다. 어느 글도
  1주택자 전세대출보증 제한을 다루지 않고, 2026-10-15 발행된 「신혼부부-1인소득-7천만원-보금자리론-전세보증」은
  같은 8·13 안건의 지원 확대 항목만 다뤘다. 이 글은 같은 안건의 반대쪽 축, 즉 조이는 항목 두 개를 한 자리에서 읽는다.
  정보 이득의 핵심은 세 가지다. 첫째, 규제 대상이 OR이 아니라 AND 3요건이라는 구조 (언론 요약은 "비거주 1주택자"
  한 마디로 줄여 적어 보유만으로 막히는 것처럼 읽힌다). 둘째, 예외 5가지가 허용 범위까지 서로 다르게 적혀 있다는 점
  (신규취급까지 허용되는 두 건과 만기연장만 허용되는 세 건을 갈라 적어라). 셋째, 보증 제한과 보증비율 축소가
  별개 항목이라 규제 대상이 아닌 1주택자도 보증비율 쪽은 영향을 받는다는 구분.
  경고 1: 안건은 보증 제한을 "원칙적 금지"로, 조치사항을 "행정지도·보증기관 내규개정"으로 적었다. 내규 개정문과
  행정지도 문안은 아직 공개되지 않았다. 세부 판정 기준을 단정하지 말고 안건 문안 그대로 인용하고 미공개를 밝혀라.
  경고 2: "실거주한 적이 없고"의 판정 기간 기준(전입신고 일수 등)은 안건에 없다. 언론 보도에 30일 거주 의무 같은
  숫자가 돌지만 1차 출처에 없으므로 쓰지 마라.
  경고 3: 보증비율은 보증기관이 대출금의 몇 %를 보증하느냐이고 대출한도 자체와는 다르다. 보증비율이 낮아지면
  은행이 안게 되는 미보증분이 늘어 한도·금리 심사에 영향이 갈 수 있다는 정도로만 적고, 한도가 정확히 얼마
  줄어든다고 계산해 단정하지 마라.
  경고 4: 아파트(APT) 보유에 한정된 요건이다. 비아파트 보유 1주택자를 규제 대상으로 쓰지 마라.
  경고 5: "지금 받아 두면 안전하다"는 식의 권유 금지. 시행일 전후 구분과 확인 경로만 제시한다.
