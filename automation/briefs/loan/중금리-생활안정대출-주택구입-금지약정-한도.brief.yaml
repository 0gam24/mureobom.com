human_notes: |
  차별화: 언론·블로그는 이 상품을 "저신용자도 연 5.9%로 1,000만원"으로 요약한다. 정작 약정서에 들어가는
  두 가지 설계를 아무도 풀어주지 않는다. (1) 주택구입 금지 약정 — 1년 또는 전액 상환 시기까지 주택을 사면
  즉시 상환에 더해 향후 3년간 주택 관련 대출이 막힌다. 생활비 1,000만원과 3년치 주택 대출 제한을 맞교환하는
  구조라는 걸 읽는 사람이 먼저 알아야 한다. (2) 1,000만원은 '전 금융기관 합산' 상한이고, 최종한도는 신용정보원
  조회 잔여한도와 금융회사 자체 산출 한도 중 적은 쪽이다 — 한 곳에서 받아 두면 다른 곳 한도가 깎인다.
  여기에 이 상품이 보증부(햇살론)도 보증보험부(사잇돌)도 아닌 '금융회사 자체 신용' 공급이라는 점을 대조하면,
  같은 저신용 구간에서 세 상품의 성격이 왜 다른지가 갈린다.
  독자가 얻는 것: 신청 전에 "지금 1년 안에 집 살 계획이 있는가"를 먼저 자문해야 하는 이유, 그리고 한도가
  왜 생각보다 적게 나오는지의 계산식.
  주의: 승인·금리·한도를 확정적으로 약속하지 말 것(금융회사 심사 산출). 주택 구입 시기를 미루라거나 당기라는
  조언 금지. DSR 40% 적용을 쓰지 말 것 — 보도자료에 없고 2차 보도에만 있다. 하반기 확대가 이미 완료됐다고
  적지 말 것. NICE 889·KCB 875를 고정 커트라인으로 서술하지 말 것(보도자료가 변동 가능이라고 명시).
  '1년 또는 전액 상환 시기까지'를 임의로 "1년만 버티면 된다"로 단순화하지 말 것.
