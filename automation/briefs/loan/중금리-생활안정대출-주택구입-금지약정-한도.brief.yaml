must_cover:
  - 상품 정체 — 2026-04-27 제4차 「포용적 금융 대전환」 회의의 「중금리대출 활성화 방안」 후속조치로 2026-06-29 출시. 금융회사가 자체 신용으로 공급하는 신용대출이며 햇살론 같은 보증부 상품이 아니라는 점(보증료·보증한도 개념이 없고, 심사 거절 리스크를 금융회사가 직접 진다)
  - 대상 — 대출 취급 시점 기준 신용평점 하위 50% 이하 중·저신용자. 2026-06-29 기준 참고치 NICE 889점·KCB 875점이며 보도자료가 "대출 시점에 따라 변동 가능"이라고 명시한 사실까지. 이 점수는 고정 커트라인이 아니다
  - 한도의 진짜 계산식 — 차주별 전 금융기관 합산 최대 1,000만원. 최종한도는 (가) 신용정보원 조회로 확인한 잔여한도(1,000만원에서 이 상품 기존 잔액을 뺀 금액)와 (나) 금융회사 자체 산출 한도 중 '적은 금액'. 즉 한 곳에서 받아 두면 다른 곳 한도가 그만큼 깎인다
  - 금리 — 1차 출시기관 기준 연 5.9~15.27%. 차주 신용도에 따라 각 금융회사 신용평가시스템이 산출한다. 최고금리는 기존 중금리대출의 16.51%에서 15.27%로 1.24%p 인하된 수치
  - 핵심 — 주택구입 금지 약정. 대출 약정 시 "1년 또는 대출 전액 상환 시기까지" 주택을 구입하지 않겠다는 약정을 맺는다. 목적은 이 자금이 주택 투기로 흘러가지 않게 하는 것
  - 위반 시 제재의 범위 — 대출금 즉시 상환 의무에 더해 향후 3년간 주택 관련 대출이 제한되고 이 상품 이용도 제한된다. 생활비 1,000만원의 대가가 3년치 주택 관련 대출 제한일 수 있다는 점을 숫자로 대조
  - 약정 문구의 해석 여지 — 보도자료 표현은 "1년 또는 대출 전액 상환 시기까지"다. 1년 경과와 전액 상환 중 어느 쪽이 먼저인지, 둘 중 하나만 충족하면 되는지를 보도자료가 한 문장으로만 적고 있으므로, 실제 적용은 취급 금융회사 약정서에서 확인해야 한다는 결론으로 연결(임의 해석 금지)
  - 신청 창구 — KB·OK·SBI·신한·예가람·한국투자저축은행 6개사의 모바일 앱·전화·영업점. 온라인 대출비교 플랫폼(토스·카카오페이·카카오뱅크·네이버페이·핀다·뱅크샐러드)에서도 금리 비교와 신청이 가능
  - 확대 일정의 현재 상태 — 보도자료는 하반기에 14개 저축은행과 은행·카드·캐피탈업권 추가 출시 '예정'이라고만 적었고 구체 날짜가 없다. 2026-11 현재 추가 출시가 완료됐다고 단정할 근거를 1차 출처에서 확인하지 못했다는 사실을 그대로 적는다
  - 공급 측 배경 — 금융위는 가계대출 총량규제 인센티브 등 제도적 지원을 근거로, 금융회사가 신용평가시스템을 고도화해 금리 인하 혜택이 차주에게 돌아가도록 당부했다. 왜 하필 지금 최고금리가 내려갔는지의 맥락
  - 공식 자료에 답이 없는 것 명시 — 상환기간·만기 구조, 중도상환수수료, DSR 적용 비율, 자금 용도를 어떤 방법으로 사후 확인하는지, 주택 '구입'의 범위(상속·증여·분양권·조합원 입주권 포함 여부). 보도자료에 없으므로 추측으로 메우지 않는다
