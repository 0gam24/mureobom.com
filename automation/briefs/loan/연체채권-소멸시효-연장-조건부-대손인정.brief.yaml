  - 종전 관행 구조와 2026-02-26 강화방안의 원칙 전환(원칙적 연장·예외적 완성 → 역전)
  - 적용 대상 금액 기준 (은행·보험 5천만원 이하 / 저축은행·상호금융·여전 3천만원 이하, 계좌수 기준 90% 이상)
  - 조건의 내용 (신청서에 적은 최초 소멸시효 완성 예정일에 시효 완성 또는 채권 포기)
  - 예외적으로 연장이 허용되는 사유 (은닉재산 발견, 파산·회생 등 법상 시효중단, 신복위·자체 채무조정 이행 중)
  - 채권을 팔아도 의무가 따라가는 구조 (매각계약서에 완성 예정일·완성 의무 명시, 양수인 점검·보고)
  - 소멸시효 관리 모범규준 개정분 (연장 판단 내부기준 의무화, 완성 시 채무자 통지, 연장 후 3년 경과 재심사)
  - 지급명령 공시송달 특례 전면 폐지 추진 (현재 26개 기관 적용, 소송촉진법 개정 사항이라 아직 시행 아님)
  - 채무자가 지금 할 수 있는 것 (완성 통지 확인, 추심 받으면 시효 항변, 신복위·금감원 창구)
  - 한계와 주의 (제도는 금융사의 세제혜택 조건이지 채무자의 시효 완성 보장이 아니며, 담보채권·금액 초과분은 대상 아님)

