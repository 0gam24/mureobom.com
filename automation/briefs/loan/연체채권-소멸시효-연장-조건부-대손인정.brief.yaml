human_notes: |
  차별화: 기존 「채무-소멸시효-완성-기간-중단」이 민법·상법 기간과 중단 사유를 다루는 반면,
  이 글은 "금융사가 왜 시효를 반복 연장해 왔고 2026-10-12 조건부 대손인정 시행으로 그 유인이
  어떻게 끊기는가"라는 제도 각도만 다룬다. 금액 기준·예외 사유·매각 시 승계 의무·모범규준
  통지 의무처럼 이 글이 아니면 모으기 어려운 조각을 한 자리에 묶는다.
  경고: 시행일은 금감원 보도자료 등록일(2026-10-12) 기준으로만 쓰고, 언론이 엇갈리게 보도한
  "9월 시행"·"4분기 신청분부터" 같은 표현은 1차 출처로 확인되지 않으면 쓰지 않는다.
  공시송달 특례 폐지는 법 개정 추진 단계이므로 "시행됐다"고 쓰면 안 된다.
  경과조치 세부는 1차 출처에서 확인 안 됨 — 추측 금지, 언급하지 않거나 "확인되지 않음"으로.
