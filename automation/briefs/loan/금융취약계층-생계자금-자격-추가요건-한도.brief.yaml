must_cover:
  - 이 상품의 정체 — 서민금융진흥원 미소금융이 취급하는 생활안정자금이고, 100만원짜리 불법사금융예방대출 위에 얹히는 다음 단계 창구라는 위치. 한도 최대 500만원, 금리 연 4.5% 이내, 기간 최대 6년(거치 1년 이내 + 상환 5년 이내), 원리금균등분할상환, 취급처는 전국 미소금융지점
  - 자격이 두 겹이라는 구조 — 기본요건(미소금융 이용대상자)과 추가요건을 둘 다 넘어야 한다는 점. 한쪽만 보고 신청했다가 돌아서는 일이 가장 흔한 실수
  - 기본요건의 세 갈래 — 개인신용평점 하위 20% 이내 / 기초생활수급자 및 차상위계층 이하 / 근로장려금 신청자격 요건 해당자. 그리고 셋 다 아니어도 개인신용평점 하위 50% 이하이면서 연소득 3,500만원 이하면 열리는 예외 통로
  - 추가요건의 세 트랙 — (1) 불법사금융예방대출 완제자 (2) 미소금융(창업·운영·시설) 12회차 이상 성실상환자 (3) 취약계층. 취약계층은 사회적 배려 대상자 8종(한부모·조손가족, 다문화가족, 북한이탈주민, 등록장애인, 기초생활수급자, 차상위계층, 자활근로자, 근로장려금 신청자격 요건 대상자)과 특별취약계층 4종(특별재난지역 거주자, 전세사기피해자, 불법사금융 피해자, 보이스피싱 피해자)으로 갈린다는 점
  - 트랙 1로 들어가는 실제 경로와 비용 — 불법사금융예방대출은 2026년 1월 2일 개편으로 한도 1인당 최대 100만원, 금리 일반 연 12.5%·사회적배려대상자 연 9.9%, 2년 원리금균등분할상환(거치기간·중도상환수수료 없음). 신청 시 금융교육 이수 또는 복지멤버십 가입이 필수. 완제하면 연 4.5% 재대출(최소 6개월 이상 이용)과 상환 축하금(납입 이자의 50%, 만기 경과 전 완제 시, 연 4.5%로 이용한 자는 제외)이 따라온다
  - 완제의 방식이 인센티브를 좌우한다는 함정 — 불법사금융예방대출 채권이 개인회생·신용회복·서금원 채무조정·매각 등으로 상환되거나 면책 처리되면 재대출과 상환 축하금 인센티브가 모두 불가. 즉 '빚이 사라진 것'과 '완제한 것'은 이 제도에서 전혀 다르게 취급된다
  - 지원제한요건 — 한국신용정보원 신용정보전산망에 신용도판단정보 및 공공정보가 등재된 경우 제외가 원칙. 다만 공공정보 등재자 중 (a) 신용회복지원 확정 또는 개인회생 인가 후 6개월 이상 경과 + 6회차 이상 변제금 미납 없이 성실 납입 (b) 개인회생 신청자 중 법원 면책 결정 (c) 개인파산 신청자 중 면책 결정일로부터 5년 이상 경과 — 이 세 경우는 다시 지원대상에 포함된다는 예외
  - 그 밖의 제외 대상 — 책임재산 도피·은닉 등 감소행위, 신청인 소유 재산에 가등기·(가)압류·가처분·경매 등 법적절차 진행 중, 채무면탈죄 해당 이력, 재외국민·외국인·해외체류자, 미성년자, 피성년후견인·피한정후견인·피특정후견인, 법인
  - 트랙 2의 기준선 — 미소금융 창업·운영·시설자금을 12회차 이상 성실상환. 참고로 미소금융 운영자금은 자영업자 대상 최대 2천만원(청년 19~34세 최대 3천만원, 프리랜서 최대 1천만원, 무등록사업자 최대 500만원·약정이자율 연 2.0%), 연 4.5% 이내, 최대 5.5년
  - 신청 경로 — 전국 미소금융지점 방문. 서민금융진흥원 앱(서민금융 잇다)으로 미소금융 상담 사전예약, 서민금융콜센터 1397. 불법사금융예방대출은 전국 50개 서민금융통합지원센터 방문 상담·신청(1397 방문예약 필수)이라 창구 자체가 다르다는 점
  - 자격을 충족해도 최종 대출 여부는 여신심사 결과에 따라 결정된다는 점, 정확한 서류와 세부 지원대상은 미소금융지점 확인 사항이라는 점

