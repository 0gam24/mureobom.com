human_notes: |
  차별화: 정책서민금융을 '상품 카탈로그'가 아니라 '사다리'로 읽는 글. 100만원(불법사금융예방대출, 12.5%)에서
  500만원(금융취약계층 생계자금, 4.5%)으로 올라가는 계단이 실제로 존재하고, 그 계단을 밟는 조건이
  '완제'라는 사실을 판정 가능한 수준까지 내린다. 핵심은 기본요건과 추가요건이 AND로 걸린다는 이중 구조,
  그리고 완제의 '방식'이 인센티브를 가른다는 함정 — 개인회생·신용회복·채무조정·매각으로 채권이 정리되면
  숫자상으로는 갚았어도 재대출과 상환 축하금이 모두 불가다. 이 순서·방식 문제를 다룬 글은 국내 어디에도 정리돼 있지 않다.
  기존 글 대조: loan/소액생계비대출-자격-한도는 불법사금융예방대출 단품의 자격·한도만 다루고 그 다음 단계인
  금융취약계층 생계자금은 전혀 언급하지 않는다(2026-06-14 발행이라 2026-01-02 개편 후 금리 체계도 반영 전).
  loan/햇살론-자격-한도-금리는 보증부 대출, loan/채무조정-성실상환자-소액대출-자격-한도는 신용회복위원회
  소액금융으로 취급기관과 자격 축이 모두 다르다. '금융취약계층 생계자금'과 '미소금융'은 전 코퍼스 320편 중
  0편으로, 검색의도 충돌이 없다.
  주의: 여신심사 결과에 따라 결정되므로 "받을 수 있다"·"승인된다" 단정 금지. 재원·예산 소진 가능성 고려해
  공급 확정 표현도 피한다. 개별 채무 상황 자문으로 읽히지 않게 일반정보 고지 유지.
