human_notes: |
  차별화: 기존 「금융분쟁조정-신청-소액분쟁-조정이탈금지」가 절차·기한·소액분쟁 특례를 다루므로
  이 글은 절차를 다시 설명하지 않고 '한 건의 결정이 실제로 무엇을 어떻게 갈랐는가'라는 실체법
  각도만 다룬다. 핵심 정보 이득은 민법 제470조와 제472조가 각각 다른 이유로 깨지는 2단 구조와,
  부당이득에서 '실질적 이득자'를 가르는 사실상 지배 기준이다. 이 두 조문을 나란히 놓고 한 사건에
  적용해 본 자료는 1차 출처 밖에 거의 없다.
  경고: 보도자료와 첨부에 없는 것을 쓰지 마라. 업권(상호금융/신협 등), 지점명, 신청인 실명,
  수락 여부, 신청인 C(딸) 명의 2개 계좌의 처리, A 본인 명의 5천만원의 회수 여부, 손해배상 민원의
  결론은 모두 자료에 없다. 금액은 51,649,425원만 확정 수치이고 이자소득세 공제 여부는 자료에 없다.
  주의: 이 사건의 1인칭 서술·가상 경험 금지. 신청인 A는 '58년생 女'로만 자료에 적혀 있으므로
  그 이상의 인물 묘사를 만들지 마라. 분조위 결정은 판결이 아니므로 '판례'로 쓰지 마라.
