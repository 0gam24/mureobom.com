human_notes: |
  차별화: '세입자 전세자금대출'과 헷갈리는 임대인 관점의 보증금 반환 목적 대출을, 생활안정자금 목적 주담대라는 정확한 제도 틀로 정리 + LTV·DSR·규제지역별 한도 매트릭스.
  전세퇴거자금대출은 독립 상품명이 아니라 '보증금 반환(생활안정자금) 목적' 주담대의 통칭임을 명확히 할 것.
  단정적 금리·한도 약속 금지(F-*). 규제는 수시 변경되므로 2026년 8월 현행 기준임을 본문에 명시.
  "집주인도 대출로 보증금을 돌려줄 수 있다"는 실무 포인트와, 전액이 자동 승인되는 것은 아니라는 한계를 균형있게.
