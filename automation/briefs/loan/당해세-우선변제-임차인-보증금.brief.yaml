must_cover:
  - 당해세 개념(그 재산 자체에 부과된 국세·지방세: 상속세·증여세·종합부동산세·재산세 등)과 당해세 우선징수 원칙(국세기본법 제35조, 지방세기본법 제71조)
  - 원칙상 당해세는 확정일자·전세권 설정보다 앞서 우선 징수 → 전세 세입자 보증금 회수가 위협받는 구조
  - 2022~2023 개정 임차인 보호: 임차보증금 확정일자보다 법정기일이 늦은 당해세는 그 배당액 한도에서 임차인의 확정일자 우선변제에 우선하지 않도록 주택임대차 보증금에 한해 안분(국세기본법 제35조 제7항 신설 취지)
  - 임대인 체납(미납국세) 열람 제도: 임대차계약 전·후 임차인의 미납국세 열람권(국세징수법)
  - 실무 대응: 계약 전 확인사항, 배당 시 순위, 흔한 오해(당해세는 무조건 1순위다) 바로잡기
  - 확정일자 우선변제일과 당해세 법정기일 선후 비교(어느 경우 안분 보호가 적용되는지 케이스)

