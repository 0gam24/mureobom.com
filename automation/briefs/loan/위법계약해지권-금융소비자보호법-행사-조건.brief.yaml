human_notes: |
  차별화: 청약철회권(covered)과 위법계약해지권을 정면으로 대비하는 표를 넣어
  "둘 다 계약에서 빠져나오는 권리인데 뭐가 다른가"를 검색자 관점에서 해소.
  6대 판매원칙 위반 유형별 예시 + 행사 기간(안 날 1년/체결 5년) + 절차(10일 통지)를 절차형으로.
  단정 금지(무조건 해지된다 X). 특정 금융사·상품 지목 금지, 일반정보로만.
