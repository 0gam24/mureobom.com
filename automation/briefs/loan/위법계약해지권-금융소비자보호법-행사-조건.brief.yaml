id: loan-위법계약해지권-금융소비자보호법-행사-조건
cluster: loan
status: published         # compliance 게이트 통과 (KST 2026-08-14)

target_query: "위법계약해지권 금융소비자보호법 대출 해지 조건"
search_intent: 절차형      # 언제 어떻게 행사하는지 요건 + 절차

signal:
  score: 58.0
  trend_momentum: 0.42
  question_volume: 0.48
  cluster_fit: 1.0
  freshness: 0.55

must_cover:
  - 위법계약해지권 개념 — 금융소비자보호법(금소법)상 판매규제 위반 계약을 소비자가 해지할 수 있는 권리
  - 청약철회권과의 차이 — 청약철회는 하자 없이도 일정 기간 내 무조건 철회, 위법계약해지는 6대 판매원칙 위반이 전제
  - 6대 판매규제(적합성·적정성·설명의무·불공정영업·부당권유·허위과장광고) 위반 시 성립
  - 행사 기간 — 위반 사실을 안 날부터 1년, 계약 체결일부터 5년 이내(둘 중 먼저 도래)
  - 행사 절차 — 금융회사에 서면 등으로 해지 요구 → 10일 내 수락/거절 통지 → 정당한 사유 없이 거절 못 함
  - 해지 효력 — 장래효(해지 시점 이후 무효), 수수료·위약금·중도상환수수료 부과 금지
  - 흔한 오해 바로잡기 — "무조건 해지된다"가 아니라 위반 입증이 전제, 손해배상과는 별개 권리

required_sources:
  - "금융소비자 보호에 관한 법률(금융소비자보호법) 제47조 위법계약의 해지, 국가법령정보센터"
  - "금융소비자 보호에 관한 법률 시행령, 국가법령정보센터"
  - "금융감독원 금융소비자 정보포털 파인 — 금융소비자보호법 안내"

