human_notes: |
  차별화: "등기부만 보면 안전해 보이는 집"이 왜 위험한지를 소유권 귀속 법리(수탁자 완전 이전)로
  설명하고, 등기사항증명서로는 끝나지 않고 신탁원부까지 봐야 하는 이유와 확인 순서를 제시한다.
  기존 코퍼스(깡통전세·임대인 변경·질권설정)는 소유자가 정상인 전제를 다루므로 겹치지 않는다.

  주의: 신탁원부 인터넷 발급 개시 시점은 1차 출처에서 확정 확인하지 못했으므로 날짜를 단정하지
  말 것. 인터넷등기소에서 확인 가능하다는 사실 관계만 쓰고, 발급 방법은 기관 안내 확인으로 넘긴다.
  개별 계약의 유효성·대항력 판단은 사안마다 달라 단정 금지(일반정보 고지 유지).
