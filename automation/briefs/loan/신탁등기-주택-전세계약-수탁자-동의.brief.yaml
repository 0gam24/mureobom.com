must_cover:
  - 신탁등기의 법적 의미 — 소유권이 수탁자에게 이전되고 위탁자에게 유보되지 않는다는 점
  - 등기사항증명서에서 신탁등기를 식별하는 법(갑구 소유자란·신탁 표시)과 신탁원부 확인 필요성
  - 임대차계약의 상대방이 누구여야 하는지(수탁자) — 위탁자와만 체결했을 때 생기는 문제
  - 신탁원부에서 확인할 항목(임대차 관련 권한·사전 동의 조항·우선수익자)
  - 2024-12-21 시행 신탁부동산 거래 주의사항 등기제도가 무엇을 바꿨는지
  - 계약 전 실행 순서(등기사항증명서 → 신탁원부 → 동의 주체 확인 → 계약서 당사자 표기)
  - 정보 기준일 명시 및 확인 못 한 사항은 원문 확인 안내

required_sources:
  - "신탁법 제2조(신탁의 정의) / 제4조(신탁의 공시와 대항) — 국가법령정보센터"
  - "부동산등기법 제23조 제7항(신탁등기 수탁자 단독 신청) — 국가법령정보센터"
  - "찾기쉬운 생활법령정보(법제처) — 재산신탁: 신탁이란?, 신탁재산의 공시"
  - "찾기쉬운 생활법령정보(법제처) — 주택임대차: 계약 전 확인 사항(등기부의 확인 등)"
  - "대법원 2002. 4. 12. 선고 2000다70460 판결(임대차보증금반환) — 수탁자에게 소유권 완전 이전"
  - "대법원 보도자료(2024. 12. 21. 신탁재산에 속하는 부동산의 거래에 관한 주의사항 등기제도 시행)"

