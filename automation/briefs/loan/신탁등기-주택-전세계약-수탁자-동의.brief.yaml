target_query: "신탁등기 된 집 전세계약 해도 되나요 신탁원부 수탁자 동의"
search_intent: 절차형      # 계약 전 확인 절차 + 위험 판정을 함께 원함

signal:                   # WebSearch 폴백 선정(스캐너 미실행) — 정성 판단값
  score: 0.0
  trend_momentum: 0.0
  question_volume: 0.0
  cluster_fit: 1.0
