human_notes: |
  차별화: '왜 내 새 통장이 한도제한계좌인가'를 보이스피싱 예방 제도 관점에서 설명하고,
  목적별 필요서류를 직장인/사업자/공과금·연금 수급자로 나눈 대조표로 정리 — 다른 글이
  '재직증명서 내면 된다'로 뭉뚱그리는 지점을 세분화. 20영업일 신규계좌 개설 제한과
  한도제한계좌는 다른 제도임을 명확히 구분. 은행마다 한도·서류가 다르므로 '통상' 수준으로
  안내하고 해당 은행 확인을 안내. "무조건 해제된다"식 단정 금지 — 은행 심사 사항 명시.
  검수 포인트: 은행별 구체 한도 수치는 '통상 예시'로만, 법정 확정치처럼 쓰지 말 것.
