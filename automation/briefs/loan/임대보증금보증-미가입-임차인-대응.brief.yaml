human_notes: |
  차별화: 코퍼스 92편의 loan 글 중 임차인이 드는 전세보증금 반환보증(loan/전세보증금-반환보증-hug-가입조건)은
  있지만, 등록임대사업자가 의무로 드는 임대보증금 보증은 한 편도 없다. 게다가 대부분의 설명이 "임대인의
  의무"에서 멈추는데, 이 글은 임차인 시점에서 (1) 가입 여부 확인, (2) 가입돼 있어도 전액이 아닐 수 있는
  일부 보증(주택가격 60% 차감식), (3) 미가입일 때 실제로 쓸 수 있는 카드(시행령 제35조 제2항 제5호 해지권,
  제67조 제5항 과태료)를 순서로 묶는다. 특히 (2)는 "보증 가입됨"만 보고 안심하는 함정이라 정보 이득이 크다.

  주의: 손해배상 청구 가능 여부는 시행령 제35조에 명시 조항이 확인되지 않았으므로 "해지할 수 있다"까지만
  쓰고 손해배상은 단정하지 말 것(일반 민사 원칙 언급도 생략).
  동일 단지 매입임대의 "대통령령으로 정하는 호수" 구체 수치는 1차 확인 전까지 쓰지 말고 조문 표현 그대로 둘 것.
  과태료 상한 3천만원은 제67조 제5항 기준으로 확인된 값. 개별 위반 건의 실제 부과액은 단정 금지.
  임차인이 계약을 해지하면 보증금 회수가 저절로 되는 것처럼 읽히지 않게 할 것(해지는 권리이지 반환 보장이 아님).
