must_cover:
  - 이 보증은 임차인이 드는 전세보증금 반환보증과 다른 제도 — 등록임대사업자가 의무로 가입하는 보증이고 보증료도 임대인이 주로 부담
  - 의무 대상 — 민간임대주택법 제49조 제1항 각 호(민간건설임대주택, 분양주택 전부 우선공급 매입임대, 동일 단지 일정 호수 이상 매입임대, 그 밖의 민간매입임대주택)
  - 가입 시점 — 법 제49조 제4항 각 호(사용검사 신청일 또는 임차인 모집일 / 등록 신청일 / 등록 후 최초 임대차계약 개시일)와 등록 말소일까지 유지 의무
  - 핵심 함정 — 보증대상은 원칙적으로 임대보증금 전액이지만(제49조 제2항), 제3항·시행령 제39조 요건을 갖추면 "담보권 설정 금액 + 임대보증금 - 주택가격의 60%" 이상만 보증하는 일부 보증이 가능하다는 점. 가입 여부만 보고 전액 보호로 단정하지 말 것
  - 가입 면제 사유 3가지 — 법 제49조 제7항 각 호(소액보증금 이하 + 임차인 부동의 동의, 공공주택사업자와의 계약, 임차인이 전세금 반환보증에 가입하고 임대사업자가 보증수수료 전액 지급)
  - 미가입 시 임차인의 권리 — 시행령 제35조 제2항 제5호에 따라 임대차계약 해제 또는 해지 가능(임대사업자의 다른 해지 사유들과 같은 조항에 위치)
  - 임대사업자에 대한 제재 — 법 제67조 제5항, 임대보증금의 100분의 10 이하 과태료(상한 3천만원)
  - 보증수수료 부담 구조 — 시행령 제40조, 임대인 75퍼센트·임차인 25퍼센트이고 임차인 부담분은 임대료에 포함해 징수하되 납부고지서에 명시
  - 확인 방법 — 표준임대차계약서의 보증 관련 기재, 보증회사(HUG)의 가입내역 조회, 렌트홈(임대등록시스템)의 등록임대주택 여부 확인
  - 기준일 명시(시행령 2026-02-26 시행 기준)와 개별 사안 판단은 지자체·보증회사 확인이 필요하다는 안내

required_sources:
  - "민간임대주택에 관한 특별법 제49조(임대보증금에 대한 보증) — 국가법령정보센터"
  - "민간임대주택에 관한 특별법 제67조(과태료) — 국가법령정보센터"
  - "민간임대주택에 관한 특별법 시행령 제35조(임대차계약의 해제·해지 등) — 국가법령정보센터"
  - "민간임대주택에 관한 특별법 시행령 제39조(보증대상액) — 국가법령정보센터"
  - "민간임대주택에 관한 특별법 시행령 제40조(보증수수료의 납부방법 등) — 국가법령정보센터"
  - "주택도시보증공사(HUG) 임대보증금보증 가입내역 조회 안내"
  - "렌트홈(임대등록시스템) 임대보증금 보증 사전 가입 안내"

