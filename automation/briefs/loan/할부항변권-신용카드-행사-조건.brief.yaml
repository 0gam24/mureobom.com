human_notes: |
  차별화: 20만원·3개월 기준 오해 정리 + 항변권 행사 서면 통지 예시 절차 + 제한 사유 표.
  거래금액 기준(20만원 이상)과 할부기간 요건을 최신 할부거래법 조문 그대로 명시할 것.
  "일시불·무이자면 항변권이 없다"는 통념은 부정확 — 성립 요건은 할부 여부·금액이지
  이자 유무가 아님을 짚어라. 지급거절은 '잔여 할부금' 범위로 한정되며 기납부금 환급은
  별개 절차라는 점(자주 틀리는 통념)을 표로 구분해 넣을 것.
