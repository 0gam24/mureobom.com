human_notes: |
  차별화: 기발행 328편에 '개인정보노출자 사고예방시스템'은 본문 언급 0편이다. 가장 가까운
  기발행글(loan/여신거래-안심차단-신청-해제-차단범위)은 안심차단 두 종(여신거래·비대면
  계좌개설)의 차이만 다루고, 금융감독원이 운영하는 노출자 등록은 존재 자체가 빠져 있다.
  이 글은 '유출 통보를 받은 사람이 지금 무엇을 어디에 신청하는가'로 각도를 좁혀, 신청처가
  금융감독원(파인) / 금융회사·금융결제원(payinfo) 두 갈래로 갈린다는 구조와, 노출자 등록은
  1차 출처가 '제한', 안심차단은 '차단'으로 달리 적고 있다는 표현 차이를 정보 이득으로 삼는다.
  2026-10-06 개인정보 유출 2차피해 특별대응기간(1개월) 지정이라는 시점성도 이 글에만 있다.

  카니발리제이션 검사 (2026-10-11 KST): _published_slugs.txt 328건에 '노출자'·'개인정보'
  슬러그 0건. 본문 기준 '노출자' 0편, '명의도용'은 2편(여신거래-안심차단, 신용카드-분실-도난)
  에서 배경어로만 등장하고 등록 절차·신청처는 전무. '파인'은 10편에서 조회 창구로 스치듯
  언급되나 노출자 등록 기능은 0편. 검색의도가 '안심차단은 무엇이 막히나'(기발행)에서
  '유출됐는데 어디에 무엇을 신청하나'(본건)로 갈라지므로 각도를 좁힌 롱테일로 허용.

  사전 출처 확인 (2026-10-11 KST):
  - 금융위원회 보도자료 87882 (2026-10-06) 원문에서 다음을 직접 확인 — 파인 등록 경로,
    '등록한 정보는 금융회사에 실시간으로 공유되며, 이후 본인 명의의 신규 계좌개설,
    신용카드 발급 등이 제한', 여신거래 안심차단 차단항목 열거와 시행일 2024-08-23,
    비대면 계좌개설 안심차단 시행일 2025-03-12, 안심차단 신청 채널(영업점·내계좌한눈에·
    은행앱), 특별대응기간 '10.6.부터 1개월(필요시 연장)'
  주의: 노출자 등록의 처리 소요시간·해제 반영 시간·수수료·등록 건수는 1차 출처에서
  확인되지 않으면 쓰지 않는다. 언론·금융회사 공지(증권사 안내문 등)는 1차 출처가 아니므로
  인용하지 않는다. 통신 3사 명의도용 방지(msafer) 수치·절차는 화이트리스트 밖이므로 단정 금지.
  '등록하면 대출이 완전히 막힌다'는 식의 과장 금지 — 출처 표현('제한')을 그대로 쓸 것.
