human_notes: |
  차별화: 기발행 304편에서 "새도약"·"장기연체채권" 문자열이 0건이다(grep 확인). 기존 채무 관련
  4편과 검색의도가 겹치지 않는다. loan/신용회복위원회-채무조정은 연체 30일·31~89일·90일 이상
  3단계와 감면 20~70%를 다루고, loan/새출발기금-채무조정은 코로나 피해 소상공인 전용이며,
  loan/프리워크아웃-개인워크아웃-차이-조건은 신복위 두 제도 비교, loan/채무-소멸시효-완성-기간-중단은
  민사 시효 법리다. 새도약기금은 주체(캠코)·대상(7년 이상 연체 무담보 5천만원 이하)·작동방식
  (신청이 아닌 일괄 매입 후 자동 심사)이 전부 다르다.
  핵심 정보 이득 3개 — 대중 설명글이 "5천만원 이하 7년 연체 빚 탕감"에서 멈춰 있어 다음이 비어 있다.
  (1) 연체 7년의 기준일이 2018-06-19로 고정이라는 점. 롤링 7년으로 오해하면 자격 판단이 어긋난다.
  (2) 소각과 분할상환을 가르는 심사 3항목(중위소득 60% 이하·생계형 재산 외 무재산·최근 5년
      출입국 2회 이하). 이 분기 기준을 정리한 글이 사실상 없다.
  (3) 매입 누적 약 75만명과 소각 누적 26.9만명의 간극. 매입을 탕감으로 읽는 오해가 여기서 나온다.
  검수 포인트:
  - 7년 이상 연체·2018-06-19 기준일·5천만원 이하·무담보, 심사 3항목, 소각 1년 이내,
    강화된 채무조정 30~80%·최장 10년은 newleap.or.kr 제도안내와 kamco.or.kr 표현 범위를 넘지 않는다.
  - 매입 수치(9조 1천억·75만명)와 소각 수치(2.3조·26.9만명)는 기준일이 다르므로 각각 기준일을
    병기한다. 두 숫자를 섞어 한 문장에 쓰지 않는다.
  - 2026-08-13 신용정보법 개정 시행과 4분기 추가 소각 계획은 금융위 2026-06-30 보도자료
    표현 범위로만 쓰고, 4분기 소각의 규모나 확정 시점을 단정하지 않는다("예정"까지만).
  - 개별 사안 단정 금지. "당신은 소각 대상이다/아니다" 판단 대신 조회 경로(newleap.or.kr 조회
    메뉴·1660-0705)로 안내하고 일반정보 고지를 유지한다.
  - 유료 대행 주의는 사실 구조(신청 절차가 없으므로 대행이 성립하지 않는다)로만 서술하고,
    특정 업체 지목이나 불법 단정은 하지 않는다.
  - 확인하지 못한 항목은 쓰지 않는다. 담보채권 제외 목록(주담대·전세·자동차담보 등)은 1차 출처에서
    확인되지 않았으므로 나열하지 말고, "무담보 요건을 충족하지 않는다"까지만 서술한다.
  - 카니발리제이션 대조 완료: _published_slugs.txt loan 93건 + grep -il "새도약"·"장기연체채권" 0건.
