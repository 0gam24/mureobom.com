must_cover:
  - 제도의 정체 — 채무자가 창구에 신청하는 제도가 아니다. 금융회사가 보유한 대상 채권을
    새도약기금이 일괄 매입하고, 매입 즉시 추심이 중단되며, 정부 행정데이터로 상환능력을
    심사한다. 이용자가 할 일은 신청이 아니라 조회다(이 구조 오해가 유료 대행 피해의 출발점)
  - 대상 채권 요건 3가지 — 개인(개인사업자 포함)이 금융회사별로 7년 이상 연체 중인 채무,
    연체 기준일은 2018년 6월 19일 이전(당일 포함)으로 고정, 무담보 채무 계좌 원금 합계액
    5천만원 이하. "오늘부터 거꾸로 7년"이 아니라 기준일이 못박혀 있다는 점이 핵심
  - 무담보 요건의 의미 — 담보권이 설정된 채무는 이 요건을 충족하지 않으므로 대상 채권이
    아니다. 이 경우의 대체 경로(신용회복위원회 채무조정, 법원 개인회생·파산)를 안내
  - 심사 결과가 갈리는 두 갈래 — 상환능력 없음으로 판별되면 1년 이내 소각,
    상환능력이 있는(현저히 부족한) 경우는 신용회복위원회의 강화된 채무조정으로 넘어가
    감면 30~80%, 최장 10년 분할상환을 적용받는다
  - 소각과 분할상환을 가르는 심사 기준 3항목 — 중위소득 60% 이하, 생계형 재산 외
    보유재산 없음, 최근 5년간 출입국 기록 2회 이하. 대중 설명글이 비워 두는 부분
  - 상환능력 심사를 생략하고 우선 소각되는 사회 취약계층 범위 — 기초생활수급자,
    장애인연금수급자, 보훈대상자, 생활조정수당·생계지원금 수급자
  - 매입과 소각은 다른 단계라는 점 — 채권이 매입됐다는 사실이 곧 소각을 뜻하지 않는다.
    누적 매입(1~5차)은 약 9조 1천억원 규모에 중복 포함 약 75만명(2026-05-29 기준),
    누적 소각(1~3차)은 2조 3천억원에 26.9만명(2026-06-30 기준)으로 규모가 다르다
  - 2026년 9월 현재의 진행 위치 — 개정 신용정보법 시행일(2026년 8월 13일) 이후
    본격적인 상환능력 심사에 착수했고, 상환능력이 없는 것으로 판별된 채권은 4분기 중
    추가 소각 예정이다. 지금은 심사가 돌아가는 대기 구간이라는 시점 정보
  - 확인 경로와 통지 방식 — 새도약기금 홈페이지(newleap.or.kr)의 채무현황 조회,
    심사현황 및 소각조회 메뉴. 소각 사실은 문자(SMS)로 안내된다(3차분은 7월 중순부터).
    전화 문의 1660-0705, 전국 12개 상담센터
  - 흔한 통념 바로잡기 — "신청서를 내야 받는다", "7년은 지금 시점부터 계산한다",
    "매입됐으니 빚은 이미 없어졌다", "대행업체를 써야 빨리 처리된다",
    "소각되면 신용점수가 곧바로 회복된다"

