  - 등록 여부를 확인하는 공식 경로와 확인 시 대조할 항목(등록번호·소속 금융회사·취급 상품)
  - 법이 모집인에게 의무로 지운 고지 항목(소속 직판업자 명칭·1사 전속 여부·계약체결권 없음·손해배상책임)과 증표 제시 의무
  - 소비자에게 수수료·사례금을 요구하는 행위가 왜 불법인지(금소법 금지행위 + 대부중개 수수료 수취 금지)와 위반 시 제재 수위
  - 모집인 때문에 손해를 봤을 때 금융회사(직접판매업자)에 배상 책임을 묻는 근거와 예외(선임·감독 주의 항변)
  - 신고·상담 창구와 실제로 챙겨둬야 할 증거

