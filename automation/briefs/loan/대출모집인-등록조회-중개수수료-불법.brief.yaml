human_notes: |
  차별화: 기존 290편 중 "대출 권유하는 사람이 정식 모집인인가"를 정면으로 다룬 글이 0건.
  기존 loan/등록대부업체-확인-조회는 '대부업 법인'이 대상이고, 본 글은 은행·저축은행·카드사가
  위탁한 '개인 모집인'이 대상이라 확인 경로·법적 근거·구제 수단이 전부 다르다. 겹치는 구간은
  한 줄 링크로만 넘기고 중복 설명하지 말 것.
  핵심 정보 이득: (1) 법이 모집인에게 강제하는 고지 4항목을 "상담 중 이 말이 안 나오면 이상하다"는
  체크 기준으로 번역, (2) 소비자가 수수료를 요구받았을 때의 법적 위치, (3) 금소법 제45조로
  금융회사에 책임을 묻는 경로와 그 예외.
  주의: 특정 업체·플랫폼 이름 거론 금지. 단정적 보장 표현 금지("무조건 환불받는다" 류).
  확인 못 한 수수료율·과태료 액수는 쓰지 말고, 확인된 조문 수치만 기재.
