human_notes: |
  차별화: "압류=통장 전액 동결"이라는 통념을 민사집행법 조문(제246조·시행령 제7조 250만 원)으로
  정면 반박하고, 이미 묶인 돈을 되찾는 '압류금지채권 범위변경 신청' 절차를 표로 정리.
  숫자(185만 원, 급여 1/2, 월 300만 원 초과분 규정)는 조문 기준으로만 확정. 개별 채무·소송
  자문이 아니라 일반정보임을 명확히. 단정적 "무조건 지킬 수 있다" 표현 금지 — 범위변경은
  법원 결정 사항임을 명시.
