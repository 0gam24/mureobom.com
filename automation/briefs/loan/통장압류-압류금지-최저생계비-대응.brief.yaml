id: loan-통장압류-압류금지-최저생계비-대응
cluster: loan
status: published           # compliance gate 통과 (KST 2026-08-02), 스케줄 실행 승인

target_query: "통장 압류됐을 때 최저생계비 압류금지 인출 대응"
search_intent: 절차형        # 압류 상황에서 무엇을 얼마까지 지킬 수 있는지 + 어떻게 풀지

signal:                     # 수동 선정(큐 stale). 사이트 공백 메움, 원문 아님
  score: 0.0
  trend_momentum: 0.0
  question_volume: 0.0
  cluster_fit: 1.0
  freshness: 0.6

must_cover:
  - 예금(통장) 압류의 원리 — 채권압류 및 추심/전부명령, 압류되면 인출이 막히는 범위
  - 압류금지채권(민사집행법 제246조) — 급여의 1/2, 최저생계비 등 법이 정한 압류금지 범위
  - 압류금지 예금등의 범위(민사집행법 시행령 제7조) — 개인별 잔액 중 250만 원까지 압류금지(2026-02-01 시행 개정, 종전 185만 원)
  - 이미 압류된 통장에서 압류금지 금액을 되찾는 절차 — 압류금지채권 범위변경 신청(법원)
  - 급여가 들어오는 통장이 통째로 묶였을 때 실무 대응(별도 계좌·범위변경 신청)
  - 흔한 오해 바로잡기(압류=전액 인출불가 아님, 최저생계비는 법으로 보호)

required_sources:           # 공식 1차 출처만(전부 whitelist 도메인). 0건이면 발행 차단
  - "민사집행법 제246조(압류금지채권) (국가법령정보센터)"
  - "민사집행법 시행령 제7조(압류금지 예금등의 범위) (국가법령정보센터)"
  - "민사집행법 제195조(압류가 금지되는 물건)·제246조 제3항(범위변경) (국가법령정보센터)"

