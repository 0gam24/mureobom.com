human_notes: |
  차별화: 계약갱신요구권(재계약 권리)과 권리금 회수기회 보호(나갈 때 권리금 회수 권리)를
  명확히 분리하고, 임대인이 방해할 수 있는 예외 사유와 손해배상 3년 시효를 표로 정리.
  손해배상 한도 산정 방식(신규임차인 약정 권리금과 종료 당시 권리금 중 낮은 금액)과
  대규모점포 적용제외는 자주 오해하는 지점이라 "오해 바로잡기" 단락으로 별도 정리.
  법조문 번호(제10조의3~제10조의5)는 개정 이력 있으니 현행 조문·항 번호를 원문으로 재확인.
  "권리금은 무조건 임대인에게 청구한다" 같은 통념 반박 포함(권리금은 신규임차인에게서
  받는 것이고, 임대인에겐 방해 시 손해배상만 청구).
