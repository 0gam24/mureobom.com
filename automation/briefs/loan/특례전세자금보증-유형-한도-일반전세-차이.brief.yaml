human_notes: |
  차별화: "특례"라는 이름 때문에 한도가 더 큰 줄 아는 통념을, HF 원문 수치로 반박한다 —
  일반전세자금보증 최대 4억 vs 무주택 청년 특례 최대 2억. 특례는 한도 확대 장치가 아니라
  일반전세로는 아예 안 되는 상황(임차권등기 세입자·전세사기피해자·신용회복지원자·
  영세자영업자)을 열어주는 자격 확대 장치라는 구조를 유형별 한도표로 보여준다.
  기존 글(hf-hug-차이)은 보증기관 간 비교라 검색의도가 다르고, 325편 중 특례전세자금보증
  언급이 0건이라 카니발리제이션 없음.
  주의: 8·13 대책의 "청년특례 만 39세 확대"는 HF 공식 페이지에 미반영(2026-10-08 확인)이라
  본문에 쓰지 않는다. 확인된 현행 기준(만 34세 이하)만 적는다.

  compliance 결과 (2026-10-08 KST): 전항목 통과 → published. 차단 0건, 경고 2건.
  - 경고 L-02/정합성: 본문 한도표의 "채권보전조치 필수" 표기(임차권등기 세입자·주택연금
    가입자·목돈 안드는 전세Ⅱ·임대주택 입주자·재개발·재건축 이주 세입자·전세사기피해자
    6개 유형)가 research 번들에 기록돼 있지 않다. 번들은 괄호 표기 규칙("괄호 안 =
    채권보전조치 시 한도", 5개 유형)만 담고 있다. 발행 차단 사유는 아니지만 재검증 추적이
    끊기므로, 다음 번들 갱신 시 sub02_01_04.do의 유형별 채권보전조치 표기를
    confirmed_figures에 추가할 것.
  - 경고 L-02/정합성: "지자체 협약상품 지역별 전월세전환율 대전시 청년 5% ~ 광주시 청년
    7.3%" 수치의 출처 페이지(협약전세자금보증)가 번들 sources·프론트매터 sources 7건에
    모두 없다. 본문이 가정값임을 명시하고 취급은행 확인을 안내해 F-01 위반은 아니지만,
    해당 페이지를 출처로 추가하거나 지역별 수치를 덜어내는 편이 안전하다.
