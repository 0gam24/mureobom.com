human_notes: |
  차별화: 사이트의 채무 관련 글(개인회생·파산·채무조정)은 모두 '본인 빚 정리'인 반면, 이 글은
  '물려받은 빚(상속채무)' 대응이라는 별개 축. 3개월 기한 + 특별한정승인 예외 + 상속포기 시 후순위
  승계라는 실무 함정을 축으로. 법률 자문이 아닌 일반정보 고지 유지, 구체 사건은 법원·법률구조공단
  상담 안내로 마무리. 단정적 결과 약속 금지.
