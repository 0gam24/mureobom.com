must_cover:
  - 상속에서 채무(빚)도 함께 승계된다는 원칙과 단순승인·한정승인·상속포기 세 갈래 개념
  - 한정승인의 의미(상속받은 재산 한도 내에서만 채무 변제)와 상속포기의 의미(상속인 지위 자체 포기)
  - 신청 기한: 상속개시 있음을 안 날부터 3개월 이내(민법 제1019조), 특별한정승인 예외(빚 초과 사실을 중대한 과실 없이 3개월 내 알지 못한 경우)
  - 신청 절차·관할(가정법원 신고), 필요 준비(상속재산목록 등), 상속포기 시 후순위 상속인에게 채무가 넘어가는 점
  - 흔한 오해(상속포기하면 무조건 안전하다 vs 후순위로 넘어가므로 공동·전원 대응 필요, 3개월 지나면 원칙적으로 단순승인 간주) 바로잡기

required_sources:         # 공식 1차 출처만(법령·기관). 0건이면 발행 차단
