  - 중도금대출에서 잔금대출(또는 주택담보대출)로의 전환·대환 구조와 유의점
  - 잔금대출 단계에서 LTV·DSR·규제지역 규제가 적용되는 방식과 한도 산정 기준
  - 흔한 오해(중도금대출 승계 여부, 무이자=공짜가 아님, 잔금 때 한도가 줄 수 있음) 바로잡기

