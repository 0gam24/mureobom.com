human_notes: |
  차별화: 분양 아파트 대출을 '계약금→중도금→잔금' 3단계 타임라인으로 한 장에 정리하고,
  중도금대출(집단대출)↔잔금대출을 시점·심사·상환·규제 4축 표로 대비한다.
  "중도금 때는 통과했는데 잔금 때 한도가 줄었다"는 실제 자주 겪는 함정(잔금 시 DSR 재적용)을
  핵심 오해 바로잡기 단락으로 배치.
  기존 LTV/DSR 글과 겹치지 않게 '분양 단계별 대출 전환'에만 집중.
  단정적 한도·승인 약속 금지 — 규제·심사 기준 서술로만(금융표현 가드).
