must_cover:
  - 구조가 2층이라는 점 — 미소금융은 서민금융진흥원 계열의 공통 상품(창업·운영·시설자금, 금융취약계층 생계자금 등)만 있는 것이 아니라, 기부 재원으로 세워진 **재단별 특화상품**이 따로 있다. 같은 "미소금융"이라는 이름 아래 어느 재단 창구인지에 따라 대상·혜택이 갈린다. 이 글의 축은 제도 자격요건이 아니라 "창구별 혜택 차이"다
  - 신한미소금융재단 '자산 형성 지원금' — 운영 중인 유일한 확정 상품. 대상은 "2026.4.1 이후 신한미소를 통해 청년운영자금대출 또는 청년미래이음자금대출을 받은 고객 중 현재 원리금분할상환금을 연체 없이 성실하게 상환중인 자". 지원내용은 회차(분기)별 최대 30만원, 고객별 최대 300만원(총 10회차). 지급은 분기말(3·6·9·12월말) 기준일에 연체가 없을 경우 다음달 10일(1·4·7·10월 10일). 실적은 2분기부터 운영해 총 444명에게 8천만원 지급
  - 자산 형성 지원금의 핵심 성격 — 이자를 깎아주는 방식이 아니라 상환 중인 사람에게 현금을 따로 주는 구조다. 다만 '연체 없이 성실 상환 중'이 분기말 기준으로 판정되므로 한 분기 연체가 그 회차를 날린다는 뜻으로 읽힌다. 보도자료는 연체 후 회차 복구 여부를 밝히지 않았으므로 그 부분은 미확인으로 남긴다
  - KB미소금융재단 'KB 청년 라이더 희망 대출(가칭)' — 2026년 11월 출시 예정이고 **명칭이 가칭**이라는 점을 반드시 명시. 대상은 청년 배달 플랫폼 종사자(만 19세 이상 39세 이하), 지원내용은 최대 500만원 이내(배달용 이륜차 구입가 이내), 금리는 연 2.5~4.5% 수준
  - KB 상품의 금리우대 두 갈래 — 친환경 이륜차(전기 오토바이·자전거 등) 구입자 1.5%p, 금감원·서금원 등 금융교육 이수자 0.5%p. 둘이 중복 적용되는지는 보도자료에 없으므로 합산 2.0%p라고 단정하지 않는다. 자금 용도가 이륜차 구입비로 묶여 있어 생활비로는 쓸 수 없는 목적형 대출이라는 점
  - NH미소금융재단(가칭) — NH농협금융 5개 계열사 기부금 1,000억원을 재원으로 연내 설립, 전국 8개 지점 순차 개설, 2027년 1분기부터 농촌 지역 금융취약계층 중심 공급. 특화상품은 'NH 영농창업자금(가칭)'·'NH 영농운영자금(가칭)'으로 2027년 중 공급 개시 예정이고 대상은 저신용 귀농인·청년농. 용도는 농지·시설 임차보증금, 초기 농자재·농기계 구입, 종자·비료·인건비 등
  - 재원과 공급 규모 — 2026년 10월 30일 협약으로 총 8,000억원 기부(삼성생명 2,000억원, NH농협금융·신한금융·우리은행·KB국민은행·하나은행·IBK기업은행 각 1,000억원). 각 기관은 최대 5년에 걸쳐 분할 출연. 2026년 중 납입 예정은 NH농협금융 534억원·삼성 400억원·KB국민은행 400억원·하나은행 200억원·IBK기업은행 200억원이고 우리은행은 2027년부터. 신한금융은 3월 협약 후 6월에 400억원을 이미 출연
  - 공급 목표와 창구 수 — 미소금융 총 공급 목표는 2026년 4,000억원, 2027년 5,000억원, 2028년 6,000억원. 사업수행기관은 39개로 확대, 지점은 2026년 9월 기준 168개에서 2027년 중 180여 개로 단계적 확대 예정. 즉 지금 창구가 없는 지역이 2027년에 생길 수 있다는 실용적 함의
  - 왜 소액 상품이 늘어났나 — 보도자료가 밝힌 현장 애로는 "기존 자영업자 대상 상품(최대 7천만원)보다 한도가 작은 상품군(ex. 500만원)의 영향으로 취급 건수가 대폭 증가". 한도가 작아지는 대신 건수가 늘어 상담·심사 대기가 길어지는 구조를 사용자 입장에서 해석(서류를 미리 갖춰 가는 쪽이 유리하다는 정도까지만)
  - 경계와 미확인 영역 — (1) 재단 특화상품의 신청 창구·서류·심사 절차는 보도자료에 없으므로 쓰지 않는다. (2) 신한 상품의 '신한미소' 두 대출(청년운영자금대출·청년미래이음자금대출)의 한도·금리는 이번 보도자료에 없으므로 숫자를 만들지 않는다. (3) 재단 특화상품과 서금원 공통상품의 중복 이용 가능 여부도 미확인. 모두 "보도자료에서 확인되지 않는다"로 정직하게 표시하고, 확인 경로(해당 재단·미소금융지점 문의)만 안내
  - 단정 금지 — 신청하면 지원금을 받는다·금리가 2%대로 내려간다는 식의 보장 표현 금지. 대상에 해당해도 최종 대출 여부는 여신심사 결과에 달렸다는 조건부 서술만

