human_notes: |
  차별화: 기발행 glue 글(금융취약계층-생계자금-자격-추가요건-한도)은 서민금융진흥원 공통상품 하나의 자격요건 표를 다룬다. 이 글은 제도 자격이 아니라 **공급 주체(재단)별 혜택 차이**를 다루는 유일한 각도다. "미소금융"을 한 덩어리로 보는 2차 정보와 달리, 신한(현금 지원금)·KB(목적형 이륜차 대출 + 금리우대)·NH(영농, 2027)로 창구가 갈린다는 사실과 각 조건을 1차 출처 문구로 확정한다. 2026년 10월 30일 협약 발표로 막 생긴 지도라 어디에도 정리된 곳이 없다.
  가장 강한 정보 이득: (1) 미소금융을 성실상환하면 이자 할인이 아니라 분기별 현금(최대 30만원, 누적 300만원)을 받는 경로가 실제로 운영되고 있다는 사실과 지급일 규칙(분기말 무연체 → 다음달 10일), (2) 배달 플랫폼 종사자용 이륜차 구입 대출이 2026년 11월 출시 예정이고 친환경 1.5%p·금융교육 0.5%p 우대가 붙는다는 점. 둘 다 보도자료 원문 문구로 확정했다.
  반드시 지킬 것: (1) KB·NH 상품은 전부 "가칭"이고 출시 "예정"이다. 제목·본문 어디서도 이미 받을 수 있는 상품처럼 쓰지 않는다. (2) 신청 절차·서류·창구는 보도자료에 없으므로 만들어 쓰지 않는다. (3) 1.5%p와 0.5%p를 합산해 2.0%p라고 쓰지 않는다(중복 적용 여부 미확인). (4) '신한미소'의 두 청년 대출 상품 자체의 한도·금리는 이번 자료에 없으므로 숫자를 쓰지 않는다. (5) 기부금 금액을 개인이 받는 한도처럼 오독될 위치에 배치하지 않는다.
  카니발리제이션 검사(2026-11-02): src/content/answers/*.md 전수에서 "미소금융" 언급은 금융취약계층-생계자금-자격-추가요건-한도 1편뿐이고 해당 글은 서금원 공통상품의 기본요건·추가요건 AND 구조를 다룬다. "신한미소금융재단"·"KB미소금융재단"·"미소금융재단"·"배달"·"이륜차"·"자산형성 지원금" 언급 0건. 검색의도가 분리되므로 통과.
  문체: 긴 줄표 금지, 화살표 1회 이하, 체크리스트 블록 1개 이하, 고정 소제목 재사용 금지. 결론은 본문 재나열이 아니라 "본인이 어느 재단 창구에 걸리는지 먼저 확인하고 무엇을 물어볼지" 정하는 행동 계획으로 닫는다.
  미확인 처리 원칙: 보도자료에 없는 항목은 "공개된 자료에서 확인되지 않는다"로 명시하고 넘긴다. 추정으로 채우지 않는다.
