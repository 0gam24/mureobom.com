  - 보증한도 1,500만원·금리 연 10% 이내·보증료 2.5% 이내·대출기간 5년 이내·원리금균등분할·중도상환수수료 없음
  - 2026-01-02 통합 구조(근로자햇살론 + 햇살론뱅크 → 햇살론일반, 햇살론15 + 최저신용자 특례보증 → 햇살론특례)와 구 상품 2025-12-31 보증 종료
  - 통합의 트레이드오프: 한도 축소(2,000/2,500만원 → 1,500만원), 금리 상한 인하(11.5% → 10%), 사회적배려대상자 보증료 인하폭 축소(1.0%p → 0.5%p), 거치기간 소멸, 원금균등 → 원리금균등
  - 보증료 인하 요건과 제출서류(사회적배려대상자 0.5%p / 금융교육·컨설팅·국민취업지원제도·복지멤버십 0.1%p, 중복 불가)와 약정 후 소급 불가
  - 금융회사별 실제 평균금리·평균신용평점('26.2분기 신규대출 기준)이 보여주는 금리와 승인 문턱의 상충

