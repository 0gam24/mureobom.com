human_notes: |
  차별화: "개편 = 무조건 유리"라는 통념을 깨는 트레이드오프 표(한도 1,500만원으로 축소·사회적배려대상자
  보증료 인하폭 1.0%p→0.5%p 축소 vs 금리 상한 11.5%→10% 인하)와, 금융회사별 평균금리·평균신용평점을
  나란히 놓아 "금리 낮은 곳일수록 평균 신용평점이 높다"는 승인 문턱 상충을 수치로 보여주는 것.
  기존 loan/햇살론-자격-한도-금리는 통합 이전 3종(햇살론15·근로자·유스) 구조를 다루고 햇살론일반을
  언급하지 않음. loan/최저신용자-특례보증-자격은 햇살론특례 축만 다룸. 본 글은 햇살론일반 축의 롱테일.
  약정 이후 보증료 인하 소급 불가는 실무상 손실이 큰 포인트라 반드시 본문에 명시.
