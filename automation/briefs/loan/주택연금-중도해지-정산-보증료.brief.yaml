human_notes: |
  차별화: 기가입 '주택연금 가입조건·월수령액' 글과 겹치지 않게, 해지 시점의 정산 구조
  (그동안 받은 월지급금 누계 + 대출이자 + 초기보증료 미환급)와 동일주택 3년 재가입 제한에 집중.
  초기보증료·연보증료율과 재가입 제한 기간은 공사 규정 개정으로 바뀔 수 있으니 최신 기준 명시.
  "해지하면 낸 돈 다 돌려받는다"는 통념 반박 단락 필수 — 초기보증료는 지급보증 대가로 소진되어
  원칙적으로 미환급이라는 점을 정산금 구성과 함께 표로 정리.
  자문·권유가 아닌 일반정보임을 명확히(해지 손익 판단은 개인별 상이).
