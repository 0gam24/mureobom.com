id: loan-선불충전금-장기미사용-통지-환급-소멸시효
cluster: loan
status: published          # 클라우드 루틴 실행에 따른 즉석 승인 (2026-10-19)

target_query: "선불충전금 장기 미사용 통지 환급, 네이버페이 카카오페이 토스 기준 차이와 소멸시효 5년"
search_intent: 정보형      # 통지가 왜 오는지 + 내 돈이 언제 사라지는지 판단하려는 의도

signal:                   # 큐 stale(2026-06-11)로 WebSearch 폴백 선정, 점수는 미산출
  score: null
  source: websearch_fallback
  freshness: 1.0          # 금융위·금감원 2026-10-15 발표, 통지 개시가 2026-10 중

must_cover:
  - 2026-10-15 금융위·금감원 발표의 실제 조치 내용(연 1회 이상 통지 + 통지 안에 환급 메뉴 포함)
  - 회사별로 갈리는 '장기 미사용' 분류 기준(카카오페이 1년 이상 / 네이버파이낸셜·비바리퍼블리카 2년 이상)
  - 회사별 유효기간 차이(네이버파이낸셜·카카오페이 10년 / 비바리퍼블리카 유효기간 없음)
  - 기존 통지 의무의 공백 구조 — 신유형 상품권 표준약관은 유효기간 만료 30일 전 3회 이상이라 10년 상품은 약 9년 11개월 무통지
  - 유효기간(약관)과 소멸시효(5년)가 서로 다른 시계라는 점, 두 자료가 이 둘을 연결해 주지 않는다는 한계 명시
  - 2025-08 국민권익위 권고(소멸시효 완성 1년 전부터 3회 이상 통지)와 소멸 규모(연평균 529억원, 2021~2024 합계 2,116억원)
  - 분류돼도 사용·환급에 제약이 없다는 점(관리 목적 분류)
  - 통지는 공식 채널만 — 출처 불명 이메일·문자의 계좌정보 요구는 사칭
  - 확인되지 않은 것: 통지 대상 잔액 하한, 통지 개시일, 3사 외 전자금융업자 확산 시점

required_sources:         # 공식 1차 출처만. 0건이면 발행 차단
  - "금융위원회·금융감독원 보도자료 「잠든 선불충전금, 잊지 말고 사용하세요」(2026-10-15, 디지털금융총괄과)"
  - "대한민국 정책브리핑(korea.kr) 국민권익위원회 「선불전자지급수단 이용자 권익 보호 방안」 정책뉴스(2025-08-01)"
  - "공정거래위원회 신유형 상품권 표준약관(유효기간 만료 전 통지 의무)"
  - "전자금융거래법 선불충전금 별도관리 규정(국가법령정보센터)"

internal_links:
  - loan/휴면예금-장기미거래자산-조회-환급
  - loan/신용카드-포인트-소멸-조회-현금화
  - loan/착오송금-반환지원-신청대상-차감비용
  - loan/보이스피싱-피해금-지급정지-환급-신청

compliance:
  medical_legal_financial_advice_disclaimer: true

geo:
  faq_schema: true
  faq_pairs_min: 3
  llms_txt: true

human_notes: |
  차별화: "255억원이 잠들어 있고 알림이 온다"로 끝나는 보도 대신, 통지 의무의 공백 구조를
  뜯어 본다 — 금융위 자료가 스스로 지적한 '유효기간 10년 상품은 약 9년 11개월간 통지 의무가
  없다'는 구조와, 그 공백을 메우는 이번 자율 통지(연 1회), 그리고 유효기간 10년과 소멸시효
  5년이라는 두 개의 다른 시계가 공개 자료만으로는 연결되지 않는다는 점을 함께 세운다.
  회사별로 1년/2년, 10년/무기한으로 갈리는 기준표가 이 글의 고유 정보 이득.

  수치 주의: 언론이 쓰는 176만명·255억원은 금융위 보도자료 본문에서 확인되지 않았다.
  확인 안 된 수치는 쓰지 않는다. 권익위 529억원·2,116억원은 korea.kr 정책뉴스에서 확인됨.

  유효기간 vs 소멸시효를 임의로 정리해 단정하지 마라. 두 자료가 각각 무엇을 적었는지만
  쓰고, 연결되지 않는 구간은 "공개 자료로 확인되지 않는다"로 남긴다.
