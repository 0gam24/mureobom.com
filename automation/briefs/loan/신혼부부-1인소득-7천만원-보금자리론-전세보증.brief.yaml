  - 이것이 대체가 아니라 OR 조건이라는 점 (부부합산 8,500만원 이하면 종전 경로 그대로 유효)
  - 현행 수치 (보금자리론 미혼 1인 7,000만원·신혼 부부합산 8,500만원·1자녀 9,000만원·다자녀 1억원 / 청년특례 전세보증 만 34세 이하·부부합산 7,000만원·한도 2억원)
  - 개선 수치 (전세보증 만 39세 이하로 확대, 신혼·유자녀 한도 3억원, 보증비율 100% 유지)
  - 시행일 구분 (8·13 대책의 시행시기는 '26.10월, 주택금융공사가 두 상품 모두 10월 19일 신규 신청 건부터로 확정)
  - 신혼가구 정의 (대출신청일이 혼인신고일로부터 7년 이내, 대출신청일로부터 3개월 이내 결혼 예정 포함)
  - 소득 조합별 판정 분기 (합산 8,500만원 초과 구간에서 결과가 갈리는 지점을 자체 계산으로 제시)
  - 공개 자료의 한계 (문서가 "부부 중 1인"으로만 적어 두어 그 1인이 차주 본인인지 특정되지 않음, 기존 심사 중 건 처리 미공개)
  - 소득요건을 통과해도 남는 제약 (보금자리론 주택가격 6억원 이하·LTV 아파트 70%·DTI 60%·한도 3.6억원, 전세보증은 은행 심사 별도)
  - 아직 시행 전인 '27.1월 예정 상품과 구분 (청년미래보금자리론·청년전월세결합보증은 안(案) 단계)

