human_notes: |
  차별화: 기발행 「보금자리론-자격-한도-금리」는 일반 요건표를, 「특례전세자금보증-유형-한도-일반전세-차이」는
  특례 16개 유형의 한도 비교를 다룬다. 후자는 2026-10-08 상품안내 기준 "만 34세 이하"로 적고 연령 변경
  공지를 확인하지 못했다고 명시했다. 이 글은 그 빈칸을 메우는 변경사항 분석형 한 편으로, 두 상품에
  동시에 들어오는 "부부 중 1인 기준 7천만원"이라는 같은 장치를 한 자리에서 비교한다.
  정보 이득의 핵심은 교차 종합이다. 주택금융공사 보도자료는 현행 수치를 적지 않았고, 상품안내 페이지는
  아직 개정 전 수치만 보여 준다. 금융위 8·13 안건의 현행·개선 대비표를 함께 읽어야 전후 비교가 완성된다.
  두 번째는 소득 조합별 분기 계산 (합산 8,500만원 초과 구간에서 어느 조합이 새 경로로 통과하는지).
  경고 1: 금융위 안건과 공사 보도자료 모두 "부부 중 1인의 연소득"으로만 적혀 있다. 그 1인이 차주 본인을
  뜻하는지 둘 중 누구든인지는 공개 자료에서 확인되지 않는다. 한쪽으로 단정하지 말고 확인 경로를 적어라.
  경고 2: 청년미래보금자리론·청년전월세결합보증은 '27.1월 잠정 시행의 안(案)이고 세부사항 추후 확정이다.
  "시행된다"고 쓰면 안 된다. 금리 수치(보금자리론 4.90~5.20%)는 안건 표의 비교값이라 현재 고시와 다를
  수 있으므로 본문에 쓰지 않는다.
  경고 3: 전세보증 쪽 "신혼·유자녀 3억원"은 안건 표의 개선안 각주와 공사 보도자료가 함께 뒷받침한다.
  다만 자녀양육가구에 1인 소득 기준이 적용되는지는 공사 보도자료가 신혼가구만 언급했으므로 구분해 써라.
