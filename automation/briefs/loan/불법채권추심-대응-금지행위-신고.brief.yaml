must_cover:
  - 채권추심법이 금지하는 대표 행위(폭행·협박·위계, 야간(21시~08시) 방문·전화·문자, 반복적·다수 연락, 정당한 사유 없는 관계인 접촉, 채무자 외 제3자에게 채무사실 고지, 채무자로 오인하게 하는 거짓 표시·법적 절차 사칭)
  - 소멸시효 완성 채권 추심 대응 + 상환유예(재산·수입 곤란 시) 요청 권리
  - 채무대리인 제도(변호사·법무사 등 수임 시 채권자의 채무자 직접 접촉 제한)
  - 불법추심 당했을 때 대응 절차: 증거 확보(통화 녹음·문자·방문 기록·일시) → 금융감독원 1332 / 불법사금융 신고, 협박·폭행은 경찰(112) 병행 신고
  - 흔한 오해 바로잡기: "빚을 졌으니 어떤 추심도 참아야 한다"는 통념 반박 — 채무 존재와 별개로 추심 방식은 법으로 제한됨
  - 등록 대부업자 vs 미등록(불법) 업자 추심의 대응 차이(금융감독원 등록 조회로 확인)

