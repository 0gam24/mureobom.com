human_notes: |
  차별화: 채권추심법 금지행위를 "당한 상황 → 어떤 조항 위반 → 어디에 어떻게 신고"로 잇는
  대응 시나리오 표 + 등록/미등록 업자별 신고 창구 분기 + 채무대리인 선임 후 직접접촉 차단 활용법.
  기준연도 2026 최신 유지(야간 기준 21시~08시, 금감원 1332). 형량·구체 처벌 수위 단정 서술 금지 —
  "법으로 금지·신고 가능" 수준으로만 안내하고 개별 사안은 상담 권유.
  자주 틀리는 통념: "빚이 있으면 추심을 다 받아줘야 한다"(추심 방식은 별도 제한), "소멸시효 지난
  채권은 무조건 안 갚아도 자동 소멸"(시효 이익 원용·일부 변제 시 부활 주의) 두 지점 반드시 교정.
