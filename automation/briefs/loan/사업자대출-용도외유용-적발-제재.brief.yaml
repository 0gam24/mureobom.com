status: published         # compliance 전 룰 통과 (2026-09-13 KST). 승인: 클라우드 루틴 '06 mureobom (07:00)' 실행 = 운영자 즉석 승인

target_query: "사업자대출 용도외 유용 적발되면 어떻게 되나요 신규대출 제한 기간"
search_intent: 정보형      # 제재 내용·기간·범위를 사전에 확인하려는 의도

signal:                   # WebSearch 폴백 선정(스캐너 큐 stale 2026-06-11) — 정성 판단값
  score: 0.0
  trend_momentum: 0.0
  question_volume: 0.0
  cluster_fit: 1.0
