must_cover:
  - 용도외유용이 무엇인지 — 대출 신청서·약정서에 적은 자금 용도와 실제 사용처가 다른 경우
  - 적발 시 1차 조치 — 대출금 즉시 회수(기한이익 상실), 사안에 따라 수사기관 통보
  - 신규대출 제한 기간의 변경 — 1차 적발 1년에서 3년, 2차 적발 5년에서 10년으로 강화
  - 제한 범위의 변경 — 해당 금융회사 사업자대출에서 전 금융권 모든 대출(개인사업자는 가계대출 포함)로 확대
  - 적용 시점 — 2026년 2분기 중 개정준칙 시행, 시행 후 신규 취급분부터 적용된다는 점
  - 2021년 이후 실행된 사업자대출에 대한 금융회사·금감원 전면 점검이 진행 중이라는 사실
  - 기준일 명시와 개별 사안(약정 조건·금융회사별 사후관리)은 금융회사 확인이 필요하다는 안내

required_sources:
  - "금융위원회 보도자료 '2026년도 가계부채 관리방안'(2026-04-01) — 용도외유용 제재 강화 표"
  - "금융위원회 보도자료 '부동산 불법행위 조사·수사 범부처 역량 결집'(2026) — 사업자대출 점검"
  - "금융감독원 — 사업자대출 용도외유용 현장점검 관련 공표 자료"

