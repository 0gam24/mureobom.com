human_notes: |
  차별화: 기발행 loan/주택담보대출-생활안정자금-목적-한도가 "용도 외 사용 시 회수 기한·신규대출
  제한 몇 년" 같은 구체 수치를 1차 출처 미확인 사유로 명시적으로 비워 둔 자리를, 2026-04-01
  금융위 가계부채 관리방안이 확정한 수치(1년→3년, 5년→10년, 전 금융권 확대)로 채운다.
  코퍼스에 '용도외유용'을 정면으로 다룬 글이 없어 카니발리제이션 없음.

  주의: 제재 기간은 개정준칙 시행 후 신규 취급분부터 적용이라는 단서를 반드시 붙일 것.
  은행연합회 점검 준칙 원문(kfb.or.kr)은 WebFetch 허용 도메인이 아니므로 '인출일부터 N개월 내
  사용내역 제출' 같은 준칙 세부 절차는 1차 확인 전까지 쓰지 말 것.
  적발 건수 등 언론 인용 수치는 금융위·금감원 공표 자료로 확인된 것만 사용.
  개별 차주의 위법 여부·처벌 가능성 판단은 단정 금지(일반정보 고지 유지).
