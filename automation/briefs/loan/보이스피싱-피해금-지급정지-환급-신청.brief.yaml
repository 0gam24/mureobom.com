human_notes: |
  차별화: '신고→지급정지→피해구제신청→채권소멸공고→환급' 전체 타임라인을 단계별로
  분해하고, 각 단계의 법적 근거 조문과 현실적 소요를 표로 명시. "돈 보내자마자 전화하면
  다 돌려받는다"는 통념과 "이미 인출되면 환급 대상에서 빠질 수 있다"는 현실을 대비.
  인포그래픽: 사고 직후 시간축(지급정지→신청→공고→환급) 플로우.
  단정적 보상 약속 금지(환급 여부·금액은 사안별). 외부 커뮤니티 원문 저장 금지, 집계신호만.
