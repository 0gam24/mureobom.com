must_cover:
  - 2026-11-06 관계기관 합동 「시장상황점검회의」가 결정한 내용의 정확한 범위 — "신용융자에 대한 증권사 담보비율 유지의무(140%)를 3개월간 면제(11.9일 시행)". 종료일은 보도자료에 적혀 있지 않다는 사실까지 그대로
  - 면제된 의무의 조문 특정 — 금융투자업규정 제4-25조 제1항(신용공여금액의 100분의 140 이상 담보 징구, 신용거래대주는 대주 시가상당액의 100분의 105 이상). 개정 연혁 2022-11-09·2024-10-02
  - 핵심 구분 — 반대매매를 직접 일으키는 수치는 제4-25조 제3항의 '담보유지비율'이고, 이 비율은 규정이 아니라 "투자매매업자 또는 투자중개업자가 정한 일정비율"이다. 즉 140% 징구의무 면제가 곧 반대매매 중단은 아니다
  - 제4-25조 제3항 절차 — 담보 평가금액 비율이 담보유지비율에 미달하면 증권사는 지체 없이 추가담보 납부를 요구해야 하고, 투자자와 사전 합의가 있으면 요구 없이 계좌의 미담보 현금·증권을 추가담보로 징구할 수 있다
  - 제4-25조 제7항 — 추가담보 요구는 내용증명 우편, 통화내용 녹취 또는 사전 합의한 방법처럼 요구 사실이 입증되는 방법이어야 한다
  - 제4-28조 제1항 — 임의처분(반대매매)의 세 가지 사유(상환요구 후 상환기일 내 미상환 / 추가담보 요구 후 증권사가 정한 납입기일까지 미납 / 이자·수수료·제세금 미납)와 '그 다음 영업일'이라는 시점, 그리고 예탁 현금 우선 충당 → 담보증권 → 그 밖의 증권 순서
  - 제4-28조 제2항 — 사전 합의가 있고 시세 급변으로 채권회수가 현저히 위험하다고 판단되면 추가담보를 요구하지 않고 바로 임의처분할 수 있으며, 처분내역을 입증 가능한 방법으로 사후 통지해야 한다
  - 제4-26조 제1항 제2호 — 담보로 잡힌 상장주권·상장지수집합투자증권의 평가는 당일 종가(불가 시 최근일 기준가격). 제4-28조 제3항은 상장증권 처분 시 사전 합의한 방법으로 호가를 제시하도록 한다
  - 제4-28조 제5항 — 처분대금 충당 순서는 처분제비용 → 연체이자 → 이자 → 채무원금이며, 투자자 요청이 있으면 연체이자·이자·원금 간 순서를 변경할 수 있다(2021-12-09 단서 신설)
  - 제4-31조 제2항 — 증권사가 최저 담보유지비율을 정하거나 변경하면 지체 없이 금융감독원장에게 보고해야 한다. 내 계좌 적용 수치는 결국 거래 증권사 고지·약정에서 확인해야 한다는 결론으로 연결
  - 금융위 조치의 규정상 근거 — 제4-33조 제1항은 제4-23조부터 제4-25조까지 등에 "불구하고" 신용공여 상황의 급격한 변동·투자자 보호·건전한 거래질서 유지에 필요한 경우 담보 제한 등 조치를 취할 수 있게 한다
  - 확인되지 않은 것 명시 — 면제 종료 날짜, 개별 증권사가 자사 담보유지비율을 실제로 낮추는지 여부, 종목별·계좌별 적용 수치. 추측으로 메우지 않는다
