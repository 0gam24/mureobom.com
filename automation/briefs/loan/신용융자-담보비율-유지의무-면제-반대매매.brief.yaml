human_notes: |
  차별화: 언론·블로그는 이 조치를 "반대매매 3개월 중단"으로 요약한다. 그런데 면제된 것은 금융투자업규정
  제4-25조 제1항의 140% 담보 '징구의무'이고, 실제 반대매매를 당기는 방아쇠는 같은 조 제3항의 '담보유지비율'
  이며 이 수치는 규정이 아니라 증권사가 정한다. 이 글은 조문을 칸 단위로 분해해 "무엇이 면제되고 무엇이
  그대로인가"를 가른다 — 추가담보 요구 절차(제3항·제7항), 임의처분 사유와 '그 다음 영업일' 시점(제4-28조
  제1항), 사전 합의 시 요구 없이 즉시 처분 가능한 예외(제2항), 당일 종가 평가(제4-26조), 처분대금 충당
  순서와 순서 변경 요청권(제4-28조 제5항), 증권사 비율 변경의 금감원 보고의무(제4-31조 제2항)까지.
  독자가 얻는 것: 뉴스 한 줄로는 알 수 없는 "내 계좌에서 실제로 달라지는 것과 달라지지 않는 것"의 경계,
  그리고 자기 증권사 수치를 어디서 확인해야 하는지.
  주의: 반대매매가 멈춘다·안전해졌다는 단정 금지. 주가 방향·시장 전망 언급 금지. 투자 판단 권유 금지.
  종료일을 '2027-02-08' 식으로 계산해 적지 말 것 — 보도자료에 없다. 개별 증권사 담보유지비율 수치
  (통상 140%·130% 등)를 출처 없이 쓰지 말 것.
