must_cover:
  - 공시일 2026-11-01 금리표와 2026-11-09 금리표의 상품별(u-/아낌e/t-) 만기별 차이 — 0.10%p가 어디에 붙는지 숫자로
  - 왜 11월 8일이 분기점인지의 규정 근거 — 업무처리기준 제4장이 "신청일부터 실행일까지 금리를 비교하여 가장 낮은 금리를 적용"하고, 공사 사전심사 건은 확약통지상 금리를 적용한다고 규정
  - 업무처리기준 용어정의상 '신청일'이 방식별로 다름 — u·아낌e는 고객이 신청시스템에서 신청 완료한 날, t는 금융기관이 공사에 전산 통지하는 날
  - 여전히 공고·규정에 없는 것은 두 가지뿐이라는 점을 정확히 — 마감 시각(몇 시까지)과 어느 단계까지가 '완료'인지의 실무 경계. 확인 경로는 고객센터 1688-8114(월~금 09:00~18:00)
  - 2026-11-08은 일요일이라는 달력 사실과, 공사 신청절차 페이지가 안내하는 채널(인터넷 u/아낌e 신청 → 전화상담 → 서류제출 → 심사승인 → 은행 방문)에서 주말이 끼는 구간
  - 보금자리론은 대출 실행일부터 만기까지 고정금리이므로, 이번 공시금리 차이가 만기까지 유지되는 구조라는 점
  - 기준일이 항목마다 다르다는 점 — 신혼가구 혼인 7년은 대출신청일 기준, 주택가격 6억원은 대출승인일 기준
  - 금리우대 항목과 %p (저소득청년 0.1·신혼가구 0.3·사회적배려층 항목당 0.7 최대 2개·다자녀 2자녀 0.5/3자녀 이상 0.7·녹색건축물 0.1·미분양관리지역 0.2·전세사기피해자 1.0·신생아출산 0.2, 신혼-신생아 중복 불가, 최대 1.0%p) 및 규제지역 0.2%p 가산
  - 전자약정(아낌e)과 비전자 처리 0.1%p 가산의 관계 — 채널 선택이 0.10%p 인상과 같은 크기로 금리를 움직인다는 비교
