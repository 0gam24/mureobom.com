human_notes: |
  차별화: 기발행 `보금자리론-자격-한도-금리`는 상시 자격·한도·금리 안내다. 이 글은 2026-11-09 공시금리
  교체라는 1회성 사건을 "11월 8일까지 신청 완료"라는 공사 문구 한 줄에 맞춰 분해한다 — 공시일 두 개의
  금리표를 직접 대조해 0.10%p가 상품·만기별로 어디에 붙는지 보여주고, 공고가 정의하지 않은 '신청 완료'의
  경계를 추측으로 메우지 않고 명시하며, 11월 8일이 일요일이라는 달력 사실과 채널별 절차를 겹쳐 놓는다.
  뉴스 요약으로 끝나지 않도록, 금리우대 항목표와 전자약정 0.1%p 가산을 같이 놓아 "인상분과 같은 크기로
  움직일 수 있는 레버"를 한 화면에 모은다.
  리서치 보정(2026-11-05): 당초 '신청 완료 정의가 아예 없다'는 전제는 보도자료·신청절차 페이지에 한해 참이다.
  업무처리기준이 신청일을 방식별로 정의하고 "신청일부터 실행일까지 중 가장 낮은 금리" 규정을 두고 있으므로,
  각도를 '왜 8일이 분기점인가'의 규정 해부로 옮긴다. 미정의로 남는 것은 마감 시각과 완료 단계의 경계 둘뿐.
  주의: 어느 선택이 이득이라는 단정·금리 전망 금지. 0.10%p의 체감 효과를 금액으로 추정 계산하지 말 것(공사 제시 수치 아님).
  우대금리 %p는 홈페이지 현행값 사용(업무처리기준 PDF 2024.01.29판은 신혼 0.2%p 등 구판이라 불일치).
