human_notes: |
  차별화: '숨은 돈 찾기' 글은 조회 사이트 나열에서 끝나는데, 이 글은 금융당국 원문 통계로 판을 다시 깐다.
  핵심 반전은 규모다. 언론이 반복하는 '휴면예금 1.5조원'은 전체가 아니라 작은 쪽이고, 소멸시효가 아직
  완성되지 않은 장기미거래 금융자산이 14.2조원으로 9배가 넘는다(2025년말). 즉 찾을 돈의 대부분은
  '휴면'이라는 이름이 붙기 전 단계에 있고, 그래서 조회 타이밍이 제도의 실익을 가른다. 여기에 두 번째
  정보 이득을 얹는다. 휴면예금이 서민금융진흥원 출연분과 금융회사 보유분으로 갈리기 때문에 조회처가
  기관별로 쪼개져 있고, 특히 은행연합회 sleepmoney.or.kr과 서민금융진흥원 sleepmoney.kinfa.or.kr은
  주소가 거의 같은데 운영기관과 범위가 달라 한 곳만 보면 놓친다. 마지막으로 2026-09-28 발표로
  금융회사별 환급실적·장기미거래 잔액이 협회 홈페이지에 매년 3월말 공개되는데, 시작은 2027년이라는
  시점을 정확히 못박는다(지금 열린다고 쓴 글이 양산될 소재라 선점 가치가 있다).
  기존 글 대조: 전 코퍼스 321편에 '휴면'이 들어간 글은 0편. loan/예금자보호-한도-1억-상향-시행시기는
  예금보험 한도, loan/신용카드-포인트-소멸-조회-현금화는 카드포인트 소멸시효, loan/착오송금-반환지원은
  잘못 보낸 돈 회수, loan/사망자-명의-금융거래-차단-예외인출-상속은 상속 개시 후 계좌 처리로
  검색의도가 모두 다르다(이 글은 넷 모두에 자연스럽게 내부링크를 건다). 카니발리제이션 없음.
  주의: 조회 결과가 있어도 지급 가능 여부·절차는 금융회사와 운영기관 확인 사항이므로 "받을 수 있다"
  단정 금지. 소멸시효 완성분의 지급 여부를 단정하지 말고, 출연분과 보유분의 창구가 다르다는 사실만 쓴다.
  2027년부터 공개라는 시점을 흐리지 말 것. 금액은 2025년말 기준임을 본문에 명시.
