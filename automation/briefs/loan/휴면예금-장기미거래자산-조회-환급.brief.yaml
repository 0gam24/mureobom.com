id: loan-휴면예금-장기미거래자산-조회-환급
cluster: loan
status: published    # compliance 전 룰(O·K·F·L·A·M·AD·E·V·SH·W) 통과 2026-10-04 (KST). 승인 경위: 클라우드 루틴 '06 mureobom (07:00)' 실행 = 운영자 사전 전권 승인(2026-09-02)에 따른 즉석 승인 → 동일자 발행

target_query: "휴면예금 조회 숨은 금융자산 찾기 장기미거래 자산 환급 방법"
search_intent: 절차형

signal:
  score: 0.0
  trend_momentum: 0.0
  question_volume: 0.0
  cluster_fit: 1.0
  freshness: 1.0

must_cover:
  - 두 개념이 다르다는 것부터 — 통계상 '휴면금융자산'은 법규상 청구권의 소멸시효가 완성된 뒤 찾아가지 않은 금액 중 서민금융진흥원에 출연하지 않은 금융회사 보유분이고, '장기미거래 금융자산'은 개인이 보유한 3년 이상 입·출금 거래내역이 없는 자산 또는 만기가 있는 상품의 경우 만기 후 3년 이상 경과한 예·적금·보험금·예탁금 등이다
  - 규모가 역전돼 있다는 점 — 2025년말 기준 휴면금융자산은 15,019억원(약 1.5조원)인데 장기미거래 금융자산은 142,015억원(약 14.2조원)으로 9배가 넘고, 둘을 합치면 157,034억원(약 15.7조원)이다. 뉴스에 자주 나오는 '1.5조원'은 전체가 아니라 작은 쪽이라는 것이 이 글의 핵심 정보
  - 자산군별 분포(2025년말, 억원 단위) — 예·적금 휴면 3,825 + 장기미거래 74,342 = 78,167(49.8%), 보험금 6,583 + 51,895 = 58,478(37.2%), 증권 3,762 + 15,620 = 19,382(12.3%), 신탁 849 + 158 = 1,007(0.6%). 증권 항목의 휴면분은 휴면성증권 및 미수령주식·배당금을 포함한다
  - 휴면자산 잔액이 몇 년째 줄지 않는다는 사실 — 2022년말 1.5조원, 2023년말 1.6조원, 2024년말 1.4조원, 2025년말 1.5조원. 조회·환급 서비스와 캠페인이 계속됐지만 비슷한 수준에 머물러 있어 당국이 추가 대책을 내놓은 배경
  - 창구가 하나가 아닌 이유 — 휴면예금은 서민금융진흥원에 출연된 것과 금융회사가 그대로 보유한 것으로 갈리고, 자산 종류(예금·보험·증권·카드포인트·공과금)마다 관리 기관이 달라서 조회처가 기관별로 쪼개져 있다
  - 금융감독원 금융소비자 정보포털 파인이 안내하는 통합 입구 — 내계좌 한눈에(계좌정보통합관리서비스, payinfo.or.kr)에서 장기미거래·휴면 금융자산(예적금·신탁·투자자 예탁금·휴면예금·보험금 등)을 한 번에 조회할 수 있고, 파인에는 상속인금융거래조회도 함께 안내된다
  - 파인 '업권별 계좌 조회 및 관리'가 안내하는 기관별 조회처 표 — 휴면예금·휴면보험금 통합조회(은행연합회), 저축은행 휴면예금조회(저축은행중앙회), 새마을금고 휴면예금 조회(새마을금고), 새마을금고 휴면공제금 조회(새마을금고보험), 휴면예금 찾아줌(서민금융진흥원, 은행·저축은행), 휴면성증권(금융투자협회), 미수령주식(예탁결제원 외), 실기주과실(한국예탁결제원), 내 보험 찾아줌(생명·손해보험협회), 자동차보험 과납보험료(보험개발원), 카드포인트(여신금융협회), 파산금융기관 미수령금(예금보험공사), 미환급공과금(정부24)
  - 이름이 거의 같아 헷갈리는 두 곳을 구분해 줄 것 — 은행연합회가 운영하는 휴면예금·휴면보험금 통합조회(sleepmoney.or.kr)와 서민금융진흥원이 운영하는 휴면예금 찾아줌(sleepmoney.kinfa.or.kr)은 운영기관과 포괄 범위가 다르다. 한쪽에서 '없음'이 나와도 다른 쪽을 확인해야 하는 구조
  - 2026년 9월 28일 배포된 금융위원회·금융감독원 공동 보도자료로 달라지는 것 — 금융회사별 ①휴면자산 환급액 ②휴면자산 잔액 ③장기미거래자산 잔액을 각 금융업권 협회·중앙회 홈페이지에 매년 3월말까지 연 1회 공개한다. 대상은 은행·증권·보험·저축은행·상호금융 전 업권이고 공개 단위는 개별 금융회사(상호금융은 전체 조합 합계 단위)다
  - 공개 항목이 업권별로 다르게 불린다는 점 — 휴면예금은 은행·저축은행·상호금융, 휴면보험금은 보험사, 휴면성증권은 증권사 기준이다
  - 시점을 정확히 — 각 협회는 2026년말까지 협회 금융소비자보호 모범규준 등을 개정하고 환급실적 공개용 홈페이지 메뉴 신설·시스템을 마련할 예정이며, 2026년 휴면자산 환급실적 등이 2027년부터 공개된다. 즉 지금 당장 비교표가 열리는 것이 아니라는 점을 분명히 할 것
  - 모범규준 개정 3축 — 관리목표 설정(휴면자산 등의 발생 예방·감축을 위한 자체 관리목표), 관리활동 강화(캠페인 등 환급 촉진 활동 수행), 내부통제 강화(관리업무 수행 결과를 금융소비자보호 내부통제위원회 등에 보고). 관리목표는 환급률·환급액·증감률·캠페인 횟수 등 통제 가능 지표를 금융회사가 자율적으로 설정한다
  - 행동 계획으로 맺을 것 — 소멸시효가 완성되기 전 '장기미거래' 단계에서 잡는 것이 실익이 크다는 점(14.2조원이 이 단계에 있다), 통합조회로 큰 그림을 보고 기관별 조회처로 내려가는 순서, 조회 결과가 있으면 해당 금융회사·기관에 직접 청구해야 한다는 점. 구체적인 청구 절차·필요 서류·지급 가능 여부는 각 금융회사와 운영기관에서 확인할 사항이라는 점을 명시
  - 정보 기준일 명시 — 금액은 2025년말 기준, 제도 내용은 2026년 9월 28일 배포(2026년 9월 29일 조간) 보도자료 기준

required_sources:
  - "금융위원회·금융감독원 공동 보도자료 「휴면자산 환급실적 등을 공개하고 금융회사의 휴면자산 관리체계를 강화합니다」(2026년 9월 28일 배포)"
  - "금융감독원 금융소비자 정보포털 파인 — 업권별 계좌 조회 및 관리"
  - "금융감독원 금융소비자 정보포털 파인 — 내계좌 통합조회 및 관리"

