human_notes: |
  차별화: 기발행 「보이스피싱 피해금 지급정지」가 피해가 발생한 뒤의 사후 구제를 다루는 반면,
  이 글은 피해가 생기기 전에 내 명의 대출 자체를 잠가 두는 사전 차단 장치를 다룬다. 정보 이득의
  축은 세 가지다. (1) "무엇이 잠기고 무엇은 안 잠기는가"의 경계 — 신용카드 신규 발급이 2025년
  개선으로 필수에서 선택으로 바뀐 지점, 그리고 이름이 비슷한 비대면 계좌개설 안심차단과는 아예
  다른 서비스라는 구분. (2) 신청은 비대면으로 쉬워졌는데 해제는 여전히 영업점 대면이라는 비대칭과
  그 이유. (3) 검색자가 가장 궁금해하지만 공개 자료에 답이 없는 항목(해제 소요 시간, 기존 대출
  연장·한도 증액 처리)을 "없다"고 정확히 알려 주는 것.
  검수 포인트:
  - 시행일·실적 수치·가족 범위·채널은 위 4개 보도자료 문구로만 확정 표기. 그 밖의 수치 금지.
  - 신용카드 선택항목 전환·임의대리인 확대는 2025-05-16 보도참고에 시행일이 명시되지 않았으므로
    "발표일 기준으로 개선됐다"까지만 쓰고 특정 시행일을 만들지 않는다.
  - 농협조합 5월말·새마을금고 순차 확대는 2025-05-16 시점의 "예정"이므로 예정으로만 서술하고
    현재 가능 여부로 단정하지 않는다.
  - "가입하면 대출 사기를 100% 막는다" 식 보장 표현 금지. 신규 여신거래 차단 장치라는 사실까지만.
  - 개별 금융회사 앱 화면·메뉴 경로는 확인 불가이므로 쓰지 않는다.
  - 어카운트인포는 비대면 계좌개설 안심차단 신청 채널로 카드뉴스에 언급된 것이므로, 여신거래
    안심차단의 채널로 옮겨 적지 않는다.
