must_cover:
  - 여신거래 안심차단이 하는 일 — 본인 명의 신규 여신거래를 전 금융권에서 사전 차단, 한국신용정보원이 정보 등록·관리, 4,012개 금융회사(단위조합 포함)에 실시간 적용
  - 차단되는 거래의 범위 — 보도자료에 열거된 신용대출, 담보대출, 카드론, 신용카드 신규 발급, 할부·리스, 예·적금 담보대출, 보험계약대출
  - 신용카드 신규 발급은 2025-05-16 개선으로 필수 차단항목에서 선택항목으로 바뀐 것(일괄 차단이던 이전과의 차이)
  - 비대면 계좌개설 안심차단과의 구분 — 이쪽은 수시입출식 계좌의 비대면 개설(대포통장) 차단이고 대출 차단이 아니라는 점, 두 서비스는 별개 신청
  - 신청 채널의 변화 — 2024-08-23 시행 당시 영업점 대면만, 인터넷전문은행 비대면 2024-09-30(케이뱅크 10-08), 이후 은행 모바일앱, 농협조합 2025년 5월말 예정 등 순차 확대
  - 임의대리인 신청·해제 허용과 그 가족 범위(배우자 및 배우자의 부모, 직계존비속, 외조부모, 외손자, 사위, 며느리), 대리 신청은 영업점 방문 채널
  - 해제 절차가 신청보다 까다로운 이유 — 사기범의 무단 해제를 막기 위해 영업점 방문으로만 해제 가능, 직원이 보이스피싱·명의도용에 따른 해제인지 확인
  - 실제로 얼마나 쓰이나 — 시행 한 달 89,817명(2024-09-26 기준), 2025-05-16 기준 여신거래 255만명·비대면 계좌개설 204만명·중복 약 147만명, SKT 해킹 직후 일주일 약 45만명
  - 공식 자료로 확인되지 않는 것의 구분 — 해제 소요 시간, 해제 후 재신청 대기기간, 기존 마이너스통장 한도 증액·대출 연장 등 기존 거래의 처리, 금융회사별 앱 신청 가능 여부

