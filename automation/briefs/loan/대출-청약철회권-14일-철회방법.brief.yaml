target_query: "대출 청약철회권 14일 대출 취소 중도상환수수료 없이"
search_intent: 절차형     # 방금 받은 대출을 되돌릴 수 있는지 + 어떻게 하는지

signal:                  # 스캐너 산출(읽기 전용, 원문 아님 — 집계 수치만)
  score: 74.0
  trend_momentum: 0.55
  question_volume: 0.5
  cluster_fit: 1.0       # loan boost ×1.15 반영 대상
  freshness: 0.5

must_cover:
  - 청약철회권이 무엇인지(금융소비자보호법이 보장하는 소비자 권리, 대출 계약을 일정 기간 안에 취소)
  - 대출 청약철회 기간 — 계약서류 받은 날 또는 대출금 받은 날 중 나중 날부터 14일 이내
  - 철회 시 소비자가 돌려줘야 할 것(원금 + 대출일부터의 약정이자 + 인지세 등 제3자에 이미 지급한 비용)과 돌려받을 것(중도상환수수료·설정비 등)
  - 철회 방법(서면·전자우편·휴대전화 문자 등으로 철회 의사 표시 + 원리금 반환)과 효력 발생 시점
  - 신용정보에 남은 대출 기록 삭제 효과(철회하면 대출받은 이력이 신용조회기록에서 삭제)
  - 적용 한도·예외(대출성 상품 금액·건수 기준, 자동차·리스 등 예외 유무, 상품별 철회 가능 범위)
  - 흔한 오해(중도상환과 다름 / 14일 지나면 청약철회권으로는 취소 불가)

required_sources:        # 공식 1차 출처만. 신호는 집계 수치만. 0건이면 발행 차단
  - "금융소비자 보호에 관한 법률 제46조(청약의 철회) / 시행령 제37조 (국가법령정보센터 law.go.kr)"
  - "금융감독원 금융소비자 포털 파인(fine.fss.or.kr) 청약철회권 안내"
  - "금융위원회·금융감독원 금융소비자보호법 안내 자료 (fsc.go.kr / fss.or.kr)"

