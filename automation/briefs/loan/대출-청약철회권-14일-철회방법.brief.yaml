human_notes: |
  차별화: '대출받았는데 후회된다'는 상황에서 중도상환(수수료 발생)과 청약철회권(수수료 없이
  취소)의 차이를 정면으로 대조하고, 14일 기산점(서류 수령일 vs 대출 실행일 중 나중 날)과
  '무엇을 돌려주고 무엇을 돌려받는지'를 표로 정리 — 다른 글이 '14일 안에 취소 가능'으로만
  뭉뚱그리는 지점을 세분화. 신용기록 삭제 효과는 청약철회권만의 실익이므로 강조.
  검수 포인트: 철회 가능 금액·건수 한도와 상품별 예외는 금소법 시행령 확정치로만 서술하고,
  '무조건 취소된다'식 단정 금지 — 기간·상품 요건 충족 시로 한정. 중도상환수수료 면제와
  혼동하지 않도록 [중도상환수수료] 글과 명확히 구분.
