must_cover:
  - 발급 평점 기준이 단일 점수가 아니라 두 갈래 택일 구조(상위 100분의 93 또는 장기연체가능성 1만분의 65 이하)이고 그 위에 카드사 공시 기준이 또 얹힌다는 점
  - 평점 기준을 아예 적용하지 않는 예외 3가지(결제능력 객관 입증·직불겸용 소액한도 카드·성년 미만 예외 발급)
  - 직불겸용 소액 신용결제 이용한도 월 최고 30만원(평점 기준 미달자의 우회 경로)
  - 연령 요건과 예외(민법상 성년 원칙, 재직 증명 18세 이상, 교통카드 목적 12세 이상, 자립지원 등 정책적 필요)
  - 결제능력 심사기준의 법정 구성 요소(소득·재산·채무, 처분가능소득 기반 월평균 결제능력)와 회원이 결제능력 변동 자료를 내면 적극 반영해야 하는 의무
  - 이용한도 책정 규칙(신청 범위 내 책정, 증액 권유 금지, 연 1회 이상 적정성 점검)
  - 2026-10-21 보증금 기반 비대면 신용카드 발급 서비스 혁신금융서비스 지정(신용이력 부족 계층 경로 추가)
  - "통념 바로잡기, 신용점수 특정 점수 이상이면 발급된다는 단정이 규정과 어긋나는 이유"

required_sources:
