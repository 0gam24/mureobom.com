human_notes: |
  차별화: 시중 글 대부분이 "NICE 몇 점·KCB 몇 점이면 발급"이라는 점수 커트라인을 제시하지만,
  규정 원문은 점수가 아니라 (1) 상위 100분의 93 또는 (2) 장기연체가능성 1만분의 65 이하 중
  택일 구조이고, 그 위에 카드사가 정해 공시하는 기준이 또 얹히는 3층 구조다. 더해서 평점 기준
  자체를 적용하지 않는 예외 3가지와 직불겸용 월 30만원 소액 신용결제 경로를 조문 단위로 짚는
  글이 없다. 점수 커트라인 수치는 화이트리스트 1차 출처로 확인되지 않으므로 절대 쓰지 않고,
  대신 "왜 점수 한 줄로 답할 수 없는지"를 정보 이득으로 만든다.
  기준일: 시행령·감독규정 모두 시행 2026-05-06 기준.
