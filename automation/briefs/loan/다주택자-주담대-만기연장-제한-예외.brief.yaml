human_notes: |
  차별화: "다주택자면 무조건 만기연장 불가"라는 통념을 3요건 교집합(주택 수·담보 소재지와 유형·만기 도래 시점)으로
  분해해, 지방 2주택 보유자가 지방 아파트 담보대출을 쓰는 경우처럼 제한을 받지 않는 조합까지 판정 가능하게 만드는 것.
  그리고 임차인 예외가 "임차인이 있으면 계속 연장"이 아니라 발표일(2026-04-01) 기준 유효한 임대차계약 종료일까지라는
  기준일 함정과, 주택 수에서 빠지는 예외(매도계약 체결 주택·어린이집·준공 후 미분양)를 명시하는 것.
  기존 글 중 loan/대출-연체-기한이익상실은 연체 이후 절차만, loan/주택담보대출-ltv-한도-규제지역은 신규 대출 한도만
  다루고 만기연장 제한은 어디에도 없음(만기연장 언급은 타 글에서 각 3회, 부수적). 본 글이 그 공백을 메운다.
  개별 대출 승인 여부는 금융회사 심사 사항이므로 단정 표현 금지, 예외 인정은 "심사 사항"으로만 서술.
