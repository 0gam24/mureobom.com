must_cover:
  - 적용 대상 3요건의 교집합 — 주택(소재지 무관) 2채 이상 보유 개인 또는 임대사업자(개인·법인) + 담보가 수도권·규제지역 아파트 + 만기연장 시점이 2026-04-17 이후
  - 주택 보유 수에서 빠지는 예외(매도계약이 체결된 주택, 어린이집, 준공 후 미분양주택 등 규제 적용이 곤란한 경우)
  - 임차인 예외의 기준일 함정 — 발표일(2026-04-01) 기준 유효하게 체결된 임대차계약의 종료일까지만 만기연장 허용
  - 법령상 의무·공익적 목적 등 불가피한 사유의 예외 허용과, 이것이 자동 적용이 아니라 금융회사 심사 사항이라는 점
  - 경과규정 — 발표일(2026-04-01)부터 시행일 전날(2026-04-16)까지 만기가 도래한 대출은 종전 규정 적용
  - 만기연장이 불허됐을 때 실제로 남는 선택지와 그 순서(상환 재원 확보·매도·담보주택 교체 여부 등)와, 만기에 상환하지 못하면 기한이익상실·연체로 넘어가는 경로
  - 같은 방안에서 함께 시행된 온라인투자연계금융업자 주담대 규제(2026-04-02, LTV 규제지역 40%·비규제지역 70%, 주택가격별 한도 6억/4억/2억)가 우회 경로를 함께 막은 구조

required_sources:
