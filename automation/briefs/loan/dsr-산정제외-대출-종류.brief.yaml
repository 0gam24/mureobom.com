human_notes: |
  차별화: 기발행 'dsr-계산-방법'(어떻게 계산하나)·'스트레스-dsr-3단계'(가산금리)와 달리
  '내 대출이 DSR 규제에 잡히는가 / 제외 대상은 무엇인가'를 목록형으로 정면으로 다룸.
  제외 대상은 규정 개정으로 바뀌므로 은행업감독규정 원문 기준을 명시하고, '제외=무조건 대출 가능'이
  아님을 강조(LTV·내부심사 별개). 개인별 한도·가부는 단정 금지, 취급 은행·감독규정 확인 안내.
