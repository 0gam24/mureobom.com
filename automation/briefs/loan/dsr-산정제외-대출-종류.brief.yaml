target_query: "DSR 안 잡히는 대출 DSR 산정 제외 대상 전세자금대출 중도금 서민금융"
search_intent: 정보형      # '내 대출이 DSR에 잡히나' 여부와 제외 대상 목록 확인 목적

signal:                   # topic-queue stale 대체 수동 선정 근사 추정치, 집계 수치만
  score: 57
  trend_momentum: 0.44
  question_volume: 0.5
  cluster_fit: 1.0        # loan boost 원값(1.0), 게이트 제외
  freshness: 0.6

must_cover:
  - DSR(총부채원리금상환비율) 규제의 근거(은행업감독규정 등 금융업권별 감독규정)와 '차주단위 DSR' 개념 한 줄 정리
  - DSR '산정 시 제외(예외)'되는 대출의 종류 목록 — 전세자금대출, 중도금·이주비 대출, 서민금융상품(햇살론·새희망홀씨 등), 300만원 이하 소액대출, 정책적 목적 대출, 재난·생계 관련 대출 등
  - '전액 제외'와 '원금만 분할 반영/장래소득 인정' 등 취급 차이 구분(전세대출은 원칙적 DSR 미산정, 일부는 산정에 포함되되 완화)
  - 규제 관점의 '제외'와 은행 내부심사·다른 규제(LTV·DTI)는 별개라는 점(제외라도 대출이 무조건 되는 건 아님)
  - 스트레스 DSR과의 관계 한 줄(제외 대상은 스트레스 금리 가산에서도 빠짐) — 상세는 기발행 글로 연결
  - 흔한 오해 바로잡기("전세대출도 DSR에 다 잡힌다", "제외되면 한도가 무제한이다")

required_sources:         # 공식 1차 출처만. WebFetch 화이트리스트 도메인. 0건이면 발행 차단
  - "은행업감독규정 별표(가계대출 등에 대한 리스크관리기준)·DSR 산정 방법 (국가법령정보센터 law.go.kr)"
  - "금융위원회 가계부채 관리·DSR 규제 보도자료·설명자료 (금융위원회 fsc.go.kr)"
  - "금융감독원 가계대출·DSR 안내 (금융감독원 fss.or.kr)"

