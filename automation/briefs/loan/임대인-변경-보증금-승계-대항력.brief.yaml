human_notes: |
  차별화: '누가 보증금 반환 의무자인가'에 집중 — 매매·상속·증여 시 임대인 지위 법정 승계(제3조 제4항) + 대항력 요건별 반환 청구 구조 + 승계 거부(이의) 예외 판례까지. 반환보증(HUG)·지급명령·확정일자 글과 겹치지 않게 '의무자 확정' 문제로 각도 고정.
  검수 포인트: (1) 대항력은 전입신고+점유 익일 0시 발생 — '전입신고 당일'로 쓰면 틀림. (2) '집 팔리면 종전 주인에게 받는다'는 통념 반박 필수, 승계가 원칙이고 종전 임대인은 면책됨. (3) 승계 거부 이의권은 판례 법리이므로 단정 표현 금지·"~할 수 있다는 판례" 톤 유지, 조문 인용은 2026 현행 기준으로 researcher가 재확인.
