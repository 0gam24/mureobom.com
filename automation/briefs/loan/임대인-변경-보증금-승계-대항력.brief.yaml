id: loan-임대인-변경-보증금-승계-대항력
cluster: loan
status: published       # compliance 전 게이트 통과 (KST 2026-07-29). _published_slugs.txt는 오케스트레이터가 일괄 추가

target_query: "전세 사는 중에 집주인이 바뀌면 보증금은 누구에게 받나 (임대인 지위 승계, 대항력)"
search_intent: 정보형     # 반환 의무자가 누구인지 원리 파악 + 대항력 확인 절차 병행

signal:                  # 스캐너 산출(읽기 전용, 원문 아님). 운영자 수동 선정 토픽
  score: 71.0
  trend_momentum: 0.58
  question_volume: 0.44
  cluster_fit: 1.0
  freshness: 0.60

must_cover:
  - 임대인 지위의 법정 승계 원리(주택임대차보호법 제3조 제4항) — 매매·상속·증여로 소유자가 바뀌면 새 소유자가 임대인 지위를 법률상 당연 승계
  - 대항력 요건(전입신고 + 주택 인도/점유)과 발생 시점(익일 0시), 대항력이 있어야 새 집주인에게 보증금을 주장할 수 있는 구조
  - 보증금 반환 의무자 판단 — 대항력 있으면 새 소유자(양수인)가 반환 의무자, 종전 임대인은 원칙적으로 면책되는 구조
  - 대항력이 없는 경우의 위험(전입 전 근저당·경매 시 배당 순위, 새 집주인에게 대항 불가)과 확정일자·우선변제와의 관계 구분
  - 임차인의 승계 거부(이의) 예외 — 소유권 이전 사실을 안 때부터 상당한 기간 내 이의를 제기하면 종전 임대인에 대한 계약 유지가 가능하다는 판례 법리
  - 흔한 오해 바로잡기 — "집이 팔리면 계약이 자동 해지된다/보증금을 종전 주인에게 받아야 한다"는 통념 반박, 소유권 이전등기부 확인 절차

required_sources:        # 공식 1차 출처(법령·정부·공단)만. 0건이면 발행 차단
  - "주택임대차보호법 제3조(대항력 등) 제1항·제4항 (국가법령정보센터 law.go.kr 조문)"
  - "법무부 주택임대차보호법 해설서(임대인 지위 승계·대항력 부분)"
  - "대한법률구조공단(klac.or.kr) 주택임대차 대항력·보증금 반환 안내"
  - "국토교통부 / 주택임대차분쟁조정위원회 임대인 변경 관련 안내"

