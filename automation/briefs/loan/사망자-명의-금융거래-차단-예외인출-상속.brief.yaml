human_notes: |
  차별화: 기발행 「상속채무 한정승인·상속포기」가 빚을 물려받을지 말지를 정하는 상속법 판단을
  다루는 반면, 이 글은 그 판단에 들어가기 전 며칠, 즉 사망신고 직후 계좌가 잠기는 구간에서
  유가족이 실제로 부딪히는 문제를 다룬다. 정보 이득의 축은 세 가지다.
  (1) 시점의 정확한 이동 — 지금까지 최대 2개월이던 차단 시차가 2026-09-11부터 '사망신고 다음 날'로
      바뀐다는 것, 그리고 그 이유가 정보 공유 주기(월 1회 → 매일 1회)와 대상 확대(일부 은행 →
      4,890개사)라는 두 축이라는 것.
  (2) 경계선 — 계좌가 '동결'된다고만 알려진 것과 달리 입금은 열려 있고, 치료비·장례비는 예외 인출로
      풀리되 현금 인출이 아니라 병원·장례식장 직접 이체 방식이라는 실제 작동 방식.
  (3) 검색자가 놓치는 부작용 — 자동이체 중단으로 인한 공과금·보험료 미납. 보도자료가 명시적으로
      경고한 항목인데 기사에서는 거의 다뤄지지 않는다. 사망신고 전에 납부방법을 옮겨 두라는
      행동 지침이 이 글의 실질적 값어치다.
  검수 포인트:
  - 시행일(2026-09-11), 4,890개사, 월 1회 → 매일 1회, 최대 2개월은 위 공동 보도자료 문구로만 표기.
    보도자료에 없는 수치(예외 인출 한도, 처리 기간, 차단 해제 소요일)는 절대 만들지 않는다.
  - '계좌 동결'·'재산 압류' 같은 표현으로 성격을 왜곡하지 않는다. 명의도용 방지 목적의 거래 차단이다.
  - 예외 인출은 '금융회사가 시행 중인 제도'로 보도자료가 서술한 범위까지만. 은행별 한도·서류 목록을
    구체적으로 적지 않는다.
  - 상속 절차 자체(한정승인·상속포기 기한, 상속세)는 기발행 글로 내부링크만 걸고 본문에서 재설명하지
    않는다. 카니발리제이션 방지.
  - 개인의 상속 사건에 대한 맞춤 자문으로 읽히지 않도록 일반정보 고지 유지.
  - 사망신고 자체의 기한·절차(1개월)는 보도자료가 언급한 범위(기한 1개월)까지만 인용한다.
