must_cover:
  - 무엇이 바뀌나 — 2026-09-11부터 「사망자 명의 금융거래 신속차단 시스템」 전면 가동, 사망신고 접수 다음 날부터 사망자 명의 금융거래 정지
  - 왜 지금인가 — 기존에는 행정안전부 사망자 정보를 한국신용정보원 통해 월 1회 공유, 사망신고 기한 1개월과 겹쳐 금융회사가 사망 사실을 확인하기까지 최대 2개월 걸리던 사각지대
  - 개선의 축 네 가지 — (1) 정보 제공 주기 월 1회에서 매일 1회, 거래 전 실시간 조회 후 즉시 차단 (2) 활용 금융회사가 은행 등 일부에서 은행·보험·카드·증권·저축은행·상호금융 등 모든 금융권 4,890개사로 확대 (3) 유가족의 별도 신청 없이 사망신고만으로 자동 처리 (4) 신용정보관리규약 개정으로 사망자 정보 목적 외 이용·제3자 제공 금지 및 금감원 상시 점검
  - 막히는 것과 막히지 않는 것의 경계 — 입금은 허용(상속인이 별도 채권 회수 절차를 밟는 불편 고려), 그 밖의 금융거래는 즉시 차단
  - 예외 인출 제도 — 치료비·장례비 등 긴급·불가피한 경우 가족관계증명서 등 관련 서류를 금융회사에 제출하면 예외적으로 인출 가능하되, 유가족 손에 현금으로 주는 방식이 아니라 병원·요양원·장례식장 등에 직접 이체하는 방식
  - 미리 손봐야 할 것 — 사망자 명의 계좌의 자동이체가 중단될 수 있으므로 공과금·보험료 납부방법을 미리 변경해 미납 불편을 피할 것
  - 상속재산 확인 경로 — 금융감독원 상속인 금융거래조회 서비스, 행정안전부 안심상속 원스톱 서비스
  - 유가족이 지켜야 할 순서 — 적법한 상속 절차를 거쳐 금융거래를 해야 한다는 원칙, 차단은 재산 압류가 아니라 명의도용 방지 장치라는 성격 구분
  - 공식 자료로 확인되지 않는 것의 구분 — 예외 인출의 한도 금액, 필요 서류의 금융회사별 목록, 차단 해제(상속 완료 후 명의변경) 소요 기간, 사망자 명의 대출의 만기·이자 처리는 이번 보도자료에 기술이 없음

