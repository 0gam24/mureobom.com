human_notes: |
  차별화: 기존 콘텐츠는 "금감원에 민원 넣으세요"에서 끝난다. 이 글은 금융소비자보호법
  제36~42조 + 시행령 제33~36조의 기한 사슬(30일→60일→20일)과, 소비자가 실제로 활용할 수
  있는 세 가지 레버 — 2천만원 이하 조정이탈금지(금융사가 먼저 소송 못 걺), 소송중지제도,
  신청만으로 생기는 시효중단 — 를 조문 근거와 예외 단서까지 붙여 정리한다. 특히 시행령
  제33조④의 "보완 2회 이상 불응·직접 이해관계 없음" 회부 거절 사유와 법 제42조 단서
  (60일 내 조정안 미제시 시 금지 해제)는 일반 콘텐츠에 거의 없는 정보 이득 지점.
  loan 101편 대조 결과 위법계약해지권·청약철회권·금리인하요구권과 검색의도 분리 확인.
