human_notes: |
  차별화: 기존 발행 글(신용회복위원회-채무조정 / 프리워크아웃-개인워크아웃-차이-조건 / 개인회생-신청-자격-절차)은 모두 "제도별 자격과 감면 조건"을 다룬다. 이 글은 제도가 아니라 **창구 라우팅**을 다루는 유일한 각도다. 즉 "지금 어느 번호를 누르고, 누르면 무엇이 자동으로 이어지는가"를 1375·1397·1332·132·109·129 여섯 번호의 역할 분담표로 확정한다. 2026년 10월 29일 개통으로 이 지도가 막 바뀐 시점이라 어디에도 정리된 곳이 없다.
  가장 강한 정보 이득: 통화료 부담 주체의 차이(1375는 수신자=신복위 부담, 1332는 발신자 부담)와 연계 방향(1397·1332·132는 양방향, 109·129는 1375로 들어오는 단방향). 둘 다 1차 출처 문구로 확정했고, 방향을 반대로 적은 2차 정보가 돌기 쉬운 지점이다.
  반드시 지킬 것: 보도자료에 없는 수치·시간은 쓰지 않는다. 특히 (1) 1332·1397·132의 운영시간은 확인되지 않았으므로 쓰지 않는다(오래된 기사에 평일 20시·토요일 13시 등이 돌지만 1차 출처 미확인), (2) 번호 "1375"의 숫자 풀이(13=일상, 75=치료)는 보도자료 본문에서 확인되지 않았으므로 별칭 "일상치료"까지만 쓴다, (3) 심층상담 소요시간이 일반 상담의 몇 배라는 수치는 리서치에서 1차 출처로 재확인되지 않으면 생략한다.
  카니발리제이션 검사(2026-11-01): src/content/answers/*.md 전수에서 "1375" 언급 0건. 1397은 8개 글, 1332는 10개 글에 모두 "문의처" 각주로만 등장하고, 번호 간 역할 분담이나 연계 구조를 다룬 글은 없다. 검색의도("어디로 전화")가 기존 글("내가 자격이 되나")과 분리되므로 통과.
  단정 금지: 전화 한 통으로 채무가 조정된다·면책된다는 표현 금지. 1375는 접수·연계 창구이며 결과는 제도별 심사에 달렸다는 조건부 서술만.
  문체: 긴 줄표 금지, 화살표는 연계 방향 표기에 꼭 필요한 1회만, 체크리스트 블록 1개 이하. 결론은 본문 재나열이 아니라 "지금 걸 번호 하나를 고르는" 행동 계획으로 닫는다.
