must_cover:
  - 개통 사실의 정확한 시점 — 2026년 10월 29일(목) 정식 개통, 그 전 10월 1일~28일은 시범운영. 운영 주체는 신용회복위원회, 금융위원회가 함께 개통식을 열었다. 보도자료가 번호에 붙인 별칭은 "일상치료"
  - 운영시간은 평일 09:00~18:00 — 주말·야간 대응 방식은 보도자료에 없으므로 쓰지 않는다
  - 통화료 부담 주체가 핵심 차이 — ☎1375는 "채무자의 경제적 부담을 고려하여 통화료는 수신자(신용회복위원회)가 부담", 반면 금융감독원 콜센터 ☎1332는 금감원 안내상 "유료, 통화료 발신자 부담". 돈이 없어 전화를 망설이는 상황에서 이 차이가 실질적으로 의미하는 것
  - 양방향 연계 3곳 — 서민금융진흥원 ☎1397(정책서민금융), 금융감독원 ☎1332(금융소비자보호), 대한법률구조공단 ☎132(법률지원). 보도자료 표현은 "양방향 연계 상담체계"로, 전화를 끊고 다시 걸지 않아도 연결된다는 점
  - 단방향 연계 2곳 — 자살예방상담전화 ☎109, 보건복지상담센터 ☎129에서 ☎1375로만 연결되는 구조(☎109, ☎129 → ☎1375). 방향이 한쪽이라는 사실을 반대로 적지 않도록 주의
  - ☎1375 한 통으로 접수되는 범위 — 신속채무조정·사전채무조정·개인워크아웃 등 금융채무 조정, 통신·공공요금 채무조정, 개인회생·파산 신청지원(법원·대한법률구조공단 연계 패스트트랙 및 신속면책), 불법사금융 피해 원스톱 신고·지원, 금융·고용·복지 연계, 복합위기 상황의 심층상담 전담팀 연계
  - 연체 전에 걸어도 된다는 점 — 보도자료는 "연체 전에도 지원받을 수 있는 신속채무조정제도를 안내하고, 채무문제가 심화되기 전 ☎1375를 통한 조기 상담의 중요성을 강조"했다. 연체가 시작된 뒤에만 상담 대상이 된다는 흔한 오해를 1차 출처로 교정
  - 시범운영 실적 수치 — 전체 콜센터 상담실적이 전월 동기('26.9월) 대비 13.9% 증가, 전년 동기('25.10월) 대비 13.2% 증가했고, 전체 실적 중 ☎1375를 통해 들어온 상담은 25% 수준
  - 경계 정리 — ☎1375는 상담·접수·연계 창구이고 채무조정 승인 기관이 아니다. 감면율·자격은 제도별 심사로 갈린다는 조건부 서술만 하고, 전화하면 빚이 줄어든다는 식의 단정은 금지
  - 번호를 고르는 기준표 — 정책서민금융 상품 문의는 1397, 금융회사와의 분쟁·불법사금융 신고는 1332, 소송·법률구조는 132, 채무 자체를 정리하고 싶으면 1375로 시작하는 것이 왜 효율적인지(어디로 걸어도 양방향 연계로 넘어가지만 접수 주체가 달라진다)

required_sources:
