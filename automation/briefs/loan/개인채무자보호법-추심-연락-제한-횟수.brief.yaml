human_notes: |
  차별화: 2024-10-17 시행 개인채무자보호법의 '7일 7회' 추심 연락 총량 제한을 정면으로 다룸.
  기발행 '채무조정요청권'(같은 법 다른 조항)·'불법채권추심-대응'(채권추심법 일반)과 조항·질문 의도 구분.
  '연체=무제한 독촉'이라는 통념을 법정 횟수 제한으로 반박. 채무조정 중 추심 제한과 연결.
  법정 횟수·유예 사유는 조문 그대로 인용하고 단정적 조언(무조건 갚지 마라 등) 금지.
