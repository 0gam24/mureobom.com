human_notes: |
  차별화: "고의·중과실 예외" 판단 기준을 표로 정리 — 어떤 경우 회원이 부담하고 어떤 경우 카드사가 보상하는지 케이스 구분. 비밀번호 유출=무조건 회원부담이라는 통념 반박.
  신고 전 소급 보상 기간(신고접수일 기준 60일)과 신고 후 책임 이전을 명확히.
  법정 문구는 여신전문금융업법 원문 조문으로 대조. 카드사별 약관 차이는 "일반 원칙" 프레임으로만.
