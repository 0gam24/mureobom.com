human_notes: |
  차별화: 기발행 보증금 글 6편은 모두 "얼마를 받는지"(소액임차인 한도·주택가액 1/2)와
  "누가 먼저 받는지"(당해세·대항력·확정일자 순위)를 다룬다. 이 글은 그 앞단의 절차 기한만
  파고든다 — 우선변제권이 있어도 배당요구 종기를 놓치면 배당 자체에서 제외된다는 구조
  (제148조 제2호)와, 법원의 채권신고 최고 대상(제84조 제4항 → 제148조 제3·4호)에
  등기 없는 임차인이 포함되지 않아 '법원이 알아서 챙겨주지 않는다'는 점이 핵심 정보 이득.
  여기에 기존 325편이 전혀 다루지 않은 공매 트랙(국세징수법 배분요구 종기 = 최초 입찰서
  제출 시작일 이전, 배분요구한 채권에만 배분)을 병렬로 붙여 "경매면 법원, 공매면 세무서"
  라는 행동 분기를 만든다.

  카니발리제이션 검사 (2026-10-09 KST): _published_slugs.txt 327건에 '배당요구'·'배분요구'
  슬러그 0건. 본문 기준으로 '배당요구종기'·'권리신고' 등장 0편, '배당요구'는
  소액임차인-최우선변제-기준 1편에서만 요건 불릿으로 스치듯 언급(종기 산정·제출 방식·
  최고 구조·공매 배분요구는 전무). 검색의도가 '얼마'(정보형)에서 '언제까지 어떻게'(절차형)로
  갈라지므로 각도를 좁힌 롱테일로 허용.

