must_cover:
  - 배당요구 종기를 누가 언제 정하는가 (민사집행법 제84조 제1항·제3항 — 첫 매각기일 이전, 압류 효력 발생부터 1주 이내 결정·공고)
  - 종기까지 배당요구하지 않으면 배당에서 빠진다 (제148조 제2호 — 배당받을 채권자의 범위)
  - 법원이 임차인에게 채권신고를 최고하지 않는 구조 (제84조 제4항은 제148조 제3·4호 대상 / 등기 없는 확정일자 임차인은 제2호)
  - 배당요구의 방식 (민사집행규칙 제48조 — 채권 원인·액수 적은 서면 + 자격 소명 서면 첨부)
  - 확정일자 임차인·소액임차인이 배당요구 자격자인 근거 (민사집행법 제88조 제1항 우선변제청구권자 / 주택임대차보호법 제3조의2 제2항·제8조 제1항)
  - 종기가 지나면 철회도 못 한다 (제88조 제2항) + 법원이 특별히 필요하면 연기 가능 (제84조 제6항)
  - 등기된 전세권자는 배당요구하면 전세권이 소멸한다 (제91조 제4항 단서) — 인수와 배당 중 선택 문제
  - 보증금을 다 못 받은 대항력 있는 임차권은 경락으로도 소멸하지 않는다 (주택임대차보호법 제3조의5 단서)
  - 배당금 수령에는 임차주택 인도가 전제 (주택임대차보호법 제3조의2 제3항)
  - 공매는 경매와 절차가 다르다 (국세징수법 제72조 제1항 제7·8호·제4항 배분요구 종기 = 최초 입찰서 제출 시작일 이전 / 제76조 제1항 제4호 / 제96조 제1항 단서 — 배분요구한 채권에만 배분)
  - 배당표 확인·이의 기한 (민사집행법 제149조 제1항 배당기일 3일 전 비치 / 제151조 이의)

