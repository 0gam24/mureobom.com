human_notes: |
  차별화: 이름만 비슷한 '카드포인트 통합조회(여신금융협회)'와 '파인(금융감독원)' 경로를 구분해 안내 + 유효기간 5년 카운트다운 관점 + '자동 현금화 아님, 직접 신청' 강조.
  카드사별 세부 약관(적립·소멸 기준) 차이는 단정 금지 — 일반정보 고지로 처리하고 '가입 카드사 약관 확인' 안내.
  유효기간은 적립일 기준 5년(카드사별 상이 가능) 최신 기준 명시.
  "포인트는 어차피 다 사라진다 / 알아서 현금으로 들어온다"는 통념은 반박 단락으로 바로잡기.
