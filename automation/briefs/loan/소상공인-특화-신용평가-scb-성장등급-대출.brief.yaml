must_cover:
  - SCB(소상공인 특화 신용평가)가 기존 신용평가와 다른 지점 — 금융거래 이력 대신 매출·업종·상권 등 비금융정보로 미래 성장성을 평가
  - 평가 대상 요건 — 상시근로자 5인 미만(제조·건설·운수업 10인 미만)이면서 3년 평균매출액 15~140억원 이하 소기업, 적용 범위 약 790만개 사업체
  - 성장등급 10등급 체계 — 우수(S1·S2), 양호(S3·S4), 보통(S5·S6), 미흡(S7~S9), 취약(S10)
  - 산출 구조 — 신용정보원 계량모형이 S등급 산출, CB사 비계량모형이 가점 부여, 신용정보원·나이스평가정보가 모형 개발·검증
  - 어느 은행에서 언제부터 — 8/31 개시 8개(국민·기업·농협·부산·신한·우리·제주·하나), 연말까지 8개 추가(경남·광주·수협·iM·전북·카카오·케이·토스), 16개 은행 2.2조원 목표
  - 실제로 무엇이 달라지나 — 금융위 공개 사례 기준 등급 상향에 따른 승인, 한도 확대, 금리 감면 폭(0.7%P·1.0%P)
  - 4월 도입방안(7개 은행·약 1.8조원 계획)과 9월 실제 시행(16개 은행·2.2조원)의 시점별 변화를 사실 나열로 대조
  - 공개 자료로 확인되는 것과 확인되지 않는 것의 구분 — 등급별 금리·한도 연동 규칙, 소상공인의 별도 신청 절차, 은행별 적용 상품명은 두 보도자료에 없음
  - 향후 일정 — 2027년 하반기까지 약 1년 시범운영 후 운영성과 분석, 제2금융권·정책금융기관 확대 독려

