human_notes: |
  차별화: 기발행 「소상공인 정책자금」이 정부 융자 신청 절차를 다룬 반면, 이 글은 시중은행 일반
  대출 심사에서 등급이 산출되는 방식 자체가 바뀐 새 제도를 다룬다. 축은 두 가지다. (1) 8월 31일
  이미 가동됐다는 시점 사실과 어떤 비금융 데이터가 S등급을 만드는지의 산출 구조, (2) 공개 자료로
  확인되는 범위와 확인되지 않는 범위를 명시적으로 갈라 주는 것. 등급-금리 연동 규칙이나 신청
  절차처럼 검색자가 가장 알고 싶어 하지만 두 보도자료에 없는 항목을 "없다"고 정확히 알려 주는
  것이 이 글의 정보 이득이다.
  검수 포인트 (researcher 정정 반영):
  - 은행 명단·시행일·등급 표기·공급 규모는 2026-09-02, 2026-04-09 보도자료 문구로만 확정 표기.
  - 금리 감면 0.7%P·1.0%P는 금융위가 공개한 개별 사례임을 명시하고 일반화·보장 표현 금지.
    사례 1은 "거절"이 아니라 "7등급에서 6등급 상향, 대출 승인"까지만 서술.
  - "등급이 오르면 대출된다" 식 단정 금지. 성장등급은 심사 요소 중 하나라는 프레임 유지.
  - 대상 요건의 매출액 구간은 업종별로 다른 소기업 기준이므로 단일 숫자로 단정하지 않고,
    업종별 개별 금액은 미확인이므로 쓰지 않는다.
  - 상시근로자 기준을 법령으로 설명할 때는 소상공인기본법 시행령 제3조 표기(광업 포함)를 따르고,
    보도자료를 인용할 때만 보도자료 표기(광업 생략)를 쓴다.
  - "자동 적용된다"·"별도 신청이 필요 없다"는 근거 없음. 단정 금지, 사실 서술까지만.
  - 소진공 정책자금과의 차이는 공식 근거 없음. 단정 비교 금지, 내부링크 안내까지만.
