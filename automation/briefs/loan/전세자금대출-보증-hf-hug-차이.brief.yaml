human_notes: |
  차별화: '전세대출 보증(대출 실행용)'과 '전세보증금 반환보증(떼임 방지)'을 혼동하는 독자 교정 표 필수.
  같은 HUG 안에서도 전세금안심대출보증(대출+반환 결합)과 순수 반환보증이 구분됨을 명확히.
  SGI서울보증 등 민간 보증은 '존재한다' 수준의 일반 언급만(공식 출처 미확보로 구체 수치·요건 주장 금지).
  보증료·한도는 '보증금·기간·신용·지역·주택수에 따라 산정/조정'이라는 원문 근거로 단정 회피.
  브랜드 팔레트 인포그래픽 1개 필수(대출용 보증 vs 반환보증 구분 흐름도).
