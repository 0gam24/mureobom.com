  - 전세자금대출은 대부분 보증기관 보증서를 담보로 실행된다는 구조
  - HF(한국주택금융공사) 전세자금보증의 성격(보증대상·한도·보증료 개념)
  - HUG(주택도시보증공사) 전세금안심대출보증(대출용 보증) 구조
  - '대출 실행용 보증'과 'HUG 전세보증금반환보증(보증금 떼임 방지)'의 구분
  - HF·HUG 비교표(보증대상·한도·보증료 개념, 조건별 변동)
  - 흔한 오해(어떤 보증이 적용되는지는 소비자 임의 선택이 아니라 상품·소득·주택 조건으로 정해진다)

