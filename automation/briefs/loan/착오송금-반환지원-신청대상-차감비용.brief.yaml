must_cover:
  - 제도의 위치 — 예금보험공사가 돈을 대신 물어주는 보상 제도가 아니다. 공사가 송금인의
    수취인에 대한 부당이득반환채권을 매입해 대신 회수해 주는 구조이고, 회수되지 않으면
    돌려받는 금액도 없다. 이 구조를 「예금자보호법」 제39조의2 제1항 문언으로 확인
  - 반드시 먼저 거쳐야 하는 단계 — 송금한 금융회사를 통한 사전 반환청구가 선행 요건이다.
    은행 반환청구로 수취인이 돌려주면 회수 관련 비용 차감 없이 전액 돌아오므로, 지원 신청은
    그 절차가 막힌 뒤의 2차 경로라는 순서를 분명히 한다
  - "신청 대상을 가르는 3가지 축 — (1) 금액 기준은 건당 5만원 이상 1억원 이하,
    (2) 기간 기준은 착오송금일로부터 1년 이내(착오송금일 제외),
    (3) 상태 기준은 착오송금과 관련해 법적 절차가 진행 중이지 않을 것"
  - 어떤 송금 수단이 대상인가 — 「예금자보호법」 제2조제9호의 '착오송금' 정의와
    같은 법 시행령 제3조의2가 자금으로 보는 전자지급수단의 범위를 「전자금융거래법」
    제2조제14호 선불전자지급수단으로 한정한다는 점. 계좌 간 이체뿐 아니라 선불충전금
    송금도 정의에 들어온다는 구조를 조문 단위로 설명(개별 서비스명 단정은 금지)
  - 착오송금의 정의가 좁다는 점 — 제2조제9호는 '수취금융회사, 수취계좌번호 등을 잘못 기재하거나
    입력하여 자금이 이동된 거래'다. 금액을 잘못 입력한 경우, 거래 상대를 착각해 정상 입력한 경우처럼
    정의 경계에 있는 사안은 단정하지 말고 공사 판단 사항으로 안내
  - 보이스피싱·사기 피해금은 이 제도의 경로가 아니라는 구분 — 전기통신금융사기 피해는
    지급정지·피해금 환급 절차가 따로 있다. 두 제도를 섞어 신청하면 시간만 잃는다
  - 실제로 손에 들어오는 금액 — 회수에 든 비용(우편 안내 등 실비)을 차감한 뒤 지급된다는 점.
    구체 항목·요율은 1차 출처에서 확인된 범위까지만 쓰고, 확인 못 한 수치는 쓰지 않는다
  - 공사가 쓸 수 있는 수단과 그 한계 — 제39조의2 제1항이 회수 방법에서 '소송'을 제외한다.
    실제 절차는 자진반환 권유에서 멈추지 않고 미반환 시 법원 지급명령(독촉절차)까지 나아가지만,
    수취인이 지급명령에 이의를 제기해 소송으로 넘어가는 단계는 공사가 대신하지 않는다.
    "공사는 반환 안내만 하고 끝난다"는 서술은 사실과 다르므로 금지(research C-01)
  - 공사가 수취인을 찾아내는 근거 — 제39조의3이 금융실명법 제4조에도 불구하고 수취인
    실지명의·주소·연락처, 전기통신사업자에 대한 휴대전화번호 제출 요구까지 허용한다.
    개인이 직접은 얻을 수 없는 정보라 제도를 쓰는 실익이 여기서 나온다
  - 매입 이후 다툼이 생기면 — 제39조의2 제1항 단서의 매입계약 해제 가능성
  - 흔한 통념 바로잡기 — "예보가 대신 물어준다", "은행에 말하면 바로 빼서 돌려준다",
    "보이스피싱도 같은 창구다", "1년은 넉넉하다", "전액 그대로 돌아온다"

required_sources:         # 공식 1차 출처만. WebFetch 화이트리스트 도메인. 0건이면 발행 차단
  - "예금자보호법 제39조의2(매입대상 등) (국가법령정보센터 law.go.kr)"
  - "예금자보호법 제39조의3(관계기관등의 협조) (국가법령정보센터 law.go.kr)"
  - "예금자보호법 제2조제9호·제10호 정의 (국가법령정보센터 law.go.kr)"
  - "예금자보호법 시행령 제3조의2(자금으로 보는 전자지급수단의 범위) (국가법령정보센터 law.go.kr)"
  - "금융거래 이용 — 착오송금 반환 (법제처 찾기쉬운 생활법령정보 easylaw.go.kr)"

