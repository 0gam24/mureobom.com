target_query: "착오송금 반환지원 신청 대상 금액 기한 차감 비용"
search_intent: 절차형      # "계좌번호를 잘못 눌러 돈이 넘어갔는데, 예보 반환지원을 쓸 수 있는 건가 / 얼마나 돌려받나"

signal:                   # topic-queue stale(2026-06-11 생성) → WebSearch 폴백 수동 선정, 집계 수치만
