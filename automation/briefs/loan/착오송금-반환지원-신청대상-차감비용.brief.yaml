human_notes: |
  차별화: 기발행 308편에서 "착오송금" 문자열이 0건이다(grep -il 확인). 인접 4편과 검색의도가
  겹치지 않는다. loan/보이스피싱-피해금-지급정지-환급-신청은 전기통신금융사기 피해금 환급이고,
  loan/사망자-명의-금융거래-차단-예외인출-상속은 사망자 계좌, loan/한도제한계좌-해제-조건-필요서류는
  신규 계좌 한도, loan/여신거래-안심차단-신청-해제-차단범위는 대출 실행 차단이다. 이 글은
  '내가 잘못 보낸 돈'이라는 별개 사안이다.
  핵심 정보 이득 3개 — 대중 설명글이 "5만원~1억원, 1년 이내"에서 멈춰 있어 다음이 비어 있다.
  (1) 이 제도가 보상이 아니라 부당이득반환채권 매입·회수라는 점, 그리고 회수가 자진반환 권유에서
      끝나지 않고 지급명령까지 가되 그 다음 소송 단계는 공사가 대신하지 않는다는 경계선.
      회수되지 않으면 지급액도 없다는 구조를 밝히는 글이 거의 없다.
  (2) 대상이 되는 '자금'의 범위가 시행령 제3조의2로 선불전자지급수단까지 한정돼 있다는 조문 구조.
  (3) 제39조의3이 금융실명법 제4조를 뚫고 수취인 실지명의·주소·휴대전화번호까지 확보할 수 있게
      한다는 점. 개인이 직접 못 하는 일을 대신해 주는 것이 이 제도의 실익이라는 설명.
  검수 포인트:
  - 5만원 이상 1억원 이하, 착오송금일로부터 1년 이내(착오송금일 제외), 법적 절차 진행 중이 아닐 것,
    금융회사 사전 반환절차 선행은 법제처 easylaw.go.kr 표현 범위를 넘지 않는다.
  - 상한 1억원은 종전 5천만원에서 상향된 값이다. 상향 시점을 1차 출처로 확인하지 못하면
    시점을 쓰지 말고 현재 기준만 서술한다. 정보 기준일을 본문에 명시한다.
  - 차감 비용은 '우편 안내 등 회수에 든 비용을 차감한 뒤 지급'이라는 구조까지만 쓴다.
    요율·금액표는 1차 출처에서 확인되지 않으면 쓰지 않는다.
  - 「착오송금 반환지원 등에 관한 규정」 제10조·제12조는 easylaw가 근거로 인용하지만
    조문 전문을 화이트리스트 도메인에서 확인하지 못했다. 확인 못 하면 조문 번호를 본문에
    인용하지 말고 easylaw 설명 범위로만 서술한다.
  - 개별 사안 단정 금지. "당신 건은 대상이다/아니다" 대신 판단 주체가 공사라는 점과
    확인 경로를 안내하고 일반정보 고지를 유지한다.
  - 특정 간편송금 서비스명을 대상/비대상으로 단정하지 않는다. 시행령이 정한 범주(선불전자지급수단)
    까지만 서술한다.
  - 금액을 잘못 입력한 경우가 정의에 포함되는지는 확인되지 않았다. 단정하지 말고 경계 사안으로 서술.
  - 카니발리제이션 대조 완료: _published_slugs.txt loan 40건 + grep -il "착오송금" 0건.
