id: loan-채무조정-성실상환자-소액대출-자격-한도
cluster: loan
status: published      # compliance 전 룰(O·K·F·L·A·M·D·AD·E·V·SH·W) 통과 (2026-09-28 KST). 승인: 클라우드 루틴 '06 mureobom (07:00)' 실행 = 운영자 사전 전권 승인(2026-09-02)

target_query: "채무조정 중에 대출 받을 수 있나요 신용회복위원회 소액금융 성실상환자 자격 한도"
search_intent: 절차형

signal:
  score: 0.0
  trend_momentum: 0.0
  question_volume: 0.0
  cluster_fit: 1.0
  freshness: 0.7

must_cover:
  - 채무조정 중에 제도권에서 열리는 거의 유일한 신규 대출 창구가 신용회복위원회 소액금융이라는 위치 설명, 그리고 그 문이 열리는 기준이 변제금 6개월 이상 성실상환 또는 상환 완료 후 3년 이내라는 점
  - 대상이 신복위 채무조정에 한정되지 않고 법원 개인회생 변제계획 이행자, 금융회사 자체 채무조정 약정 이행자까지 포함된다는 점
  - 용도별로 한도와 금리가 갈리는 구조 — 생활안정자금 1,500만원 이내 연 4% 이내, 고금리차환자금·시설개선자금·운영자금·학자금 각 1,000만원 이내 연 2% 이내, 모두 5년 이내 원리금균등분할
  - 비대면 신청 한도가 성실상환 기간으로 갈리는 함정 — 6~11개월은 300만원, 12개월 이상은 1,000만원
  - 신청제한 사유 6가지, 특히 최근 6개월 이내 신규 채무 발생자와 채무조정 이후 신규 채무 과다 발생자가 배제된다는 점(급한 마음에 카드론을 먼저 쓰면 이 창구가 닫히는 순서 문제)
  - 고금리차환자금의 요건 — 신청일 기준 6개월 이전에 발생한 연 18% 이상 고금리 신용대출 상환 용도
  - 특별 대출 갈래 — 새도약론(2018-06-19 이전 발생 7년 이상 장기연체 후 채무조정 확정 6개월 이상 상환자, 생활안정·고금리차환·시설개선·운영 각 1,500만원 연 3~4%, 학자금 1,000만원 연 2%), 새희망힐링론(보이스피싱·불법사금융 등 피해자, 500만원 이내 연 3% 이내, 24개월 성실납입 시 연 2%)
  - 신용교육원 온라인 교육 이수(신청일 기준 2개월 이내) 0.1%p 우대금리
  - 신청 경로와 서류 — 비대면(cyber.ccrs.or.kr·앱, 인증서 필요) 또는 지부 방문, 주민등록등본(최근 2개월)·본인확인서류·소득증빙(근로소득자 급여명세서 최근 3개월 등 / 자영업자 사업자등록증명원·소득금액증명원 등), 상담 1600-5500 평일 09~18시
  - 소액대출 외에 성실상환으로 함께 열리는 창구들의 존재(공공정보 조기해제, 일시완제 추가감면, 전세자금 특례보증, 소액 신용·체크카드는 12회차 이상, 체납 건강보험료 지원 등) — 목록 수준으로만 안내하고 각 요건은 신복위 확인 사항으로 처리
  - 승인 여부·금액은 상환여력 심사 결과이므로 자격을 충족해도 확정이 아니라는 점

