human_notes: |
  차별화: "채무조정 들어가면 대출은 끝"이라는 통념을 뒤집되, 열리는 문의 폭을 정확히 재는 것 — 6개월이라는
  시점 기준, 용도별로 1,500만원/연 4%와 1,000만원/연 2%로 갈리는 두 갈래, 그리고 같은 자격이라도 비대면
  신청 한도가 성실상환 6~11개월 300만원 vs 12개월 이상 1,000만원으로 3배 차이 나는 지점까지 판정 가능하게 만든다.
  핵심 실무 함정은 순서 문제다. 급전이 필요해 카드론·대출을 먼저 쓰면 '최근 6개월 이내 신규 채무 발생자'
  신청제한에 걸려 이 창구가 닫힌다. 어떤 기존 글도 이 순서를 다루지 않는다.
  기존 글 대조: loan/프리워크아웃-개인워크아웃-차이-조건은 채무조정 진입 요건만, loan/개인회생-신청-자격-절차는
  법원 절차와 변제금 산정만, loan/소액생계비대출-자격-한도는 채무조정과 무관한 신용 하위 20% 대상 상품,
  loan/최저신용자-특례보증-자격은 햇살론 계열 보증 상품. '성실이행'·'성실상환자 대출' 검색의도를 해결한 글은
  315편 중 0편이며 '소액신용카드'·'새도약론'은 전 코퍼스에 없다. 본 글이 그 공백을 메운다.
  주의: 승인·금액은 상환여력 심사 결과이므로 "받을 수 있다" 단정 금지. 재원이 기부금·지자체 차입금이라
  예산 소진 가능성도 확정 표현을 피할 근거. 개별 채무 상황 자문으로 읽히지 않게 일반정보 고지 유지.
