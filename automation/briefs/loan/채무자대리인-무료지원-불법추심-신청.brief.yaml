human_notes: |
  차별화: 이미 발행된 '불법채권추심-대응-금지행위-신고'는 무엇이 불법 추심이고 어떻게 신고하는지에 초점.
  이 글은 '채무자대리인 무료 지원 제도'라는 별도 프로그램(무료 변호사 선임 → 채권자 연락을 대리인이 대신 받음)의 대상·신청·효력에 초점. 두 글의 본문 겹침 최소화 위해 신고 절차는 내부링크로 넘기고 제도 메커니즘 중심으로 서술.
  '무료'라는 핵심 사실과 '채무가 없어지는 제도가 아님'을 명확히. 단정적 채무면제 표현 금지.
  제8조의2 효력(대리인 선임 통지 후 채무자 직접 연락 금지)이 이 제도의 실질 핵심 — 반드시 조문 기준으로 정확히.
