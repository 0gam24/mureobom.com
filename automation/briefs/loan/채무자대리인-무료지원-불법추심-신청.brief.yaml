id: loan-채무자대리인-무료지원-불법추심-신청
cluster: loan
status: approved         # 스케줄 자동 발행 = 운영자 즉석 승인(큐 stale)

target_query: "채무자대리인 무료 지원 신청 대상 불법추심 대부업 대응 변호사"
search_intent: 절차형     # 지원 대상 확인 + 신청 절차를 함께 원함

signal:                  # 수동 선정(큐 stale) — 실측 시그널 없음
  score: 0
  trend_momentum: 0.0
  question_volume: 0.0
  cluster_fit: 0.0
  freshness: 0.0

must_cover:
  - 채무자대리인 제도의 정의(채무자를 대신해 채권추심자의 연락·방문을 받는 대리인을 무료로 선임해 주는 정부 지원 사업)와 근거(채권의 공정한 추심에 관한 법률 제8조의2 대리인 선임 통지 효력)
  - 지원 대상(불법 사금융·미등록 대부, 법정최고금리 초과, 불법 채권추심 피해 등)과 소득 요건 여부, 지원 내용(대리인 선임비·소송 대리 비용 무료 지원 범위)
  - 신청 방법(금융감독원 불법사금융 통합신고센터 1332, 서민금융통합지원센터 방문·전화, 온라인 접수)과 준비 서류·처리 흐름
  - 채권추심법상 채무자대리인 선임 후 채권추심자가 채무자에게 직접 연락하면 위반이라는 점(제8조의2), 위반 시 제재
  - 불법 채권추심 자체의 금지행위(폭행·협박, 반복 연락, 야간 연락, 관계인 압박 등)와의 관계 — 신고와 대리인 지원은 별개 트랙임을 구분
  - 흔한 오해(유료인 줄 안다 / 모든 채무에 적용되는 줄 안다 / 채무가 사라지는 제도로 오해) 교정

required_sources:        # 공식 1차 출처만. 0건이면 발행 차단
  - "채권의 공정한 추심에 관한 법률 제8조의2(대리인 선임 시 채무자에 대한 연락 금지) 및 제9조(금지행위) (국가법령정보센터 law.go.kr)"
  - "대부업 등의 등록 및 금융이용자 보호에 관한 법률(법정최고금리·불법추심 관련) (국가법령정보센터 law.go.kr)"
  - "금융감독원 (fss.or.kr) — 불법사금융 대응 및 채무자대리인·소송변호사 무료 지원 안내"

