human_notes: |
  차별화: 대상별(생계·의료급여 / 주거·교육급여 / 차상위 / 기초연금) 감면 금액 차등을 기본감면+통화료 감면 구조 표로 분해 + 이동전화·시내전화·초고속인터넷 적용 범위 + 복지로·정부24·통신사·유선(☎)·행복e음 연계 신청 경로 + 세대 합산·자동 소급 여부까지 한 글로 통합.
  검수 포인트 1: 감면 금액은 2026년 기준으로 명시. 대상별 상한(기본감면·통화료 감면율)이 제도별로 달라 최신 수치 대조 필수.
  검수 포인트 2: '기초연금 수급자 통신비 감면'은 저소득층 감면과 별개 트랙(감면액 다름). 둘을 뭉뚱그리지 말 것.
  검수 포인트 3: '자동으로 감면된다'는 흔한 오해 — 신청 시점부터 적용, 소급 없음. 알뜰폰(MVNO) 적용 여부는 사업자별로 갈리므로 단정 금지.
