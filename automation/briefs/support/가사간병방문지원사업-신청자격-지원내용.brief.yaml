human_notes: |
  차별화: 노인맞춤돌봄(65세 이상)·장애인활동지원과 헷갈리는 지점을 '만 65세 미만 저소득
  취약계층'이라는 대상 기준으로 명확히 갈라주는 것이 핵심. 대상 유형(장애인·중증/희귀난치질환·
  소년소녀가정·조손·한부모 등)과 월 서비스 시간 등급, 소득별 본인부담 차등을 표로 정리.
  이미 발행된 의료급여(insurance)·노인맞춤돌봄(support)과 주제가 겹치지 않는지 재확인 완료.
  검수 포인트: 본인부담·서비스 시간 수치는 복지부/전자바우처 현행 기준으로만, 연도 명시.
  자격은 소득·재산 및 욕구조사로 결정됨을 밝히고 '무조건 받는다'식 단정 금지. 일반정보 고지 유지.
