human_notes: |
  차별화: 휴직(연 90일) vs 휴가(연 10일)를 한 표로 구분 + '무급'이라는 핵심 오해 교정 + 사업주 거부 가능 예외사유 명시.
  이 제도는 무급이므로 '급여 지급'·'수당' 표현 금지 — 육아휴직급여와 혼동 주의.
  기간·분할 단위·대상 가족 범위는 법 제22조의2 및 시행령 조문 기준으로 명시(부정확한 통념 배제).
  사업주 거부는 '무조건 가능'이 아니라 법정 예외사유에 한함을 명확히.
