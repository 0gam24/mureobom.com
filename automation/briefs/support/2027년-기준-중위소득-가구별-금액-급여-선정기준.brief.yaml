  - 적용 시점(2027-01-01)과 기준 중위소득이 연동되는 다른 복지사업(차상위 50%·청년도약계좌 250%(2024-03-12 개정, fsc.go.kr 확인) 등 사례 2~3개)
  - 경계 시나리오: 2026년엔 선정기준 초과였던 가구가 2027년엔 해당되는지(소득인정액 기준으로 판단, 실소득과의 차이 명시)
  - 실무 마찰: 소득인정액 ≠ 실소득(재산 소득환산), 가구원수 판정, 부양의무자 기준(의료급여)

