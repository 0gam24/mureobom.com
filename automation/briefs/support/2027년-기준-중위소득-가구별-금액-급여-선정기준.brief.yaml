human_notes: |
  차별화: 기발행 '기초생활수급자 신청자격'(2026 기준)·'차상위계층 기준'은 올해 기준의 자격 설명.
  이 글은 2027년 변경분 자체가 주제 — 변경사항 분석형(TYPE F). 가구원수별 2026→2027 급여
  선정기준 증가액을 자체 계산해 표로 보여주고, 산정방식 개편이 왜 6.70%를 만들었는지 해석하며,
  "우리 집은 내년에 되나"를 소득인정액 기준으로 판단하는 경계 시나리오를 넣는다. 다른 사이트는
  보도자료 숫자 나열에 그친다. 숫자는 보도자료(mohw/korea.kr) 원문 대조 필수, 고시 미확인 시
  '고시 예정' 표기. 근로장려금 9월 반기신청은 기존 글이 표로 다뤄 카니발리제이션으로 기각.
