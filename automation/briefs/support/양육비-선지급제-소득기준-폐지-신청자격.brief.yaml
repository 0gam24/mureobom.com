human_notes: |
  차별화: "소득기준이 없어졌다"는 뉴스 한 줄에서 멈추지 않고, 폐지 후 실제로 당락을 가르는
  남은 관문(양육비 채권 확보 노력 요건)을 신청 실패 원인 중심으로 해부한다.
  기존 290편 중 support/한부모가족-지원금-양육비는 복지급여 총론이고 선지급제는 2줄 언급뿐 —
  본 글은 선지급제 단일 제도의 자격·절차·회수 구조로 각도를 좁힌 롱테일.
  핵심: 선지급은 복지급여가 아니라 국가가 양육비 채권을 대신 받아주는 대위 구조라서,
  소득이 아니라 '채권 확보 노력'이 관문이라는 점을 독자가 착각한다.
  확인 못 한 시행령 조문 번호·부정수급 환수율은 쓰지 않는다.
