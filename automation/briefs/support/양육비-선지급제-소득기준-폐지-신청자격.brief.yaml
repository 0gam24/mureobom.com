  - 국가의 회수 절차(국세 강제징수 방식)와 채무자 제재
  - 소득기준 때문에 과거 탈락했던 가구가 다시 따져야 할 남은 요건(재신청 행정절차는 미확인이므로 단정 금지, 상담센터 안내)
  - 신청 반려가 잦은 제출서류 지점(집행권원·송달/확정증명원·'상세' 발급·3개월 거래내역)

