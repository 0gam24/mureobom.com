human_notes: |
  차별화: '대출'이 아니라 정부 재원 근로자 복지 융자라는 점, 그리고 용도별(혼례·의료·자녀학자금·
  임금감소 생계비) 한도를 표 하나로 묶어 서민금융 대출과 구분. 대상이 '저소득 근로자·특고'라는
  자격 경계를 명확히. 금리·한도 구체 수치는 연도별로 바뀌므로 근로복지공단 최신 공고 확인
  안내를 반드시 붙이고, 조문(근로복지기본법)은 제도 근거로만 인용. 단정적 "누구나 받는다" 금지 —
  예산 소진·자격 심사 있음을 고지. 클러스터 경계: 근로자 대상 정부 복지 융자이므로 support.
