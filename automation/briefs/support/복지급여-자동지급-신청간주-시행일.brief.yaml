human_notes: |
  차별화: 모든 보도가 "신청주의 개선 6법, 공포 후 3개월 뒤 시행"으로 끝나는데,
  국가법령정보센터 원문을 보면 시행일이 네 갈래(2027.1.21 / 2027.4.21 / 2027.7.1 /
  2028.1.1)로 쪼개져 있다. 특히 기초연금법은 본문이 공포 후 6개월이라 2027년 4월
  21일이고, 신청 간주를 담은 제10조제4항만 3개월이라 2027년 1월 21일이다. 법률
  번호와 조문 단위로 시행일을 맞춘 표를 제시하는 것이 이 글의 유일한 정보 이득.

  두 번째 축: 부칙 적용례가 "누가 자동으로 받는가"를 가른다. 아동수당은 시행 이후
  출생한 아동부터라서 2027년 1월 20일 출생아는 여전히 직접 신청해야 한다(부칙 제3조
  제1항). 반대로 장애인연금 신청 간주는 시행 당시 이미 생계·의료급여 수급권자인
  사람에게도 적용되고(부칙 제2조), 기초연금 간주는 시행 이후 65세가 되는 사람부터만
  적용된다(부칙 제2조제2항). 세 제도의 적용 경계가 서로 다르다는 점을 표로 분리한다.

  주의: "자동 지급"이라고 뭉개지 말 것. 법 구조는 신청 절차의 간주·생략이고,
  소득·재산 요건 확인은 남는다. 아동수당은 신청 자체가 사라지는 대신 제7조제1항
  단서의 수급 거부(opt-out) 구조가 들어간다. 이 둘을 섞어 쓰면 틀린다.

  확인 못 한 것: 직권신청의 "대통령령으로 정하는 위기상황"과 "심신미약·심신상실 등
  대통령령으로 정하는 경우"의 구체 범위는 시행령 개정 전이라 확인되지 않았다.
  시행령으로 정한다는 사실만 쓰고 범위를 추정하지 마라. 아동수당 금액·연령 확대
  일정(13세 미만, 2세 미만 추가 지급)은 이 개정과 무관한 별도 조문이므로 이 글에서
  금액을 단정하지 마라. 개인별 수급 가능 여부는 단정하지 않는다(일반정보 고지 유지).
