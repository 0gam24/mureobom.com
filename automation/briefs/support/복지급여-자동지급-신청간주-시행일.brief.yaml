must_cover:
  - 신청주의 개선 6법이 2026년 10월 20일 공포됐고, 언론·정부 홍보가 일괄 "공포 후 3개월"로 안내하지만 실제 시행일은 법마다 다르다는 점. 법률 번호와 시행일을 1:1로 대조
  - 6법 시행일 지도 - 사회보장기본법(법률 제22100호)·사회보장급여법(제22099호)·국민기초생활 보장법(제22087호)·아동수당법(제22101호)·장애인연금법(제22108호)은 2027년 1월 21일, 기초연금법(제22097호)은 본문이 공포 후 6개월이라 2027년 4월 21일
  - 같은 법 안에서도 조문별로 쪼개진 예외 - 기초연금법 제10조제4항·제11조제6항만 2027년 1월 21일, 장애인연금법 제2조제1호·제6조는 2027년 7월 1일, 국민기초생활 보장법 제11조는 2028년 1월 1일
  - 아동수당·첫만남이용권 - 아동수당법 제6조(신청)가 삭제되고(제8조는 2019.1.15 이미 삭제분으로 이번 개정과 무관) 제5조가 지자체에 정보 제공 의무를 지우며 제7조제1항 단서로 수급을 원하지 않는 보호자는 빠지는 opt-out 구조로 바뀜. 제10조제1항은 출생한 날이 속하는 달부터 지급하고 지급 결정 전 기간분은 최초 지급 시 일시 지급
  - 아동수당법 부칙의 출생일 경계 - 부칙 제2조제1항은 "시행 이후 출생한 아동부터", 부칙 제3조제1항은 시행 전 출생 아동은 종전 규정. 즉 2027년 1월 20일 출생아는 여전히 직접 신청해야 함. 다만 부칙 제2조제2항으로 첫만남이용권(제10조의2)은 시행 당시 출생일부터 2년이 지나지 않고 지급 신청이 없던 아동에게도 적용
  - 장애인연금 신청 간주 - 제8조제3항으로 국민기초생활 보장법 제7조제1항제1호 생계급여 수급권자, 같은 항 제3호 의료급여 수급권자가 제4조 수급권자 범위에 들면 신청한 것으로 봄. 부칙 제2조로 시행 당시 이미 생계·의료급여 수급권자인 사람에게도 적용(기존 수급자 포함). 제10조제2항은 간주 시 조사 생략 가능
  - 기초연금 신청 간주 - 제10조제4항으로 장애인연금법 제4조 수급권자는 65세에 도달하는 날에 기초연금을 신청한 것으로 보고, 장애인연금법 제8조제3항의 자료 제공 동의를 기초연금 동의로 갈음. 부칙 제2조제2항은 그 개정규정 시행(2027년 1월 21일) 이후 65세가 되는 사람부터 적용
  - 동의 없는 직권신청 - 국민기초생활 보장법 제21조제3항과 사회보장급여법 제5조제3항이 같은 구조로, 심신미약·심신상실 등 대통령령으로 정하는 경우와 대통령령으로 정하는 위기상황으로 생계유지가 곤란하거나 곤란해질 우려가 있는 경우에 동의 없이 직권신청. 담당자는 보장기관의 장에게 지체 없이 보고
  - 동의 없는 직권신청에 딸린 금융정보 조회 - 국민기초생활 보장법 제23조의2제2항, 사회보장급여법 제8조제1항 단서·제3항이 동의 서면 없이 금융·신용·보험정보 제공을 요청할 수 있게 함. 사회보장급여법 제5조제6항은 신청 간주 시에도 근거 법령·조사 목적과 범위·신고의무·정보 보유기간과 파기를 고지하도록 함
  - 공무원 면책과 우대 - 국민기초생활 보장법 제21조제4항은 고의나 중대한 과실이 없으면 감사원법·공공감사에 관한 법률에 따른 징계·문책 요구 책임을 묻지 않도록 하고, 제31조의2와 사회보장급여법 제53조의4가 인사상 우대 조치를 신설(둘 다 본조신설 2026.10.20)
  - 사회보장급여법 제5조제4항의 일반 간주 규정. 제22조의2 맞춤형 급여 안내(거부하지 않으면 신청 간주)는 2020.12.29 신설된 기존 조문이므로 이번 개정 신설분과 구분해 서술
  - 자동으로 바뀌는 것과 그대로 남는 것의 경계 - 간주는 "신청 절차 생략"이고 소득·재산 등 수급요건 확인은 그대로 남는다는 점(기초연금법 제10조제4항, 장애인연금법 제10조제2항, 사회보장급여법 제5조제4항 구조)

