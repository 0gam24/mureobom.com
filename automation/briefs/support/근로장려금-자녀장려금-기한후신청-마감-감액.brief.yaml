human_notes: |
  차별화: 기발행 '근로장려금 신청자격'·'자녀장려금 신청자격'은 자격·금액 개요이고 기한 후 신청은 표 한 줄뿐.
  이 글은 기한 후 신청 하나만 다루는 절차형(TYPE A 문제해결 + D 계산). 경쟁 글들이 11월 30일·12월 1일로
  엇갈리는 마감일을 법 조문(6개월 기산점 + 국세기본법 기한 특례)과 국세청 공식 안내로 판정하는 것이 핵심
  정보 이득. 5% 감액 계산 예시(자녀장려금 재산 50% 감액과 겹치는 경우 포함), 지급 시기 법정 근거,
  마감 후 구제 가능성까지. 네이버 검색어는 '기한후신청'(붙여쓰기)과 '기한 후 신청'을 함께 쓰므로 제목·
  본문에 자연스럽게 둘 다. 국세청 공식 안내로 마감일을 확정 못 하면 '국세청 안내 기준'과 '법 조문 해석'을
  분리해 표기하고, 안전한 날짜(더 이른 날)를 행동 기준으로 제시. 블로그·언론 기사 수치는 근거로 쓰지 않음.
