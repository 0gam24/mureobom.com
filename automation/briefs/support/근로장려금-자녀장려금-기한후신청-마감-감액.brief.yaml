must_cover:
  - 기한 후 신청이 무엇이고 누가 대상인지(정기신청 기간에 신청하지 않은 가구, 근로장려금·자녀장려금 모두 해당), 반기신청과의 관계(반기신청 상·하반기 누락자는 어떻게 되는지)
  - 2026년 기한 후 신청 마감일이 자료마다 11월 30일·12월 1일로 갈리는 이유 — 조세특례제한법상 '신청기한 경과 후 6개월'의 기산점과 국세기본법 제5조 기한 특례(2026-05-31 일요일 → 정기신청 기한 6월 1일) 적용 여부를 1차 출처로 판정(국세청 공식 안내가 정답)
  - 5% 감액(산정액의 95% 지급) 근거 조문과 계산 예시, 자녀장려금 재산 1억7천만원 이상 50% 감액과 겹칠 때 적용 순서(1차 출처로 확인되는 범위만)
  - 기한 후 신청분 지급 시기(결정 기한·지급 기한 법정 근거), 정기신청분(8월 말)과 비교
  - 신청 경로(홈택스·손택스·ARS·세무서)와 안내문을 못 받은 가구도 신청 가능한지, 필요 서류·확인 포인트
  - 실무 마찰: 마감 지나면 다음 해에 소급 신청 불가 여부, 국세 체납 시 충당, 최소 지급액 미달, 소득·재산 기준일(2025년 소득·2025.6.1 재산)
  - 마감 전 행동 계획(무엇을 어디서 확인할지)

