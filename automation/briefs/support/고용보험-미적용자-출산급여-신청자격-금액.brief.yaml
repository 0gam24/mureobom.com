human_notes: |
  차별화: 기발행 304편 전체에서 "미적용자"·"출산급여" 문자열이 0건이다(grep 확인). 기존
  support/출산전후휴가-급여-기간-신청자격은 "고용보험 피보험단위기간 180일 이상"을 전제로 쓴 글이라,
  그 요건에서 떨어진 사람(프리랜서·특고·1인 사업자·초단시간 근로)은 그 글에서 답을 못 얻는다.
  이 글은 정확히 그 탈락 구간을 받는 제도를 다루므로 검색의도가 겹치지 않고 서로를 보완한다.
  핵심 정보 이득은 "자격이 있느냐"가 아니라 "2026년부터 무엇 때문에 떨어지느냐"다 — 2026-01-01
  시행 개정으로 (1)소득은 세금 신고분만 인정 (2)배우자·동거친족 사업장의 특고·프리랜서는 배제
  (3)보조인력은 임신 진단 이후 1인만 (4)1인 자영업자는 모든 사업장이 요건 충족이라는 네 갈래가
  새로 생겼다. 대중 설명글은 아직 "150만원 준다"에 머물러 있어 이 네 가지가 비어 있다.
  검수 포인트:
  - 150만원·월 50만원 3개월·유산사산 임신기간별 4구간·신청기한 1년은 정부24 서비스 안내와
    고용노동부 자료로 확정 표기하고, 확인한 기준일을 본문에 명시한다. 확인 못 한 수치는 쓰지 않는다.
  - 2026-01-01 시행 변경 4건은 고용노동부 게시물(2025-12-31)의 표현 범위를 넘지 않는다.
    소득 증빙자료 적용 시점이 2026-02-01 신청자부터라는 단서를 빠뜨리지 않는다.
  - 지원대상 4유형은 정부24 표기(1유형~4유형)를 따르되 유형 번호만 나열하지 말고 실제로 누가
    어디에 걸리는지로 서술한다.
  - 개별 사안 단정 금지. "내 경우 받을 수 있다/없다" 확정 판단 대신 확인 경로(고용센터·고용24·1350)로
    안내하고 일반정보 고지를 유지한다.
  - 의료·임신 관련 조언 금지. 유산·사산 구간은 급여 산정 기준으로만 서술하고 의학적 설명을 붙이지 않는다.
  - 카니발리제이션 대조 완료: _published_slugs.txt support 63건 + grep -il "출산급여"·"미적용자" 0건.
    출산전후휴가(고용보험 가입자)·부모급여(복지부 현금지원)·진료비 바우처(건보)와 소관·대상이 모두 다르다.
