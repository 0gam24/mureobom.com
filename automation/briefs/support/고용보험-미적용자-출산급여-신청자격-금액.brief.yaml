target_query: "고용보험 미적용자 출산급여 신청자격 150만원 프리랜서 자영업자 신청방법"
search_intent: 절차형      # "나는 고용보험이 없는데 출산급여를 받을 수 있나, 어디에 어떻게 신청하나"

signal:                   # topic-queue stale(2026-06-11 생성) → WebSearch 폴백 수동 선정, 집계 수치만
  score: 57
  trend_momentum: 0.50    # 2026-01-01 시행 지급요건 개정(소득 증빙·친족 관계·보조인력)으로 탈락 사례 문의 증가
  question_volume: 0.58
  cluster_fit: 0.95
  freshness: 0.75

must_cover:
  - 제도의 정체 — 고용보험 출산전후휴가급여를 받지 못하는 소득활동 여성에게 주는 별도 급여이고,
    고용보험 가입 여부가 아니라 "출산휴가급여를 못 받는 상태"가 기준이라는 점
  - 지원대상 4유형 구분 — (1)피보험자이나 피보험단위기간 180일 미충족 (2)고용보험 적용제외 사업의
    근로자·적용제외자 (3)출산일 현재 피고용인 없는 단독·공동 사업자 (4)근로자도 1인사업자도 아닌
    특수형태근로종사자·프리랜서
  - 지급액 구조 — 총 150만원(월 50만원 × 3개월분), 유산·사산은 임신기간별로 15주까지 30만원,
    16~21주 50만원, 22~27주 100만원, 28주 이상 150만원
  - 2026년 1월 1일 시행 변경사항 4가지 — 소득활동은 세금 신고된 소득 기준으로 인정(소득 증빙자료는
    2026-02-01 신청자부터 적용), 보조인력 채용은 임신 진단 이후 1인에 한해 인정, 특고·프리랜서가
    사업주와 배우자·동거친족 관계면 지원 불가, 1인 자영업자는 신청인의 모든 사업장이 요건을 충족해야 함
  - 신청기한 — 출산일로부터 1년 이내, 기간 내 미신청 시 소멸(이 기한이 실제 탈락 1순위)
  - 신청 경로와 서류 — 고용24(work24.go.kr) 온라인 또는 거주지·사업장 관할 고용센터 방문·우편,
    유형별 소득활동 증빙과 소득발생 증빙, 유산·사산 진단서
  - 출산전후휴가급여와의 경계 — 180일을 채워 출산휴가급여를 받으면 이 급여 대상이 아니고,
    180일에 미달해 못 받을 때 이 급여로 넘어오는 구조(둘 중 하나)
  - 다른 출산 지원과의 관계 — 부모급여·첫만남이용권·임신출산 진료비 바우처는 소관 부처가 달라
    성격이 다른 지원이라는 점(중복 여부는 각 제도 기준으로 확인)
  - 흔한 통념 바로잡기("고용보험이 없으면 출산급여는 아예 없다", "사업자등록이 있어야만 받는다",
    "출산 후 아무 때나 신청하면 된다", "남편 사업장에서 일해도 프리랜서면 받는다")

