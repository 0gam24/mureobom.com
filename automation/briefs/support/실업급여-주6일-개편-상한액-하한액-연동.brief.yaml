human_notes: |
  차별화: 기발행 '실업급여 금액·수급기간 계산'은 현행 제도의 계산법이고, 그 글은 "상한액 66,000원 동결 +
  하한액 최저임금 연동 → 하한액이 상한액에 가까워질 수 있다"까지만 적는다. 이 글은 정부가 바로 그 문제에
  답으로 내놓은 2026-09-01 「고용보험 제도개편 방안」만 다룬다. 핵심 정보 이득은 두 가지. (1) 언론이
  "주 6일로 줄어든다"로 뭉개는 부분을 보도자료 원문 기준으로 '총 지급액·총 지급일수는 유지'로 정정하고,
  보도자료가 말하지 않은 것(1일 금액 산정식·달력상 종료일)은 미확정으로 분리한다. (2) 실제 금액이 바뀌는
  지점은 주 6일이 아니라 상한액의 하한액 연동(103%)이라는 구조를 짚는다. 두 번째 축은 '법률 개정 vs
  하위법령 개정' 구분 — 같은 발표 안에서도 체감 시점이 갈리는데 이를 표로 정리한 글이 없다.
  확정 시행일이 없는 항목은 날짜를 만들지 말고 "미정"으로 쓴다. 금액 예시는 조문 산정식 범위 안에서만,
  2026년 최저임금 실측치가 1차 출처로 확인되지 않으면 구체 금액을 쓰지 말고 산정식으로만 설명한다.
  단정 표현 금지("무조건 오른다"·"확정됐다" 금지, "심의된 방안"·"개정 목표" 로 표기).
