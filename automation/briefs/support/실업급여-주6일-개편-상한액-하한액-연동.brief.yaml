must_cover:
  - 2026-09-01 고용보험위원회가 심의한 「고용보험 제도개편 방안」의 실업급여 항목 전체 목록과, 각 항목이 '법률 개정' 사항인지 '하위법령등 개정' 사항인지 구분(체감 시점이 다른 이유)
  - 구직급여 지급방식 주 7일 → 주 6일(무급휴일 제외) 변경의 정확한 범위 — 총 지급액과 총 지급일수(120~270일)는 유지된다는 점. 보도자료가 명시하지 않은 부분(1일 금액 산정식·달력상 수급 종료일 변동 등)은 '미확정'으로 분리 표기하고 추측하지 않는다
  - 구직급여 상한액 결정방식 개편 — 정액 상한액을 하한액 연동으로 전환, 연동비율 103%의 근거(2026년 상·하한액 격차 3.1% 반영). 현행 상한액 정액 구조와 하한액 산정식(최저임금 80% × 1일 소정근로시간, 최대 8시간)을 1차 출처 조문으로 설명하고, 연동 전환이 고소득 이직자에게 갖는 의미
  - 조기재취업수당 지급 제외 기준 하향(월 574만원 이상 → 월 300만원 이상)과 그 결과 누가 새로 제외되는지
  - 실업급여 계정 보험료율 1.8% → 2.0% 인상('27년 노동자·사용자 각 0.1%p 인상)과 가입자 부담 변화의 방향
  - (가칭)일·가정 양립 계정 2028년 신설과 실업급여 계정에서 모성보호 지출이 빠져나가는 구조 — 왜 실업급여 개편과 한 묶음인지
  - 시행 시점 — 보도자료에 확정 시행일이 적힌 항목과 적히지 않은 항목을 구분. 정부 목표가 '연내 법률 및 하위법령 개정'이라는 사실, 법률 개정 항목은 국회 통과 전까지 확정이 아니라는 점
  - 정보 기준일 명시 + 지금 이직을 앞둔 사람이 취할 행동 계획(현행 기준으로 수급액을 확인하는 경로, 개편 확정 여부를 어디서 확인하는지)

