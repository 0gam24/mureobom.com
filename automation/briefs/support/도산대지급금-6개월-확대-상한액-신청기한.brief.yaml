human_notes: |
  차별화: 2026년 8월 20일 시행된 도산대지급금 6개월 확대를 상한액 고시와 곱해서
  "내 나이면 실제 한도가 얼마로 바뀌었나"를 숫자로 보여주는 글. 시중 안내는 아직
  최대 2,100만원(3개월 기준)으로 쓰여 있는데, 40대 기준 실제 한도는 3,150만원이다.
  동시에 부칙 적용례 때문에 "이미 도산 결정이 난 사업장에서 퇴직한 사람"은 확대분을
  못 받는다는 함정을 명시한다. 기준은 퇴직일이 아니라 도산 결정일이다.

  두 번째 축: 도산대지급금과 간이대지급금을 "어느 쪽이 더 유리한가"가 아니라
  "내 상황에서 어느 문이 열려 있나"로 정리한다. 상한 구조가 완전히 다르다
  (도산은 연령별 월 상한 × 개월, 간이는 총액 1,000만원 고정).

  주의: 상한액 고시의 표는 임금·휴업수당·출산전후휴가 급여가 1월분, 퇴직급여등이
  1년분 기준이다. 이 단위를 빠뜨리면 숫자가 전부 틀어진다. 재직자 임금 요건은
  "월 350만원 미만"이 아니라 통상임금 시급 평균이 최저임금의 110% 미만이다
  (흔한 오보). 2026년 최저임금 10,320원 기준 11,352원 미만.

  확인 못 한 것: 상한액 고시는 2021년 10월 14일 시행본이 최신이며 6개월 확대에
  맞춘 개정 고시는 확인되지 않았다. 따라서 "월 상한액 자체가 올랐다"고 쓰지 말고
  "적용 개월 수가 늘어 총액 한도가 커졌다"로만 쓴다.
  개인별 수급 가능 여부·금액 확정은 단정하지 않는다(일반정보 고지 유지).
