must_cover:
  - 2026년 8월 20일 시행 법률 제21376호로 도산대지급금 임금 범위가 최종 3개월분에서 최종 6개월분으로 확대(휴업수당·출산전후휴가 급여도 6개월분). 간이대지급금은 3개월분 그대로
  - 부칙 제2조 적용례 함정 - 퇴직 시점이 아니라 시행일 이후 회생절차개시 결정·파산선고 결정·도산등사실인정이 있는 경우부터 적용
  - 도산대지급금 상한액 고시(연령별 1월분 기준) 임금 220/310/350/330/230만원, 퇴직급여등 1년분 동일, 휴업수당 154/217/245/231/161만원, 출산전후휴가 급여 310만원
  - 6개월 확대로 40대 기준 임금분 상한이 1,050만원에서 2,100만원으로, 퇴직급여 1,050만원을 더한 총액이 2,100만원에서 3,150만원으로 바뀌는 계산
  - 간이대지급금 상한 - 임금·휴업수당·출산전후휴가 급여 700만원, 퇴직급여등 700만원, 총 상한 1,000만원. 퇴직급여등은 퇴직 근로자만 적용(재직자 제외)
  - 도산등사실인정 요건(상시근로자 300명 이하, 사업 폐지 또는 폐지 과정, 지급능력 없음)과 10인 미만 사업장의 금품청산 기일 후 3개월 특례
  - 기한 두 겹 구조 - 지급대상이 되는 기한(도산 신청일 1년 전부터 3년 이내 퇴직 / 퇴직 다음 날부터 소송 2년·진정 1년 / 도산등사실인정 신청 퇴직 다음 날부터 1년)과 청구 기한(도산 2년, 판결 1년, 확인서 6개월)
  - 재직자 간이대지급금 요건 - 통상임금 평균이 최저임금 시급의 110% 미만(2026년 10,320원 기준 11,352원 미만), 1개월 미만 일용 제외, 한 사업장에서 평생 1회
  - 받고 나면 국가가 그 금액만큼 사업주에 대한 청구권을 대위하므로 사업주 책임이 사라지지 않는다는 점
  - 부정수급 시 환수에 더해 5배 이하 추가징수와 형사처벌
  - 창구 구분 - 체불임금등·사업주확인서 발급과 도산등사실인정은 지방고용노동관서, 대지급금 지급은 근로복지공단

