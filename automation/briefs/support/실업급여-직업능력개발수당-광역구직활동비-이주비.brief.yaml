human_notes: |
  차별화: 기발행 실업급여 6편은 구직급여(신청·금액·자발적퇴사·부정수급·알바신고)와
  조기재취업수당까지만 다룬다. 이 글은 나머지 취업촉진수당 3종(직업능력개발수당·
  광역구직활동비·이주비)만 전담한다. 국내 콘텐츠 대부분이 조기재취업수당에 쏠려 있어
  3종은 금액·거리요건·청구기한이 흩어져 있는 공백 구간. 구체 수치(1일 지급액, 거리 기준,
  14일 청구기한, 1년 이상 근로계약)를 한 표로 모으는 것이 정보 이득의 핵심.
  주의: 금액·기준은 고시·시행규칙 개정으로 바뀌므로 확인 기준일을 본문에 명시하고,
  '무조건 받는다'식 단정 금지(고용센터장 인정·사업주 지급 여부에 따라 달라짐).
  조기재취업수당은 요건만 짧게 대비하고 기존 글로 내부링크(카니발리제이션 회피).
