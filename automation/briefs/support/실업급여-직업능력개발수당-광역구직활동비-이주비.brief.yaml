  - 직업능력개발수당 지급 요건(고용센터 지시 훈련 수강)과 1일 지급액, 훈련 참여 중 교통비·식비 중복 지급 시 조정
  - 직업능력개발수당 지급 제외(훈련 거부로 구직급여 수급 정지된 기간), 수강증명서 제출 시점(실업인정일)
  - 광역 구직활동비 요건(거주지와 방문 사업장 거리 기준, 사업주 미지급 또는 미달), 지급 범위(운임·숙박료)와 청구 기한
