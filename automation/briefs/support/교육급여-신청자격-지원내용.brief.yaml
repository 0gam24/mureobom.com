human_notes: |
  차별화: 기초생활 4대 급여 중 교육급여만 단독 심층. 기발행 기초생활수급자-생계급여(생계 중심)와
  달리 교육활동지원비 금액·초중고 차등·복지로 신청을 절차형으로 정리. 2026 기준 중위소득 50%
  선정선과 금액은 연도별로 바뀌므로 최신 고시 대조 + 변동 가능 고지. 교육급여 vs 교육비(교육청)
  혼동 바로잡기 단락 필수. 소득인정액 개념은 링크로 넘기고 본문은 교육급여 고유 내용에 집중.
