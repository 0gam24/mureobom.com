  - 지원 금액 — 기저귀 월 정액 바우처, 조제분유 월 정액 바우처(구체 금액은 연도별 고시, 국민행복카드 포인트 지급 방식)
  - 신청 방법 — 복지로 온라인 또는 주민센터·보건소 방문, 국민행복카드 발급, 필요 서류
  - 지원 기간 — 영아가 만 2세가 되는 시점까지, 출생 신고 후 신청 가능
  - 흔한 오해 바로잡기 — 부모급여·아동수당과 별개 사업(중복 수급 가능), 소득기준 초과 시 특정 자격만 대상

