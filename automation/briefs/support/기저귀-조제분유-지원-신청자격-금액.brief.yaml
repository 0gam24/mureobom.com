human_notes: |
  차별화: 부모급여·아동수당·첫만남이용권(covered)과 헷갈리는 "기저귀·조제분유 바우처"를
  별개 사업으로 명확히 구분하고 중복 수급 가능함을 강조. 소득기준 이하 일반 + 저소득/다자녀/장애인
  특정 자격 2트랙을 표로. 조제분유는 모유수유 곤란 사유 필요라는 조건 명시.
  정확한 월 지원액은 연도별 고시라 "연도 고시 기준" 프레임으로. 소득 판정은 개별 상이 안내.
