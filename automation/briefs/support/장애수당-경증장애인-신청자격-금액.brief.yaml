human_notes: |
  차별화: 기발행 'support/장애인연금-신청자격-급여액'은 중증(종전 1~3급) 대상이고, 이 글은 경증(종전 4~6급) 대상 '장애수당'으로 완전히 다른 제도임을 명확히 구분. 장애수당(성인 경증)과 장애아동수당(18세 미만)을 함께 다루고 장애인연금과의 차이표(대상 장애정도·연령·금액)를 핵심으로.
  검수 포인트: 지급액은 연도별로 개정되니 최신 기준연도(2026) 확인 후 명시. 장애인연금(중증)과 장애수당(경증)을 혼동하는 검색자가 많으니 도입부에서 두 제도 경계를 먼저 명확히.
  흔한 통념 오류: "등록 장애인이면 모두 받는다"는 오해 반박 — 국민기초생활보장 수급자·차상위계층 요건이 있음을 강조.
