  검수 포인트: 지급액(월 10만원)·대상 연령(만 8세 미만=0~95개월) 최신 기준 확인, "소득 높으면 못 받는다"는 통념 반박(보편지급), 출생신고 원스톱 신청 시 별도 방문 불필요 동선 명시.
