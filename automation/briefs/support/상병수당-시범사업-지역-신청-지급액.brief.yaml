  - 2단계 정액 모형과 3단계 정률 모형의 지급액·소득기준 차이
  - 취업자 요건(건강보험 직장가입·고용/산재보험·일용근로자·자영업자 매출 기준)
  - 대기기간 7일과 최대 보장기간 150일, 단계별 차이
  - 신청 절차와 2025년 4월 1일 변경된 진단서 규정, 진단서 발급일 기준 14일 신청기한
  - 산재 휴업급여·실업급여와 겹치지 않는 지점(업무 외 질병·부상)
  - 본사업 전환 논의 현황(2027년 목표, 2026년 6월 건정심 성과평가)

