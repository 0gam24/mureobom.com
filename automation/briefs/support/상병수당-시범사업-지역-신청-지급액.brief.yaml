human_notes: |
  차별화: "내 지역이 대상인가"를 첫 관문으로 놓고, 종료된 1단계 6곳을 아직도 대상으로
  안내하는 오래된 정보(총 14개 지역)를 2026년 6월 건정심 자료의 8개 시군구로 교정한다.
  거기에 2단계 정액 모형과 3단계 정률 모형이 금액 산정식·소득기준 모두 다르다는 점을
  같은 지역 거주자 기준 비교표로 보여준다. 대부분의 안내가 빠뜨리는 실무 마찰 지점
  두 가지(2025년 4월 1일부터 입원도 진단서 필수, 진단서 발급일로부터 14일 신청기한)를
  명시한다.
  주의: 지급액은 2026년 기준 49,540원(2단계 정액·3단계 하한)·68,100원(3단계 상한)만 쓴다.
  정부24에 남아 있는 47,560원은 이전 연도 값이므로 인용하지 않는다.
  산재 휴업급여와의 경계(업무상 재해는 상병수당 대상 아님)를 반드시 구분한다.
