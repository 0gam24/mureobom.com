human_notes: |
  차별화: 임신·출산 진료비 바우처(발행됨)와 별개인 '난임 시술비 지원'을 대상·금액·신청 순서로 정리.
  소득·연령 기준은 지자체별로 다르고 다수 지역이 소득기준을 폐지한 흐름이 있어, 특정 금액 단정 대신 '거주 지자체 보건소 기준 확인'으로 안전하게 안내(정확성). 회당 지원 상한·횟수도 개정 잦으니 조문·복지로 확인된 범위만.
  의료·건강 관련 YMYL 주제 — 일반정보 고지 필수, 의학적 조언·시술 성공률 단정 절대 금지.
