  freshness: 0.0

must_cover:
  - 난임부부 시술비 지원 사업의 개요와 근거(모자보건법상 난임극복 지원, 보건복지부 사업) — 체외수정(신선배아·동결배아)·인공수정 시술비 일부를 지원
  - 지원 대상 요건(난임 진단서, 부부 중 1명 이상 건강보험 가입 등)과 소득·연령 기준의 지자체 확대 흐름(다수 지자체 소득기준 폐지 등 지역별 차이가 있음을 명시, 단정 수치 대신 '거주 지자체 기준 확인' 안내)
  - 지원 내용(시술 종류별 회당 지원 상한, 지원 횟수 산정 방식)과 건강보험 급여 적용분과의 관계(본인부담 일부를 추가 지원하는 구조)
  - 신청 방법(정부24·e보건소 온라인 또는 관할 보건소 방문), 지원결정통지서 발급 후 시술이라는 절차 순서, 필요 서류
  - 관련·연계 지원(임신·출산 진료비 바우처, 산모신생아 건강관리 등)과의 구분 — 별개 사업임을 명확히
  - 흔한 오해(전액 무료인 줄 안다 / 소득기준이 전국 동일한 줄 안다 / 시술 후 소급 신청되는 줄 안다) 교정

required_sources:
  - "모자보건법(난임 극복 지원 등) (국가법령정보센터 law.go.kr)"
  - "복지로 (bokjiro.go.kr) — 난임부부 시술비 지원 사업 안내(지원 대상·내용·신청)"
  - "정부24 (gov.kr) — 난임부부 시술비 지원 신청 서비스"

