target_query: "난임부부 시술비 지원 대상 소득기준 지원금액 신청방법 체외수정 인공수정 횟수"
search_intent: 절차형     # 지원 대상·금액 확인 + 신청 절차를 함께 원함

signal:
  score: 0
  trend_momentum: 0.0
  question_volume: 0.0
