must_cover:
  - 제도 정체 — 남녀고용평등과 일·가정 양립 지원에 관한 법률 제18조의3에 근거한 법정휴가. 연간 6일이며 남녀 근로자 모두, 난임치료를 받는 중은 물론 계획 중인 사람도 쓸 수 있다
  - 2026-11-27 변경의 정확한 범위 — 연간 6일 총량은 그대로이고 바뀌는 것은 '유급으로 보장되는 최초 일수'가 2일에서 4일로 늘어나는 것. 나머지 2일은 여전히 무급
  - 핵심 오해 바로잡기 1 — 급여 상한 168,420원(2일)에서 336,840원(4일)은 '총액' 상한이다. 두 수치 모두 하루 84,210원 기준이므로 하루에 받는 돈이 두 배가 되는 게 아니라 지원 일수가 두 배가 되는 것이다
  - 핵심 오해 바로잡기 2 — '유급 4일'과 '정부 급여 4일'은 다른 이야기다. 유급 보장은 사업장 규모와 무관한 법정 의무이고, 고용보험 난임치료휴가 급여는 우선지원대상기업 소속 근로자로 한정된다. 대규모기업 근로자도 유급은 받지만 그 돈은 회사가 전액 부담한다
  - 우선지원대상기업 근로자의 돈 구조 — 정부가 통상임금을 상한 안에서 지원하고, 통상임금이 상한을 넘으면 그 차액은 사업주가 지급한다. 정부 지원과 회사 부담이 합쳐져 통상임금이 채워지는 구조
  - 경과 적용 — 고용노동부 활용 가이드 Q8. 11월 27일 전에 난임치료휴가 최초 2일을 이미 유급으로 썼더라도, 27일 이후 쓰는 추가 2일은 유급으로 처리된다. 다만 연간 6일 한도 자체가 늘어나는 것은 아니다
  - 휴가를 쓸 수 있는 날의 범위 — 시술 당일뿐 아니라 시술 전 필수 준비단계(난임검사·배란유도 등) 병원 방문일과 시술 직후 안정기·휴식기까지 포함된다. 2025년 8월부터 범위가 넓어진 결과
  - 신청 경로와 기한 — 고용24 홈페이지 또는 관할 고용센터. 휴가를 시작한 날 이후 1개월부터 휴가가 끝난 날 이후 12개월 이내. 사업주가 먼저 유급휴가를 지원하고 대위신청하는 방법도 있다
  - 서류 부담 경감 — 2026년 5월부터 급여 신청 시 진단서를 보건복지부 '난임부부 시술비 지원 결정통지서'로 대체할 수 있다. 시술비 지원을 이미 받고 있는 사람은 서류를 새로 떼지 않아도 된다
  - 사업주 의무와 제재 — 휴가를 신청했는데 부여하지 않으면 500만원 이하 과태료. 휴가 사용을 이유로 한 불리한 처우에는 3년 이하 징역 또는 3천만원 이하 벌금이 2026-11-27부터 함께 시행된다. 비밀유지 의무도 사업주에게 있다
  - 사용 단위 — 원칙은 일 단위. 사업장 노사 협의나 취업규칙에서 정한 경우에만 시간 단위 사용이 가능하다
  - 공식 자료에 답이 없는 것 명시 — 상한액 336,840원이 2027년 이후에도 유지되는지, 우선지원대상기업 판정이 신청 시점 기준인지, 1년 미만 근속자의 적용 여부. 1차 출처에 없으므로 추측으로 메우지 않고 1350·관할 고용센터 확인으로 연결
