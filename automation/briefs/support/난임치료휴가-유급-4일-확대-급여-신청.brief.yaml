human_notes: |
  차별화: 8월 보도 이후 기사·블로그는 전부 "유급 2일→4일, 상한 두 배(168,420원→336,840원)" 한 줄로 끝난다.
  정작 돈이 갈리는 지점 세 개를 아무도 풀지 않는다.
  (1) 상한 두 수치는 모두 하루 84,210원 기준이다. 일당이 두 배가 되는 게 아니라 지원받는 날이 두 배가 된다.
      "상한 두 배"만 읽고 하루에 더 받는 줄 아는 오독이 흔하다.
  (2) '유급 4일'(전 사업장 법정 의무)과 '정부 급여 4일'(우선지원대상기업 한정)은 서로 다른 제도다.
      대규모기업 근로자는 유급은 받되 그 재원이 회사다. 내가 어느 쪽인지에 따라 신청할 곳이 달라진다.
  (3) 고용노동부 활용 가이드 Q8의 경과 적용 — 11월 27일 전에 이미 유급 2일을 소진한 사람도
      27일 이후 쓰는 추가 2일을 유급으로 받는다. 올해 치료를 시작한 사람에게 가장 실질적인 정보인데
      보도자료 본문에는 없고 첨부 가이드에만 있다.
  여기에 신청 기한(휴가 시작 1개월 후 ~ 종료 12개월 이내)과 진단서를 복지부 시술비 지원 결정통지서로
  대체하는 2026년 5월 간소화를 붙이면, 읽는 사람이 11월 27일 전후로 무엇을 해야 하는지가 정리된다.
  독자가 얻는 것: 내 회사 규모로 내가 받을 수 있는 돈의 출처와 금액, 지금 2일을 써도 손해가 아닌 이유,
  그리고 휴가를 시작한 뒤 한 달이 지나야 신청할 수 있다는 기한 함정.
  주의: 개인별 통상임금을 계산해 주지 말 것(사업장 산정). "무조건 336,840원을 받는다"로 쓰지 말 것 —
  통상임금이 상한보다 적으면 통상임금만큼만이다. 우선지원대상기업 해당 여부를 독자 업종으로 단정하지 말 것.
  11월 27일 이전 사용분에 대해 "4일이 새로 생긴다"로 쓰지 말 것(가이드 Q8은 연 6일 한도 안에서의 처리다).
  난임 시술 자체에 대한 의학적 조언 금지. 지식iN 등 커뮤니티 문장 유입 금지.
