human_notes: |
  차별화: '출산전후휴가 = 엄마의 90일'과 '배우자 출산휴가(아빠)', '육아휴직'을 누가·며칠·
  얼마로 한 표에 대비 — 이용자가 가장 많이 헷갈리는 세 제도를 명확히 분리. 우선지원대상기업 vs
  대규모기업의 유급 구간 차이(대규모기업 최초 60일 사업주 부담)를 정확히. 상한액은 연도별로
  바뀌므로 2026년 기준 확인하고 '월 상한 있음'을 명시. 신청 기한(종료 후 12개월) 놓치면
  소멸됨을 강조. "무조건 통상임금 100% 다 나온다" 오해(상한 존재) 교정.
  검수 포인트: 90일/120일, 출산 후 45일/60일, 피보험단위기간 180일, 상한액 2026 기준 정확히.
