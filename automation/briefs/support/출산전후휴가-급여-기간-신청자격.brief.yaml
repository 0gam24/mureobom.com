target_query: "출산전후휴가 급여 기간 90일 신청자격 상한액 배우자 출산휴가와 차이"
search_intent: 절차형     # 며칠 쉬고 얼마 받는지 + 어떻게 신청하는지 함께 원함

signal:                  # 스캐너 산출(읽기 전용, 원문 아님 — 집계 수치만)
  score: 77.0
  trend_momentum: 0.58
  question_volume: 0.58
  cluster_fit: 1.0
  freshness: 0.5

must_cover:
  - 출산전후휴가 기본 구조(단태아 90일·다태아 120일, 출산 후 최소 45일(다태아 60일) 확보 원칙)
  - 유급 여부(우선지원대상기업은 90일 전체 고용보험 지원, 대규모기업은 최초 60일 사업주 유급+이후 30일 고용보험)
  - 출산전후휴가 급여 지급액(통상임금 100% 기준)과 고용보험 지원 상한액·하한액(월 상한 존재)
  - 신청 자격(고용보험 피보험단위기간 180일 이상 등)과 신청 기한(휴가 시작 후 1개월~종료 후 12개월 이내)
  - 신청 절차·서류(출산전후휴가 확인서, 급여 신청서, 통상임금 확인 자료 — 고용24/관할 고용센터)
  - 배우자 출산휴가·육아휴직과의 구분(누가·언제·며칠, 중복/연계 여부)

required_sources:        # 공식 1차 출처만. 신호는 집계 수치만. 0건이면 발행 차단
  - "근로기준법 제74조(임산부의 보호) / 고용보험법 제75~77조 (국가법령정보센터 law.go.kr)"
  - "고용노동부 출산전후휴가 급여 안내 (moel.go.kr)"
  - "고용보험 누리집 출산전후휴가 급여 신청 안내 (ei.go.kr / 고용24 work24.go.kr)"

