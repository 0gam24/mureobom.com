human_notes: |
  차별화: 기발행 기초생활 글(생계급여 신청자격)과 달리 '해산급여·장제급여'라는 별도 급여 유형 자체를 단독으로 다룸 — 흩어진 출산·장례 지원 정보를 한 글로. 지급액과 신청처를 한 표로 정리.
  금액(해산급여 출생영아 1인당·장제급여 1구당)은 복지로/정부24 최신 고시로 대조 확인, 렌더 확인된 수치만 인용. 미확인 수치 단정 금지.
  민감 주제(사망·출산)이나 정보 제공 프레임 유지, 의료·법률 자문 아님 고지.
