<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" font-family="'IBM Plex Sans KR', system-ui, sans-serif">
  <rect x="0" y="0" width="1200" height="900" fill="#FBF7F0"/>

  <text x="60" y="76" font-size="42" font-weight="700" fill="#1A2B2A">휴면 1.5조원 vs 장기미거래 14.2조원</text>
  <text x="60" y="118" font-size="22" fill="#4A5856">2025년말 기준, 숨은 금융자산 합계 15조 7,034억원의 구성</text>
  <text x="1140" y="118" font-size="23" font-weight="700" fill="#0A5F58" text-anchor="end">142,015 ÷ 15,019 ≈ 9.5배</text>

  <rect x="60" y="170" width="103" height="86" fill="#C2873B"/>
  <rect x="163" y="170" width="977" height="86" fill="#0E7C72"/>
  <text x="200" y="222" font-size="29" font-weight="700" fill="#FBF7F0">장기미거래 금융자산 142,015억원 (90.4%)</text>
  <line x1="111" y1="256" x2="111" y2="274" stroke="#C2873B" stroke-width="3"/>
  <text x="60" y="300" font-size="24" font-weight="700" fill="#C2873B">휴면금융자산 15,019억원 (9.6%)</text>
  <text x="60" y="340" font-size="24" fill="#1A2B2A">합계 157,034억원의 90%는 휴면이 아닌 장기미거래 단계에 있습니다.</text>

  <line x1="60" y1="366" x2="1140" y2="366" stroke="#E3DCCF" stroke-width="2"/>

  <text x="60" y="412" font-size="29" font-weight="700" fill="#1A2B2A">자산군별 구성 (단위: 억원)</text>
  <rect x="640" y="394" width="20" height="20" fill="#C2873B"/>
  <text x="670" y="411" font-size="21" fill="#4A5856">휴면</text>
  <rect x="770" y="394" width="20" height="20" fill="#0E7C72"/>
  <text x="800" y="411" font-size="21" fill="#4A5856">장기미거래</text>

  <text x="60" y="478" font-size="26" font-weight="700" fill="#1A2B2A">예·적금</text>
  <rect x="190" y="450" width="31" height="44" fill="#C2873B"/>
  <rect x="221" y="450" width="610" height="44" fill="#0E7C72"/>
  <text x="860" y="470" font-size="22" fill="#1A2B2A">계 78,167 (49.8%)</text>
  <text x="860" y="492" font-size="19" fill="#4A5856">휴면 3,825 / 장기 74,342</text>

  <text x="60" y="568" font-size="26" font-weight="700" fill="#1A2B2A">보험금</text>
  <rect x="190" y="540" width="54" height="44" fill="#C2873B"/>
  <rect x="244" y="540" width="426" height="44" fill="#0E7C72"/>
  <text x="860" y="560" font-size="22" fill="#1A2B2A">계 58,478 (37.2%)</text>
  <text x="860" y="582" font-size="19" fill="#4A5856">휴면 6,583 / 장기 51,895</text>

  <text x="60" y="658" font-size="26" font-weight="700" fill="#1A2B2A">증권</text>
  <rect x="190" y="630" width="31" height="44" fill="#C2873B"/>
  <rect x="221" y="630" width="128" height="44" fill="#0E7C72"/>
  <text x="860" y="650" font-size="22" fill="#1A2B2A">계 19,382 (12.3%)</text>
  <text x="860" y="672" font-size="19" fill="#4A5856">휴면 3,762 / 장기 15,620</text>

  <text x="60" y="748" font-size="26" font-weight="700" fill="#1A2B2A">신탁</text>
  <rect x="190" y="720" width="8" height="44" fill="#C2873B"/>
  <rect x="198" y="720" width="4" height="44" fill="#0E7C72"/>
  <text x="860" y="740" font-size="22" fill="#1A2B2A">계 1,007 (0.6%)</text>
  <text x="860" y="762" font-size="19" fill="#4A5856">휴면 849 / 장기 158</text>

  <rect x="60" y="792" width="1080" height="68" rx="10" fill="#E3F0EE"/>
  <text x="84" y="822" font-size="23" font-weight="700" fill="#0A5F58">신탁만 휴면(849)이 장기미거래(158)보다 큽니다.</text>
  <text x="84" y="848" font-size="20" fill="#4A5856">예·적금은 장기미거래가 약 19배, 보험금은 약 8배, 증권은 약 4배로 반대 방향입니다.</text>

  <text x="60" y="886" font-size="18" fill="#8A938F">출처: 금융위원회·금융감독원 공동 보도자료(2026년 9월 28일 배포), 2025년말 기준</text>
</svg>
