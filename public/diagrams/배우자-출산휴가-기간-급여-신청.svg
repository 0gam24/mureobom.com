<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 640" role="img" aria-label="배우자 출산휴가 기간 20일, 청구기한 120일, 분할 최대 3회, 급여 상한 1,684,210원, 신청 절차 요약" font-family="'IBM Plex Sans KR', system-ui, sans-serif">
  <rect x="0" y="0" width="820" height="640" fill="#FBF7F0"/>

  <text x="40" y="46" font-size="26" font-weight="700" fill="#1A2B2A">배우자 출산휴가 한눈에 보기</text>
  <text x="40" y="72" font-size="14" fill="#4A5856">2025.2.23. 개정 시행 현행 기준</text>

  <!-- 기간 3패널 -->
  <g>
    <rect x="40" y="96" width="230" height="96" rx="10" fill="#E3F0EE" stroke="#E3DCCF"/>
    <text x="155" y="128" font-size="15" fill="#4A5856" text-anchor="middle">휴가 기간</text>
    <text x="155" y="162" font-size="30" font-weight="700" fill="#0A5F58" text-anchor="middle">20일</text>
    <text x="155" y="183" font-size="12" fill="#8A938F" text-anchor="middle">전부 유급, 과거 10일</text>
  </g>
  <g>
    <rect x="295" y="96" width="230" height="96" rx="10" fill="#E3F0EE" stroke="#E3DCCF"/>
    <text x="410" y="128" font-size="15" fill="#4A5856" text-anchor="middle">청구 기한</text>
    <text x="410" y="162" font-size="30" font-weight="700" fill="#0A5F58" text-anchor="middle">120일</text>
    <text x="410" y="183" font-size="12" fill="#8A938F" text-anchor="middle">출산일부터, 과거 90일</text>
  </g>
  <g>
    <rect x="550" y="96" width="230" height="96" rx="10" fill="#E3F0EE" stroke="#E3DCCF"/>
    <text x="665" y="128" font-size="15" fill="#4A5856" text-anchor="middle">분할 사용</text>
    <text x="665" y="162" font-size="30" font-weight="700" fill="#0A5F58" text-anchor="middle">최대 3회</text>
    <text x="665" y="183" font-size="12" fill="#8A938F" text-anchor="middle">과거 1회</text>
  </g>

  <!-- 급여 패널 -->
  <rect x="40" y="216" width="740" height="118" rx="10" fill="#F4EEE2" stroke="#E3DCCF"/>
  <text x="60" y="246" font-size="16" font-weight="700" fill="#1A2B2A">고용보험 배우자 출산휴가급여</text>
  <text x="60" y="274" font-size="13" fill="#4A5856">대상: 우선지원대상기업 근로자, 피보험 단위기간 통산 180일 이상</text>
  <text x="60" y="298" font-size="13" fill="#4A5856">지원 기간: 휴가 20일 전체분 (과거에는 최초 5일분)</text>
  <g>
    <rect x="520" y="238" width="240" height="78" rx="8" fill="#FBF7F0" stroke="#C2873B"/>
    <text x="640" y="266" font-size="13" fill="#4A5856" text-anchor="middle">급여 상한액 (20일분)</text>
    <text x="640" y="298" font-size="26" font-weight="700" fill="#C2873B" text-anchor="middle">1,684,210원</text>
  </g>

  <!-- 신청 절차 흐름 -->
  <text x="40" y="380" font-size="16" font-weight="700" fill="#1A2B2A">신청 절차 3단계</text>
  <g>
    <rect x="40" y="398" width="220" height="150" rx="10" fill="#F4EEE2" stroke="#E3DCCF"/>
    <circle cx="70" cy="428" r="15" fill="#0E7C72"/>
    <text x="70" y="433" font-size="15" font-weight="700" fill="#FBF7F0" text-anchor="middle">1</text>
    <text x="95" y="433" font-size="15" font-weight="700" fill="#1A2B2A">회사에 휴가 신청</text>
    <text x="60" y="464" font-size="12.5" fill="#4A5856">사업주는 20일 부여 의무.</text>
    <text x="60" y="486" font-size="12.5" fill="#4A5856">거부, 불리한 처우 금지.</text>
    <text x="60" y="508" font-size="12.5" fill="#4A5856">사용 기간은 유급 처리.</text>
  </g>
  <g>
    <rect x="300" y="398" width="220" height="150" rx="10" fill="#F4EEE2" stroke="#E3DCCF"/>
    <circle cx="330" cy="428" r="15" fill="#0E7C72"/>
    <text x="330" y="433" font-size="15" font-weight="700" fill="#FBF7F0" text-anchor="middle">2</text>
    <text x="355" y="433" font-size="15" font-weight="700" fill="#1A2B2A">확인서 제출</text>
    <text x="320" y="464" font-size="12.5" fill="#4A5856">배우자 출산휴가</text>
    <text x="320" y="486" font-size="12.5" fill="#4A5856">확인서 사전 제출.</text>
    <text x="320" y="508" font-size="12.5" fill="#4A5856">통상임금, 관계 증명 서류.</text>
  </g>
  <g>
    <rect x="560" y="398" width="220" height="150" rx="10" fill="#F4EEE2" stroke="#E3DCCF"/>
    <circle cx="590" cy="428" r="15" fill="#0E7C72"/>
    <text x="590" y="433" font-size="15" font-weight="700" fill="#FBF7F0" text-anchor="middle">3</text>
    <text x="615" y="433" font-size="15" font-weight="700" fill="#1A2B2A">급여 신청</text>
    <text x="580" y="464" font-size="12.5" fill="#4A5856">고용24 온라인, 고용센터.</text>
    <text x="580" y="486" font-size="12.5" fill="#4A5856">휴가 시작 1개월 후부터</text>
    <text x="580" y="508" font-size="12.5" fill="#4A5856">종료 12개월 이내.</text>
  </g>
  <text x="270" y="478" font-size="22" fill="#8A938F" text-anchor="middle">&#8594;</text>
  <text x="530" y="478" font-size="22" fill="#8A938F" text-anchor="middle">&#8594;</text>

  <text x="40" y="592" font-size="12.5" fill="#4A5856">대규모기업 근로자는 고용보험 급여 지원 대상이 아니며, 20일 유급은 사업주가 전액 부담해요.</text>
  <text x="40" y="616" font-size="11.5" fill="#8A938F">출처: 남녀고용평등법 제18조의2, 고용노동부 고용24 제도안내. 물어봄 정리.</text>
</svg>
