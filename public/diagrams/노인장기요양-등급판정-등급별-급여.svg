<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 660" font-family="'IBM Plex Sans KR', system-ui, sans-serif" role="img" aria-label="노인장기요양 등급별 점수구간과 이용 급여, 월 한도액 표">
  <rect x="0" y="0" width="820" height="660" fill="#FBF7F0"/>
  <text x="24" y="40" font-size="24" font-weight="700" fill="#1A2B2A">노인장기요양 등급별 점수구간과 급여</text>
  <text x="24" y="66" font-size="14" fill="#4A5856">장기요양인정 점수(높을수록 도움 필요) · 2026년 재가급여 월 한도액 기준</text>

  <!-- header row -->
  <rect x="24" y="84" width="772" height="40" fill="#0A5F58"/>
  <text x="40" y="110" font-size="14" font-weight="700" fill="#FBF7F0">등급</text>
  <text x="150" y="110" font-size="14" font-weight="700" fill="#FBF7F0">인정점수</text>
  <text x="300" y="110" font-size="14" font-weight="700" fill="#FBF7F0">심신상태</text>
  <text x="470" y="110" font-size="14" font-weight="700" fill="#FBF7F0">이용 급여</text>
  <text x="660" y="110" font-size="14" font-weight="700" fill="#FBF7F0">월 한도액</text>

  <!-- row 1 -->
  <rect x="24" y="124" width="772" height="72" fill="#E3F0EE"/>
  <text x="40" y="165" font-size="15" font-weight="700" fill="#0A5F58">1등급</text>
  <text x="150" y="165" font-size="14" fill="#1A2B2A">95점 이상</text>
  <text x="300" y="158" font-size="13" fill="#1A2B2A">전적으로</text>
  <text x="300" y="176" font-size="13" fill="#1A2B2A">도움 필요</text>
  <text x="470" y="158" font-size="13" fill="#1A2B2A">재가급여 6종</text>
  <text x="470" y="176" font-size="13" fill="#1A2B2A">+ 시설급여(원칙)</text>
  <text x="660" y="165" font-size="14" font-weight="700" fill="#1A2B2A">2,512,900원</text>

  <!-- row 2 -->
  <rect x="24" y="196" width="772" height="72" fill="#F4EEE2"/>
  <text x="40" y="237" font-size="15" font-weight="700" fill="#0A5F58">2등급</text>
  <text x="150" y="237" font-size="14" fill="#1A2B2A">75~95점 미만</text>
  <text x="300" y="230" font-size="13" fill="#1A2B2A">상당 부분</text>
  <text x="300" y="248" font-size="13" fill="#1A2B2A">도움 필요</text>
  <text x="470" y="230" font-size="13" fill="#1A2B2A">재가급여 6종</text>
  <text x="470" y="248" font-size="13" fill="#1A2B2A">+ 시설급여(원칙)</text>
  <text x="660" y="237" font-size="14" font-weight="700" fill="#1A2B2A">2,331,200원</text>

  <!-- row 3 -->
  <rect x="24" y="268" width="772" height="72" fill="#E3F0EE"/>
  <text x="40" y="309" font-size="15" font-weight="700" fill="#0A5F58">3등급</text>
  <text x="150" y="309" font-size="14" fill="#1A2B2A">60~75점 미만</text>
  <text x="300" y="302" font-size="13" fill="#1A2B2A">부분적</text>
  <text x="300" y="320" font-size="13" fill="#1A2B2A">도움 필요</text>
  <text x="470" y="302" font-size="13" fill="#1A2B2A">재가급여 6종</text>
