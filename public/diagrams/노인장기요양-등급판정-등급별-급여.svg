  <text x="660" y="309" font-size="14" font-weight="700" fill="#1A2B2A">1,528,200원</text>

  <!-- row 4 -->
  <rect x="24" y="340" width="772" height="72" fill="#F4EEE2"/>
  <text x="40" y="381" font-size="15" font-weight="700" fill="#0A5F58">4등급</text>
  <text x="150" y="381" font-size="14" fill="#1A2B2A">51~60점 미만</text>
  <text x="300" y="374" font-size="13" fill="#1A2B2A">일정 부분</text>
  <text x="300" y="392" font-size="13" fill="#1A2B2A">도움 필요</text>
  <text x="470" y="374" font-size="13" fill="#1A2B2A">재가급여 6종</text>
  <text x="470" y="392" font-size="13" fill="#4A5856">(시설급여는 예외 인정)</text>
  <text x="660" y="381" font-size="14" font-weight="700" fill="#1A2B2A">1,409,700원</text>

  <!-- row 5 -->
  <rect x="24" y="412" width="772" height="72" fill="#E3F0EE"/>
  <text x="40" y="447" font-size="15" font-weight="700" fill="#0A5F58">5등급</text>
  <text x="40" y="465" font-size="11" fill="#4A5856">(치매)</text>
  <text x="150" y="453" font-size="14" fill="#1A2B2A">45~51점 미만</text>
  <text x="300" y="446" font-size="13" fill="#1A2B2A">치매환자</text>
  <text x="300" y="464" font-size="12" fill="#4A5856">(노인성 질병)</text>
  <text x="470" y="446" font-size="13" fill="#1A2B2A">재가급여 중심</text>
  <text x="470" y="464" font-size="13" fill="#4A5856">(시설급여는 예외 인정)</text>
