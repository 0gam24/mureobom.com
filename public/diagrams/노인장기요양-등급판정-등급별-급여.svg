  <!-- row 6 -->
  <rect x="24" y="484" width="772" height="72" fill="#F4EEE2"/>
  <text x="40" y="519" font-size="15" font-weight="700" fill="#C2873B">인지지원</text>
  <text x="40" y="537" font-size="11" fill="#4A5856">(경증치매)</text>
  <text x="150" y="525" font-size="14" fill="#1A2B2A">45점 미만</text>
  <text x="300" y="518" font-size="13" fill="#1A2B2A">경증치매</text>
  <text x="300" y="536" font-size="12" fill="#4A5856">(인지 기능 저하)</text>
  <text x="470" y="518" font-size="13" fill="#1A2B2A">주야간보호 등</text>
  <text x="470" y="536" font-size="13" fill="#4A5856">일부 급여로 제한</text>
  <text x="660" y="525" font-size="14" font-weight="700" fill="#1A2B2A">676,320원</text>

  <!-- footer -->
  <line x1="24" y1="572" x2="796" y2="572" stroke="#E3DCCF" stroke-width="1"/>
  <rect x="24" y="586" width="16" height="16" fill="#0E7C72"/>
  <text x="48" y="599" font-size="13" fill="#1A2B2A">본인부담률: 재가급여 15% · 시설급여 20% (감경 대상은 60% 또는 40% 감경)</text>
  <text x="24" y="632" font-size="12" fill="#8A938F">근거: 노인장기요양보험법 시행령 제7조(등급판정기준) · 국민건강보험공단 2026년 급여비용 안내</text>
  <text x="24" y="652" font-size="12" fill="#8A938F">인정 유효기간 최소 2년 · 급여 종류·한도액은 연도별로 변동될 수 있어요</text>
</svg>
