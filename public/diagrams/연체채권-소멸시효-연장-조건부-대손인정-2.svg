<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-label="조건부 대손인정 제도의 발표·사전예고·시행 알림 날짜를 2026년 2월 26일, 6월 10일, 6월 17일, 10월 12일 네 단계 타임라인으로 두고, 아직 계획 또는 추진 단계로만 확인되는 네 항목을 아래에 따로 모아 구분한 도표" font-family="'IBM Plex Sans KR', system-ui, sans-serif">
  <rect x="0" y="0" width="960" height="600" fill="#FBF7F0"/>

  <text x="44" y="48" font-size="25" font-weight="700" fill="#1A2B2A">발표에서 시행까지, 그리고 아직 계획인 것</text>
  <text x="44" y="76" font-size="13.5" fill="#4A5856">금융위원회·금융감독원 보도자료만으로 확인한 단계 구분. 정보 기준일 2026년 10월 12일</text>

  <g>
    <rect x="44" y="104" width="204" height="196" rx="10" fill="#F4EEE2" stroke="#E3DCCF"/>
    <rect x="44" y="104" width="204" height="32" rx="10" fill="#C2873B"/>
    <text x="146" y="126" font-size="14.5" font-weight="700" fill="#FBF7F0" text-anchor="middle">2026.2.26.</text>
    <text x="62" y="164" font-size="13" fill="#8A938F">금융위원회</text>
    <text x="62" y="190" font-size="13.5" font-weight="700" fill="#1A2B2A">제2차 포용적 금융</text>
    <text x="62" y="210" font-size="13.5" font-weight="700" fill="#1A2B2A">대전환 회의</text>
    <text x="62" y="240" font-size="12.5" fill="#4A5856">시효 연장 관행 개혁을</text>
    <text x="62" y="260" font-size="12.5" fill="#4A5856">과제로 제시</text>
    <text x="62" y="286" font-size="12" fill="#C2873B">방향 발표 단계</text>
  </g>

  <g>
    <rect x="266" y="104" width="204" height="196" rx="10" fill="#F4EEE2" stroke="#E3DCCF"/>
    <rect x="266" y="104" width="204" height="32" rx="10" fill="#C2873B"/>
    <text x="368" y="126" font-size="14.5" font-weight="700" fill="#FBF7F0" text-anchor="middle">2026.6.10.</text>
    <text x="284" y="164" font-size="13" fill="#8A938F">금융위원회</text>
    <text x="284" y="190" font-size="13.5" font-weight="700" fill="#1A2B2A">금융기관채권</text>
    <text x="284" y="210" font-size="13.5" font-weight="700" fill="#1A2B2A">대손인정업무세칙</text>
    <text x="284" y="240" font-size="12.5" fill="#4A5856">개정안 사전예고</text>
    <text x="284" y="260" font-size="12.5" fill="#4A5856">예고기간 6.11.~7.21.</text>
    <text x="284" y="286" font-size="12" fill="#C2873B">40일 의견수렴</text>
  </g>

  <g>
    <rect x="488" y="104" width="204" height="196" rx="10" fill="#F4EEE2" stroke="#E3DCCF"/>
    <rect x="488" y="104" width="204" height="32" rx="10" fill="#C2873B"/>
    <text x="590" y="126" font-size="14.5" font-weight="700" fill="#FBF7F0" text-anchor="middle">2026.6.17.</text>
    <text x="506" y="164" font-size="13" fill="#8A938F">금융위원회</text>
    <text x="506" y="190" font-size="13.5" font-weight="700" fill="#1A2B2A">채권추심·대출채권</text>
    <text x="506" y="210" font-size="13.5" font-weight="700" fill="#1A2B2A">매각 가이드라인</text>
    <text x="506" y="240" font-size="12.5" fill="#4A5856">개정안 사전예고</text>
    <text x="506" y="260" font-size="12.5" fill="#4A5856">예고기간 6.18.~7.8.</text>
    <text x="506" y="286" font-size="12" fill="#C2873B">20일 의견수렴</text>
  </g>

  <g>
    <rect x="710" y="104" width="204" height="196" rx="10" fill="#E3F0EE" stroke="#0E7C72"/>
    <rect x="710" y="104" width="204" height="32" rx="10" fill="#0A5F58"/>
    <text x="812" y="126" font-size="14.5" font-weight="700" fill="#FBF7F0" text-anchor="middle">2026.10.12.</text>
    <text x="728" y="164" font-size="13" fill="#4A5856">금융감독원</text>
    <text x="728" y="190" font-size="13.5" font-weight="700" fill="#0A5F58">조건부 대손인정</text>
    <text x="728" y="210" font-size="13.5" font-weight="700" fill="#0A5F58">제도 시행 알림</text>
    <text x="728" y="240" font-size="12.5" fill="#4A5856">보도자료 제목으로</text>
    <text x="728" y="260" font-size="12.5" fill="#4A5856">시행 사실 확인</text>
    <text x="728" y="286" font-size="12" fill="#B5462F">자료에 시행일 문장 없음</text>
  </g>

  <rect x="44" y="326" width="872" height="162" rx="10" fill="#F4EEE2" stroke="#B5462F"/>
  <text x="66" y="354" font-size="15.5" font-weight="700" fill="#B5462F">아직 계획 또는 추진 단계로만 확인되는 것</text>
  <text x="66" y="386" font-size="13.5" fill="#1A2B2A">채권추심 및 대출채권 매각 가이드라인 개정 (7월 중 개정 완료 후 즉시 시행 계획까지만 확인)</text>
  <text x="66" y="412" font-size="13.5" fill="#1A2B2A">개인채무자보호법 감독규정 개정 (7월 중 시행 계획까지만 확인)</text>
  <text x="66" y="438" font-size="13.5" fill="#1A2B2A">업권별 소멸시효 관리 모범규준 개정 (8월 중 개정 예정으로 발표, 채무자 통지·3년 재심사 포함)</text>
  <text x="66" y="464" font-size="13.5" fill="#1A2B2A">지급명령 공시송달 특례 폐지 (소송촉진 등에 관한 특례법 개정 추진, 현재 26개 기관 적용)</text>

  <text x="44" y="556" font-size="11.5" fill="#8A938F">출처: 금융위원회 보도자료(2026.2.26.·2026.6.10.·2026.6.17.·2026.7.15.), 금융감독원 보도자료(2026.10.12.). 물어봄 정리.</text>
</svg>
