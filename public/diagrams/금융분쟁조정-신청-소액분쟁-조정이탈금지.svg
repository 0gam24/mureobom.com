<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" font-family="'IBM Plex Sans KR', system-ui, sans-serif">
  <rect x="0" y="0" width="1200" height="900" fill="#FBF7F0"/>

  <text x="60" y="66" font-size="40" font-weight="700" fill="#1A2B2A">금융분쟁조정 기한 사슬과 2천만원 특례</text>
  <text x="60" y="106" font-size="22" fill="#4A5856">금융소비자보호법 제36조·제39조·제40조·제41조·제42조 및 시행령 제33조·제36조 기준</text>
  <line x1="60" y1="128" x2="1140" y2="128" stroke="#E3DCCF" stroke-width="2"/>

  <text x="60" y="168" font-size="27" font-weight="700" fill="#0A5F58">법정 기한 사슬</text>

  <!-- row 1 -->
  <rect x="60" y="190" width="560" height="94" rx="10" fill="#F4EEE2" stroke="#E3DCCF" stroke-width="2"/>
  <rect x="78" y="208" width="104" height="58" rx="8" fill="#0E7C72"/>
  <text x="130" y="246" font-size="25" font-weight="700" fill="#FBF7F0" text-anchor="middle">D+0</text>
  <text x="202" y="230" font-size="25" font-weight="700" fill="#1A2B2A">분쟁조정 신청 접수</text>
  <text x="202" y="262" font-size="22" fill="#4A5856">금융감독원장에게 신청, 서식 없음</text>
  <path d="M328 290 L352 290 L340 306 Z" fill="#C2873B"/>

  <!-- row 2 -->
  <rect x="60" y="310" width="560" height="94" rx="10" fill="#F4EEE2" stroke="#E3DCCF" stroke-width="2"/>
  <rect x="78" y="328" width="104" height="58" rx="8" fill="#0E7C72"/>
  <text x="130" y="366" font-size="25" font-weight="700" fill="#FBF7F0" text-anchor="middle">30일</text>
  <text x="202" y="350" font-size="25" font-weight="700" fill="#1A2B2A">합의권고 기간</text>
  <text x="202" y="382" font-size="22" fill="#4A5856">미합의 시 지체 없이 위원회 회부</text>
  <path d="M328 410 L352 410 L340 426 Z" fill="#C2873B"/>

  <!-- row 3 -->
  <rect x="60" y="430" width="560" height="94" rx="10" fill="#E3F0EE" stroke="#0E7C72" stroke-width="2"/>
  <rect x="78" y="448" width="104" height="58" rx="8" fill="#C2873B"/>
  <text x="130" y="486" font-size="25" font-weight="700" fill="#FBF7F0" text-anchor="middle">회부</text>
  <text x="202" y="470" font-size="25" font-weight="700" fill="#1A2B2A">조정위원회 심의 개시</text>
  <text x="202" y="502" font-size="22" fill="#4A5856">회부일부터 작성 기한 기산</text>
  <path d="M328 530 L352 530 L340 546 Z" fill="#C2873B"/>

  <!-- row 4 -->
  <rect x="60" y="550" width="560" height="94" rx="10" fill="#F4EEE2" stroke="#E3DCCF" stroke-width="2"/>
  <rect x="78" y="568" width="104" height="58" rx="8" fill="#0E7C72"/>
  <text x="130" y="606" font-size="25" font-weight="700" fill="#FBF7F0" text-anchor="middle">60일</text>
  <text x="202" y="590" font-size="25" font-weight="700" fill="#1A2B2A">조정안 작성 기한</text>
  <text x="202" y="622" font-size="22" fill="#4A5856">심의 후 당사자에게 조정안 제시</text>
  <path d="M328 650 L352 650 L340 666 Z" fill="#C2873B"/>

  <!-- row 5 -->
  <rect x="60" y="670" width="560" height="94" rx="10" fill="#F4EEE2" stroke="#E3DCCF" stroke-width="2"/>
  <rect x="78" y="688" width="104" height="58" rx="8" fill="#0E7C72"/>
  <text x="130" y="726" font-size="25" font-weight="700" fill="#FBF7F0" text-anchor="middle">20일</text>
  <text x="202" y="710" font-size="25" font-weight="700" fill="#1A2B2A">수락 기한</text>
  <text x="202" y="742" font-size="22" fill="#4A5856">무응답은 불수락으로 간주</text>

  <text x="60" y="792" font-size="22" fill="#8A938F">법정 기한을 더하면 30+60+20 = 110일 (보완·조사 기간은 별도)</text>

  <!-- right panel -->
  <rect x="650" y="190" width="490" height="574" rx="12" fill="#F4EEE2" stroke="#E3DCCF" stroke-width="2"/>
  <text x="676" y="234" font-size="28" font-weight="700" fill="#0A5F58">2천만원 이하 소액분쟁</text>
  <text x="676" y="266" font-size="22" fill="#4A5856">일반금융소비자가 신청한 사건</text>

  <rect x="672" y="286" width="446" height="104" rx="8" fill="#E3F0EE"/>
  <text x="694" y="320" font-size="24" font-weight="700" fill="#0A5F58">조정이탈금지 (제42조)</text>
  <text x="694" y="350" font-size="22" fill="#1A2B2A">조정안 제시 전까지</text>
  <text x="694" y="378" font-size="22" fill="#1A2B2A">금융회사는 소 제기 불가</text>

  <rect x="672" y="402" width="446" height="104" rx="8" fill="#E3F0EE"/>
  <text x="694" y="436" font-size="24" font-weight="700" fill="#0A5F58">소송중지 (제41조)</text>
  <text x="694" y="466" font-size="22" fill="#1A2B2A">법원은 조정까지 소송 중지</text>
  <text x="694" y="494" font-size="22" fill="#1A2B2A">중지 안 되면 조정이 중지</text>

  <rect x="672" y="518" width="446" height="104" rx="8" fill="#E3F0EE"/>
  <text x="694" y="552" font-size="24" font-weight="700" fill="#0A5F58">시효중단 (제40조)</text>
  <text x="694" y="582" font-size="22" fill="#1A2B2A">신청만으로 중단, 거절 시</text>
  <text x="694" y="610" font-size="22" fill="#1A2B2A">1개월 내 청구로 소급</text>

  <rect x="672" y="634" width="446" height="106" rx="8" fill="#FBF7F0" stroke="#B5462F" stroke-width="2"/>
  <text x="694" y="668" font-size="22" font-weight="700" fill="#B5462F">금지가 풀리는 단서 2가지</text>
  <text x="694" y="698" font-size="22" fill="#1A2B2A">회부 거절 서면통지 수령</text>
  <text x="694" y="726" font-size="22" fill="#1A2B2A">60일 내 조정안 미제시</text>

  <!-- bottom strip -->
  <rect x="60" y="818" width="1080" height="62" rx="10" fill="#E3F0EE" stroke="#0E7C72" stroke-width="2"/>
  <text x="84" y="846" font-size="23" font-weight="700" fill="#0A5F58">회부되지 않을 수 있는 경우 (시행령 제33조④)</text>
  <text x="84" y="872" font-size="22" fill="#1A2B2A">회부 전 소 제기 · 보완 요구 2회 이상 불응 · 신청인과 직접적인 이해관계 없음</text>
</svg>
