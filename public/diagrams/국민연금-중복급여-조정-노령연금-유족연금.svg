<svg viewBox="0 0 720 560" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Sans KR', system-ui, sans-serif">
  <rect x="0" y="0" width="720" height="560" fill="#FBF7F0"/>
  <text x="360" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#1A2B2A">국민연금 중복급여 조정, 선택 흐름</text>
  <text x="360" y="70" text-anchor="middle" font-size="14" fill="#4A5856">한 사람에게 급여가 둘 이상 생기면 하나만 선택 (국민연금법 제56조)</text>

  <!-- Top: two benefits arise -->
  <rect x="120" y="96" width="220" height="60" rx="10" fill="#F4EEE2" stroke="#E3DCCF" stroke-width="1.5"/>
  <text x="230" y="128" text-anchor="middle" font-size="16" font-weight="700" fill="#1A2B2A">본인 노령연금</text>
  <text x="230" y="147" text-anchor="middle" font-size="12.5" fill="#4A5856">이미 받는 중</text>

  <rect x="380" y="96" width="220" height="60" rx="10" fill="#F4EEE2" stroke="#E3DCCF" stroke-width="1.5"/>
  <text x="490" y="128" text-anchor="middle" font-size="16" font-weight="700" fill="#1A2B2A">배우자 유족연금</text>
  <text x="490" y="147" text-anchor="middle" font-size="12.5" fill="#4A5856">배우자 사망으로 발생</text>

  <!-- arrows down to selection -->
  <line x1="230" y1="156" x2="330" y2="196" stroke="#8A938F" stroke-width="2"/>
  <line x1="490" y1="156" x2="390" y2="196" stroke="#8A938F" stroke-width="2"/>

  <!-- selection node -->
  <rect x="250" y="196" width="220" height="52" rx="26" fill="#0E7C72"/>
  <text x="360" y="221" text-anchor="middle" font-size="15.5" font-weight="700" fill="#FBF7F0">둘 중 하나만 선택</text>
  <text x="360" y="239" text-anchor="middle" font-size="12" fill="#E3F0EE">나머지 급여는 지급 정지</text>

  <!-- branch arrows -->
  <line x1="300" y1="248" x2="200" y2="300" stroke="#0A5F58" stroke-width="2"/>
  <line x1="420" y1="248" x2="520" y2="300" stroke="#0A5F58" stroke-width="2"/>

  <!-- left branch: pick 노령연금 -->
  <rect x="40" y="300" width="300" height="150" rx="12" fill="#E3F0EE" stroke="#0E7C72" stroke-width="1.5"/>
  <text x="190" y="328" text-anchor="middle" font-size="16" font-weight="700" fill="#0A5F58">노령연금을 선택</text>
  <line x1="64" y1="342" x2="316" y2="342" stroke="#0E7C72" stroke-width="1" opacity="0.4"/>
  <text x="190" y="368" text-anchor="middle" font-size="14" fill="#1A2B2A">노령연금 전액 지급</text>
  <text x="190" y="394" text-anchor="middle" font-size="14" font-weight="700" fill="#C2873B">+ 유족연금액의 30% 추가</text>
  <text x="190" y="418" text-anchor="middle" font-size="12" fill="#4A5856">2016년 11월 30일 이후 (종전 20%)</text>
  <text x="190" y="438" text-anchor="middle" font-size="12" fill="#4A5856">제56조 제2항</text>

  <!-- right branch: pick 유족연금 -->
  <rect x="380" y="300" width="300" height="150" rx="12" fill="#F4EEE2" stroke="#E3DCCF" stroke-width="1.5"/>
  <text x="530" y="328" text-anchor="middle" font-size="16" font-weight="700" fill="#1A2B2A">유족연금을 선택</text>
  <line x1="404" y1="342" x2="656" y2="342" stroke="#E3DCCF" stroke-width="1"/>
  <text x="530" y="368" text-anchor="middle" font-size="14" fill="#1A2B2A">유족연금 전액 지급</text>
  <text x="530" y="394" text-anchor="middle" font-size="14" fill="#4A5856">노령연금은 지급 정지</text>
  <text x="530" y="418" text-anchor="middle" font-size="12" fill="#4A5856">추가 지급 없음</text>
  <text x="530" y="438" text-anchor="middle" font-size="12" fill="#4A5856">제56조 제1항</text>

  <!-- bottom note: 다른 법 조정 -->
  <rect x="40" y="472" width="640" height="66" rx="12" fill="#FBF7F0" stroke="#B5462F" stroke-width="1.5"/>
  <text x="60" y="498" font-size="13.5" font-weight="700" fill="#B5462F">다른 법 급여와 겹칠 때 (제113조)</text>
  <text x="60" y="520" font-size="12.5" fill="#4A5856">산재보험 등과 같은 사유로 겹치면 국민연금 장애·유족연금은 2분의 1만 지급</text>
  <text x="60" y="536" font-size="11.5" fill="#8A938F">실제 금액은 개인 가입이력에 따라 다름. 선택 전 국민연금공단(1355) 확인</text>
</svg>
