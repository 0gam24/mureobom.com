<svg viewBox="0 0 760 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="퇴직연금 유형별 중도인출과 담보대출 가능 여부 매트릭스">
  <rect x="0" y="0" width="760" height="560" fill="#FBF7F0"/>
  <text x="30" y="46" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="24" font-weight="700" fill="#1A2B2A">퇴직연금 유형별 중도인출·담보대출 가능 여부</text>
  <text x="30" y="72" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="14" fill="#4A5856">근로자퇴직급여 보장법 제7조·제22조, 시행령 제2조·제14조·제18조 기준</text>

  <!-- Matrix table -->
  <!-- header row -->
  <rect x="30" y="96" width="220" height="48" fill="#0A5F58"/>
  <rect x="250" y="96" width="240" height="48" fill="#0E7C72"/>
  <rect x="490" y="96" width="240" height="48" fill="#0E7C72"/>
  <text x="140" y="126" text-anchor="middle" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="15" font-weight="700" fill="#FBF7F0">제도 유형</text>
  <text x="370" y="126" text-anchor="middle" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="15" font-weight="700" fill="#FBF7F0">중도인출</text>
  <text x="610" y="126" text-anchor="middle" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="15" font-weight="700" fill="#FBF7F0">담보대출</text>

  <!-- DB row -->
  <rect x="30" y="144" width="220" height="80" fill="#F4EEE2"/>
  <rect x="250" y="144" width="240" height="80" fill="#FBF7F0"/>
  <rect x="490" y="144" width="240" height="80" fill="#E3F0EE"/>
  <text x="46" y="180" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="16" font-weight="700" fill="#1A2B2A">DB (확정급여형)</text>
  <text x="46" y="205" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="13" fill="#4A5856">회사가 운용·급여 확정</text>
  <text x="370" y="178" text-anchor="middle" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="16" font-weight="700" fill="#B5462F">불가</text>
  <text x="370" y="204" text-anchor="middle" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="12" fill="#4A5856">중도인출 규정 없음</text>
  <text x="610" y="178" text-anchor="middle" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="16" font-weight="700" fill="#0A5F58">가능</text>
  <text x="610" y="204" text-anchor="middle" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="12" fill="#4A5856">적립금의 50% 한도</text>

  <!-- DC row -->
  <rect x="30" y="224" width="220" height="80" fill="#F4EEE2"/>
  <rect x="250" y="224" width="240" height="80" fill="#E3F0EE"/>
  <rect x="490" y="224" width="240" height="80" fill="#E3F0EE"/>
  <text x="46" y="260" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="16" font-weight="700" fill="#1A2B2A">DC (확정기여형)</text>
  <text x="46" y="285" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="13" fill="#4A5856">근로자가 직접 운용</text>
  <text x="370" y="258" text-anchor="middle" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="16" font-weight="700" fill="#0A5F58">가능</text>
  <text x="370" y="284" text-anchor="middle" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="12" fill="#4A5856">법정 사유 한정</text>
  <text x="610" y="258" text-anchor="middle" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="16" font-weight="700" fill="#0A5F58">가능</text>
  <text x="610" y="284" text-anchor="middle" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="12" fill="#4A5856">적립금의 50% 한도</text>

  <!-- IRP row -->
  <rect x="30" y="304" width="220" height="80" fill="#F4EEE2"/>
  <rect x="250" y="304" width="240" height="80" fill="#E3F0EE"/>
  <rect x="490" y="304" width="240" height="80" fill="#E3F0EE"/>
  <text x="46" y="340" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="16" font-weight="700" fill="#1A2B2A">IRP (개인형)</text>
  <text x="46" y="365" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="13" fill="#4A5856">개인 계좌·이직 시 이전</text>
  <text x="370" y="338" text-anchor="middle" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="16" font-weight="700" fill="#0A5F58">가능</text>
  <text x="370" y="364" text-anchor="middle" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="12" fill="#4A5856">DC 사유 준용</text>
  <text x="610" y="338" text-anchor="middle" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="16" font-weight="700" fill="#0A5F58">가능</text>
  <text x="610" y="364" text-anchor="middle" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="12" fill="#4A5856">적립금의 50% 한도</text>

  <!-- reasons panel -->
  <rect x="30" y="410" width="700" height="126" rx="6" fill="#F4EEE2"/>
  <text x="46" y="438" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="15" font-weight="700" fill="#0A5F58">중도인출 허용 사유 (법정 한정 열거)</text>
  <text x="46" y="464" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="13" fill="#1A2B2A">· 무주택자 본인 명의 주택구입</text>
  <text x="46" y="486" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="13" fill="#1A2B2A">· 무주택자 주거목적 전세·보증금 (사업장당 1회)</text>
  <text x="46" y="508" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="13" fill="#1A2B2A">· 6개월 이상 요양 의료비 부담</text>
  <text x="400" y="464" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="13" fill="#1A2B2A">· 최근 5년 내 파산선고</text>
  <text x="400" y="486" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="13" fill="#1A2B2A">· 최근 5년 내 개인회생 개시결정</text>
  <text x="400" y="508" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="13" fill="#1A2B2A">· 천재지변 등 재난 피해</text>
  <text x="46" y="528" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="11.5" fill="#8A938F">생활비·투자 등 그 밖의 목적은 인출 불가. 담보대출 사유는 대학등록금·혼례비·장례비까지 더 넓음.</text>
</svg>
