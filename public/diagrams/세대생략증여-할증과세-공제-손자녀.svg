<svg viewBox="0 0 860 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="세대생략증여 할증 30%와 증여재산공제 구조" font-family="'IBM Plex Sans KR', system-ui, sans-serif">
  <rect x="0" y="0" width="860" height="640" fill="#FBF7F0"/>
  <text x="30" y="44" font-size="24" font-weight="700" fill="#1A2B2A">세대생략증여, 할증 30%와 공제 한눈에</text>
  <text x="30" y="70" font-size="14" fill="#4A5856">조부모가 자녀를 건너뛰고 손주에게 직접 증여할 때의 구조 (2026년 상증세법 기준)</text>

  <!-- 두 경로 비교 -->
  <rect x="30" y="90" width="390" height="230" rx="12" fill="#F4EEE2" stroke="#E3DCCF" stroke-width="1"/>
  <text x="50" y="120" font-size="16" font-weight="700" fill="#0A5F58">경로 A. 부모 거쳐 두 번</text>
  <rect x="50" y="136" width="90" height="42" rx="8" fill="#E3F0EE" stroke="#0E7C72" stroke-width="1"/>
  <text x="95" y="162" font-size="14" font-weight="700" fill="#1A2B2A" text-anchor="middle">조부모</text>
  <text x="200" y="162" font-size="13" fill="#4A5856" text-anchor="middle">증여 1회</text>
  <path d="M146 157 H255" stroke="#0E7C72" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <rect x="262" y="136" width="90" height="42" rx="8" fill="#E3F0EE" stroke="#0E7C72" stroke-width="1"/>
  <text x="307" y="162" font-size="14" font-weight="700" fill="#1A2B2A" text-anchor="middle">부모</text>
  <rect x="50" y="216" width="90" height="42" rx="8" fill="#E3F0EE" stroke="#0E7C72" stroke-width="1"/>
  <text x="95" y="242" font-size="14" font-weight="700" fill="#1A2B2A" text-anchor="middle">부모</text>
  <text x="200" y="242" font-size="13" fill="#4A5856" text-anchor="middle">증여 2회</text>
  <path d="M146 237 H255" stroke="#0E7C72" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <rect x="262" y="216" width="90" height="42" rx="8" fill="#E3F0EE" stroke="#0E7C72" stroke-width="1"/>
  <text x="307" y="242" font-size="14" font-weight="700" fill="#1A2B2A" text-anchor="middle">손주</text>
  <text x="50" y="290" font-size="13" fill="#4A5856">증여세 2번 부과, 할증 없음</text>
  <text x="50" y="308" font-size="13" fill="#4A5856">공제도 관계별로 각각 적용</text>

  <rect x="440" y="90" width="390" height="230" rx="12" fill="#F4EEE2" stroke="#C2873B" stroke-width="1.5"/>
  <text x="460" y="120" font-size="16" font-weight="700" fill="#C2873B">경로 B. 세대생략 한 번</text>
  <rect x="460" y="150" width="90" height="42" rx="8" fill="#E3F0EE" stroke="#0E7C72" stroke-width="1"/>
  <text x="505" y="176" font-size="14" font-weight="700" fill="#1A2B2A" text-anchor="middle">조부모</text>
  <text x="640" y="168" font-size="13" fill="#4A5856" text-anchor="middle">직접 증여</text>
  <text x="640" y="186" font-size="13" font-weight="700" fill="#B5462F" text-anchor="middle">+30% 할증</text>
  <path d="M556 171 H735" stroke="#C2873B" stroke-width="2.5" fill="none" marker-end="url(#arg)"/>
  <rect x="742" y="150" width="70" height="42" rx="8" fill="#E3F0EE" stroke="#0E7C72" stroke-width="1"/>
  <text x="777" y="176" font-size="14" font-weight="700" fill="#1A2B2A" text-anchor="middle">손주</text>
  <text x="460" y="230" font-size="13" fill="#4A5856">증여세 1번, 산출세액에 30% 가산</text>
  <text x="460" y="252" font-size="13" fill="#4A5856">미성년자가 20억원 초과 증여받으면</text>
  <text x="460" y="270" font-size="13" font-weight="700" fill="#B5462F">40% 가산</text>
  <text x="460" y="298" font-size="13" fill="#4A5856">대습(증여자의 최근친 직계비속 사망 후</text>
  <text x="460" y="316" font-size="13" fill="#4A5856">그 자녀가 받음)이면 할증 제외</text>

  <!-- 증여재산공제 -->
  <rect x="30" y="340" width="390" height="130" rx="12" fill="#F4EEE2" stroke="#E3DCCF" stroke-width="1"/>
  <text x="50" y="370" font-size="16" font-weight="700" fill="#0A5F58">증여재산공제 (직계존속→직계비속)</text>
  <rect x="50" y="386" width="170" height="64" rx="8" fill="#E3F0EE"/>
  <text x="135" y="412" font-size="14" fill="#4A5856" text-anchor="middle">성년 수증자</text>
  <text x="135" y="436" font-size="18" font-weight="700" fill="#0E7C72" text-anchor="middle">5,000만원</text>
  <rect x="232" y="386" width="170" height="64" rx="8" fill="#E3F0EE"/>
  <text x="317" y="412" font-size="14" fill="#4A5856" text-anchor="middle">미성년 수증자</text>
  <text x="317" y="436" font-size="18" font-weight="700" fill="#0E7C72" text-anchor="middle">2,000만원</text>
  <text x="50" y="464" font-size="12" fill="#8A938F">10년간 합산 한도. 초과분은 공제되지 않아요.</text>

  <!-- 세율 5단계 -->
  <rect x="440" y="340" width="390" height="130" rx="12" fill="#F4EEE2" stroke="#E3DCCF" stroke-width="1"/>
  <text x="460" y="370" font-size="16" font-weight="700" fill="#0A5F58">증여세율 5단계 누진 (과세표준)</text>
  <text x="460" y="396" font-size="13" fill="#1A2B2A">1억원 이하</text>
  <text x="810" y="396" font-size="13" font-weight="700" fill="#0E7C72" text-anchor="end">10%</text>
  <text x="460" y="416" font-size="13" fill="#1A2B2A">5억원 이하</text>
  <text x="810" y="416" font-size="13" font-weight="700" fill="#0E7C72" text-anchor="end">20%</text>
  <text x="460" y="436" font-size="13" fill="#1A2B2A">10억원 이하</text>
  <text x="810" y="436" font-size="13" font-weight="700" fill="#0E7C72" text-anchor="end">30%</text>
  <text x="460" y="456" font-size="13" fill="#1A2B2A">30억원 이하 40%, 30억원 초과 50%</text>

  <!-- 계산 순서 -->
  <rect x="30" y="490" width="800" height="120" rx="12" fill="#E3F0EE" stroke="#0E7C72" stroke-width="1"/>
  <text x="50" y="520" font-size="16" font-weight="700" fill="#0A5F58">세액 계산 순서</text>
  <text x="50" y="552" font-size="14" fill="#1A2B2A">① 증여재산가액 − 증여재산공제 = 과세표준</text>
  <text x="50" y="576" font-size="14" fill="#1A2B2A">② 과세표준 × 세율(10~50%) = 산출세액</text>
  <text x="50" y="600" font-size="14" fill="#1A2B2A">③ 산출세액 × 30%(또는 40%) 가산 = 세대생략 할증 반영 세액</text>
  <text x="440" y="600" font-size="12" fill="#8A938F" text-anchor="end">출처: 상증세법 제53·56·57조, 국세청 안내</text>

  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#0E7C72"/>
    </marker>
    <marker id="arg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#C2873B"/>
    </marker>
  </defs>
</svg>
