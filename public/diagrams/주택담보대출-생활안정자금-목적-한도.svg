<svg viewBox="0 0 760 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="주택담보대출 자금 목적별 취급 비교: 목적은 주택구입, 생활안정자금, 임차보증금 반환 세 가지로 구분해요. 주택구입 목적은 LTV·DSR이 모두 적용되고 규제지역 한도가 차등돼요. 생활안정자금 목적은 수도권·규제지역 한도가 최대 1억원, 주택 2채 이상 보유 차주는 취급 금지, 지방은 금융회사 자율이에요. 임차보증금 반환목적은 각종 제한이 일괄 폐지돼 LTV·DSR 범위 내에서 취급돼요(2023년 3월 완화). LTV·DSR과 스트레스 DSR(스트레스 금리 1.50%)은 세 목적 모두 공통 적용돼요.">
  <rect x="0" y="0" width="760" height="470" fill="#FBF7F0"/>

  <text x="40" y="44" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="24" font-weight="700" fill="#1A2B2A">주담대 자금 목적별 취급 한눈에 보기</text>
  <text x="40" y="70" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="13.5" fill="#4A5856">금융위원회 공식 자료 기준, 목적을 구분해 관리해요</text>

  <!-- card 1: 주택구입 -->
  <rect x="40" y="100" width="220" height="200" fill="#F4EEE2"/>
  <rect x="40" y="100" width="220" height="5" fill="#0A5F58"/>
  <text x="58" y="128" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="12" font-weight="700" fill="#8A938F">목적 1</text>
  <text x="58" y="152" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="16" font-weight="700" fill="#1A2B2A">주택구입 목적</text>
  <rect x="58" y="164" width="184" height="1" fill="#E3DCCF"/>
  <circle cx="62" cy="188" r="3" fill="#0A5F58"/>
  <text x="74" y="192" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="12.5" fill="#1A2B2A">실거주·구입 자금</text>
  <circle cx="62" cy="216" r="3" fill="#0A5F58"/>
  <text x="74" y="220" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="12.5" fill="#1A2B2A">LTV·DSR 모두 적용</text>
  <circle cx="62" cy="244" r="3" fill="#0A5F58"/>
  <text x="74" y="248" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="12.5" fill="#1A2B2A">규제지역 한도 차등</text>

  <!-- card 2: 생활안정자금 -->
  <rect x="270" y="100" width="220" height="200" fill="#F4EEE2"/>
  <rect x="270" y="100" width="220" height="5" fill="#C2873B"/>
  <text x="288" y="128" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="12" font-weight="700" fill="#8A938F">목적 2</text>
  <text x="288" y="152" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="16" font-weight="700" fill="#1A2B2A">생활안정자금 목적</text>
  <rect x="288" y="164" width="184" height="1" fill="#E3DCCF"/>
  <circle cx="292" cy="188" r="3" fill="#C2873B"/>
  <text x="304" y="192" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="12.5" fill="#1A2B2A">보유주택 담보 생활비</text>
  <circle cx="292" cy="216" r="3" fill="#C2873B"/>
  <text x="304" y="220" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#B5462F">수도권·규제지역 최대 1억원</text>
  <circle cx="292" cy="244" r="3" fill="#C2873B"/>
  <text x="304" y="248" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="12.5" fill="#1A2B2A">다주택자 취급 금지</text>
  <circle cx="292" cy="272" r="3" fill="#C2873B"/>
  <text x="304" y="276" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="12.5" fill="#1A2B2A">지방은 금융회사 자율</text>

  <!-- card 3: 임차보증금 반환 -->
  <rect x="500" y="100" width="220" height="200" fill="#F4EEE2"/>
  <rect x="500" y="100" width="220" height="5" fill="#0E7C72"/>
  <text x="518" y="128" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="12" font-weight="700" fill="#8A938F">목적 3</text>
  <text x="518" y="152" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="16" font-weight="700" fill="#1A2B2A">임차보증금 반환목적</text>
  <rect x="518" y="164" width="184" height="1" fill="#E3DCCF"/>
  <circle cx="522" cy="188" r="3" fill="#0E7C72"/>
  <text x="534" y="192" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="12.5" fill="#1A2B2A">세입자 보증금 반환</text>
  <circle cx="522" cy="216" r="3" fill="#0E7C72"/>
  <text x="534" y="220" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="12.5" fill="#1A2B2A">각종 제한 일괄 폐지</text>
  <circle cx="522" cy="244" r="3" fill="#0E7C72"/>
  <text x="534" y="248" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="12.5" fill="#1A2B2A">LTV·DSR 범위 내 취급</text>
  <circle cx="522" cy="272" r="3" fill="#0E7C72"/>
  <text x="534" y="276" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="12.5" fill="#8A938F">2023년 3월 규제 완화</text>

  <!-- common banner -->
  <rect x="40" y="322" width="680" height="70" fill="#E3F0EE"/>
  <rect x="40" y="322" width="5" height="70" fill="#0A5F58"/>
  <text x="62" y="352" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="15" font-weight="700" fill="#0A5F58">세 목적 공통: LTV·DSR은 자금 목적을 가리지 않고 모두 적용</text>
  <text x="62" y="378" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="13" fill="#1A2B2A">스트레스 DSR은 사실상 모든 가계대출에 적용(스트레스 금리 1.50%)</text>

  <!-- note -->
  <text x="40" y="428" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="11.5" fill="#8A938F">금융위원회 공식 자료 기준이며, 실제 한도·조건은 지역·연도·금융회사에 따라 달라져요.</text>
</svg>
