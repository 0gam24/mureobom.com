  <text x="40" y="420" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="14" fill="#4A5856">임금 상한은 1월분, 퇴직급여등 상한은 1년분 기준이에요. 표의 금액은 상한을 곱한 산술 한도이고 실제 지급액은 미지급액과 상한 중 낮은 쪽입니다.</text>

  <text x="40" y="458" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="16" font-weight="700" fill="#0A5F58">간이대지급금 · 연령 구분 없는 총액 상한 (임금 범위 최종 3개월분 유지)</text>

