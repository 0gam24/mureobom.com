<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-label="도산대지급금 6개월 확대 후 연령별 산술 총액 한도와 간이대지급금 총액 상한 비교. 고용노동부 상한액 고시의 임금 월 상한은 30세 미만 220만원, 30세 이상 40세 미만 310만원, 40세 이상 50세 미만 350만원, 50세 이상 60세 미만 330만원, 60세 이상 230만원이고 여기에 6개월을 곱하면 각각 1320만원, 1860만원, 2100만원, 1980만원, 1380만원이 된다. 퇴직급여등은 1년분 상한에 3년을 곱해 660만원, 930만원, 1050만원, 990만원, 690만원이며, 두 항목을 더한 산술 총액 한도는 1980만원, 2790만원, 3150만원, 2970만원, 2070만원이다. 월 상한액 고시는 2021년 10월 14일 시행본이 최신이므로 바뀐 것은 월 상한액이 아니라 적용 개월 수 3개월에서 6개월이다. 간이대지급금은 연령 구분 없이 임금과 휴업수당, 출산전후휴가 급여가 700만원, 퇴직급여등이 700만원, 총 상한이 1000만원이고 임금 범위는 최종 3개월분으로 유지된다. 확대 적용 기준은 퇴직일이 아니라 2026년 8월 20일 이후의 회생절차개시 결정, 파산선고, 도산등사실인정 날짜다.">
  <rect x="0" y="0" width="960" height="720" fill="#FBF7F0"/>

  <text x="40" y="50" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="26" font-weight="700" fill="#1A2B2A">도산대지급금 6개월 확대, 연령별 한도는 이렇게 바뀝니다</text>
  <text x="40" y="80" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="14.5" fill="#4A5856">월 상한액은 그대로이고 적용 개월 수가 최종 3개월분에서 최종 6개월분으로 늘었어요 (2026-08-20 시행)</text>

  <text x="40" y="115" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="16" font-weight="700" fill="#0A5F58">도산대지급금 · 연령별 월 상한에 개월 수를 곱한 산술 한도</text>
  <text x="920" y="115" text-anchor="end" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="12.5" fill="#8A938F">단위: 만원</text>

