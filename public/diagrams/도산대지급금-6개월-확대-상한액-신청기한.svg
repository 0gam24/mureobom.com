  <text x="64" y="652" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="14" fill="#1A2B2A">2026년 8월 20일 이후에 회생절차개시 결정·파산선고 결정·도산등사실인정이 있은 경우부터 6개월분이 적용됩니다.</text>

  <text x="40" y="694" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="13" fill="#8A938F">고용노동부 체불 임금등 대지급금 상한액 고시(2021-10-14 시행) · 임금채권보장법 제7조 및 부칙 제2조 기준. 정보 기준일 2026년 10월 7일.</text>
