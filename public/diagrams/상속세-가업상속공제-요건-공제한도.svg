<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 660" font-family="'IBM Plex Sans KR', system-ui, sans-serif">
  <rect x="0" y="0" width="720" height="660" fill="#FBF7F0"/>
  <text x="36" y="46" font-size="24" font-weight="700" fill="#1A2B2A">가업상속공제 한눈에 보기</text>
  <text x="36" y="72" font-size="14" fill="#4A5856">상속세 및 증여세법 제18조의2 · 시행령 제15조 (2026년 기준)</text>

  <!-- STEP 1: 3주체 요건 -->
  <text x="36" y="108" font-size="16" font-weight="700" fill="#0A5F58">1. 세 주체 요건을 모두 갖춰야 적용</text>

  <rect x="36" y="120" width="210" height="118" rx="10" fill="#F4EEE2" stroke="#E3DCCF"/>
  <text x="52" y="146" font-size="15" font-weight="700" fill="#1A2B2A">피상속인</text>
  <text x="52" y="170" font-size="12.5" fill="#4A5856">지분 40%(상장 20%)</text>
  <text x="52" y="188" font-size="12.5" fill="#4A5856">10년 이상 계속 보유</text>
  <text x="52" y="212" font-size="12.5" fill="#4A5856">대표이사 재직 요건</text>
  <text x="52" y="230" font-size="12.5" fill="#4A5856">(50%·10년·5년 중 하나)</text>

  <rect x="255" y="120" width="210" height="118" rx="10" fill="#F4EEE2" stroke="#E3DCCF"/>
  <text x="271" y="146" font-size="15" font-weight="700" fill="#1A2B2A">상속인</text>
  <text x="271" y="170" font-size="12.5" fill="#4A5856">18세 이상</text>
  <text x="271" y="188" font-size="12.5" fill="#4A5856">2년 이상 가업 종사</text>
  <text x="271" y="212" font-size="12.5" fill="#4A5856">신고기한까지 임원,</text>
  <text x="271" y="230" font-size="12.5" fill="#4A5856">2년 내 대표이사 취임</text>

  <rect x="474" y="120" width="210" height="118" rx="10" fill="#F4EEE2" stroke="#E3DCCF"/>
  <text x="490" y="146" font-size="15" font-weight="700" fill="#1A2B2A">가업</text>
  <text x="490" y="170" font-size="12.5" fill="#4A5856">중소기업(자산 5천억↓)</text>
  <text x="490" y="188" font-size="12.5" fill="#4A5856">또는 중견기업</text>
  <text x="490" y="206" font-size="12.5" fill="#4A5856">(매출 평균 5천억↓)</text>
  <text x="490" y="230" font-size="12.5" fill="#4A5856">10년 이상 계속 경영</text>

  <!-- STEP 2: 경영기간별 한도 -->
  <text x="36" y="278" font-size="16" font-weight="700" fill="#0A5F58">2. 경영기간에 따라 공제한도</text>

  <rect x="36" y="290" width="210" height="86" rx="10" fill="#E3F0EE" stroke="#E3DCCF"/>
  <text x="141" y="322" font-size="14" fill="#4A5856" text-anchor="middle">10년 이상 20년 미만</text>
  <text x="141" y="356" font-size="22" font-weight="700" fill="#0E7C72" text-anchor="middle">300억 원</text>

  <rect x="255" y="290" width="210" height="86" rx="10" fill="#E3F0EE" stroke="#E3DCCF"/>
  <text x="360" y="322" font-size="14" fill="#4A5856" text-anchor="middle">20년 이상 30년 미만</text>
  <text x="360" y="356" font-size="22" font-weight="700" fill="#0E7C72" text-anchor="middle">400억 원</text>

  <rect x="474" y="290" width="210" height="86" rx="10" fill="#0E7C72"/>
  <text x="579" y="322" font-size="14" fill="#E3F0EE" text-anchor="middle">30년 이상</text>
  <text x="579" y="356" font-size="22" font-weight="700" fill="#FBF7F0" text-anchor="middle">600억 원</text>

  <!-- STEP 3: 사후관리 5년 -->
  <text x="36" y="416" font-size="16" font-weight="700" fill="#0A5F58">3. 상속개시일부터 5년 사후관리</text>

  <rect x="36" y="428" width="648" height="96" rx="10" fill="#F4EEE2" stroke="#E3DCCF"/>
  <circle cx="66" cy="460" r="8" fill="#C2873B"/>
  <text x="82" y="465" font-size="13" fill="#1A2B2A">가업용 자산 40% 이상 처분 금지</text>
  <circle cx="66" cy="490" r="8" fill="#C2873B"/>
  <text x="82" y="495" font-size="13" fill="#1A2B2A">고용(정규직 근로자 수·총급여액) 90% 이상 유지</text>
  <circle cx="390" cy="460" r="8" fill="#C2873B"/>
  <text x="406" y="465" font-size="13" fill="#1A2B2A">상속인의 지분 유지</text>
  <circle cx="390" cy="490" r="8" fill="#C2873B"/>
  <text x="406" y="495" font-size="13" fill="#1A2B2A">상속인이 계속 가업에 종사</text>
  <text x="66" y="516" font-size="12" fill="#8A938F">위 네 가지를 5년간 지켜야 공제가 유지돼요</text>

  <!-- 위반 시 추징 -->
  <rect x="36" y="536" width="648" height="60" rx="10" fill="#FBF7F0" stroke="#B5462F"/>
  <text x="52" y="562" font-size="14" font-weight="700" fill="#B5462F">위반 시 추징</text>
  <text x="52" y="584" font-size="13" fill="#4A5856">정당한 사유 없이 어기면, 공제받은 금액에 기간 고려 율을 곱해 과세가액에 산입, 상속세 부과</text>

  <text x="36" y="632" font-size="12" fill="#8A938F">예) 25년 경영 중견기업 승계 → 한도 400억. 가업재산 350억이면 350억 공제(한도 내).</text>
  <text x="36" y="650" font-size="12" fill="#8A938F">가업승계 증여세 과세특례는 생전 증여에 적용하는 별개 제도예요.</text>
</svg>
