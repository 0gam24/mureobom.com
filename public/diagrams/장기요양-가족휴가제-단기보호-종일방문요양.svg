<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" width="1000" height="720" role="img" aria-label="장기요양 가족휴가제는 월 한도액 밖에서 연 12일 이내로 쓰는 급여이고, 종일 방문요양은 2회를 1일로 산정해 연 12일이 24회와 같다">
  <rect x="0" y="0" width="1000" height="720" fill="#FBF7F0"/>

  <text x="60" y="58" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="30" font-weight="700" fill="#1A2B2A">가족휴가제 연 12일은 월 한도액 밖에서 쓰는 급여</text>
  <text x="60" y="92" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="17" fill="#4A5856">장기요양급여 제공기준 고시 제36조의2 기준 (2026년 1월 1일 시행)</text>

  <!-- 왼쪽: 월 한도액 안 -->
  <rect x="60" y="120" width="420" height="330" rx="10" fill="#F4EEE2" stroke="#E3DCCF" stroke-width="2"/>
  <rect x="60" y="120" width="420" height="44" rx="10" fill="#E3DCCF"/>
  <text x="84" y="150" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="19" font-weight="700" fill="#1A2B2A">월 이용 한도액 안</text>
  <text x="84" y="196" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="17" fill="#4A5856">등급별 한도액 범위에서 이용</text>
  <text x="84" y="232" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="17" fill="#1A2B2A">방문요양 · 방문목욕 · 방문간호</text>
  <text x="84" y="262" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="17" fill="#1A2B2A">주야간보호 · 복지용구</text>
  <text x="84" y="304" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="18" font-weight="700" fill="#1A2B2A">일반 단기보호: 월 9일 이내</text>
  <text x="84" y="334" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="17" fill="#4A5856">정해진 사유가 있으면 1회 9일</text>
  <text x="84" y="360" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="17" fill="#4A5856">이내에서 연 4회까지 연장</text>
  <text x="84" y="410" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="15" fill="#8A938F">근거: 고시 제36조제3항,</text>
  <text x="84" y="432" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="15" fill="#8A938F">시행규칙 제11조</text>

  <!-- 오른쪽: 월 한도액 밖 -->
  <rect x="520" y="120" width="420" height="330" rx="10" fill="#E3F0EE" stroke="#0E7C72" stroke-width="2"/>
  <rect x="520" y="120" width="420" height="44" rx="10" fill="#0E7C72"/>
  <text x="544" y="150" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="19" font-weight="700" fill="#FBF7F0">월 이용 한도액과 무관</text>
  <text x="544" y="196" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="21" font-weight="700" fill="#0A5F58">장기요양 가족휴가제</text>
  <text x="544" y="234" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="18" font-weight="700" fill="#1A2B2A">연간 12일 이내</text>
  <text x="544" y="266" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="17" fill="#1A2B2A">단기보호급여 또는</text>
  <text x="544" y="292" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="17" fill="#1A2B2A">종일 방문요양급여</text>
  <text x="544" y="334" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="17" fill="#4A5856">대상: 1·2등급 수급자 또는</text>
  <text x="544" y="360" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="17" fill="#4A5856">치매가 있는 수급자</text>
  <text x="544" y="410" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="15" fill="#8A938F">근거: 고시 제36조의2</text>
  <text x="544" y="432" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="15" fill="#8A938F">(가족의 휴식을 위한 급여)</text>

  <!-- 하단: 일수 산정 규칙 -->
  <rect x="60" y="482" width="880" height="166" rx="10" fill="#F4EEE2" stroke="#E3DCCF" stroke-width="2"/>
  <text x="84" y="516" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="19" font-weight="700" fill="#0A5F58">종일 방문요양 일수 산정 규칙</text>

  <rect x="84" y="534" width="264" height="92" rx="8" fill="#FBF7F0" stroke="#E3DCCF" stroke-width="1.5"/>
  <text x="216" y="570" text-anchor="middle" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="22" font-weight="700" fill="#1A2B2A">1회 = 12시간</text>
  <text x="216" y="602" text-anchor="middle" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="16" fill="#4A5856">방문요양 1회당 12시간 이용</text>

  <rect x="368" y="534" width="264" height="92" rx="8" fill="#FBF7F0" stroke="#E3DCCF" stroke-width="1.5"/>
  <text x="500" y="570" text-anchor="middle" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="22" font-weight="700" fill="#1A2B2A">2회 = 1일</text>
  <text x="500" y="602" text-anchor="middle" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="16" fill="#4A5856">2회 이용 시 1일로 산정</text>

  <rect x="652" y="534" width="264" height="92" rx="8" fill="#E3F0EE" stroke="#0E7C72" stroke-width="1.5"/>
  <text x="784" y="570" text-anchor="middle" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="22" font-weight="700" fill="#0A5F58">12일 = 24회</text>
  <text x="784" y="602" text-anchor="middle" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="16" fill="#4A5856">연 12일을 회차로 환산</text>

  <text x="60" y="690" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="15" fill="#8A938F">출처: 장기요양급여 제공기준 및 급여비용 산정방법 등에 관한 고시 제36조의2·제36조제3항, 노인장기요양보험법 시행규칙 제11조</text>
</svg>
