<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="난임치료휴가 2026년 11월 27일 변경 요약. 연간 6일 총량은 유지되고 유급이 2일에서 4일로, 급여 상한이 168,420원에서 336,840원으로 바뀝니다. 우선지원대상기업 소속은 고용보험 급여와 사업주 차액으로 통상임금이 채워지고, 대규모기업 소속은 사업주가 통상임금 전액을 지급합니다. 급여 신청은 휴가 시작 1개월 후부터 종료 후 12개월 이내에 고용24 또는 관할 고용센터에서 합니다.">
  <rect x="0" y="0" width="1200" height="900" fill="#FBF7F0"/>

  <g font-family="'IBM Plex Sans KR', system-ui, sans-serif">
    <text x="60" y="74" font-size="41" font-weight="700" fill="#1A2B2A" font-family="'Gowun Batang', 'IBM Plex Sans KR', serif">난임치료휴가 유급 4일, 돈은 어디서 나오나</text>
    <text x="60" y="114" font-size="23" fill="#4A5856">같은 유급 4일이라도 재원과 신청 절차는 사업장 유형에 따라 갈립니다</text>
    <text x="60" y="146" font-size="18" fill="#8A938F">정보 기준일 2026년 11월 11일 · 시행일 2026년 11월 27일 · 출처 고용노동부 활용 가이드(2026년 8월)</text>
    <line x1="60" y1="166" x2="1140" y2="166" stroke="#E3DCCF" stroke-width="2"/>

    <rect x="60" y="188" width="1080" height="130" rx="16" fill="#F4EEE2" stroke="#E3DCCF" stroke-width="2"/>
    <text x="88" y="222" font-size="20" font-weight="700" fill="#8A938F">11월 27일에 달라지는 부분</text>
    <text x="260" y="258" font-size="19" fill="#4A5856" text-anchor="middle">연간 휴가 일수</text>
    <text x="260" y="294" font-size="25" font-weight="700" fill="#1A2B2A" text-anchor="middle">6일 그대로</text>
    <text x="600" y="258" font-size="19" fill="#4A5856" text-anchor="middle">유급 보장 일수</text>
    <text x="600" y="294" font-size="25" font-weight="700" fill="#0A5F58" text-anchor="middle">2일에서 4일로</text>
    <text x="940" y="258" font-size="19" fill="#4A5856" text-anchor="middle">급여 지원 상한(총액)</text>
    <text x="940" y="294" font-size="25" font-weight="700" fill="#0A5F58" text-anchor="middle">336,840원</text>

    <rect x="60" y="340" width="525" height="360" rx="16" fill="#F4EEE2" stroke="#0E7C72" stroke-width="2"/>
    <text x="88" y="386" font-size="28" font-weight="700" fill="#0A5F58">우선지원대상기업 소속</text>

    <rect x="88" y="406" width="469" height="96" rx="12" fill="#E3F0EE" stroke="#0E7C72" stroke-width="2"/>
    <text x="112" y="444" font-size="22" font-weight="700" fill="#0A5F58">고용보험 난임치료휴가 급여</text>
    <text x="112" y="478" font-size="20" fill="#4A5856">통상임금을 상한 안에서 지원</text>

    <text x="322" y="538" font-size="30" font-weight="700" fill="#8A938F" text-anchor="middle">+</text>

    <rect x="88" y="554" width="469" height="96" rx="12" fill="#FBF7F0" stroke="#E3DCCF" stroke-width="2"/>
    <text x="112" y="592" font-size="22" font-weight="700" fill="#1A2B2A">사업주</text>
    <text x="112" y="626" font-size="20" fill="#4A5856">통상임금과 정부 지원액의 차액</text>

    <text x="88" y="680" font-size="21" fill="#0A5F58">고용24 또는 관할 고용센터에 신청</text>

    <rect x="615" y="340" width="525" height="360" rx="16" fill="#F4EEE2" stroke="#E3DCCF" stroke-width="2"/>
    <text x="643" y="386" font-size="28" font-weight="700" fill="#1A2B2A">대규모기업 소속</text>

    <rect x="643" y="406" width="469" height="96" rx="12" fill="#FBF7F0" stroke="#E3DCCF" stroke-width="2"/>
    <text x="667" y="444" font-size="22" font-weight="700" fill="#1A2B2A">사업주</text>
    <text x="667" y="478" font-size="20" fill="#4A5856">통상임금 전액 지급</text>

    <text x="877" y="544" font-size="21" font-weight="700" fill="#B5462F" text-anchor="middle">고용보험 급여 지원 대상 아님</text>

    <rect x="643" y="554" width="469" height="96" rx="12" fill="#FBF7F0" stroke="#E3DCCF" stroke-width="2"/>
    <text x="667" y="592" font-size="22" font-weight="700" fill="#1A2B2A">유급 4일 보장은 동일</text>
    <text x="667" y="626" font-size="20" fill="#4A5856">사업장 규모와 무관한 법정휴가</text>

    <text x="643" y="680" font-size="21" fill="#4A5856">해당 없음 (회사가 지급)</text>

    <rect x="60" y="724" width="1080" height="144" rx="16" fill="#F4EEE2" stroke="#E3DCCF" stroke-width="2"/>
    <text x="88" y="758" font-size="20" font-weight="700" fill="#8A938F">양쪽 모두 같은 부분</text>
    <text x="260" y="794" font-size="19" fill="#4A5856" text-anchor="middle">연간 휴가 총량</text>
    <text x="260" y="826" font-size="21" font-weight="700" fill="#1A2B2A" text-anchor="middle">6일 유지</text>
    <text x="260" y="854" font-size="19" fill="#4A5856" text-anchor="middle">나머지 2일은 무급</text>
    <text x="600" y="794" font-size="19" fill="#4A5856" text-anchor="middle">급여 신청 기한</text>
    <text x="600" y="826" font-size="21" font-weight="700" fill="#1A2B2A" text-anchor="middle">휴가 시작 1개월 후부터</text>
    <text x="600" y="854" font-size="19" fill="#4A5856" text-anchor="middle">끝난 날 이후 12개월 이내</text>
    <text x="940" y="794" font-size="19" fill="#4A5856" text-anchor="middle">11월 27일 이전 사용분</text>
    <text x="940" y="826" font-size="21" font-weight="700" fill="#1A2B2A" text-anchor="middle">최초 2일만 썼다면</text>
    <text x="940" y="854" font-size="19" fill="#4A5856" text-anchor="middle">추가 2일은 유급 처리</text>
  </g>
</svg>
