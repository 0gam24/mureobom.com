<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="1200" height="860" role="img" font-family="'IBM Plex Sans KR', system-ui, sans-serif">
  <rect x="0" y="0" width="1200" height="860" fill="#FBF7F0"/>

  <!-- header -->
  <rect x="0" y="0" width="1200" height="96" fill="#0A5F58"/>
  <text x="48" y="48" font-size="32" font-weight="700" fill="#FBF7F0">선불충전금 장기 미사용 통지와 세 개의 시계</text>
  <text x="48" y="78" font-size="16" fill="#E3F0EE">금융위원회 2026년 10월 15일 보도자료 기준, 정보 기준 2026년 10월</text>

  <!-- section A -->
  <text x="48" y="136" font-size="20" font-weight="700" fill="#1A2B2A">3개사 기준 비교: 장기 미사용 분류와 약관상 유효기간</text>

  <rect x="48" y="158" width="1102" height="38" fill="#E3F0EE"/>
  <text x="68" y="183" font-size="15.5" font-weight="700" fill="#0A5F58">회사</text>
  <text x="650" y="183" font-size="15.5" font-weight="700" fill="#0A5F58" text-anchor="middle">장기 미사용 분류 기준</text>
  <text x="985" y="183" font-size="15.5" font-weight="700" fill="#0A5F58" text-anchor="middle">약관상 유효기간</text>

  <rect x="48" y="196" width="1102" height="40" fill="#FBF7F0"/>
  <text x="68" y="222" font-size="16" fill="#1A2B2A">네이버파이낸셜</text>
  <text x="650" y="222" font-size="16" fill="#4A5856" text-anchor="middle">2년 이상</text>
  <text x="985" y="222" font-size="16" font-weight="700" fill="#0A5F58" text-anchor="middle">10년</text>

  <rect x="48" y="236" width="1102" height="40" fill="#F4EEE2"/>
  <text x="68" y="262" font-size="16" fill="#1A2B2A">카카오페이</text>
  <text x="650" y="262" font-size="16" font-weight="700" fill="#B5462F" text-anchor="middle">1년 이상</text>
  <text x="985" y="262" font-size="16" font-weight="700" fill="#0A5F58" text-anchor="middle">10년</text>

  <rect x="48" y="276" width="1102" height="40" fill="#FBF7F0"/>
  <text x="68" y="302" font-size="16" fill="#1A2B2A">비바리퍼블리카</text>
  <text x="650" y="302" font-size="16" fill="#4A5856" text-anchor="middle">2년 이상</text>
  <text x="985" y="302" font-size="16" font-weight="700" fill="#C2873B" text-anchor="middle">유효기간 없음</text>

  <rect x="48" y="158" width="1102" height="158" fill="none" stroke="#E3DCCF" stroke-width="1.5"/>
  <text x="48" y="342" font-size="15" fill="#4A5856">분류는 관리 목적. 보도자료는 분류돼도 사용·환급에 제약이 없다고 기재</text>

  <!-- section B -->
  <text x="48" y="382" font-size="20" font-weight="700" fill="#1A2B2A">따로 도는 세 개의 시계</text>

  <g>
    <rect x="48" y="400" width="354" height="210" rx="12" fill="#F4EEE2" stroke="#E3DCCF" stroke-width="1.5"/>
    <rect x="68" y="420" width="104" height="30" rx="15" fill="#0E7C72"/>
    <text x="120" y="440" font-size="15" font-weight="700" fill="#FBF7F0" text-anchor="middle">시계 1</text>
    <text x="68" y="480" font-size="19" font-weight="700" fill="#0A5F58">장기 미사용 분류</text>
    <text x="68" y="510" font-size="15.5" fill="#1A2B2A">1년 또는 2년 이상 미사용</text>
    <text x="68" y="534" font-size="15.5" fill="#4A5856">정한 곳: 각 회사 기준</text>
    <text x="68" y="558" font-size="15.5" fill="#4A5856">지나면 통지 대상이 됨</text>
    <text x="68" y="582" font-size="15.5" fill="#4A5856">사용·환급 제약은 없음</text>
  </g>
  <g>
    <rect x="422" y="400" width="354" height="210" rx="12" fill="#F4EEE2" stroke="#E3DCCF" stroke-width="1.5"/>
    <rect x="442" y="420" width="104" height="30" rx="15" fill="#0E7C72"/>
    <text x="494" y="440" font-size="15" font-weight="700" fill="#FBF7F0" text-anchor="middle">시계 2</text>
    <text x="442" y="480" font-size="19" font-weight="700" fill="#0A5F58">약관상 유효기간</text>
    <text x="442" y="510" font-size="15.5" fill="#1A2B2A">10년 또는 유효기간 없음</text>
    <text x="442" y="534" font-size="15.5" fill="#4A5856">정한 곳: 회사 약관</text>
    <text x="442" y="558" font-size="15.5" fill="#4A5856">만료 후 처리 방식은</text>
    <text x="442" y="582" font-size="15.5" fill="#4A5856">보도자료에 기재 없음</text>
  </g>
  <g>
    <rect x="796" y="400" width="354" height="210" rx="12" fill="#F4EEE2" stroke="#E3DCCF" stroke-width="1.5"/>
    <rect x="816" y="420" width="104" height="30" rx="15" fill="#C2873B"/>
    <text x="868" y="440" font-size="15" font-weight="700" fill="#FBF7F0" text-anchor="middle">시계 3</text>
    <text x="816" y="480" font-size="19" font-weight="700" fill="#0A5F58">소멸시효</text>
    <text x="816" y="510" font-size="15.5" fill="#1A2B2A">5년 (권익위 자료 표기)</text>
    <text x="816" y="534" font-size="15.5" fill="#4A5856">상사채권 일반 시효도 5년</text>
    <text x="816" y="558" font-size="15.5" fill="#4A5856">2026년 10월 조치 자료에는</text>
    <text x="816" y="582" font-size="15.5" fill="#4A5856">소멸시효 언급이 없음</text>
  </g>

  <!-- section C -->
  <rect x="48" y="632" width="1102" height="96" rx="10" fill="#E3F0EE" stroke="#0E7C72" stroke-width="1.5"/>
  <text x="72" y="662" font-size="17" font-weight="700" fill="#0A5F58">통지 의무의 공백과 이번 조치</text>
  <text x="72" y="690" font-size="15" fill="#1A2B2A">표준약관 통지 의무는 유효기간 만료 30일 전부터 3회 이상. 10년 상품은 약 9년 11개월간 통지 의무가 없음</text>
  <text x="72" y="714" font-size="15" fill="#1A2B2A">이번 조치는 그 구간에 연 1회 이상 통지를 더함. 통지 내용은 잔액 보유 사실과 유효기간</text>

  <!-- section D -->
  <rect x="48" y="744" width="546" height="70" rx="10" fill="#F4EEE2" stroke="#E3DCCF" stroke-width="1.5"/>
  <text x="68" y="772" font-size="15" font-weight="700" fill="#0A5F58">권익위 2025년 8월 권고 (권고 단계)</text>
  <text x="68" y="796" font-size="14.5" fill="#1A2B2A">소멸시효 완성 1년 전부터 3회 이상 통지</text>

  <rect x="604" y="744" width="546" height="70" rx="10" fill="#F4EEE2" stroke="#E3DCCF" stroke-width="1.5"/>
  <text x="624" y="772" font-size="15" font-weight="700" fill="#0A5F58">소멸시효 만료금액 (권익위 자료)</text>
  <text x="624" y="796" font-size="14.5" fill="#1A2B2A">연평균 529억원, 2021년부터 2024년 합계 2,116억원</text>

  <text x="48" y="840" font-size="13.5" fill="#8A938F">출처: 금융위원회 보도자료(2026.10.15) / 국민권익위원회 정책뉴스(2025.8.1) / 권익위·공정위 보도자료(2019.8.21) / 상법 제64조</text>
</svg>
