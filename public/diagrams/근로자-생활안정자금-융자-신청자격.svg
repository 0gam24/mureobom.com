<svg viewBox="0 0 820 760" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Sans KR', system-ui, sans-serif" role="img" aria-label="근로자 생활안정자금 융자 대상, 용도별 한도, 상환, 신청 절차 요약">
  <rect x="0" y="0" width="820" height="760" fill="#FBF7F0"/>

  <!-- Title -->
  <text x="40" y="52" font-size="27" font-weight="700" fill="#0A5F58">근로자 생활안정자금 융자 한눈에</text>
  <text x="40" y="80" font-size="14" fill="#8A938F">고용노동부 보도자료 기준. 세부 수치는 근로복지넷 최신 공고에서 확인하세요.</text>

  <!-- 지원 대상 panel -->
  <rect x="40" y="100" width="740" height="118" rx="10" fill="#E3F0EE"/>
  <text x="62" y="130" font-size="17" font-weight="700" fill="#0A5F58">지원 대상</text>
  <text x="62" y="160" font-size="14.5" fill="#1A2B2A">· 소득: 3인 가구 기준중위소득 이하 (예: 월 5,359,036원 이하)</text>
  <text x="62" y="184" font-size="14.5" fill="#1A2B2A">· 근속: 현 사업장에서 3개월 이상 근로</text>
  <text x="62" y="208" font-size="14.5" fill="#1A2B2A">· 범위: 저소득 근로자 + 특수형태근로종사자 + 산재보험 가입 1인 자영업자</text>

  <!-- 용도별 한도 panel -->
  <text x="40" y="256" font-size="18" font-weight="700" fill="#0A5F58">용도별 융자 한도</text>
  <!-- bars: max 2000 -> scale width, base x=180, full width 500 = 2000만원 -->
  <!-- 혼례 -->
  <text x="62" y="292" font-size="14.5" fill="#4A5856">혼례비</text>
  <rect x="180" y="278" width="500" height="20" rx="4" fill="#0E7C72"/>
  <text x="692" y="293" font-size="14" font-weight="700" fill="#0A5F58">2,000만원</text>
  <!-- 육아 -->
  <text x="62" y="326" font-size="14.5" fill="#4A5856">육아비</text>
  <rect x="180" y="312" width="500" height="20" rx="4" fill="#0E7C72"/>
  <text x="692" y="327" font-size="14" font-weight="700" fill="#0A5F58">2,000만원</text>
  <!-- 부모요양 -->
  <text x="62" y="360" font-size="14.5" fill="#4A5856">부모요양비</text>
  <rect x="180" y="346" width="500" height="20" rx="4" fill="#0E7C72"/>
  <text x="692" y="361" font-size="14" font-weight="700" fill="#0A5F58">2,000만원</text>
  <!-- 장례 -->
  <text x="62" y="394" font-size="14.5" fill="#4A5856">장례비</text>
  <rect x="180" y="380" width="250" height="20" rx="4" fill="#C2873B"/>
  <text x="442" y="395" font-size="14" font-weight="700" fill="#C2873B">1,000만원</text>
  <text x="62" y="426" font-size="12.5" fill="#8A938F">의료비·학자금·임금감소 생계비 등 다른 용도의 세부 한도는 근로복지넷 공고 확인.</text>

  <!-- 상환 조건 panel -->
  <rect x="40" y="446" width="740" height="86" rx="10" fill="#F4EEE2"/>
  <text x="62" y="476" font-size="17" font-weight="700" fill="#0A5F58">상환 조건</text>
  <text x="62" y="506" font-size="14.5" fill="#1A2B2A">1년 거치 후 3~4년 동안 원금균등분할 상환. 거치기간에는 이자만 냅니다.</text>

  <!-- 신청 절차 -->
  <text x="40" y="572" font-size="18" font-weight="700" fill="#0A5F58">신청 절차 4단계</text>
  <!-- step boxes -->
  <g>
    <rect x="40" y="590" width="168" height="90" rx="10" fill="#F4EEE2" stroke="#E3DCCF"/>
    <circle cx="66" cy="616" r="13" fill="#0E7C72"/>
    <text x="66" y="621" font-size="14" font-weight="700" fill="#FBF7F0" text-anchor="middle">1</text>
    <text x="88" y="621" font-size="14.5" font-weight="700" fill="#1A2B2A">근로복지넷 접속</text>
    <text x="58" y="648" font-size="12.5" fill="#4A5856">work.comwel.or.kr</text>
    <text x="58" y="666" font-size="12.5" fill="#4A5856">온라인 신청</text>

    <rect x="228" y="590" width="168" height="90" rx="10" fill="#F4EEE2" stroke="#E3DCCF"/>
    <circle cx="254" cy="616" r="13" fill="#0E7C72"/>
    <text x="254" y="621" font-size="14" font-weight="700" fill="#FBF7F0" text-anchor="middle">2</text>
    <text x="276" y="621" font-size="14.5" font-weight="700" fill="#1A2B2A">서류 제출</text>
    <text x="246" y="648" font-size="12.5" fill="#4A5856">공공마이데이터로</text>
    <text x="246" y="666" font-size="12.5" fill="#4A5856">10종 서류 간소화</text>

    <rect x="416" y="590" width="168" height="90" rx="10" fill="#F4EEE2" stroke="#E3DCCF"/>
    <circle cx="442" cy="616" r="13" fill="#0E7C72"/>
    <text x="442" y="621" font-size="14" font-weight="700" fill="#FBF7F0" text-anchor="middle">3</text>
    <text x="464" y="621" font-size="14.5" font-weight="700" fill="#1A2B2A">자격 심사</text>
    <text x="434" y="648" font-size="12.5" fill="#4A5856">소득·근속·용도</text>
    <text x="434" y="666" font-size="12.5" fill="#4A5856">예산 범위 내 승인</text>

    <rect x="604" y="590" width="176" height="90" rx="10" fill="#E3F0EE" stroke="#E3DCCF"/>
    <circle cx="630" cy="616" r="13" fill="#C2873B"/>
    <text x="630" y="621" font-size="14" font-weight="700" fill="#FBF7F0" text-anchor="middle">4</text>
    <text x="652" y="621" font-size="14.5" font-weight="700" fill="#1A2B2A">융자 실행</text>
    <text x="622" y="648" font-size="12.5" fill="#4A5856">직접융자 또는</text>
    <text x="622" y="666" font-size="12.5" fill="#4A5856">이차보전 방식 지원</text>
  </g>

  <text x="40" y="712" font-size="12.5" fill="#8A938F">이차보전형은 금융회사 대출금리에서 정부가 최대 3%p 이자를 지원하는 방식입니다.</text>
  <text x="40" y="734" font-size="12" fill="#8A938F">금액·금리·자격 기준은 연도별로 바뀌므로 발표 시점과 최신 공고를 함께 확인하세요.</text>
</svg>
