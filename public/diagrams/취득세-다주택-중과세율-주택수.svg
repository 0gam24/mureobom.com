<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" role="img" aria-labelledby="t d" font-family="'IBM Plex Sans KR', system-ui, sans-serif">
  <title id="t">주택 수별 취득세 중과세율표</title>
  <desc id="d">세대 합산 주택 수와 조정대상지역 여부에 따른 유상취득 취득세율. 1주택은 조정·비조정 모두 1에서 3퍼센트 기본세율. 조정 2주택은 8퍼센트이나 일시적 2주택은 제외, 비조정 2주택은 중과가 아닌 1에서 3퍼센트. 조정 3주택은 12퍼센트, 비조정 3주택은 8퍼센트. 4주택 이상은 조정·비조정 모두 12퍼센트. 법인은 주택 수와 무관하게 12퍼센트. 실효 부담은 지방교육세가 더해져 8퍼센트는 약 8.4퍼센트, 12퍼센트는 약 12.4퍼센트 수준이며 전용 85제곱미터 초과는 농어촌특별세가 더 붙는다.</desc>
  <rect x="0" y="0" width="760" height="560" fill="#FBF7F0"/>
  <text x="32" y="44" font-size="24" font-weight="700" fill="#1A2B2A">주택 수별 취득세 중과세율 (유상취득)</text>
  <text x="32" y="70" font-size="13" fill="#4A5856">2026년 7월 기준 현행, 지방세법 제13조의2·제13조의3. 세대 합산 주택 수로 판정</text>

  <!-- table header -->
  <rect x="32" y="90" width="200" height="40" fill="#0A5F58"/>
  <rect x="232" y="90" width="264" height="40" fill="#0E7C72"/>
  <rect x="496" y="90" width="232" height="40" fill="#0E7C72"/>
  <text x="132" y="115" font-size="14" font-weight="700" fill="#FBF7F0" text-anchor="middle">세대 합산 주택 수</text>
  <text x="364" y="115" font-size="14" font-weight="700" fill="#FBF7F0" text-anchor="middle">조정대상지역</text>
  <text x="612" y="115" font-size="14" font-weight="700" fill="#FBF7F0" text-anchor="middle">비조정대상지역</text>

  <!-- row 1주택 -->
  <rect x="32" y="130" width="200" height="52" fill="#F4EEE2" stroke="#E3DCCF"/>
  <rect x="232" y="130" width="264" height="52" fill="#F4EEE2" stroke="#E3DCCF"/>
  <rect x="496" y="130" width="232" height="52" fill="#F4EEE2" stroke="#E3DCCF"/>
  <text x="52" y="161" font-size="14" font-weight="700" fill="#1A2B2A">1주택</text>
  <text x="364" y="156" font-size="15" font-weight="700" fill="#1A2B2A" text-anchor="middle">1 ~ 3%</text>
  <text x="364" y="174" font-size="10" fill="#8A938F" text-anchor="middle">6억↓ 1%, 9억↑ 3%</text>
  <text x="612" y="156" font-size="15" font-weight="700" fill="#1A2B2A" text-anchor="middle">1 ~ 3%</text>
  <text x="612" y="174" font-size="10" fill="#8A938F" text-anchor="middle">기본세율</text>

  <!-- row 2주택 -->
  <rect x="32" y="182" width="200" height="52" fill="#FBF7F0" stroke="#E3DCCF"/>
  <rect x="232" y="182" width="264" height="52" fill="#E3F0EE" stroke="#E3DCCF"/>
  <rect x="496" y="182" width="232" height="52" fill="#FBF7F0" stroke="#E3DCCF"/>
  <text x="52" y="213" font-size="14" font-weight="700" fill="#1A2B2A">2주택</text>
  <text x="364" y="208" font-size="15" font-weight="700" fill="#0A5F58" text-anchor="middle">8%</text>
  <text x="364" y="226" font-size="10" fill="#4A5856" text-anchor="middle">일시적 2주택은 제외</text>
  <text x="612" y="213" font-size="13" font-weight="700" fill="#4A5856" text-anchor="middle">1 ~ 3% (중과 아님)</text>

  <!-- row 3주택 -->
  <rect x="32" y="234" width="200" height="52" fill="#F4EEE2" stroke="#E3DCCF"/>
  <rect x="232" y="234" width="264" height="52" fill="#E3F0EE" stroke="#E3DCCF"/>
  <rect x="496" y="234" width="232" height="52" fill="#E3F0EE" stroke="#E3DCCF"/>
  <text x="52" y="265" font-size="14" font-weight="700" fill="#1A2B2A">3주택</text>
  <text x="364" y="266" font-size="15" font-weight="700" fill="#B5462F" text-anchor="middle">12%</text>
  <text x="612" y="266" font-size="15" font-weight="700" fill="#0A5F58" text-anchor="middle">8%</text>

  <!-- row 4주택 -->
  <rect x="32" y="286" width="200" height="52" fill="#FBF7F0" stroke="#E3DCCF"/>
  <rect x="232" y="286" width="264" height="52" fill="#E3F0EE" stroke="#E3DCCF"/>
  <rect x="496" y="286" width="232" height="52" fill="#E3F0EE" stroke="#E3DCCF"/>
  <text x="52" y="317" font-size="14" font-weight="700" fill="#1A2B2A">4주택 이상</text>
  <text x="364" y="318" font-size="15" font-weight="700" fill="#B5462F" text-anchor="middle">12%</text>
  <text x="612" y="318" font-size="15" font-weight="700" fill="#B5462F" text-anchor="middle">12%</text>

  <!-- row 법인 -->
  <rect x="32" y="338" width="200" height="52" fill="#F4EEE2" stroke="#E3DCCF"/>
  <rect x="232" y="338" width="496" height="52" fill="#F4EEE2" stroke="#E3DCCF"/>
  <text x="52" y="369" font-size="14" font-weight="700" fill="#1A2B2A">법인 (주택)</text>
  <text x="480" y="363" font-size="15" font-weight="700" fill="#B5462F" text-anchor="middle">12% (주택 수와 지역 무관)</text>
  <text x="480" y="381" font-size="10" fill="#8A938F" text-anchor="middle">표준세율 4% + 중과기준세율 2% × 400%</text>

  <!-- 실효 부담 패널 -->
  <rect x="32" y="410" width="696" height="118" rx="12" fill="#F4EEE2" stroke="#E3DCCF"/>
  <text x="52" y="438" font-size="15" font-weight="700" fill="#0A5F58">여기에 부가세목이 더 붙어요 (개략)</text>
  <text x="52" y="466" font-size="13" fill="#1A2B2A">본세 8% → 지방교육세 포함 실효 약 8.4% (전용 85㎡ 이하)</text>
  <text x="52" y="490" font-size="13" fill="#1A2B2A">본세 12% → 지방교육세 포함 실효 약 12.4% (전용 85㎡ 이하)</text>
  <text x="52" y="514" font-size="12" fill="#4A5856">전용 85㎡ 초과 주택은 농어촌특별세가 추가로 붙어 부담이 더 커져요</text>
</svg>
