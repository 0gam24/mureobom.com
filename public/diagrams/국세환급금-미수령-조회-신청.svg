<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 640" font-family="'IBM Plex Sans KR', system-ui, sans-serif">
  <rect x="0" y="0" width="820" height="640" fill="#FBF7F0"/>

  <!-- Title -->
  <text x="40" y="48" font-size="26" font-weight="700" fill="#1A2B2A">미수령 국세환급금, 이렇게 찾아요</text>
  <text x="40" y="76" font-size="15" fill="#4A5856">조회 3경로에서 확인하고, 소멸시효 5년 안에 계좌를 신고하세요</text>

  <!-- Section 1: 3 조회 경로 -->
  <text x="40" y="122" font-size="17" font-weight="700" fill="#0A5F58">조회 3경로</text>

  <!-- Card 1: 홈택스 -->
  <rect x="40" y="138" width="230" height="150" rx="12" fill="#F4EEE2" stroke="#E3DCCF" stroke-width="1.5"/>
  <circle cx="70" cy="170" r="16" fill="#0E7C72"/>
  <text x="70" y="176" font-size="16" font-weight="700" fill="#FBF7F0" text-anchor="middle">1</text>
  <text x="98" y="176" font-size="17" font-weight="700" fill="#1A2B2A">홈택스 (PC)</text>
  <text x="62" y="210" font-size="13.5" fill="#4A5856">조회/발급</text>
  <text x="62" y="232" font-size="13.5" fill="#4A5856">→ 국세환급</text>
  <text x="62" y="254" font-size="13.5" fill="#4A5856">→ 국세환급금 찾기</text>
  <text x="62" y="276" font-size="12.5" fill="#8A938F">주민번호·성명 입력</text>

  <!-- Card 2: 손택스 -->
  <rect x="295" y="138" width="230" height="150" rx="12" fill="#F4EEE2" stroke="#E3DCCF" stroke-width="1.5"/>
  <circle cx="325" cy="170" r="16" fill="#0E7C72"/>
  <text x="325" y="176" font-size="16" font-weight="700" fill="#FBF7F0" text-anchor="middle">2</text>
  <text x="353" y="176" font-size="17" font-weight="700" fill="#1A2B2A">손택스 (모바일)</text>
  <text x="317" y="210" font-size="13.5" fill="#4A5856">앱 로그인</text>
  <text x="317" y="232" font-size="13.5" fill="#4A5856">(공동인증·지문)</text>
  <text x="317" y="254" font-size="13.5" fill="#4A5856">→ 환급금 조회</text>
  <text x="317" y="276" font-size="12.5" fill="#8A938F">상속인 국세내역도 확인</text>

  <!-- Card 3: 정부24 -->
  <rect x="550" y="138" width="230" height="150" rx="12" fill="#F4EEE2" stroke="#E3DCCF" stroke-width="1.5"/>
  <circle cx="580" cy="170" r="16" fill="#0E7C72"/>
  <text x="580" y="176" font-size="16" font-weight="700" fill="#FBF7F0" text-anchor="middle">3</text>
  <text x="608" y="176" font-size="17" font-weight="700" fill="#1A2B2A">정부24 (통합)</text>
  <text x="572" y="210" font-size="13.5" fill="#4A5856">미환급금 찾기</text>
  <text x="572" y="232" font-size="13.5" fill="#4A5856">국세·지방세·건보</text>
  <text x="572" y="254" font-size="13.5" fill="#4A5856">한 번에 조회</text>
  <text x="572" y="276" font-size="12.5" fill="#8A938F">조회는 통합, 신청은 기관별</text>

  <!-- Arrow down to 계좌 신고 -->
  <path d="M410 288 L410 316" stroke="#C2873B" stroke-width="2.5"/>
  <path d="M410 322 L403 310 L417 310 Z" fill="#C2873B"/>

  <!-- 계좌 신고 box -->
  <rect x="150" y="326" width="520" height="60" rx="12" fill="#E3F0EE" stroke="#0E7C72" stroke-width="1.5"/>
  <text x="410" y="352" font-size="16" font-weight="700" fill="#0A5F58" text-anchor="middle">환급계좌 개설(변경) 신고</text>
  <text x="410" y="375" font-size="13" fill="#4A5856" text-anchor="middle">계좌를 신고해야 지급, 안 하면 미수령 상태로 남아요</text>

  <!-- Section 2: 소멸시효 타임라인 -->
  <text x="40" y="436" font-size="17" font-weight="700" fill="#0A5F58">소멸시효 5년 타임라인 (국세기본법 제54조)</text>

  <!-- timeline base -->
  <line x1="70" y1="500" x2="750" y2="500" stroke="#E3DCCF" stroke-width="6" stroke-linecap="round"/>
  <line x1="70" y1="500" x2="620" y2="500" stroke="#0E7C72" stroke-width="6" stroke-linecap="round"/>

  <!-- start dot -->
  <circle cx="70" cy="500" r="9" fill="#0E7C72"/>
  <text x="70" y="474" font-size="13.5" font-weight="700" fill="#1A2B2A" text-anchor="middle">권리 발생</text>
  <text x="70" y="530" font-size="12" fill="#8A938F" text-anchor="middle">행사할 수 있는 때</text>

  <!-- mid dot: 신청 가능 -->
  <circle cx="620" cy="500" r="9" fill="#0E7C72"/>
  <text x="620" y="474" font-size="13.5" font-weight="700" fill="#0A5F58" text-anchor="middle">이 구간에 신고</text>
  <text x="345" y="474" font-size="14" font-weight="700" fill="#0E7C72" text-anchor="middle">5년 이내 청구 가능</text>

  <!-- end dot: 시효 완성 -->
  <circle cx="750" cy="500" r="9" fill="#B5462F"/>
  <text x="750" y="474" font-size="13.5" font-weight="700" fill="#B5462F" text-anchor="middle">5년 경과</text>
  <text x="750" y="530" font-size="12" fill="#B5462F" text-anchor="middle">시효 완성</text>

  <!-- warning box -->
  <rect x="40" y="556" width="740" height="56" rx="10" fill="#F4EEE2" stroke="#B5462F" stroke-width="1.5"/>
  <text x="60" y="580" font-size="13.5" font-weight="700" fill="#B5462F">시효가 완성되면</text>
  <text x="60" y="600" font-size="13" fill="#4A5856">청구권이 소멸해 더는 돌려받지 못하고, 해당 금액은 국고에 남아요. 통지가 있어도 시효는 자동 연장되지 않아요.</text>
</svg>
