<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" width="760" height="620" role="img" aria-label="신용카드매출전표등 발행세액공제 요약: 2026년 공제율 1.3% 연 한도 1000만원, 2027년부터 1% 연 500만원. 대상은 직전연도 공급가액 10억원 이하 개인사업자, 법인 제외. 납부세액 한도 내 공제.">
  <rect x="0" y="0" width="760" height="620" fill="#FBF7F0"/>
  <text x="40" y="52" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="26" font-weight="700" fill="#1A2B2A">신용카드매출전표등 발행세액공제 한눈에</text>
  <text x="40" y="80" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="15" fill="#4A5856">부가가치세법 제46조 · 국세청 안내 기준 (2026년 발행분)</text>

  <!-- 공제율/한도 연도 비교 -->
  <rect x="40" y="104" width="340" height="176" rx="14" fill="#E3F0EE" stroke="#0E7C72" stroke-width="1.5"/>
  <text x="60" y="136" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="16" font-weight="700" fill="#0A5F58">공제율 · 연간 한도</text>

  <text x="60" y="172" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="15" font-weight="700" fill="#1A2B2A">2026.12.31까지 (우대)</text>
  <text x="60" y="198" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="22" font-weight="700" fill="#0E7C72">1.3%</text>
  <text x="140" y="198" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="16" fill="#1A2B2A">· 연 한도 1,000만원</text>

  <line x1="60" y1="216" x2="360" y2="216" stroke="#E3DCCF" stroke-width="1.5"/>

  <text x="60" y="244" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="15" font-weight="700" fill="#1A2B2A">2027.1.1부터 (환원 예정)</text>
  <text x="60" y="270" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="22" font-weight="700" fill="#C2873B">1%</text>
  <text x="120" y="270" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="16" fill="#1A2B2A">· 연 한도 500만원</text>

  <!-- 대상 요건 -->
  <rect x="400" y="104" width="320" height="176" rx="14" fill="#F4EEE2" stroke="#E3DCCF" stroke-width="1.5"/>
  <text x="420" y="136" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="16" font-weight="700" fill="#0A5F58">적용 대상</text>
  <text x="420" y="168" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="15" fill="#1A2B2A">O  개인사업자 (일반 · 간이 모두)</text>
  <text x="420" y="196" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="15" fill="#1A2B2A">O  직전연도 공급가액 10억원 이하</text>
  <text x="420" y="224" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="15" fill="#1A2B2A">O  소매 · 음식 · 숙박 등 B2C 업종</text>
  <text x="420" y="256" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="15" font-weight="700" fill="#B5462F">X  법인사업자 · 10억 초과 개인 제외</text>

  <!-- 공제 흐름 -->
  <text x="40" y="322" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="16" font-weight="700" fill="#1A2B2A">공제가 적용되는 흐름</text>

  <rect x="40" y="340" width="160" height="72" rx="12" fill="#F4EEE2" stroke="#E3DCCF" stroke-width="1.5"/>
  <text x="120" y="370" text-anchor="middle" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="14" fill="#4A5856">신용카드 · 현금영수증</text>
  <text x="120" y="392" text-anchor="middle" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="14" fill="#4A5856">매출 발행</text>

  <text x="212" y="382" text-anchor="middle" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="22" fill="#0E7C72">&#8594;</text>

  <rect x="228" y="340" width="160" height="72" rx="12" fill="#F4EEE2" stroke="#E3DCCF" stroke-width="1.5"/>
  <text x="308" y="370" text-anchor="middle" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="14" fill="#4A5856">발행금액 × 1.3%</text>
  <text x="308" y="392" text-anchor="middle" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="14" fill="#4A5856">(2026년 기준)</text>

  <text x="400" y="382" text-anchor="middle" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="22" fill="#0E7C72">&#8594;</text>

  <rect x="416" y="340" width="160" height="72" rx="12" fill="#E3F0EE" stroke="#0E7C72" stroke-width="1.5"/>
  <text x="496" y="370" text-anchor="middle" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="14" fill="#0A5F58">납부세액에서</text>
  <text x="496" y="392" text-anchor="middle" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="14" fill="#0A5F58">공제 (연 한도 내)</text>

  <text x="588" y="382" text-anchor="middle" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="22" fill="#0E7C72">&#8594;</text>

  <rect x="604" y="340" width="116" height="72" rx="12" fill="#F4EEE2" stroke="#E3DCCF" stroke-width="1.5"/>
  <text x="662" y="370" text-anchor="middle" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="14" fill="#4A5856">부가세 신고서</text>
  <text x="662" y="392" text-anchor="middle" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="14" fill="#4A5856">공제세액 반영</text>

  <!-- 환급 아님 경고 박스 -->
  <rect x="40" y="440" width="680" height="60" rx="12" fill="#FBF7F0" stroke="#B5462F" stroke-width="1.5"/>
  <text x="60" y="466" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="15" font-weight="700" fill="#B5462F">환급이 아니에요</text>
  <text x="60" y="490" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="14" fill="#4A5856">낼 세금(납부세액) 범위 안에서만 빼줘요. 공제액이 납부세액을 넘으면 초과분은 소멸(0원)돼요.</text>

  <!-- 계산 예시 -->
  <rect x="40" y="516" width="680" height="76" rx="12" fill="#F4EEE2" stroke="#E3DCCF" stroke-width="1.5"/>
  <text x="60" y="544" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="15" font-weight="700" fill="#0A5F58">계산 예시 (2026년)</text>
  <text x="60" y="570" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="14" fill="#1A2B2A">카드 · 현금영수증 발행 2억원 × 1.3% = 260만원, 연 한도 1,000만원 이내라 전액 공제</text>
  <text x="60" y="586" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="13" fill="#8A938F">단, 그 기간 납부세액이 200만원이면 공제는 200만원까지, 초과 60만원은 소멸</text>
</svg>
