<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="1200" height="860" role="img" aria-label="현금영수증 가맹점 가입의무와 의무발행업종 발급의무의 대상·가산세 산식 비교, 그리고 5일·10일·5년 기한 구분">
  <rect x="0" y="0" width="1200" height="860" fill="#FBF7F0"/>

  <text x="50" y="62" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="38" font-weight="700" fill="#1A2B2A">현금영수증, 두 갈래 의무와 가산세 산식</text>
  <text x="50" y="98" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="21" fill="#4A5856">같은 제도처럼 보이지만 대상 요건도, 가산세 과세표준도 다릅니다</text>

  <!-- 좌측 패널: 가맹점 가입의무 -->
  <rect x="50" y="128" width="535" height="392" rx="14" fill="#F4EEE2" stroke="#E3DCCF" stroke-width="2"/>
  <rect x="50" y="128" width="535" height="6" rx="3" fill="#C2873B"/>
  <text x="82" y="180" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="27" font-weight="700" fill="#0A5F58">1. 가맹점 가입의무</text>
  <text x="82" y="210" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="19" fill="#8A938F">업종 + 수입금액으로 생기는 의무</text>

  <text x="82" y="256" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="20" font-weight="700" fill="#4A5856">누가 대상인가</text>
  <text x="82" y="292" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="21" fill="#1A2B2A">소비자상대업종을 하는 사업자</text>
  <text x="82" y="324" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="21" fill="#1A2B2A">개인은 직전 과세기간 수입금액이</text>
  <text x="82" y="356" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="21" fill="#1A2B2A">2,400만원 이상인 경우</text>
  <text x="82" y="388" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="21" fill="#1A2B2A">법인은 수입금액과 무관</text>

  <rect x="82" y="418" width="471" height="76" rx="10" fill="#E3F0EE"/>
  <text x="100" y="448" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="18" fill="#4A5856">위반 시 가산세</text>
  <text x="100" y="480" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="26" font-weight="700" fill="#0A5F58">미가입기간 수입금액 × 1%</text>

  <!-- 우측 패널: 발급의무 -->
  <rect x="615" y="128" width="535" height="392" rx="14" fill="#F4EEE2" stroke="#E3DCCF" stroke-width="2"/>
  <rect x="615" y="128" width="535" height="6" rx="3" fill="#0E7C72"/>
  <text x="647" y="180" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="27" font-weight="700" fill="#0A5F58">2. 현금영수증 발급의무</text>
  <text x="647" y="210" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="19" fill="#8A938F">업종 + 거래금액으로 생기는 의무</text>

  <text x="647" y="256" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="20" font-weight="700" fill="#4A5856">언제 생기나</text>
  <text x="647" y="292" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="21" fill="#1A2B2A">시행령 별표 3의3 의무발행업종</text>
  <text x="647" y="324" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="21" fill="#1A2B2A">건당 10만원 이상(부가세 포함)</text>
  <text x="647" y="356" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="21" fill="#1A2B2A">현금거래를 한 경우</text>
  <text x="647" y="388" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="21" font-weight="700" fill="#B5462F">가맹점 가입 여부와 무관</text>

  <rect x="647" y="418" width="471" height="76" rx="10" fill="#E3F0EE"/>
  <text x="665" y="448" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="18" fill="#4A5856">위반 시 가산세</text>
  <text x="665" y="480" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="26" font-weight="700" fill="#0A5F58">미발급금액 × 20%</text>

  <!-- 하단: 기한 3종 -->
  <text x="50" y="572" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="26" font-weight="700" fill="#1A2B2A">붙여 쓰기 쉬운 세 기한</text>

  <rect x="50" y="596" width="355" height="208" rx="14" fill="#F4EEE2" stroke="#E3DCCF" stroke-width="2"/>
  <text x="78" y="640" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="23" font-weight="700" fill="#0E7C72">현금 받은 날부터 5일</text>
  <line x1="78" y1="656" x2="377" y2="656" stroke="#E3DCCF" stroke-width="2"/>
  <text x="78" y="690" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="20" fill="#1A2B2A">상대방 인적사항을</text>
  <text x="78" y="720" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="20" fill="#1A2B2A">모를 때 지정번호</text>
  <text x="78" y="750" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="20" font-weight="700" fill="#0A5F58">010-000-1234</text>
  <text x="78" y="780" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="20" fill="#1A2B2A">자진발급</text>

  <rect x="422" y="596" width="355" height="208" rx="14" fill="#F4EEE2" stroke="#E3DCCF" stroke-width="2"/>
  <text x="450" y="640" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="23" font-weight="700" fill="#0E7C72">대금 받은 날부터 10일</text>
  <line x1="450" y1="656" x2="749" y2="656" stroke="#E3DCCF" stroke-width="2"/>
  <text x="450" y="690" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="20" fill="#1A2B2A">착오·누락분을</text>
  <text x="450" y="720" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="20" fill="#1A2B2A">자진신고하거나</text>
  <text x="450" y="750" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="20" fill="#1A2B2A">자진발급하면</text>
  <text x="450" y="780" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="20" font-weight="700" fill="#0A5F58">세율 10% 적용</text>

  <rect x="795" y="596" width="355" height="208" rx="14" fill="#F4EEE2" stroke="#E3DCCF" stroke-width="2"/>
  <text x="823" y="640" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="23" font-weight="700" fill="#C2873B">거래일부터 5년</text>
  <line x1="823" y1="656" x2="1122" y2="656" stroke="#E3DCCF" stroke-width="2"/>
  <text x="823" y="690" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="20" fill="#1A2B2A">소비자의 미발급·</text>
  <text x="823" y="720" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="20" fill="#1A2B2A">발급거부 신고 기한</text>
  <text x="823" y="750" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="20" fill="#1A2B2A">소득공제 인정은</text>
  <text x="823" y="780" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="20" font-weight="700" fill="#B5462F">3년 이내 신고분</text>

  <text x="50" y="838" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="18" fill="#8A938F">2026년 9월 15일 기준 국세청 안내와 소득세법 제162조의3·제81조의9 대조. 개별 사안은 관할 세무서 확인.</text>
</svg>
