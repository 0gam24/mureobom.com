<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" role="img" aria-labelledby="title desc" font-family="'IBM Plex Sans KR', system-ui, sans-serif">
  <title id="title">같은 사람도 NICE와 KCB 점수가 다른 이유와 무료 조회 정리</title>
  <desc id="desc">한 사람의 신용정보를 NICE와 KCB가 서로 다른 평가모형으로 계산해 점수가 달라지며, 본인 조회(연성조회)는 점수에 영향이 없고 각 회사에서 4개월마다 무료로 열람할 수 있다.</desc>

  <rect x="0" y="0" width="760" height="560" fill="#FBF7F0"/>

  <!-- header -->
  <text x="40" y="52" font-size="27" font-weight="700" fill="#1A2B2A">같은 사람인데 왜 점수가 다를까</text>
  <text x="40" y="80" font-size="15" fill="#4A5856">2021년부터 신용등급(1~10등급) 폐지, 신용점수제(1~1000점)로 전환</text>

  <!-- same person node -->
  <rect x="40" y="104" width="200" height="92" rx="12" fill="#F4EEE2" stroke="#E3DCCF" stroke-width="1.5"/>
  <text x="140" y="140" text-anchor="middle" font-size="16" font-weight="700" fill="#1A2B2A">한 사람의</text>
  <text x="140" y="164" text-anchor="middle" font-size="16" font-weight="700" fill="#1A2B2A">신용정보</text>
  <text x="140" y="184" text-anchor="middle" font-size="12.5" fill="#8A938F">대출·연체·카드 이용 등</text>

  <!-- arrows -->
  <path d="M240 132 L300 132" stroke="#0E7C72" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <path d="M240 168 L300 168" stroke="#0E7C72" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#0E7C72"/>
    </marker>
  </defs>

  <!-- NICE card -->
  <rect x="306" y="104" width="200" height="92" rx="12" fill="#E3F0EE" stroke="#0E7C72" stroke-width="1.5"/>
  <text x="406" y="132" text-anchor="middle" font-size="15" font-weight="700" fill="#0A5F58">NICE평가정보</text>
  <text x="406" y="158" text-anchor="middle" font-size="13" fill="#4A5856">평가모형 A로 계산</text>
  <text x="406" y="184" text-anchor="middle" font-size="21" font-weight="700" fill="#0E7C72">예: 820점</text>

  <!-- KCB card -->
  <rect x="520" y="104" width="200" height="92" rx="12" fill="#F4EEE2" stroke="#C2873B" stroke-width="1.5"/>
  <text x="620" y="132" text-anchor="middle" font-size="15" font-weight="700" fill="#1A2B2A">KCB(코리아크레딧뷰로)</text>
  <text x="620" y="158" text-anchor="middle" font-size="13" fill="#4A5856">평가모형 B로 계산</text>
  <text x="620" y="184" text-anchor="middle" font-size="21" font-weight="700" fill="#C2873B">예: 790점</text>

  <text x="40" y="230" font-size="14" fill="#4A5856">반영하는 항목·데이터·시점이 서로 달라 점수가 다르게 나와요. 어느 한쪽이 절대 기준은 아니에요.</text>

  <!-- cutoff panel -->
  <rect x="40" y="252" width="680" height="150" rx="12" fill="#F4EEE2" stroke="#E3DCCF" stroke-width="1.5"/>
  <text x="60" y="282" font-size="16" font-weight="700" fill="#1A2B2A">같은 규제 기준도 회사마다 컷오프가 달라요 (금융위 예시)</text>

  <line x1="60" y1="296" x2="700" y2="296" stroke="#E3DCCF" stroke-width="1"/>
  <text x="60" y="322" font-size="13.5" fill="#4A5856">구분</text>
  <text x="330" y="322" font-size="13.5" font-weight="700" fill="#0A5F58">NICE 기준</text>
  <text x="520" y="322" font-size="13.5" font-weight="700" fill="#C2873B">KCB 기준</text>

  <line x1="60" y1="332" x2="700" y2="332" stroke="#E3DCCF" stroke-width="1"/>
  <text x="60" y="356" font-size="13.5" fill="#1A2B2A">신용카드 발급</text>
  <text x="330" y="356" font-size="13.5" fill="#1A2B2A">680점 이상</text>
  <text x="520" y="356" font-size="13.5" fill="#1A2B2A">576점 이상</text>

  <line x1="60" y1="366" x2="700" y2="366" stroke="#E3DCCF" stroke-width="1"/>
  <text x="60" y="390" font-size="13.5" fill="#1A2B2A">서민금융상품 지원</text>
  <text x="330" y="390" font-size="13.5" fill="#1A2B2A">744점 이하</text>
  <text x="520" y="390" font-size="13.5" fill="#1A2B2A">700점 이하</text>

  <!-- free lookup band -->
  <rect x="40" y="422" width="680" height="102" rx="12" fill="#E3F0EE" stroke="#0E7C72" stroke-width="1.5"/>
  <text x="60" y="452" font-size="16" font-weight="700" fill="#0A5F58">무료 조회 &amp; 본인 조회는 점수에 영향 없어요</text>
  <text x="60" y="480" font-size="13.5" fill="#1A2B2A">각 회사에서 4개월마다 1회, 1년에 3회 무료 열람 (신용정보법 제39조)</text>
  <text x="60" y="504" font-size="13.5" fill="#1A2B2A">내가 내 점수를 보는 것(연성조회)은 점수에 영향을 주지 않아요</text>
  <text x="60" y="520" font-size="11.5" fill="#8A938F">출처: 금융위원회 · 금융감독원 파인 · 법제처 생활법령 (2026년 8월 기준)</text>
</svg>
