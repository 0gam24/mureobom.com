<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-label="소득활동에 따른 노령연금 감액 구조: 초과소득월액 200만원 미만 감액 없음, 200만~300만 15% 이상, 300만~400만 20% 이상, 400만 이상 25% 이상, 최대 노령연금의 1/2 한도" font-family="'IBM Plex Sans KR', system-ui, sans-serif">
  <rect x="0" y="0" width="760" height="400" fill="#FBF7F0"/>
  <text x="60" y="40" font-size="22" font-weight="700" fill="#1A2B2A">소득활동에 따른 노령연금 감액 구조 (2026년 기준)</text>
  <text x="60" y="66" font-size="13" fill="#4A5856">감액은 수급개시연령부터 5년간만 · 초과소득월액 = 월 근로·사업소득금액 − A값(2026년 3,193,511원)</text>

  <!-- 구간별 감액 막대 -->
  <rect x="60" y="120" width="264" height="70" fill="#E3F0EE"/>
  <rect x="324" y="120" width="132" height="70" fill="#0E7C72"/>
  <rect x="456" y="120" width="132" height="70" fill="#0A5F58"/>
  <rect x="588" y="120" width="132" height="70" fill="#B5462F"/>

  <text x="192" y="162" font-size="18" font-weight="700" fill="#0A5F58" text-anchor="middle">감액 없음</text>
  <text x="390" y="150" font-size="20" font-weight="700" fill="#FBF7F0" text-anchor="middle">15%+</text>
  <text x="390" y="172" font-size="12" fill="#E3F0EE" text-anchor="middle">15만원 기준</text>
  <text x="522" y="150" font-size="20" font-weight="700" fill="#FBF7F0" text-anchor="middle">20%+</text>
  <text x="522" y="172" font-size="12" fill="#E3F0EE" text-anchor="middle">30만원 기준</text>
  <text x="654" y="150" font-size="20" font-weight="700" fill="#FBF7F0" text-anchor="middle">25%+</text>
  <text x="654" y="172" font-size="12" fill="#F4EEE2" text-anchor="middle">50만원 기준</text>

  <!-- 구간 경계 눈금 -->
  <text x="60" y="210" font-size="12" fill="#8A938F" text-anchor="middle">0</text>
  <text x="324" y="210" font-size="12" fill="#4A5856" text-anchor="middle">200만원</text>
  <text x="456" y="210" font-size="12" fill="#4A5856" text-anchor="middle">300만원</text>
  <text x="588" y="210" font-size="12" fill="#4A5856" text-anchor="middle">400만원</text>
  <text x="720" y="210" font-size="12" fill="#8A938F" text-anchor="end">초과소득월액</text>

  <!-- 유의사항 패널 -->
  <rect x="60" y="240" width="660" height="128" rx="8" fill="#F4EEE2" stroke="#E3DCCF" stroke-width="1"/>
  <text x="80" y="270" font-size="13" fill="#1A2B2A">· 감액 한도: 어떤 경우에도 노령연금액의 최대 1/2까지만 줄어요.</text>
  <text x="80" y="296" font-size="13" fill="#1A2B2A">· 적용 기간: 수급개시연령부터 5년간만(이후엔 소득 많아도 감액 없음).</text>
  <text x="80" y="322" font-size="13" fill="#1A2B2A">· 대상 소득: 근로·사업소득금액만(이자·배당·연금 등은 제외).</text>
  <text x="80" y="348" font-size="13" fill="#B5462F">· 감액 기간에는 부양가족연금액이 지급되지 않아요.</text>
</svg>
