<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="1200" height="860" role="img" aria-label="산재보험 간병 관련 급여 비교. 요양(치료) 중에는 요양비의 한 항목인 간병료가 지급되며, 근거는 시행규칙 제11조·제12조·제13조이고 금액은 간병이 필요한 정도에 따른 간병 1~3등급으로 전문간병인 79,590원·66,320원·53,060원, 가족 및 그 밖의 간병인 69,370원·57,810원·46,250원이다. 간병인 1명이 2명 이상 동시 간병 시 100분의 20 가산, 중환자실·회복실 요양 기간은 별도 간병 미제공. 치유 후에는 간병급여가 지급되며, 근거는 법 제61조와 시행령 제59조 및 별표 7이고 금액은 장해등급에 따른 상시·수시 구분으로 전문간병인 상시 53,060원 수시 35,370원, 가족 및 그 밖의 간병인 상시 46,250원 수시 30,830원이다. 지출액이 기준보다 적으면 실제 지출액만 지급하고 재요양 기간 중에는 지급하지 않는다. 간병료 3등급 금액 53,060원과 46,250원이 간병급여 상시 금액과 수치상 동일해 혼동이 생긴다. 금액 기준일은 2026년 9월 15일.">
  <rect x="0" y="0" width="1200" height="860" fill="#FBF7F0"/>

  <text x="60" y="58" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="36" font-weight="700" fill="#1A2B2A">산재 간병료와 간병급여, 치유 전후로 갈립니다</text>
  <text x="60" y="94" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="18" fill="#4A5856">같은 1일 금액이 두 제도에 등장해 생기는 혼동을 지급 시점·근거·등급 기준으로 구분</text>
  <text x="60" y="124" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="14" fill="#8A938F">정보 기준일 2026년 9월 15일 · 출처 법제처 찾기쉬운 생활법령정보, 국가법령정보센터</text>

  <text x="330" y="166" text-anchor="middle" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="17" fill="#4A5856">요양(치료) 중</text>
  <text x="600" y="166" text-anchor="middle" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="17" font-weight="700" fill="#C2873B">치유</text>
  <text x="880" y="166" text-anchor="middle" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="17" fill="#4A5856">치유 후</text>

  <rect x="60" y="180" width="540" height="8" fill="#0A5F58"/>
  <rect x="600" y="180" width="520" height="8" fill="#0E7C72"/>
  <polygon points="1120,172 1148,184 1120,196" fill="#0E7C72"/>
  <circle cx="600" cy="184" r="10" fill="#C2873B"/>

  <rect x="60" y="258" width="510" height="430" rx="14" fill="#F4EEE2" stroke="#E3DCCF" stroke-width="1.5"/>
  <rect x="630" y="258" width="510" height="430" rx="14" fill="#E3F0EE" stroke="#E3DCCF" stroke-width="1.5"/>
  <rect x="60" y="215" width="510" height="56" rx="14" fill="#0A5F58"/>
  <rect x="630" y="215" width="510" height="56" rx="14" fill="#0E7C72"/>
  <text x="88" y="252" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="25" font-weight="700" fill="#FBF7F0">요양 중 · 간병료</text>
  <text x="658" y="252" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="25" font-weight="700" fill="#FBF7F0">치유 후 · 간병급여</text>

  <text x="88" y="306" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="15" fill="#8A938F">지급 시점</text>
  <text x="88" y="330" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="17" fill="#1A2B2A">요양비의 한 항목으로 치료 중 지급</text>
  <text x="88" y="368" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="15" fill="#8A938F">근거</text>
  <text x="88" y="392" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="17" fill="#1A2B2A">시행규칙 제11조·제12조·제13조</text>
  <text x="88" y="416" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="17" fill="#1A2B2A">고용노동부 간병료 지급기준 고시</text>
  <text x="88" y="454" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="15" fill="#8A938F">금액 기준</text>
  <text x="88" y="478" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="17" fill="#1A2B2A">간병이 필요한 정도에 따른 간병 1~3등급</text>

  <text x="658" y="306" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="15" fill="#8A938F">지급 시점</text>
  <text x="658" y="330" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="17" fill="#1A2B2A">치유 후 실제 간병을 받은 날에 지급</text>
  <text x="658" y="368" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="15" fill="#8A938F">근거</text>
  <text x="658" y="392" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="17" fill="#1A2B2A">법 제61조, 시행령 제59조·별표 7</text>
  <text x="658" y="416" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="17" fill="#1A2B2A">고용노동부 간병급여 지급기준 고시</text>
  <text x="658" y="454" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="15" fill="#8A938F">금액 기준</text>
  <text x="658" y="478" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="17" fill="#1A2B2A">장해등급에 따른 상시·수시 구분</text>

  <line x1="88" y1="500" x2="546" y2="500" stroke="#E3DCCF" stroke-width="1.5"/>
  <text x="96" y="524" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="14" fill="#8A938F">1일 금액</text>
  <text x="330" y="524" text-anchor="middle" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="14" fill="#8A938F">전문간병인</text>
  <text x="480" y="524" text-anchor="middle" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="14" fill="#8A938F">가족·그 밖</text>
  <text x="96" y="556" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="17" fill="#4A5856">간병 1등급</text>
  <text x="330" y="556" text-anchor="middle" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="18" font-weight="700" fill="#1A2B2A">79,590원</text>
  <text x="480" y="556" text-anchor="middle" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="18" fill="#1A2B2A">69,370원</text>
  <text x="96" y="586" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="17" fill="#4A5856">간병 2등급</text>
  <text x="330" y="586" text-anchor="middle" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="18" font-weight="700" fill="#1A2B2A">66,320원</text>
  <text x="480" y="586" text-anchor="middle" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="18" fill="#1A2B2A">57,810원</text>
  <rect x="88" y="596" width="458" height="34" rx="8" fill="none" stroke="#C2873B" stroke-width="2"/>
  <text x="96" y="620" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="17" fill="#4A5856">간병 3등급</text>
  <text x="330" y="620" text-anchor="middle" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="18" font-weight="700" fill="#C2873B">53,060원</text>
  <text x="480" y="620" text-anchor="middle" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="18" font-weight="700" fill="#C2873B">46,250원</text>

  <line x1="658" y1="500" x2="1116" y2="500" stroke="#E3DCCF" stroke-width="1.5"/>
  <text x="666" y="524" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="14" fill="#8A938F">1일 금액</text>
  <text x="900" y="524" text-anchor="middle" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="14" fill="#8A938F">전문간병인</text>
  <text x="1050" y="524" text-anchor="middle" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="14" fill="#8A938F">가족·그 밖</text>
  <rect x="658" y="532" width="458" height="34" rx="8" fill="none" stroke="#C2873B" stroke-width="2"/>
  <text x="666" y="556" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="17" fill="#4A5856">상시 간병</text>
  <text x="900" y="556" text-anchor="middle" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="18" font-weight="700" fill="#C2873B">53,060원</text>
  <text x="1050" y="556" text-anchor="middle" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="18" font-weight="700" fill="#C2873B">46,250원</text>
  <text x="666" y="592" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="17" fill="#4A5856">수시 간병</text>
  <text x="900" y="592" text-anchor="middle" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="18" font-weight="700" fill="#1A2B2A">35,370원</text>
  <text x="1050" y="592" text-anchor="middle" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="18" fill="#1A2B2A">30,830원</text>
  <text x="666" y="622" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="15" fill="#0A5F58">수시는 상시의 3분의 2 (시행령 제59조제3항)</text>

  <text x="88" y="658" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="15" fill="#4A5856">1명이 2명 이상 동시 간병 시 100분의 20 가산</text>
  <text x="88" y="680" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="15" fill="#B5462F">중환자실·회복실 요양 기간은 별도 간병 미제공</text>
  <text x="658" y="658" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="15" fill="#4A5856">지출이 기준보다 적으면 실제 지출액만 지급</text>
  <text x="658" y="680" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="15" fill="#B5462F">재요양 기간 중에는 간병급여를 지급하지 않음</text>

  <rect x="60" y="708" width="1080" height="88" rx="14" fill="#F4EEE2" stroke="#C2873B" stroke-width="2"/>
  <text x="88" y="744" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="20" font-weight="700" fill="#1A2B2A">겹치는 숫자: 간병료 3등급 53,060원·46,250원이 간병급여 상시 금액과 수치가 같습니다</text>
  <text x="88" y="774" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="16" fill="#4A5856">두 금액표는 별개 고시이므로, 어느 제도인지는 금액이 아니라 치유 전인지 후인지로 판단하세요</text>

  <text x="60" y="828" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="14" fill="#8A938F">금액은 고용노동부 고시 개정으로 바뀔 수 있어 청구 시점의 적용 금액은 근로복지공단에서 확인하세요.</text>
</svg>
