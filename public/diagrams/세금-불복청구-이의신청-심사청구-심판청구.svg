<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 740" role="img" aria-label="국세 불복 기간 축과 경로 분기. 고지서를 받기 전 세무조사 결과 서면통지나 과세예고 통지 단계에서는 통지받은 날부터 30일 이내에 과세전적부심사를 청구하고 결정도 30일 이내에 통지됩니다. 처분 통지를 받은 날부터는 90일이 기산되며 이의신청, 심사청구, 심판청구, 감사원 심사청구 중 하나를 선택합니다. 이의신청은 세무서장 또는 관할 지방국세청장에게 내고 결정기간은 30일이며 항변하면 60일입니다. 이의신청만으로는 행정소송을 낼 수 없고 감사원 심사청구가 배제됩니다. 심사청구는 국세청장에게 내고 결정기간은 90일, 심판청구는 조세심판원장에게 내며 두 절차는 중복 제기할 수 없습니다. 행정소송은 심사청구 또는 심판청구 결정 통지를 받은 날부터 90일 이내 불변기간입니다. 불복을 제기해도 징수와 압류는 정지되지 않습니다." font-family="'IBM Plex Sans KR', system-ui, sans-serif">
  <rect x="0" y="0" width="1080" height="740" fill="#FBF7F0"/>

  <text x="44" y="52" font-size="28" font-weight="700" fill="#1A2B2A">세금 고지, 30일과 90일로 갈리는 다툼 경로</text>
  <text x="44" y="80" font-size="15" fill="#8A938F">국세기본법 제55조·제56조·제57조·제61조·제65조·제66조·제68조·제81조의15 기준 (정보 기준일 2026년 9월 8일)</text>

  <!-- 1. 과세 전 단계 -->
  <rect x="44" y="100" width="992" height="118" rx="12" fill="#F4EEE2"/>
  <text x="68" y="130" font-size="17" font-weight="700" fill="#0A5F58">1. 고지서를 받기 전: 세무조사 결과 서면통지·과세예고 통지 단계</text>

  <rect x="68" y="146" width="290" height="54" rx="8" fill="#E3F0EE"/>
  <text x="88" y="170" font-size="15" font-weight="700" fill="#0A5F58">통지받은 날부터 30일 이내</text>
  <text x="88" y="190" font-size="14" fill="#4A5856">과세전적부심사 청구</text>

  <rect x="374" y="146" width="290" height="54" rx="8" fill="#E3F0EE"/>
  <text x="394" y="170" font-size="15" font-weight="700" fill="#0A5F58">청구받은 날부터 30일 이내</text>
  <text x="394" y="190" font-size="14" fill="#4A5856">국세심사위원회 심사 후 결정</text>

  <rect x="680" y="146" width="332" height="54" rx="8" fill="#F4EEE2" stroke="#E3DCCF" stroke-width="1.5"/>
  <text x="700" y="170" font-size="15" font-weight="700" fill="#1A2B2A">다투지 않는 선택</text>
  <text x="700" y="190" font-size="14" fill="#4A5856">조기결정 신청도 가능해요</text>

  <!-- 2. 기산점 -->
  <rect x="44" y="232" width="992" height="46" rx="10" fill="#0E7C72"/>
  <text x="68" y="261" font-size="17" font-weight="700" fill="#FBF7F0">2. 처분(납세고지·경정 등) 통지를 받은 날이 90일의 기산점</text>
  <text x="1012" y="261" font-size="14" fill="#E3F0EE" text-anchor="end">제61조·제68조</text>

  <!-- 3. 네 갈래 -->
  <text x="44" y="308" font-size="17" font-weight="700" fill="#0A5F58">3. 90일 안에 고르는 네 갈래, 첫 선택이 다음 선택을 줄여요</text>

  <rect x="44" y="322" width="236" height="250" rx="12" fill="#F4EEE2"/>
  <text x="64" y="352" font-size="17" font-weight="700" fill="#0A5F58">이의신청</text>
  <text x="64" y="378" font-size="15" font-weight="700" fill="#1A2B2A">제기 90일 이내</text>
  <text x="64" y="400" font-size="14" fill="#4A5856">세무서장 또는</text>
  <text x="64" y="420" font-size="14" fill="#4A5856">관할 지방국세청장</text>
  <text x="64" y="446" font-size="14" fill="#1A2B2A">결정 30일</text>
  <text x="64" y="466" font-size="14" fill="#4A5856">(항변하면 60일)</text>
  <text x="64" y="496" font-size="14" fill="#B5462F">감사원 심사청구 배제</text>
  <text x="64" y="516" font-size="14" fill="#B5462F">이것만으로는 소송 불가</text>
  <text x="64" y="546" font-size="13" fill="#8A938F">제66조</text>

  <rect x="296" y="322" width="236" height="250" rx="12" fill="#E3F0EE"/>
  <text x="316" y="352" font-size="17" font-weight="700" fill="#0A5F58">심사청구</text>
  <text x="316" y="378" font-size="15" font-weight="700" fill="#1A2B2A">제기 90일 이내</text>
  <text x="316" y="400" font-size="14" fill="#4A5856">국세청장에게</text>
  <text x="316" y="420" font-size="14" fill="#4A5856">결정 뒤 행정소송 가능</text>
  <text x="316" y="446" font-size="14" fill="#1A2B2A">결정 90일</text>
  <text x="316" y="466" font-size="14" fill="#4A5856">각하되면 내용 심리 없음</text>
  <text x="316" y="496" font-size="14" fill="#B5462F">심판청구와 중복 불가</text>
  <text x="316" y="516" font-size="14" fill="#B5462F">결정에는 재청구 불가</text>
  <text x="316" y="546" font-size="13" fill="#8A938F">제61조·제65조</text>

  <rect x="548" y="322" width="236" height="250" rx="12" fill="#E3F0EE"/>
  <text x="568" y="352" font-size="17" font-weight="700" fill="#0A5F58">심판청구</text>
  <text x="568" y="378" font-size="15" font-weight="700" fill="#1A2B2A">제기 90일 이내</text>
  <text x="568" y="400" font-size="14" fill="#4A5856">조세심판원장에게</text>
  <text x="568" y="420" font-size="14" fill="#4A5856">결정 뒤 행정소송 가능</text>
  <text x="568" y="446" font-size="14" fill="#8A938F">결정기간은 이 그림의</text>
  <text x="568" y="466" font-size="14" fill="#8A938F">확인 범위 밖</text>
  <text x="568" y="496" font-size="14" fill="#B5462F">심사청구와 중복 불가</text>
  <text x="568" y="516" font-size="14" fill="#B5462F">결정에는 재청구 불가</text>
  <text x="568" y="546" font-size="13" fill="#8A938F">제68조</text>

  <rect x="800" y="322" width="236" height="250" rx="12" fill="#F4EEE2"/>
  <text x="820" y="352" font-size="17" font-weight="700" fill="#0A5F58">감사원 심사청구</text>
  <text x="820" y="378" font-size="15" font-weight="700" fill="#1A2B2A">감사원에 직접 청구</text>
  <text x="820" y="400" font-size="14" fill="#B5462F">이의신청을 거쳤다면</text>
  <text x="820" y="420" font-size="14" fill="#B5462F">선택할 수 없어요</text>
  <text x="820" y="446" font-size="14" fill="#8A938F">청구기간은 감사원법</text>
  <text x="820" y="466" font-size="14" fill="#8A938F">소관이라 표기하지 않음</text>
  <text x="820" y="496" font-size="14" fill="#4A5856">감사원에 심사청구를 한</text>
  <text x="820" y="516" font-size="14" fill="#4A5856">처분은 국세기본법상</text>
  <text x="820" y="536" font-size="14" fill="#4A5856">불복 대상에서 제외</text>
  <text x="820" y="560" font-size="13" fill="#8A938F">제55조 단서</text>

  <!-- 4. 행정소송 -->
  <rect x="44" y="588" width="992" height="54" rx="10" fill="#E3F0EE"/>
  <text x="68" y="613" font-size="16" font-weight="700" fill="#0A5F58">4. 행정소송은 심사청구 또는 심판청구의 결정 통지를 받은 날부터 90일 이내 (불변기간, 제56조)</text>
  <text x="68" y="633" font-size="14" fill="#4A5856">이의신청만 거친 상태에서는 행정소송을 제기할 수 없어요. 결정기간 안에 통지를 받지 못하면 결정기간이 지난 날부터 제기할 수 있어요.</text>

  <!-- 5. 집행부정지 -->
  <rect x="44" y="654" width="992" height="54" rx="10" fill="#F4EEE2" stroke="#B5462F" stroke-width="1.5"/>
  <text x="68" y="679" font-size="16" font-weight="700" fill="#B5462F">5. 불복을 제기해도 고지된 세액의 징수와 압류는 멈추지 않아요 (제57조 집행부정지)</text>
  <text x="68" y="699" font-size="14" fill="#4A5856">재결청이 중대한 손해를 예방할 필요가 긴급하다고 인정할 때에만 집행이나 절차 속행을 중지할 수 있어요.</text>

  <text x="44" y="728" font-size="13" fill="#8A938F">재산세·취득세 등 지방세는 지방세기본법 소관이라 절차와 기관이 달라요. 이 그림은 일반 정보이며 개별 사건의 판단이 아니에요.</text>
</svg>
