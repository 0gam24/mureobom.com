<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img" aria-label="장기요양 본인부담금 감경 구조: 기본 부담률 재가 15%·시설 20%, 60% 감경 시 재가 6%·시설 8%, 40% 감경 시 재가 9%·시설 12%, 의료급여 수급권자는 면제" font-family="'IBM Plex Sans KR', system-ui, sans-serif">
  <rect x="0" y="0" width="760" height="460" fill="#FBF7F0"/>
  <text x="40" y="42" font-size="22" font-weight="700" fill="#1A2B2A">장기요양 본인부담금, 감경받으면 얼마나 내나요?</text>
  <text x="40" y="68" font-size="13" fill="#4A5856">기본 부담률(재가 15%·시설 20%)에 감경률을 곱한 실제 부담률 · 감경 60%는 비용의 40%만 부담</text>

  <!-- 열 헤더 -->
  <text x="250" y="112" font-size="15" font-weight="700" fill="#0A5F58" text-anchor="middle">재가급여</text>
  <text x="470" y="112" font-size="15" font-weight="700" fill="#0A5F58" text-anchor="middle">시설급여(요양원)</text>

  <!-- 행1: 기본 부담률 -->
  <rect x="40" y="128" width="180" height="60" rx="8" fill="#F4EEE2" stroke="#E3DCCF" stroke-width="1"/>
  <text x="130" y="158" font-size="14" font-weight="700" fill="#1A2B2A" text-anchor="middle">감경 없음</text>
  <text x="130" y="178" font-size="12" fill="#4A5856" text-anchor="middle">기본 부담률</text>
  <rect x="240" y="128" width="200" height="60" rx="8" fill="#E3F0EE"/>
  <text x="340" y="166" font-size="22" font-weight="700" fill="#0A5F58" text-anchor="middle">15%</text>
  <rect x="460" y="128" width="200" height="60" rx="8" fill="#E3F0EE"/>
  <text x="560" y="166" font-size="22" font-weight="700" fill="#0A5F58" text-anchor="middle">20%</text>

  <!-- 행2: 60% 감경 -->
  <rect x="40" y="196" width="180" height="60" rx="8" fill="#F4EEE2" stroke="#E3DCCF" stroke-width="1"/>
  <text x="130" y="226" font-size="14" font-weight="700" fill="#1A2B2A" text-anchor="middle">60% 감경</text>
  <text x="130" y="246" font-size="12" fill="#4A5856" text-anchor="middle">비용의 40%만 부담</text>
  <rect x="240" y="196" width="200" height="60" rx="8" fill="#0E7C72"/>
  <text x="340" y="234" font-size="22" font-weight="700" fill="#FBF7F0" text-anchor="middle">6%</text>
  <rect x="460" y="196" width="200" height="60" rx="8" fill="#0E7C72"/>
  <text x="560" y="234" font-size="22" font-weight="700" fill="#FBF7F0" text-anchor="middle">8%</text>

  <!-- 행3: 40% 감경 -->
  <rect x="40" y="264" width="180" height="60" rx="8" fill="#F4EEE2" stroke="#E3DCCF" stroke-width="1"/>
  <text x="130" y="294" font-size="14" font-weight="700" fill="#1A2B2A" text-anchor="middle">40% 감경</text>
  <text x="130" y="314" font-size="12" fill="#4A5856" text-anchor="middle">비용의 60% 부담</text>
  <rect x="240" y="264" width="200" height="60" rx="8" fill="#0A5F58"/>
  <text x="340" y="302" font-size="22" font-weight="700" fill="#FBF7F0" text-anchor="middle">9%</text>
  <rect x="460" y="264" width="200" height="60" rx="8" fill="#0A5F58"/>
  <text x="560" y="302" font-size="22" font-weight="700" fill="#FBF7F0" text-anchor="middle">12%</text>

  <!-- 행4: 의료급여 면제 -->
  <rect x="40" y="332" width="180" height="60" rx="8" fill="#F4EEE2" stroke="#E3DCCF" stroke-width="1"/>
  <text x="130" y="362" font-size="14" font-weight="700" fill="#1A2B2A" text-anchor="middle">의료급여 수급권자</text>
  <text x="130" y="382" font-size="12" fill="#4A5856" text-anchor="middle">감경 아닌 면제</text>
  <rect x="240" y="332" width="420" height="60" rx="8" fill="#C2873B"/>
  <text x="450" y="370" font-size="20" font-weight="700" fill="#FBF7F0" text-anchor="middle">본인부담금 0% (전액 면제)</text>

  <!-- 하단 안내 -->
  <rect x="40" y="408" width="680" height="36" rx="8" fill="#F4EEE2" stroke="#E3DCCF" stroke-width="1"/>
  <text x="56" y="431" font-size="12.5" fill="#B5462F">감경 대상·보험료 순위 구간은 고시로 바뀌어요. 개인별 여부는 국민건강보험공단 1577-1000·복지로에서 확인하세요.</text>
</svg>
