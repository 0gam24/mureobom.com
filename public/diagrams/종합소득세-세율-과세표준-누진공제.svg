<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" role="img" aria-label="종합소득세 8구간 기본세율표와 산출세액 계산 구조 도표. 산출세액은 과세표준 곱하기 세율 빼기 누진공제로 계산해요. 8구간은 과세표준 1,400만원 이하 6% 누진공제 0원, 5,000만원 이하 15% 누진공제 126만원, 8,800만원 이하 24% 576만원, 1억 5,000만원 이하 35% 1,544만원, 3억원 이하 38% 1,994만원, 5억원 이하 40% 2,594만원, 10억원 이하 42% 3,594만원, 10억원 초과 45% 6,594만원이에요. 계산 예시로 과세표준 3,000만원은 3,000만 곱하기 15% 빼기 126만은 324만원, 1억원은 1억 곱하기 35% 빼기 1,544만은 1,956만원이에요. 여기에 개인지방소득세 10%가 별도로 붙어 실제 부담은 약 1.1배예요.">
  <rect x="0" y="0" width="820" height="500" fill="#FBF7F0"/>

  <text x="40" y="44" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="26" font-weight="700" fill="#1A2B2A">종합소득세 8구간 세율과 세액 계산</text>
  <text x="40" y="70" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="14.5" fill="#4A5856">산출세액 = 과세표준 x 세율 - 누진공제 (소득세법 제55조, 2026년 적용)</text>

  <!-- 세율표 헤더 -->
  <rect x="40" y="86" width="430" height="30" rx="6" fill="#0E7C72"/>
  <text x="54" y="106" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#FBF7F0">과세표준 구간</text>
  <text x="330" y="106" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#FBF7F0">세율</text>
  <text x="386" y="106" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#FBF7F0">누진공제</text>

  <!-- 8개 행 -->
  <g font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="12" fill="#1A2B2A">
    <rect x="40" y="116" width="430" height="27" fill="#F4EEE2"/>
    <text x="54" y="134">1,400만원 이하</text><text x="330" y="134" font-weight="700" fill="#0A5F58">6%</text><text x="386" y="134" fill="#4A5856">0원</text>

    <rect x="40" y="143" width="430" height="27" fill="#FBF7F0"/>
    <text x="54" y="161">1,400만 ~ 5,000만원</text><text x="330" y="161" font-weight="700" fill="#0A5F58">15%</text><text x="386" y="161" fill="#4A5856">126만원</text>

    <rect x="40" y="170" width="430" height="27" fill="#F4EEE2"/>
    <text x="54" y="188">5,000만 ~ 8,800만원</text><text x="330" y="188" font-weight="700" fill="#0A5F58">24%</text><text x="386" y="188" fill="#4A5856">576만원</text>

    <rect x="40" y="197" width="430" height="27" fill="#FBF7F0"/>
    <text x="54" y="215">8,800만 ~ 1억 5,000만원</text><text x="330" y="215" font-weight="700" fill="#0A5F58">35%</text><text x="386" y="215" fill="#4A5856">1,544만원</text>

    <rect x="40" y="224" width="430" height="27" fill="#F4EEE2"/>
    <text x="54" y="242">1억 5,000만 ~ 3억원</text><text x="330" y="242" font-weight="700" fill="#0A5F58">38%</text><text x="386" y="242" fill="#4A5856">1,994만원</text>

    <rect x="40" y="251" width="430" height="27" fill="#FBF7F0"/>
    <text x="54" y="269">3억 ~ 5억원</text><text x="330" y="269" font-weight="700" fill="#0A5F58">40%</text><text x="386" y="269" fill="#4A5856">2,594만원</text>

    <rect x="40" y="278" width="430" height="27" fill="#F4EEE2"/>
    <text x="54" y="296">5억 ~ 10억원</text><text x="330" y="296" font-weight="700" fill="#0A5F58">42%</text><text x="386" y="296" fill="#4A5856">3,594만원</text>

    <rect x="40" y="305" width="430" height="27" fill="#FBF7F0"/>
    <text x="54" y="323">10억원 초과</text><text x="330" y="323" font-weight="700" fill="#0A5F58">45%</text><text x="386" y="323" fill="#4A5856">6,594만원</text>
  </g>
  <rect x="40" y="116" width="430" height="216" fill="none" stroke="#E3DCCF" stroke-width="1.2"/>

  <!-- 과세표준 위치 박스 -->
  <rect x="490" y="86" width="290" height="70" rx="12" fill="#E3F0EE" stroke="#0E7C72" stroke-width="1.3"/>
  <text x="508" y="112" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="13" font-weight="700" fill="#0A5F58">과세표준이란</text>
  <text x="508" y="134" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="12" fill="#4A5856">종합소득금액 - 소득공제</text>
  <text x="508" y="150" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="11.5" fill="#8A938F">세율은 총소득이 아닌 이 값에 적용</text>

  <!-- 계산 예시 1 -->
  <rect x="490" y="166" width="290" height="66" rx="12" fill="#F4EEE2" stroke="#E3DCCF" stroke-width="1.2"/>
  <text x="508" y="190" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#1A2B2A">예시 1. 과세표준 3,000만원</text>
  <text x="508" y="212" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="12.5" fill="#4A5856">3,000만 x 15% - 126만 =</text>
  <text x="700" y="212" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="14" font-weight="700" fill="#0A5F58">324만원</text>

  <!-- 계산 예시 2 -->
  <rect x="490" y="242" width="290" height="66" rx="12" fill="#F4EEE2" stroke="#E3DCCF" stroke-width="1.2"/>
  <text x="508" y="266" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#1A2B2A">예시 2. 과세표준 1억원</text>
  <text x="508" y="288" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="12.5" fill="#4A5856">1억 x 35% - 1,544만 =</text>
  <text x="700" y="288" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="14" font-weight="700" fill="#0A5F58">1,956만원</text>

  <!-- 지방소득세 안내 -->
  <rect x="490" y="318" width="290" height="14" fill="none"/>
  <text x="490" y="329" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="11.5" fill="#8A938F">위 금액은 국세(종합소득세) 기준이에요</text>

  <!-- 지방소득세 별도 강조 -->
  <rect x="40" y="350" width="740" height="52" rx="12" fill="#FBF7F0" stroke="#C2873B" stroke-width="1.3"/>
  <circle cx="66" cy="376" r="4" fill="#C2873B"/>
  <text x="82" y="381" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="13.5" fill="#1A2B2A">개인지방소득세 10% 별도(지방세법 제92조): 실제 부담은 산출세액의 약 1.1배예요</text>

  <!-- 오해 반박 -->
  <rect x="40" y="414" width="740" height="66" rx="12" fill="#E3F0EE" stroke="#0E7C72" stroke-width="1.2"/>
  <text x="60" y="440" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="13" font-weight="700" fill="#0A5F58">누진세는 전체에 최고세율을 일괄 적용하지 않아요</text>
  <text x="60" y="462" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="12.5" fill="#4A5856">구간을 넘긴 초과분에만 높은 세율이 붙어요. 누진공제는 이 계산을 한 줄로 바꾼 값이에요.</text>
</svg>
