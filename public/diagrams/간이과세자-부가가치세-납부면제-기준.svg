<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" role="img" aria-label="간이과세자 부가가치세 납부의무 면제 기준 도표. 해당 과세기간 공급대가 합계액이 4,800만원 미만이면 부가가치세 납부의무가 면제돼요(부가가치세법 제69조 제1항). 면제여도 부가세 확정신고 의무, 사업자등록·증빙 의무, 매출 0원 무실적 신고는 그대로 유지돼요. 면제되는 것은 납부세액과 예정부과 징수이고, 면제되지 않는 예외는 재고납부세액(제64조)과 미등록가산세예요. 또한 간이과세자는 공제세액이 납부세액을 넘어도 매입세액 환급을 받지 못해요. 납부면제(제69조)와 간이과세 적용배제(제61조, 공급대가 8,000만원 이상)는 다른 개념이에요.">
  <rect x="0" y="0" width="820" height="500" fill="#FBF7F0"/>

  <text x="40" y="46" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="27" font-weight="700" fill="#1A2B2A">간이과세자 부가가치세 납부의무 면제 기준</text>
  <text x="40" y="74" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="15" fill="#4A5856">면제되는 건 세액 '납부'뿐이고, 신고 의무는 그대로 남아요 (부가가치세법 제69조)</text>

  <!-- 기준 하이라이트 박스 -->
  <rect x="40" y="92" width="740" height="82" rx="16" fill="#E3F0EE" stroke="#0E7C72" stroke-width="1.5"/>
  <text x="64" y="124" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="13.5" fill="#4A5856">해당 과세기간 공급대가(부가세 포함 매출) 합계액이</text>
  <text x="64" y="158" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="24" font-weight="700" fill="#0A5F58">4,800만원 미만이면 → 납부의무 면제</text>

  <!-- 카드 A: 그대로 유지 -->
  <rect x="40" y="196" width="233" height="158" rx="12" fill="#F4EEE2" stroke="#E3DCCF" stroke-width="1.3"/>
  <text x="60" y="226" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="15" font-weight="700" fill="#1A2B2A">면제여도 그대로</text>
  <circle cx="64" cy="250" r="3.5" fill="#0E7C72"/>
  <text x="76" y="255" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="12.5" fill="#4A5856">부가세 확정신고 의무</text>
  <circle cx="64" cy="276" r="3.5" fill="#0E7C72"/>
  <text x="76" y="281" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="12.5" fill="#4A5856">사업자등록·증빙 의무</text>
  <circle cx="64" cy="302" r="3.5" fill="#0E7C72"/>
  <text x="76" y="307" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="12.5" fill="#4A5856">매출 0원도 무실적 신고</text>

  <!-- 카드 B: 면제되는 것 -->
  <rect x="293" y="196" width="233" height="158" rx="12" fill="#E3F0EE" stroke="#0E7C72" stroke-width="1.3"/>
  <text x="313" y="226" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="15" font-weight="700" fill="#0A5F58">면제되는 것</text>
  <circle cx="317" cy="250" r="3.5" fill="#0E7C72"/>
  <text x="329" y="255" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="12.5" fill="#4A5856">납부세액(낼 세금)</text>
  <circle cx="317" cy="276" r="3.5" fill="#0E7C72"/>
  <text x="329" y="281" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="12.5" fill="#4A5856">예정부과 징수(50%)</text>
  <text x="313" y="322" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="12" fill="#8A938F">제66조 예정부과도</text>
  <text x="313" y="340" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="12" fill="#8A938F">적용하지 않아요</text>

  <!-- 카드 C: 면제 안 되는 예외 -->
  <rect x="546" y="196" width="234" height="158" rx="12" fill="#F4EEE2" stroke="#E3DCCF" stroke-width="1.3"/>
  <text x="566" y="226" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="15" font-weight="700" fill="#B5462F">면제 안 되는 예외</text>
  <circle cx="570" cy="250" r="3.5" fill="#C2873B"/>
  <text x="582" y="255" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="12.5" fill="#4A5856">재고납부세액(제64조)</text>
  <circle cx="570" cy="276" r="3.5" fill="#C2873B"/>
  <text x="582" y="281" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="12.5" fill="#4A5856">미등록가산세</text>
  <text x="566" y="322" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="12" fill="#8A938F">4,800만원 미만이어도</text>
  <text x="566" y="340" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="12" fill="#8A938F">이 금액은 그대로 납부</text>

  <!-- 매입세액 환급 불가 경고 -->
  <rect x="40" y="374" width="740" height="52" rx="12" fill="#FBF7F0" stroke="#B5462F" stroke-width="1.3"/>
  <circle cx="66" cy="400" r="4" fill="#B5462F"/>
  <text x="82" y="405" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="13.5" fill="#1A2B2A">매입세액 환급 불가: 공제세액이 납부세액을 넘어도 초과분은 돌려받지 못해요</text>

  <text x="40" y="456" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="12.5" fill="#4A5856">※ 공급대가는 부가세 포함 매출이고, 과세기간이 1년보다 짧으면 12개월로 환산해 4,800만원 미만 여부를 판단해요.</text>
  <text x="40" y="478" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="12.5" fill="#4A5856">※ 납부면제(제69조)와 간이과세 적용배제(제61조, 직전연도 공급대가 8,000만원 이상)는 다른 개념이에요.</text>
</svg>
