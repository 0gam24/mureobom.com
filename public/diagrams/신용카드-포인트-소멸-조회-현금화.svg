<svg viewBox="0 0 760 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="카드포인트 유효기간 5년과 통합조회·계좌이체 현금화 절차">
  <style>
    text { font-family: 'IBM Plex Sans KR', system-ui, sans-serif; }
    .title { font-size: 22px; font-weight: 700; fill: #1A2B2A; }
    .sub { font-size: 13px; fill: #4A5856; }
    .panelhead { font-size: 15px; font-weight: 700; fill: #0A5F58; }
    .body { font-size: 13px; fill: #1A2B2A; }
    .cap { font-size: 12px; fill: #8A938F; }
    .step { font-size: 13px; font-weight: 700; fill: #FBF7F0; }
    .stepbody { font-size: 12.5px; fill: #1A2B2A; }
    .num { font-size: 15px; font-weight: 700; fill: #FBF7F0; }
  </style>

  <rect x="0" y="0" width="760" height="560" fill="#FBF7F0"/>

  <text x="32" y="46" class="title">카드포인트, 사라지기 전에 현금으로</text>
  <text x="32" y="70" class="sub">유효기간 5년, 소멸 6개월 전 명세서 통지, 1포인트(1원) 계좌이체</text>

  <!-- Timeline panel -->
  <rect x="32" y="90" width="696" height="118" rx="12" fill="#F4EEE2"/>
  <text x="52" y="118" class="panelhead">유효기간 타임라인</text>

  <line x1="70" y1="160" x2="690" y2="160" stroke="#E3DCCF" stroke-width="4"/>
  <circle cx="90" cy="160" r="9" fill="#0E7C72"/>
  <circle cx="540" cy="160" r="9" fill="#C2873B"/>
  <circle cx="670" cy="160" r="9" fill="#B5462F"/>

  <text x="90" y="140" text-anchor="middle" class="body">적립일</text>
  <text x="90" y="188" text-anchor="middle" class="cap">5년 카운트 시작</text>

  <text x="540" y="140" text-anchor="middle" class="body">소멸 6개월 전</text>
  <text x="540" y="188" text-anchor="middle" class="cap">명세서로 소멸예정 통지</text>

  <text x="670" y="140" text-anchor="middle" class="body">소멸일</text>
  <text x="670" y="188" text-anchor="middle" class="cap">미사용분 소멸</text>

  <!-- Currency steps panel -->
  <rect x="32" y="228" width="696" height="252" rx="12" fill="#E3F0EE"/>
  <text x="52" y="256" class="panelhead">현금화 4단계 (자동 아님, 직접 신청)</text>

  <!-- step boxes -->
  <g>
    <rect x="52" y="276" width="656" height="42" rx="8" fill="#0E7C72"/>
    <circle cx="76" cy="297" r="13" fill="#0A5F58"/>
    <text x="76" y="302" text-anchor="middle" class="num">1</text>
    <text x="100" y="302" class="step">앱 접속 후 본인인증 (통합조회·이체 또는 어카운트인포)</text>
  </g>
  <g>
    <rect x="52" y="326" width="656" height="42" rx="8" fill="#0E7C72"/>
    <circle cx="76" cy="347" r="13" fill="#0A5F58"/>
    <text x="76" y="352" text-anchor="middle" class="num">2</text>
    <text x="100" y="352" class="step">여러 카드사 포인트 잔액 한 화면에서 조회</text>
  </g>
  <g>
    <rect x="52" y="376" width="656" height="42" rx="8" fill="#0E7C72"/>
    <circle cx="76" cy="397" r="13" fill="#0A5F58"/>
    <text x="76" y="402" text-anchor="middle" class="num">3</text>
    <text x="100" y="402" class="step">현금화할 포인트와 입금받을 본인 계좌 지정</text>
  </g>
  <g>
    <rect x="52" y="426" width="656" height="42" rx="8" fill="#C2873B"/>
    <circle cx="76" cy="447" r="13" fill="#0A5F58"/>
    <text x="76" y="452" text-anchor="middle" class="num">4</text>
    <text x="100" y="452" class="step">신청 완료, 1포인트=1원으로 계좌 입금</text>
  </g>

  <text x="32" y="516" class="cap">기준: 2021.1.5 통합조회·계좌이체 서비스 도입. 카드사별 세부 약관은 가입 카드사 확인.</text>
  <text x="32" y="538" class="cap">출처: 금융위원회·금융감독원 안내. 일반정보이며 개별 상품 조건은 다를 수 있어요.</text>
</svg>
