<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 560" role="img" aria-labelledby="title desc" font-family="'IBM Plex Sans KR', system-ui, sans-serif">
  <title id="title">당해세 우선변제와 2023년 임차인 보증금 보호 개정 비교</title>
  <desc id="desc">개정 전에는 당해세(상속세·증여세·종합부동산세)가 확정일자 임차권보다 무조건 먼저 배당됐지만, 2023년부터는 확정일자보다 법정기일이 늦은 당해세에 한해 임차보증금 배당에 갈음해 안분 보호된다.</desc>

  <rect x="0" y="0" width="840" height="560" fill="#FBF7F0"/>

  <!-- 헤더 -->
  <text x="40" y="52" font-size="26" font-weight="700" fill="#1A2B2A">당해세와 전세보증금, 2023년 개정 전후 비교</text>
  <text x="40" y="80" font-size="15" fill="#4A5856">당해세 = 그 재산에 부과된 상속세·증여세·종합부동산세 (국세기본법 제35조)</text>
  <line x1="40" y1="98" x2="800" y2="98" stroke="#E3DCCF" stroke-width="2"/>

  <!-- 왼쪽 패널: 개정 전 -->
  <rect x="40" y="120" width="360" height="360" rx="14" fill="#F4EEE2" stroke="#E3DCCF" stroke-width="1.5"/>
  <text x="60" y="152" font-size="18" font-weight="700" fill="#B5462F">개정 전 (통념)</text>
  <text x="60" y="178" font-size="14" fill="#4A5856">당해세는 무조건 1순위로 먼저 징수</text>

  <rect x="60" y="198" width="320" height="52" rx="8" fill="#B5462F"/>
  <text x="76" y="222" font-size="15" font-weight="700" fill="#FBF7F0">1순위  당해세</text>
  <text x="76" y="240" font-size="12" fill="#F4EEE2">상속세·증여세·종합부동산세</text>

  <rect x="60" y="262" width="320" height="48" rx="8" fill="#E3F0EE" stroke="#0E7C72" stroke-width="1.5"/>
  <text x="76" y="291" font-size="15" font-weight="700" fill="#0A5F58">2순위  확정일자 임차보증금</text>

  <text x="60" y="346" font-size="13" fill="#4A5856">배당액이 당해세로 먼저 빠지면</text>
  <text x="60" y="368" font-size="13" fill="#4A5856">임차인 몫이 줄어들 위험</text>

  <rect x="60" y="392" width="320" height="68" rx="8" fill="#FBF7F0" stroke="#E3DCCF" stroke-width="1.5"/>
  <text x="76" y="418" font-size="13" font-weight="700" fill="#B5462F">결과</text>
  <text x="76" y="440" font-size="13" fill="#1A2B2A">확정일자를 갖춰도 당해세에 밀려</text>
  <text x="76" y="458" font-size="13" fill="#1A2B2A">보증금 회수가 빠듯해질 수 있음</text>

  <!-- 오른쪽 패널: 2023 이후 -->
  <rect x="440" y="120" width="360" height="360" rx="14" fill="#F4EEE2" stroke="#E3DCCF" stroke-width="1.5"/>
  <text x="460" y="152" font-size="18" font-weight="700" fill="#0A5F58">2023년 이후 (개정)</text>
  <text x="460" y="178" font-size="14" fill="#4A5856">요건 충족 시 임차보증금 배당에 갈음</text>

  <rect x="460" y="198" width="320" height="70" rx="8" fill="#0E7C72"/>
  <text x="476" y="224" font-size="14" font-weight="700" fill="#FBF7F0">조건</text>
  <text x="476" y="246" font-size="13" fill="#E3F0EE">확정일자·전세권 설정일보다</text>
  <text x="476" y="262" font-size="13" fill="#E3F0EE">법정기일이 '늦은' 당해세일 때</text>

  <rect x="460" y="282" width="320" height="52" rx="8" fill="#E3F0EE" stroke="#0E7C72" stroke-width="1.5"/>
  <text x="476" y="306" font-size="15" font-weight="700" fill="#0A5F58">확정일자 임차보증금 우선</text>
  <text x="476" y="324" font-size="12" fill="#4A5856">당해세 우선징수 순서에 갈음해 변제</text>

  <rect x="460" y="348" width="320" height="44" rx="8" fill="#F4EEE2" stroke="#C2873B" stroke-width="1.5"/>
  <text x="476" y="376" font-size="13" fill="#1A2B2A">그 다음 남은 배당액에서 당해세 징수</text>

  <rect x="460" y="404" width="320" height="56" rx="8" fill="#FBF7F0" stroke="#E3DCCF" stroke-width="1.5"/>
  <text x="476" y="430" font-size="13" font-weight="700" fill="#0A5F58">결과</text>
  <text x="476" y="452" font-size="13" fill="#1A2B2A">요건 갖춘 임차인 보증금 보호 강화</text>

  <!-- 하단 주의 -->
  <text x="40" y="512" font-size="13" fill="#8A938F">주의: 안분 보호는 모든 당해세가 아니라 확정일자보다 법정기일이 늦은 상속세·증여세·종합부동산세에만 적용돼요.</text>
  <text x="40" y="534" font-size="12" fill="#8A938F">기준: 국세기본법 제35조 제7항 (2022.12.31 신설, 2023년 시행) · 물어봄 편집부 정리</text>
</svg>
