<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" role="img" aria-label="세금 납부기한 연장 신청의 두 기한 타임라인. 만료일 10일 전까지 신청하면 신청일부터 10일 안에 승인 여부 통지가 없을 때 10일째 되는 날 승인한 것으로 보는 묵시적 승인이 적용된다. 국세징수법 제13조 제5항과 제14조 제5항 근거. 만료일 3일 전까지는 신청서 제출 마감이며 국세정보통신망 제출도 포함되지만, 무통지 승인 간주는 적용되지 않는다. 시행령 제14조 근거. 3일 전을 넘기면 관할 세무서장이 3일 전까지 제출할 수 없었다고 인정하는 경우에만 만료일까지 제출할 수 있다. 만료일이 지나면 미납세액의 3퍼센트에 더해 지정납부기한 다음 날부터 월 1만분의 67의 납부지연가산세가 붙는다. 국세기본법 제47조의4 근거이며 승인된 연장 기간에는 이 가산세를 부과하지 않는다. 승인 기간은 원칙 9개월 이내, 특별재난지역 등은 2년 이내.">
  <rect x="0" y="0" width="960" height="660" fill="#FBF7F0"/>

  <text x="48" y="50" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="27" font-weight="700" fill="#1A2B2A">납부기한 연장 신청, 지켜야 할 기한이 두 개예요</text>
  <text x="48" y="80" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="14" fill="#4A5856">국세징수법 제13조·제14조(시행 2026-06-02), 같은 법 시행령 제12조·제14조(시행 2026-02-27) 기준</text>

  <rect x="48" y="132" width="864" height="16" rx="8" fill="#E3DCCF"/>
  <rect x="48" y="132" width="382" height="16" fill="#0E7C72"/>
  <rect x="430" y="132" width="230" height="16" fill="#C2873B"/>
  <rect x="660" y="132" width="130" height="16" fill="#8A938F"/>
  <rect x="790" y="132" width="122" height="16" rx="8" fill="#B5462F"/>
  <rect x="790" y="132" width="60" height="16" fill="#B5462F"/>

  <rect x="428" y="124" width="3" height="32" fill="#1A2B2A"/>
  <rect x="658" y="124" width="3" height="32" fill="#1A2B2A"/>
  <rect x="788" y="124" width="3" height="32" fill="#1A2B2A"/>

  <text x="430" y="178" text-anchor="middle" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="15" font-weight="700" fill="#0A5F58">만료일 10일 전</text>
  <text x="660" y="178" text-anchor="middle" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="15" font-weight="700" fill="#C2873B">3일 전</text>
  <text x="788" y="178" text-anchor="middle" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="15" font-weight="700" fill="#B5462F">만료일</text>
  <text x="48" y="204" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="13" fill="#8A938F">왼쪽에서 신청할수록 선택지가 넓어집니다. 같은 신청서라도 제출 시점에 따라 받을 수 있는 보호가 달라져요.</text>

  <rect x="48" y="224" width="864" height="88" rx="10" fill="#E3F0EE" stroke="#0E7C72" stroke-width="1.3"/>
  <rect x="48" y="224" width="9" height="88" fill="#0E7C72"/>
  <text x="76" y="254" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="17" font-weight="700" fill="#0A5F58">만료일 10일 전까지 신청하면</text>
  <text x="76" y="280" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="14.5" fill="#1A2B2A">신청일부터 10일 안에 승인 여부 통지가 없으면, 10일째 되는 날 승인한 것으로 봅니다.</text>
  <text x="76" y="302" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="14" fill="#4A5856">국세징수법 제13조 제5항·제14조 제5항의 묵시적 승인</text>

  <rect x="48" y="324" width="864" height="88" rx="10" fill="#F4EEE2" stroke="#C2873B" stroke-width="1.3"/>
  <rect x="48" y="324" width="9" height="88" fill="#C2873B"/>
  <text x="76" y="354" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="17" font-weight="700" fill="#C2873B">만료일 3일 전까지가 신청서 제출 마감</text>
  <text x="76" y="380" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="14.5" fill="#1A2B2A">시행령 제14조가 정한 마감선입니다. 국세정보통신망을 통한 제출도 포함돼요.</text>
  <text x="76" y="402" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="14" fill="#4A5856">적법한 신청이지만, 무통지 승인 간주는 적용되지 않습니다.</text>

  <rect x="48" y="424" width="864" height="88" rx="10" fill="#F4EEE2" stroke="#E3DCCF" stroke-width="1.3"/>
  <rect x="48" y="424" width="9" height="88" fill="#8A938F"/>
  <text x="76" y="454" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="17" font-weight="700" fill="#4A5856">3일 전을 넘겼다면</text>
  <text x="76" y="480" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="14.5" fill="#1A2B2A">관할 세무서장이 3일 전까지 제출할 수 없었다고 인정하는 경우에만</text>
  <text x="76" y="502" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="14" fill="#4A5856">기한 만료일까지 제출할 수 있습니다(시행령 제14조 단서).</text>

  <rect x="48" y="524" width="864" height="88" rx="10" fill="#F4EEE2" stroke="#B5462F" stroke-width="1.3"/>
  <rect x="48" y="524" width="9" height="88" fill="#B5462F"/>
  <text x="76" y="554" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="17" font-weight="700" fill="#B5462F">만료일이 지나면</text>
  <text x="76" y="580" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="14.5" fill="#1A2B2A">미납세액의 3%에 더해, 지정납부기한 다음 날부터 월 1만분의 67이 붙습니다.</text>
  <text x="76" y="602" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="14" fill="#4A5856">국세기본법 제47조의4. 승인된 연장 기간에는 이 가산세를 부과하지 않아요.</text>

  <text x="48" y="640" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="13" fill="#8A938F">국세 기준. 승인 기간은 연장한 날의 다음 날부터 9개월 이내가 원칙이고, 특별재난지역 등은 2년 이내로 정할 수 있어요.</text>
</svg>
