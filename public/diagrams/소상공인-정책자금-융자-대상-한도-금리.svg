<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 720" role="img" aria-labelledby="title desc" font-family="'IBM Plex Sans KR', system-ui, sans-serif">
  <title id="title">소상공인 정책자금 구조: 직접대출과 대리대출, 자금 4종, 신청 5단계</title>
  <desc id="desc">소상공인 정책자금은 공단이 직접 심사하는 직접대출과 취급 은행을 거치는 대리대출로 나뉘고, 일반경영안정·특별경영안정·성장기반·상생성장 4종 자금이 있으며, 신청은 자격진단부터 지급까지 5단계로 진행됩니다.</desc>

  <rect x="0" y="0" width="820" height="720" fill="#FBF7F0"/>

  <text x="40" y="46" font-size="26" font-weight="700" fill="#1A2B2A">소상공인 정책자금 한눈에 보기</text>
  <text x="40" y="72" font-size="14" fill="#4A5856">소상공인시장진흥공단 운영 정부 융자 (근거: 소상공인기본법 제23조)</text>

  <!-- 대출 방식 2트랙 -->
  <text x="40" y="112" font-size="17" font-weight="700" fill="#0A5F58">① 대출 방식 두 갈래</text>

  <rect x="40" y="126" width="360" height="118" rx="10" fill="#E3F0EE" stroke="#0E7C72" stroke-width="1.5"/>
  <text x="60" y="154" font-size="16" font-weight="700" fill="#0A5F58">직접대출</text>
  <text x="60" y="180" font-size="13" fill="#1A2B2A">공단이 직접 상담·심사·지급</text>
  <text x="60" y="202" font-size="13" fill="#1A2B2A">소상공인정책자금 누리집에서 신청</text>
  <text x="60" y="224" font-size="13" fill="#4A5856">정책자금 기준금리 연동</text>

  <rect x="420" y="126" width="360" height="118" rx="10" fill="#F4EEE2" stroke="#C2873B" stroke-width="1.5"/>
  <text x="440" y="154" font-size="16" font-weight="700" fill="#C2873B">대리대출</text>
  <text x="440" y="180" font-size="13" fill="#1A2B2A">취급 은행을 거쳐 심사·지급</text>
  <text x="440" y="202" font-size="13" fill="#1A2B2A">토스뱅크 등 인터넷전문은행 포함</text>
  <text x="440" y="224" font-size="13" fill="#4A5856">은행 대출금리 + 정책 이차보전</text>

  <!-- 자금 4종 -->
  <text x="40" y="290" font-size="17" font-weight="700" fill="#0A5F58">② 자금 종류 4가지 (대상별)</text>

  <g font-size="12.5">
    <rect x="40" y="304" width="180" height="96" rx="9" fill="#F4EEE2" stroke="#E3DCCF"/>
    <text x="56" y="330" font-size="14" font-weight="700" fill="#1A2B2A">일반경영안정</text>
    <text x="56" y="354" fill="#4A5856">모든 소상공인</text>
    <text x="56" y="374" fill="#4A5856">(업력 무관)</text>

    <rect x="230" y="304" width="180" height="96" rx="9" fill="#F4EEE2" stroke="#E3DCCF"/>
    <text x="246" y="330" font-size="14" font-weight="700" fill="#1A2B2A">특별경영안정</text>
    <text x="246" y="354" fill="#4A5856">저신용·재해피해</text>
    <text x="246" y="374" fill="#4A5856">취약 소상공인</text>

    <rect x="420" y="304" width="180" height="96" rx="9" fill="#F4EEE2" stroke="#E3DCCF"/>
    <text x="436" y="330" font-size="14" font-weight="700" fill="#1A2B2A">성장기반</text>
    <text x="436" y="354" fill="#4A5856">성장 가능성 높은</text>
    <text x="436" y="374" fill="#4A5856">소공인·혁신형</text>

    <rect x="610" y="304" width="170" height="96" rx="9" fill="#F4EEE2" stroke="#E3DCCF"/>
    <text x="626" y="330" font-size="14" font-weight="700" fill="#1A2B2A">상생성장</text>
    <text x="626" y="354" fill="#4A5856">온라인플랫폼</text>
    <text x="626" y="374" fill="#4A5856">입점 소상공인</text>
  </g>

  <!-- 신청 5단계 -->
  <text x="40" y="450" font-size="17" font-weight="700" fill="#0A5F58">③ 신청 흐름 5단계</text>

  <g>
    <rect x="40" y="466" width="142" height="70" rx="9" fill="#E3F0EE" stroke="#0E7C72"/>
    <text x="111" y="498" font-size="13" font-weight="700" fill="#0A5F58" text-anchor="middle">자격 진단</text>
    <text x="111" y="519" font-size="11.5" fill="#4A5856" text-anchor="middle">소상공인 여부</text>

    <rect x="197" y="466" width="142" height="70" rx="9" fill="#F4EEE2" stroke="#E3DCCF"/>
    <text x="268" y="498" font-size="13" font-weight="700" fill="#1A2B2A" text-anchor="middle">누리집 신청</text>
    <text x="268" y="519" font-size="11.5" fill="#4A5856" text-anchor="middle">자금 선택</text>

    <rect x="354" y="466" width="142" height="70" rx="9" fill="#F4EEE2" stroke="#E3DCCF"/>
    <text x="425" y="498" font-size="13" font-weight="700" fill="#1A2B2A" text-anchor="middle">서류 제출</text>
    <text x="425" y="519" font-size="11.5" fill="#4A5856" text-anchor="middle">확인서 발급</text>

    <rect x="511" y="466" width="142" height="70" rx="9" fill="#F4EEE2" stroke="#E3DCCF"/>
    <text x="582" y="498" font-size="13" font-weight="700" fill="#1A2B2A" text-anchor="middle">심사</text>
    <text x="582" y="519" font-size="11.5" fill="#4A5856" text-anchor="middle">상환능력 평가</text>

    <rect x="668" y="466" width="112" height="70" rx="9" fill="#E3F0EE" stroke="#0E7C72"/>
    <text x="724" y="498" font-size="13" font-weight="700" fill="#0A5F58" text-anchor="middle">약정·지급</text>
    <text x="724" y="519" font-size="11.5" fill="#4A5856" text-anchor="middle">계좌 입금</text>

    <g fill="#8A938F" font-size="16">
      <text x="188.5" y="506" text-anchor="middle">›</text>
      <text x="345.5" y="506" text-anchor="middle">›</text>
      <text x="502.5" y="506" text-anchor="middle">›</text>
      <text x="659.5" y="506" text-anchor="middle">›</text>
    </g>
  </g>

  <!-- 주의 박스 -->
  <rect x="40" y="576" width="740" height="104" rx="10" fill="#FBF7F0" stroke="#B5462F" stroke-width="1.3"/>
  <text x="60" y="604" font-size="14" font-weight="700" fill="#B5462F">기억할 점</text>
  <text x="60" y="630" font-size="13" fill="#1A2B2A">금리·한도·융자제외 대상은 자금과 차주 조건에 따라 다르고 매년 공고로 갱신돼요.</text>
  <text x="60" y="652" font-size="13" fill="#1A2B2A">정확한 수치는 당해연도 공고와 소상공인정책자금 누리집에서 확인하세요.</text>
  <text x="60" y="674" font-size="12.5" fill="#4A5856">정책자금이라고 무조건 최저금리·자동 승인은 아니며 상환능력 심사가 있어요.</text>
</svg>
