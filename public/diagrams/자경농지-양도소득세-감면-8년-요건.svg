<svg viewBox="0 0 760 560" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Sans KR', system-ui, sans-serif">
  <rect x="0" y="0" width="760" height="560" fill="#FBF7F0"/>
  <text x="40" y="46" font-size="24" font-weight="700" fill="#1A2B2A">8년 자경농지 양도소득세 감면, 요건과 한도</text>
  <text x="40" y="72" font-size="14" fill="#4A5856">조세특례제한법 제69조·시행령 제66조·제133조 기준 (2026년 8월 현행)</text>

  <!-- 3 requirement columns -->
  <!-- Req 1: 재촌 -->
  <rect x="40" y="96" width="220" height="196" rx="12" fill="#F4EEE2" stroke="#E3DCCF" stroke-width="1"/>
  <rect x="40" y="96" width="220" height="40" rx="12" fill="#0E7C72"/>
  <rect x="40" y="118" width="220" height="18" fill="#0E7C72"/>
  <text x="150" y="122" font-size="17" font-weight="700" fill="#FBF7F0" text-anchor="middle">1. 재촌 요건</text>
  <text x="60" y="166" font-size="14" fill="#1A2B2A">농지 가까이 8년 이상 거주</text>
  <circle cx="66" cy="192" r="3" fill="#0E7C72"/>
  <text x="78" y="197" font-size="13" fill="#4A5856">농지 소재 시·군·구</text>
  <circle cx="66" cy="220" r="3" fill="#0E7C72"/>
  <text x="78" y="225" font-size="13" fill="#4A5856">연접한 시·군·구</text>
  <circle cx="66" cy="248" r="3" fill="#0E7C72"/>
  <text x="78" y="253" font-size="13" fill="#4A5856">직선거리 30km 이내</text>
  <text x="60" y="280" font-size="12" fill="#8A938F">셋 중 하나만 충족</text>

  <!-- Req 2: 자경 -->
  <rect x="270" y="96" width="220" height="196" rx="12" fill="#F4EEE2" stroke="#E3DCCF" stroke-width="1"/>
  <rect x="270" y="96" width="220" height="40" rx="12" fill="#0E7C72"/>
  <rect x="270" y="118" width="220" height="18" fill="#0E7C72"/>
  <text x="380" y="122" font-size="17" font-weight="700" fill="#FBF7F0" text-anchor="middle">2. 자경 요건</text>
  <text x="290" y="166" font-size="14" fill="#1A2B2A">8년 이상 직접 경작</text>
  <circle cx="296" cy="192" r="3" fill="#0E7C72"/>
  <text x="308" y="197" font-size="13" fill="#4A5856">상시 종사 또는</text>
  <circle cx="296" cy="220" r="3" fill="#0E7C72"/>
  <text x="308" y="225" font-size="13" fill="#4A5856">농작업 1/2 이상 자기 노동</text>
  <rect x="286" y="240" width="188" height="40" rx="8" fill="#E3F0EE"/>
  <text x="296" y="258" font-size="12" fill="#B5462F">소득 3,700만원 이상 해는</text>
  <text x="296" y="274" font-size="12" fill="#B5462F">경작기간에서 제외</text>

  <!-- Req 3: 감면효과 -->
  <rect x="500" y="96" width="220" height="196" rx="12" fill="#F4EEE2" stroke="#E3DCCF" stroke-width="1"/>
  <rect x="500" y="96" width="220" height="40" rx="12" fill="#C2873B"/>
  <rect x="500" y="118" width="220" height="18" fill="#C2873B"/>
  <text x="610" y="122" font-size="17" font-weight="700" fill="#FBF7F0" text-anchor="middle">감면 효과</text>
  <text x="610" y="192" font-size="44" font-weight="700" fill="#0A5F58" text-anchor="middle">100%</text>
  <text x="610" y="220" font-size="14" fill="#1A2B2A" text-anchor="middle">양도소득세 감면</text>
  <text x="610" y="252" font-size="12" fill="#8A938F" text-anchor="middle">두 요건 모두 충족 시</text>
  <text x="610" y="272" font-size="12" fill="#8A938F" text-anchor="middle">소유만 8년은 해당 없음</text>

  <!-- plus signs -->
  <text x="265" y="200" font-size="24" font-weight="700" fill="#4A5856" text-anchor="middle">+</text>
  <text x="495" y="200" font-size="24" font-weight="700" fill="#4A5856" text-anchor="middle">=</text>

  <!-- 한도 구조 -->
  <rect x="40" y="316" width="680" height="164" rx="12" fill="#E3F0EE" stroke="#E3DCCF" stroke-width="1"/>
  <text x="60" y="348" font-size="17" font-weight="700" fill="#0A5F58">감면 한도 (조세특례제한법 제133조)</text>

  <rect x="60" y="368" width="300" height="92" rx="10" fill="#FBF7F0"/>
  <text x="80" y="398" font-size="14" fill="#4A5856">과세기간별(1년) 한도</text>
  <text x="80" y="436" font-size="30" font-weight="700" fill="#0E7C72">1억원</text>

  <rect x="400" y="368" width="300" height="92" rx="10" fill="#FBF7F0"/>
  <text x="420" y="398" font-size="14" fill="#4A5856">5개 과세기간 합산 한도</text>
  <text x="420" y="436" font-size="30" font-weight="700" fill="#0E7C72">2억원</text>

  <text x="40" y="512" font-size="12" fill="#8A938F">주거·상업·공업지역 편입 또는 환지예정지 지정 후 3년 경과 농지는 감면 대상에서 제외됩니다.</text>
  <text x="40" y="534" font-size="12" fill="#8A938F">감면 여부는 개별 요건 충족에 따라 달라집니다. 일반 정보이며 개별 사안은 관할 세무서에 확인하세요.</text>
</svg>
