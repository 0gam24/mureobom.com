  <text x="64" y="534" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="16" font-weight="700" fill="#0A5F58">소득인정액이 각 급여의 선정기준 이하이면 그 급여의 수급 구간이에요</text>
  <text x="64" y="562" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="16" fill="#1A2B2A">소득인정액 = 소득평가액 + 재산의 소득환산액 (국민기초생활 보장법 제2조 제9호). 월급 그대로가 아니에요</text>
  <text x="64" y="590" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="15" fill="#4A5856">제80차 중앙생활보장위원회 의결 2026. 7. 28 · 보건복지부 고시 제2026-157호 · 교육급여 50% 선은 차상위계층 상한과 같은 금액</text>

