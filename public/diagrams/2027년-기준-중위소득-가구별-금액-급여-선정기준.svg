  <text x="500" y="668" text-anchor="middle" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="14" fill="#8A938F">출처: 보건복지부 보도자료 「내년 기준 중위소득 6.70% 역대 최대 인상」(2026-07-28) 수치를 물어봄이 표로 옮김</text>
