<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" role="img" aria-label="2027년 가구원수별 기준 중위소득과 급여별 선정기준 표(월, 원): 1인 가구 중위소득 2,736,042원(생계 875,533·의료 1,094,417·주거 1,313,300·교육 1,368,021원), 4인 가구 6,929,885원(생계 2,217,563·의료 2,771,954·주거 3,326,345·교육 3,464,943원). 전 가구 2026년 대비 6.70% 인상, 2027년부터 적용.">
  <rect x="0" y="0" width="1000" height="720" fill="#FBF7F0"/>

  <!-- 제목 -->
  <text x="500" y="58" text-anchor="middle" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="28" font-weight="700" fill="#1A2B2A">2027년 기준 중위소득과 급여별 선정기준 (월, 원)</text>
  <text x="500" y="92" text-anchor="middle" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="16" fill="#4A5856">2026년 대비 1~6인 가구 모두 <tspan font-weight="700" fill="#C2873B">6.70% 인상</tspan> (2015년 이후 최대) · 2027년부터 적용</text>
  <line x1="40" y1="110" x2="960" y2="110" stroke="#E3DCCF" stroke-width="1.5"/>

