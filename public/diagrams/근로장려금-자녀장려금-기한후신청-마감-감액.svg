<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 712" role="img" aria-label="2026년 근로·자녀장려금 신청 타임라인. 2025년 소득분은 정기신청 5월 1일부터 6월 1일까지, 기한 후 신청 6월 2일부터 12월 1일(화)까지이며 기한 후 신청은 산정액의 95%를 지급한다. 국세상담센터 Q&amp;A에는 11월 30일 표기가 남아 있다. 자동신청은 사전 동의했더라도 소득·재산 요건을 갖춘 가구만 정기분으로 처리된다. 정기분 지급 예정일은 8월 27일(법정 지급기한 9월 말), 기한 후 신청분은 신청일로부터 4개월 이내 지급(국세청 안내). 2026년 소득분 근로장려금 반기신청은 상반기분 9월 1일부터 15일, 하반기분 2027년 3월 1일부터 15일이며 반기신청에는 기한 후 신청이 없다. 재산 1억7천만원 이상 2억4천만원 미만 구간과 겹치면 두 비율을 곱한 계산으로 47.5%를 받는다. 법정 결정 기한은 신청한 달 말일이 지난 후 3개월, 지급은 결정일부터 30일 이내다.">
  <rect x="0" y="0" width="1000" height="712" fill="#FBF7F0"/>
  <g font-family="'IBM Plex Sans KR', system-ui, sans-serif">

    <!-- 제목 -->
    <text x="500" y="54" text-anchor="middle" font-size="28" font-weight="700" fill="#1A2B2A">2026년 근로·자녀장려금 신청 타임라인</text>
    <text x="500" y="88" text-anchor="middle" font-size="17" fill="#4A5856">정기신청을 놓쳤다면 <tspan font-weight="700" fill="#B5462F">12월 1일(화)</tspan>까지 기한 후 신청 · 산정액의 95% 지급</text>

    <!-- 연도 -->
    <text x="180" y="124" font-size="15" fill="#8A938F">2026년</text>
    <text x="696" y="124" font-size="15" fill="#8A938F">2027년</text>

    <!-- 월 눈금 띠 -->
    <rect x="180" y="132" width="768" height="34" rx="6" fill="#F4EEE2"/>
    <g stroke="#E3DCCF" stroke-width="1">
      <line x1="244" y1="138" x2="244" y2="160"/>
      <line x1="308" y1="138" x2="308" y2="160"/>
      <line x1="372" y1="138" x2="372" y2="160"/>
      <line x1="436" y1="138" x2="436" y2="160"/>
      <line x1="500" y1="138" x2="500" y2="160"/>
      <line x1="564" y1="138" x2="564" y2="160"/>
      <line x1="628" y1="138" x2="628" y2="160"/>
      <line x1="756" y1="138" x2="756" y2="160"/>
      <line x1="820" y1="138" x2="820" y2="160"/>
      <line x1="884" y1="138" x2="884" y2="160"/>
    </g>
    <line x1="692" y1="132" x2="692" y2="166" stroke="#8A938F" stroke-width="1.5"/>
    <g font-size="15" fill="#4A5856" text-anchor="middle">
      <text x="212" y="155">5월</text>
      <text x="276" y="155">6월</text>
      <text x="340" y="155">7월</text>
      <text x="404" y="155">8월</text>
      <text x="468" y="155">9월</text>
      <text x="532" y="155">10월</text>
      <text x="596" y="155">11월</text>
      <text x="660" y="155">12월</text>
      <text x="724" y="155">1월</text>
      <text x="788" y="155">2월</text>
      <text x="852" y="155">3월</text>
      <text x="916" y="155">4월</text>
    </g>

    <!-- 레인 1: 2025년 소득분 -->
    <text x="40" y="218" font-size="17" font-weight="700" fill="#0A5F58">2025년 소득분</text>
    <text x="40" y="241" font-size="15" fill="#4A5856">근로·자녀장려금</text>

    <!-- 정기신청 -->
    <rect x="180" y="186" width="66" height="60" rx="6" fill="#0E7C72"/>
    <text x="213" y="211" text-anchor="middle" font-size="16" font-weight="700" fill="#FBF7F0">정기</text>
    <text x="213" y="234" text-anchor="middle" font-size="15" fill="#FBF7F0">5.1~6.1</text>

    <!-- 기한 후 신청 -->
    <rect x="248" y="186" width="382" height="60" rx="6" fill="#F4EEE2" stroke="#C2873B" stroke-width="2"/>
    <text x="439" y="211" text-anchor="middle" font-size="17" font-weight="700" fill="#1A2B2A">기한 후 신청 6.2~12.1(화)</text>
    <text x="439" y="235" text-anchor="middle" font-size="15" font-weight="700" fill="#B5462F">산정액의 95% 지급 (5% 감액)</text>

    <!-- 마감선 -->
    <line x1="630" y1="178" x2="630" y2="256" stroke="#B5462F" stroke-width="3"/>
    <text x="642" y="208" font-size="16" font-weight="700" fill="#B5462F">공식 마감 12.1(화)</text>
    <text x="642" y="232" font-size="15" fill="#4A5856">국세상담센터 Q&amp;A엔 11.30 표기</text>

    <!-- 자동신청 분기 -->
    <text x="180" y="285" font-size="15" font-weight="700" fill="#0A5F58">자동신청 내역이 있으면</text>
    <text x="180" y="306" font-size="15" fill="#0A5F58">정기분으로 신청된 것</text>
    <text x="180" y="327" font-size="15" fill="#4A5856">(요건 갖춘 가구만)</text>

    <!-- 지급 행 -->
    <circle cx="426" cy="280" r="7" fill="#0E7C72"/>
    <text x="440" y="285" font-size="15" fill="#1A2B2A">정기분 지급 예정일 8.27</text>
    <text x="440" y="306" font-size="15" fill="#4A5856">(법정 지급기한 9월 말)</text>

    <circle cx="630" cy="280" r="5" fill="#C2873B"/>
    <line x1="636" y1="280" x2="884" y2="280" stroke="#C2873B" stroke-width="2.5" stroke-dasharray="7 6"/>
    <line x1="884" y1="272" x2="884" y2="288" stroke="#C2873B" stroke-width="2.5"/>
    <text x="642" y="306" font-size="15" font-weight="700" fill="#1A2B2A">기한 후 신청분: 신청일로부터</text>
    <text x="642" y="327" font-size="15" fill="#4A5856">4개월 이내 지급 (국세청 안내)</text>

    <line x1="40" y1="346" x2="960" y2="346" stroke="#E3DCCF" stroke-width="1.5"/>

    <!-- 레인 2: 2026년 소득분 반기신청 -->
    <text x="40" y="378" font-size="17" font-weight="700" fill="#0A5F58">2026년 소득분</text>
    <text x="40" y="401" font-size="15" fill="#4A5856">근로장려금 반기신청</text>

    <rect x="436" y="362" width="32" height="36" rx="4" fill="#0A5F58"/>
    <text x="476" y="386" font-size="15" font-weight="700" fill="#1A2B2A">상반기분 9.1~9.15</text>

    <rect x="820" y="362" width="30" height="36" rx="4" fill="#0A5F58"/>
    <text x="810" y="386" text-anchor="end" font-size="15" font-weight="700" fill="#1A2B2A">하반기분 2027.3.1~3.15</text>

    <text x="180" y="430" font-size="15" font-weight="700" fill="#B5462F">반기신청은 기간을 놓쳐도 기한 후 신청이 없어요.</text>
    <text x="180" y="453" font-size="15" fill="#4A5856">상반기분을 놓쳤다면 하반기분 신청으로 2026년 연간 소득분을 받을 수 있어요.</text>

    <!-- 카드 1: 마감일 판정 -->
    <rect x="40" y="478" width="290" height="164" rx="12" fill="#E3F0EE"/>
    <text x="60" y="510" font-size="17" font-weight="700" fill="#0A5F58">왜 12월 1일인가요</text>
    <text x="60" y="541" font-size="15" fill="#1A2B2A">5.31(일)이라 정기 기한은 6.1(월)</text>
    <text x="60" y="567" font-size="15" fill="#1A2B2A">6.2부터 6개월, 만료일 12.1(화)</text>
    <text x="60" y="593" font-size="15" fill="#1A2B2A">11.30은 5.31이 평일인 해의 날짜</text>
    <text x="60" y="619" font-size="15" fill="#4A5856">(2018년 공지는 6.1~11.30)</text>

    <!-- 카드 2: 감액 -->
    <rect x="355" y="478" width="290" height="164" rx="12" fill="#F4EEE2" stroke="#C2873B" stroke-width="1.5"/>
    <text x="375" y="510" font-size="17" font-weight="700" fill="#0A5F58">얼마나 줄어드나요</text>
    <text x="375" y="541" font-size="15" fill="#1A2B2A">기한 후 신청: 산정액 × 95%</text>
    <text x="375" y="567" font-size="15" fill="#1A2B2A">재산 1.7억~2.4억 미만: × 50%</text>
    <text x="375" y="593" font-size="15" font-weight="700" fill="#B5462F">겹치면 50% × 95% = 47.5%</text>
    <text x="375" y="619" font-size="15" fill="#4A5856">(두 비율을 곱한 계산)</text>

    <!-- 카드 3: 법정 기한 -->
    <rect x="670" y="478" width="290" height="164" rx="12" fill="#E3F0EE"/>
    <text x="690" y="510" font-size="17" font-weight="700" fill="#0A5F58">법정 결정·지급 기한</text>
    <text x="690" y="541" font-size="15" fill="#1A2B2A">결정: 신청한 달 말일 후 3개월 내</text>
    <text x="690" y="567" font-size="15" fill="#1A2B2A">지급: 결정일부터 30일 내</text>
    <text x="690" y="593" font-size="15" fill="#1A2B2A">11.30 신청분 결정 기한 2027.2.28</text>
    <text x="690" y="619" font-size="15" fill="#1A2B2A">12.1 신청분 결정 기한 2027.3.31</text>

    <!-- 하단 주석 -->
    <text x="500" y="672" text-anchor="middle" font-size="15" fill="#4A5856">결정 기한은 대통령령이 정한 사유가 있으면 2개월 범위에서 연장될 수 있어요.</text>
    <text x="500" y="697" text-anchor="middle" font-size="15" fill="#8A938F">출처: 조세특례제한법·국세기본법·민법, 국세청 신청 안내·보도자료·국세상담센터 Q&amp;A 대조 · 기준일 2026.10.25</text>
  </g>
</svg>
