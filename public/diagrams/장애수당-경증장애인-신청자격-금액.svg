<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" role="img" aria-label="장애 정도에 따라 지원 제도가 갈려요. 등록 장애인은 장애 정도가 심하지 않은 경증이면 장애수당 대상이고, 심한 중증이면 장애인연금 대상이라 둘을 함께 받을 수 없어요. 2026년 기준 장애수당은 만 18세 이상 경증장애인 중 기초수급자 또는 차상위계층에게 재가 월 6만원, 보장시설 월 3만원을 지급해요. 장애인연금은 18세 이상 중증장애인에게 기초급여 월 349,700원과 부가급여를 지급해요. 만 18세 미만 장애아동은 중증 경증 모두 장애아동수당 대상으로 2026년 대표 금액은 중증 월 227,000원, 경증 월 151,000원이에요. 신청은 지급신청서와 소득재산신고서, 금융정보 제공 동의서를 관할 읍면동에 제출하면 소득재산 조사를 거쳐 매월 20일 계좌로 지급돼요." font-family="'IBM Plex Sans KR', system-ui, sans-serif">
  <rect x="0" y="0" width="760" height="560" fill="#FBF7F0"/>
  <text x="32" y="44" font-size="24" font-weight="700" fill="#1A2B2A">장애수당·장애인연금, 장애 정도로 갈려요</text>
  <text x="32" y="72" font-size="13" fill="#4A5856">2026년 기준, 장애인복지법 제49조·제50조 / 장애인연금법</text>

  <!-- 갈림 상단 노드 -->
  <rect x="280" y="92" width="200" height="42" rx="10" fill="#F4EEE2" stroke="#E3DCCF"/>
  <text x="380" y="118" font-size="14" font-weight="700" fill="#1A2B2A" text-anchor="middle">등록 장애인</text>

  <!-- 분기선 -->
  <line x1="380" y1="134" x2="160" y2="168" stroke="#E3DCCF" stroke-width="2"/>
  <line x1="380" y1="134" x2="600" y2="168" stroke="#E3DCCF" stroke-width="2"/>

  <!-- 경증: 장애수당 -->
  <rect x="32" y="168" width="330" height="196" rx="12" fill="#E3F0EE" stroke="#0E7C72"/>
  <text x="197" y="196" font-size="15" font-weight="700" fill="#0A5F58" text-anchor="middle">경증 (심하지 않은 장애인)</text>
  <text x="197" y="220" font-size="13" font-weight="700" fill="#1A2B2A" text-anchor="middle">장애수당 (제49조)</text>
  <text x="197" y="244" font-size="11" fill="#4A5856" text-anchor="middle">만 18세 이상 + 기초수급자·차상위</text>
  <text x="197" y="262" font-size="11" fill="#4A5856" text-anchor="middle">(소득인정액 기준 중위소득 50% 이하)</text>
  <line x1="60" y1="278" x2="334" y2="278" stroke="#E3DCCF" stroke-width="1"/>
  <text x="197" y="302" font-size="13" font-weight="700" fill="#0A5F58" text-anchor="middle">재가 월 6만 원</text>
  <text x="197" y="324" font-size="13" font-weight="700" fill="#0A5F58" text-anchor="middle">보장시설 월 3만 원</text>
  <text x="197" y="348" font-size="11" fill="#8A938F" text-anchor="middle">등록만으론 지급 안 됨, 소득 요건 필요</text>

  <!-- 중증: 장애인연금 -->
  <rect x="398" y="168" width="330" height="196" rx="12" fill="#F4EEE2" stroke="#E3DCCF"/>
  <text x="563" y="196" font-size="15" font-weight="700" fill="#1A2B2A" text-anchor="middle">중증 (심한 장애인)</text>
  <text x="563" y="220" font-size="13" font-weight="700" fill="#1A2B2A" text-anchor="middle">장애인연금 (장애인연금법)</text>
  <text x="563" y="244" font-size="11" fill="#4A5856" text-anchor="middle">만 18세 이상 + 소득인정액</text>
  <text x="563" y="262" font-size="11" fill="#4A5856" text-anchor="middle">선정기준액 이하(단독 140·부부 224만 원)</text>
  <line x1="426" y1="278" x2="700" y2="278" stroke="#E3DCCF" stroke-width="1"/>
  <text x="563" y="302" font-size="13" font-weight="700" fill="#1A2B2A" text-anchor="middle">기초급여 월 349,700원</text>
  <text x="563" y="324" font-size="13" font-weight="700" fill="#1A2B2A" text-anchor="middle">+ 부가급여</text>
  <text x="563" y="348" font-size="11" fill="#8A938F" text-anchor="middle">경증 장애수당과 중복 수급 불가</text>

  <!-- 장애아동수당 배너 -->
  <rect x="32" y="384" width="696" height="52" rx="10" fill="#FBF7F0" stroke="#C2873B"/>
  <text x="52" y="410" font-size="13" font-weight="700" fill="#C2873B">만 18세 미만 장애아동</text>
  <text x="52" y="428" font-size="11" fill="#4A5856">장애아동수당(제50조): 중증·경증 모두 대상. 2026년 대표 중증 227,000원·경증 151,000원 (수급자격별 차등, 읍면동·복지로 확인)</text>

  <!-- 신청 흐름 -->
  <text x="32" y="472" font-size="14" font-weight="700" fill="#1A2B2A">신청 흐름</text>
  <rect x="32" y="484" width="150" height="52" rx="10" fill="#F4EEE2" stroke="#E3DCCF"/>
  <text x="107" y="508" font-size="11" fill="#4A5856" text-anchor="middle">지급신청서 +</text>
  <text x="107" y="524" font-size="11" fill="#4A5856" text-anchor="middle">소득·재산신고서</text>
  <polygon points="188,510 200,504 200,516" fill="#8A938F"/>
  <rect x="206" y="484" width="150" height="52" rx="10" fill="#F4EEE2" stroke="#E3DCCF"/>
  <text x="281" y="508" font-size="11" fill="#4A5856" text-anchor="middle">관할 읍·면·동</text>
  <text x="281" y="524" font-size="11" fill="#4A5856" text-anchor="middle">제출</text>
  <polygon points="362,510 374,504 374,516" fill="#8A938F"/>
  <rect x="380" y="484" width="150" height="52" rx="10" fill="#F4EEE2" stroke="#E3DCCF"/>
  <text x="455" y="508" font-size="11" fill="#4A5856" text-anchor="middle">소득·재산 조사</text>
  <text x="455" y="524" font-size="11" fill="#4A5856" text-anchor="middle">수급 여부 결정</text>
  <polygon points="536,510 548,504 548,516" fill="#8A938F"/>
  <rect x="554" y="484" width="174" height="52" rx="10" fill="#E3F0EE" stroke="#0E7C72"/>
  <text x="641" y="508" font-size="12" font-weight="700" fill="#0A5F58" text-anchor="middle">매월 20일 지급</text>
  <text x="641" y="524" font-size="11" fill="#4A5856" text-anchor="middle">신청한 달부터 개시</text>
</svg>
