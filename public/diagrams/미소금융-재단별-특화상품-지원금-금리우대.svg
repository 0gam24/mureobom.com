<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" width="1200" height="840" role="img" aria-label="미소금융 재단별 특화상품 비교: 신한은 현금 지원금 운영 중, KB는 2026년 11월 출시 예정 목적형 대출, NH는 2027년 중 공급 개시 예정">
  <rect x="0" y="0" width="1200" height="840" fill="#FBF7F0"/>

  <g font-family="'IBM Plex Sans KR', system-ui, sans-serif">
    <text x="48" y="64" font-size="36" font-weight="700" fill="#1A2B2A">미소금융 재단별 특화상품, 혜택의 형태가 다릅니다</text>
    <text x="48" y="98" font-size="18" fill="#4A5856">같은 미소금융이라도 어느 재단 창구인지에 따라 현금 지급·목적형 대출·금리우대로 갈려요</text>
    <line x1="48" y1="122" x2="1152" y2="122" stroke="#E3DCCF" stroke-width="2"/>

    <!-- card 1 : 신한 -->
    <rect x="48" y="148" width="352" height="560" rx="14" fill="#E3F0EE" stroke="#0E7C72" stroke-width="2"/>
    <rect x="68" y="170" width="92" height="30" rx="15" fill="#0E7C72"/>
    <text x="114" y="191" font-size="16" font-weight="700" fill="#FBF7F0" text-anchor="middle">운영 중</text>
    <text x="68" y="240" font-size="23" font-weight="700" fill="#0A5F58">신한미소금융재단</text>
    <text x="68" y="270" font-size="18" fill="#1A2B2A">자산 형성 지원금</text>
    <text x="68" y="294" font-size="15" fill="#4A5856">2026년 2분기부터 지급 시작</text>
    <line x1="68" y1="312" x2="380" y2="312" stroke="#E3DCCF" stroke-width="2"/>
    <text x="68" y="342" font-size="15" fill="#8A938F">혜택의 형태</text>
    <text x="68" y="370" font-size="19" font-weight="700" fill="#0E7C72">상환 중인 사람에게 현금</text>
    <text x="68" y="394" font-size="16" fill="#4A5856">이자 할인 방식이 아님</text>
    <text x="68" y="432" font-size="15" fill="#8A938F">지원 금액</text>
    <text x="68" y="462" font-size="22" font-weight="700" fill="#1A2B2A">분기별 최대 30만원</text>
    <text x="68" y="488" font-size="17" fill="#1A2B2A">누적 최대 300만원</text>
    <text x="68" y="510" font-size="17" fill="#4A5856">총 10회차 (2년 6개월분)</text>
    <text x="68" y="546" font-size="15" fill="#8A938F">대상</text>
    <text x="68" y="572" font-size="16" fill="#4A5856">2026년 4월 1일 이후 신한미소에서</text>
    <text x="68" y="594" font-size="16" fill="#4A5856">청년 대출을 받고 연체 없이</text>
    <text x="68" y="616" font-size="16" fill="#4A5856">성실하게 상환 중인 고객</text>
    <text x="68" y="652" font-size="15" fill="#8A938F">분기말 무연체 시 다음달 10일 지급</text>
    <text x="68" y="676" font-size="15" fill="#8A938F">2026년 2분기 이후 444명, 8천만원</text>

    <!-- card 2 : KB -->
    <rect x="424" y="148" width="352" height="560" rx="14" fill="#F4EEE2" stroke="#E3DCCF" stroke-width="2"/>
    <rect x="444" y="170" width="248" height="30" rx="15" fill="#C2873B"/>
    <text x="568" y="191" font-size="16" font-weight="700" fill="#FBF7F0" text-anchor="middle">2026년 11월 출시 예정</text>
    <text x="444" y="240" font-size="23" font-weight="700" fill="#0A5F58">KB미소금융재단</text>
    <text x="444" y="270" font-size="18" fill="#1A2B2A">KB 청년 라이더 희망 대출</text>
    <text x="444" y="294" font-size="15" fill="#B5462F">가칭 (명칭 변경 가능)</text>
    <line x1="444" y1="312" x2="756" y2="312" stroke="#E3DCCF" stroke-width="2"/>
    <text x="444" y="342" font-size="15" fill="#8A938F">혜택의 형태</text>
    <text x="444" y="370" font-size="19" font-weight="700" fill="#0E7C72">목적형 대출 + 금리우대</text>
    <text x="444" y="394" font-size="16" fill="#4A5856">이륜차 구입비로 용도 한정</text>
    <text x="444" y="432" font-size="15" fill="#8A938F">한도와 금리</text>
    <text x="444" y="462" font-size="22" font-weight="700" fill="#1A2B2A">최대 500만원 이내</text>
    <text x="444" y="488" font-size="17" fill="#1A2B2A">배달용 이륜차 구입가 이내</text>
    <text x="444" y="510" font-size="17" fill="#4A5856">금리 연 2.5~4.5% 수준</text>
    <text x="444" y="546" font-size="15" fill="#8A938F">대상</text>
    <text x="444" y="572" font-size="16" fill="#4A5856">청년 배달 플랫폼 종사자</text>
    <text x="444" y="594" font-size="16" fill="#4A5856">만 19세 이상 39세 이하</text>
    <text x="444" y="616" font-size="16" fill="#4A5856">출시 전이라 약관은 미공개</text>
    <text x="444" y="652" font-size="15" fill="#8A938F">친환경 이륜차 1.5%p, 금융교육 0.5%p</text>
    <text x="444" y="676" font-size="15" fill="#8A938F">두 우대의 중복 적용 여부는 미확인</text>

    <!-- card 3 : NH -->
    <rect x="800" y="148" width="352" height="560" rx="14" fill="#F4EEE2" stroke="#E3DCCF" stroke-width="2"/>
    <rect x="820" y="170" width="260" height="30" rx="15" fill="#4A5856"/>
    <text x="950" y="191" font-size="16" font-weight="700" fill="#FBF7F0" text-anchor="middle">2027년 중 공급 개시 예정</text>
    <text x="820" y="240" font-size="23" font-weight="700" fill="#0A5F58">NH미소금융재단</text>
    <text x="820" y="270" font-size="18" fill="#1A2B2A">NH 영농창업자금·영농운영자금</text>
    <text x="820" y="294" font-size="15" fill="#B5462F">재단명과 상품명 모두 가칭</text>
    <line x1="820" y1="312" x2="1132" y2="312" stroke="#E3DCCF" stroke-width="2"/>
    <text x="820" y="342" font-size="15" fill="#8A938F">혜택의 형태</text>
    <text x="820" y="370" font-size="19" font-weight="700" fill="#0E7C72">영농 목적 대출</text>
    <text x="820" y="394" font-size="16" fill="#4A5856">농업 외 용도로는 쓰기 어려움</text>
    <text x="820" y="432" font-size="15" fill="#8A938F">한도와 금리</text>
    <text x="820" y="462" font-size="22" font-weight="700" fill="#8A938F">공개되지 않음</text>
    <text x="820" y="488" font-size="17" fill="#1A2B2A">용도는 농지·시설 임차보증금,</text>
    <text x="820" y="510" font-size="17" fill="#4A5856">농자재·농기계·종자·인건비 등</text>
    <text x="820" y="546" font-size="15" fill="#8A938F">대상</text>
    <text x="820" y="572" font-size="16" fill="#4A5856">저신용 귀농인, 청년농</text>
    <text x="820" y="594" font-size="16" fill="#4A5856">농촌 지역 금융취약계층 중심</text>
    <text x="820" y="616" font-size="16" fill="#4A5856">전국 8개 지점 순차 개설 예정</text>
    <text x="820" y="652" font-size="15" fill="#8A938F">재단은 2026년 중 설립 예정</text>
    <text x="820" y="676" font-size="15" fill="#8A938F">공급은 2027년 1분기부터 시작</text>

    <!-- bottom strip -->
    <rect x="48" y="726" width="1104" height="62" rx="12" fill="#F4EEE2" stroke="#E3DCCF" stroke-width="2"/>
    <text x="72" y="764" font-size="18" font-weight="700" fill="#0A5F58">미소금융 지점 수</text>
    <text x="236" y="764" font-size="18" fill="#4A5856">2026년 3월 163개</text>
    <text x="406" y="764" font-size="18" fill="#8A938F">·</text>
    <text x="430" y="764" font-size="18" fill="#4A5856">2026년 9월 168개</text>
    <text x="600" y="764" font-size="18" fill="#8A938F">·</text>
    <text x="624" y="764" font-size="18" fill="#1A2B2A">2027년 중 180여 개로 확대 예정</text>

    <text x="48" y="818" font-size="15" fill="#8A938F">출처: 금융위원회 보도자료 2026년 10월 30일 · 2026년 3월 30일. 정보 기준일 2026년 11월 2일. 가칭·예정 표기는 원문 그대로입니다.</text>
  </g>
</svg>
