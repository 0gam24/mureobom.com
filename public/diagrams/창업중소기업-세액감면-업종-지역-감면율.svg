<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 540" role="img" aria-label="창업중소기업 세액감면율 매트릭스: 창업 유형과 수도권 과밀억제권역 여부에 따른 감면율과 기간" font-family="'IBM Plex Sans KR', system-ui, sans-serif">
  <rect x="0" y="0" width="820" height="540" fill="#FBF7F0"/>

  <text x="30" y="42" font-size="26" font-weight="700" fill="#1A2B2A">창업중소기업 세액감면율 매트릭스</text>
  <text x="30" y="66" font-size="15" fill="#4A5856">조세특례제한법 제6조 · 최초 소득발생 과세연도부터 5년간 소득세·법인세 감면</text>

  <!-- column headers -->
  <rect x="220" y="86" width="285" height="46" fill="#0E7C72"/>
  <rect x="515" y="86" width="285" height="46" fill="#0A5F58"/>
  <text x="362" y="115" font-size="16" font-weight="700" fill="#FBF7F0" text-anchor="middle">수도권과밀억제권역 밖</text>
  <text x="657" y="115" font-size="16" font-weight="700" fill="#FBF7F0" text-anchor="middle">수도권과밀억제권역 안</text>

  <!-- row 1: 청년창업 -->
  <rect x="20" y="140" width="190" height="86" fill="#F4EEE2" stroke="#E3DCCF"/>
  <text x="115" y="178" font-size="16" font-weight="700" fill="#1A2B2A" text-anchor="middle">청년창업</text>
  <text x="115" y="200" font-size="12" fill="#8A938F" text-anchor="middle">대표자 만 15~34세</text>

  <rect x="220" y="140" width="285" height="86" fill="#E3F0EE" stroke="#E3DCCF"/>
  <text x="362" y="183" font-size="30" font-weight="700" fill="#0E7C72" text-anchor="middle">100%</text>
  <text x="362" y="207" font-size="13" fill="#4A5856" text-anchor="middle">5년간 전액</text>

  <rect x="515" y="140" width="285" height="86" fill="#F4EEE2" stroke="#E3DCCF"/>
  <text x="657" y="183" font-size="30" font-weight="700" fill="#0A5F58" text-anchor="middle">50%</text>
  <text x="657" y="207" font-size="13" fill="#4A5856" text-anchor="middle">5년간 절반</text>

  <!-- row 2: 소규모 창업 -->
  <rect x="20" y="234" width="190" height="86" fill="#F4EEE2" stroke="#E3DCCF"/>
  <text x="115" y="272" font-size="16" font-weight="700" fill="#1A2B2A" text-anchor="middle">소규모 창업</text>
  <text x="115" y="294" font-size="12" fill="#8A938F" text-anchor="middle">연 수입 8천만원 이하</text>

  <rect x="220" y="234" width="285" height="86" fill="#E3F0EE" stroke="#E3DCCF"/>
  <text x="362" y="277" font-size="30" font-weight="700" fill="#0E7C72" text-anchor="middle">100%</text>
  <text x="362" y="301" font-size="13" fill="#4A5856" text-anchor="middle">청년 여부 무관</text>

  <rect x="515" y="234" width="285" height="86" fill="#F4EEE2" stroke="#E3DCCF"/>
  <text x="657" y="277" font-size="30" font-weight="700" fill="#0A5F58" text-anchor="middle">50%</text>
  <text x="657" y="301" font-size="13" fill="#4A5856" text-anchor="middle">5년간 절반</text>

  <!-- row 3: 일반 창업중소기업 -->
  <rect x="20" y="328" width="190" height="86" fill="#F4EEE2" stroke="#E3DCCF"/>
  <text x="115" y="366" font-size="16" font-weight="700" fill="#1A2B2A" text-anchor="middle">일반 창업</text>
  <text x="115" y="388" font-size="12" fill="#8A938F" text-anchor="middle">중소기업</text>

  <rect x="220" y="328" width="285" height="86" fill="#E3F0EE" stroke="#E3DCCF"/>
  <text x="362" y="371" font-size="30" font-weight="700" fill="#0E7C72" text-anchor="middle">50%</text>
  <text x="362" y="395" font-size="13" fill="#4A5856" text-anchor="middle">5년간 절반</text>

  <rect x="515" y="328" width="285" height="86" fill="#F4EEE2" stroke="#E3DCCF"/>
  <text x="657" y="376" font-size="20" font-weight="700" fill="#B5462F" text-anchor="middle">감면 제외</text>

  <!-- footnote -->
  <rect x="30" y="440" width="760" height="70" fill="#F4EEE2" stroke="#E3DCCF"/>
  <text x="46" y="466" font-size="13" fill="#4A5856">고용 증가 시 25~50% 추가감면 가능 · 2018.5.29 이후 창업분 적용</text>
  <text x="46" y="490" font-size="13" fill="#4A5856">2025.1.1 이후 창업분은 5년 감면세액 합계 5억원 초과분 제외 · 대상은 제6조 열거 업종만</text>
  <text x="46" y="508" font-size="11" fill="#8A938F">2026년 7월 기준. 개인별 적용 여부는 홈택스·관할 세무서 확인.</text>
</svg>
