<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 700" width="980" height="700" role="img" font-family="'IBM Plex Sans KR', system-ui, sans-serif">
  <rect x="0" y="0" width="980" height="700" fill="#FBF7F0"/>

  <text x="40" y="56" font-size="30" font-weight="700" fill="#1A2B2A">등록임대주택 임대보증금 보증, 임차인 확인 3단계</text>
  <text x="40" y="88" font-size="16" fill="#4A5856">민간임대주택에 관한 특별법 제49조·제67조, 같은 법 시행령 제35조·제39조 (2026년 9월 기준)</text>

  <!-- panel 1 -->
  <rect x="40" y="110" width="290" height="440" rx="10" fill="#F4EEE2" stroke="#E3DCCF"/>
  <rect x="40" y="110" width="290" height="44" rx="10" fill="#0E7C72"/>
  <rect x="40" y="140" width="290" height="14" fill="#0E7C72"/>
  <text x="58" y="140" font-size="19" font-weight="700" fill="#FBF7F0">1. 의무 대상 주택인가</text>

  <circle cx="60" cy="182" r="4" fill="#0A5F58"/>
  <text x="76" y="187" font-size="16" fill="#1A2B2A">민간건설임대주택</text>
  <circle cx="60" cy="214" r="4" fill="#0A5F58"/>
  <text x="76" y="219" font-size="16" fill="#1A2B2A">분양주택 전부를 우선</text>
  <text x="76" y="243" font-size="16" fill="#1A2B2A">공급받은 매입임대</text>
  <circle cx="60" cy="270" r="4" fill="#0A5F58"/>
  <text x="76" y="275" font-size="16" fill="#1A2B2A">동일 주택단지 100호</text>
  <text x="76" y="299" font-size="16" fill="#1A2B2A">이상 매입임대</text>
  <circle cx="60" cy="326" r="4" fill="#0A5F58"/>
  <text x="76" y="331" font-size="16" fill="#1A2B2A">그 밖의 민간매입임대</text>
  <text x="76" y="355" font-size="16" fill="#1A2B2A">주택</text>

  <line x1="58" y1="384" x2="312" y2="384" stroke="#E3DCCF"/>
  <text x="58" y="410" font-size="14" fill="#8A938F">가입 의무자는 임차인이 아니라</text>
  <text x="58" y="432" font-size="14" fill="#8A938F">임대사업자 (법 제49조 제1항,</text>
  <text x="58" y="454" font-size="14" fill="#8A938F">시행령 제38조)</text>
  <text x="58" y="490" font-size="14" fill="#C2873B">보증수수료 임대인 75% ·</text>
  <text x="58" y="512" font-size="14" fill="#C2873B">임차인 25% (시행령 제40조)</text>

  <!-- panel 2 -->
  <rect x="345" y="110" width="290" height="440" rx="10" fill="#F4EEE2" stroke="#E3DCCF"/>
  <rect x="345" y="110" width="290" height="44" rx="10" fill="#0E7C72"/>
  <rect x="345" y="140" width="290" height="14" fill="#0E7C72"/>
  <text x="363" y="140" font-size="19" font-weight="700" fill="#FBF7F0">2. 가입 여부와 보증금액</text>

  <circle cx="365" cy="182" r="4" fill="#0A5F58"/>
  <text x="381" y="187" font-size="16" fill="#1A2B2A">표준임대차계약서의</text>
  <text x="381" y="211" font-size="16" fill="#1A2B2A">보증 관련 기재</text>
  <circle cx="365" cy="238" r="4" fill="#0A5F58"/>
  <text x="381" y="243" font-size="16" fill="#1A2B2A">HUG 임차인 조회</text>
  <circle cx="365" cy="270" r="4" fill="#0A5F58"/>
  <text x="381" y="275" font-size="16" fill="#1A2B2A">시장·군수·구청장 통보</text>

  <rect x="363" y="300" width="254" height="152" rx="8" fill="#E3F0EE" stroke="#0E7C72"/>
  <text x="381" y="330" font-size="17" font-weight="700" fill="#0A5F58">보증대상은 원칙 전액</text>
  <text x="381" y="362" font-size="16" fill="#1A2B2A">일부 보증이면</text>
  <text x="381" y="386" font-size="16" fill="#1A2B2A">(담보권 설정액 + 보증금)</text>
  <text x="381" y="410" font-size="16" fill="#1A2B2A">빼기 주택가격의 60%</text>
  <text x="381" y="436" font-size="14" fill="#4A5856">임차인 동의가 요건에 포함</text>

  <text x="363" y="486" font-size="14" fill="#8A938F">법 제49조 제2항·제3항,</text>
  <text x="363" y="508" font-size="14" fill="#8A938F">시행령 제39조</text>

  <!-- panel 3 -->
  <rect x="650" y="110" width="290" height="440" rx="10" fill="#F4EEE2" stroke="#E3DCCF"/>
  <rect x="650" y="110" width="290" height="44" rx="10" fill="#0E7C72"/>
  <rect x="650" y="140" width="290" height="14" fill="#0E7C72"/>
  <text x="668" y="140" font-size="19" font-weight="700" fill="#FBF7F0">3. 미가입일 때</text>

  <text x="668" y="187" font-size="16" fill="#1A2B2A">임차인은 임대차계약을</text>
  <text x="668" y="211" font-size="16" fill="#1A2B2A">해제하거나 해지할 수</text>
  <text x="668" y="235" font-size="16" fill="#1A2B2A">있어요</text>
  <text x="668" y="259" font-size="14" fill="#8A938F">시행령 제35조 제2항 제5호</text>

  <rect x="668" y="276" width="254" height="102" rx="8" fill="#FBF7F0" stroke="#B5462F"/>
  <text x="686" y="306" font-size="15" fill="#B5462F">해지는 계약을 끝낼 권리일 뿐</text>
  <text x="686" y="330" font-size="15" fill="#B5462F">보증금 반환을 보장하는 것은</text>
  <text x="686" y="354" font-size="15" fill="#B5462F">아니에요</text>

  <text x="668" y="412" font-size="16" fill="#1A2B2A">임대사업자에게는 과태료</text>
  <text x="668" y="440" font-size="16" font-weight="700" fill="#0A5F58">임대보증금의 100분의 10</text>
  <text x="668" y="464" font-size="16" font-weight="700" fill="#0A5F58">이하, 3천만원 상한</text>
  <text x="668" y="492" font-size="14" fill="#8A938F">법 제67조 제5항 (법정 상한)</text>

  <!-- footer -->
  <line x1="40" y1="574" x2="940" y2="574" stroke="#E3DCCF"/>
  <text x="40" y="604" font-size="15" fill="#4A5856">가입 의무 면제 3가지: 임대보증금이 소액보증금 기준 이하이면서 임차인이 동의한 경우, 공공주택사업자와의 계약,</text>
  <text x="40" y="630" font-size="15" fill="#4A5856">임차인이 전세금 반환보증에 가입하고 임대사업자가 그 보증수수료를 전부 지급한 경우 (법 제49조 제7항)</text>
  <text x="40" y="666" font-size="14" fill="#8A938F">개별 사안의 의무 대상 여부와 보증대상액은 보증회사와 시장·군수·구청장 확인이 필요해요.</text>
</svg>
