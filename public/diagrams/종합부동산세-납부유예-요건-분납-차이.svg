<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 884" width="1200" height="884" role="img" aria-label="종합부동산세 납부유예의 신청 달력과 비용 계산. 공동명의 1주택자 신청 창구는 9월 16일부터 30일까지로 12월보다 먼저 닫히고, 납부기간 12월 1일부터 15일 사이에서는 납부유예 신청 마감이 분납 신청 마감보다 앞에 놓이며 허가 여부 서면 통지도 같은 보름 안에 이뤄진다. 허가가 취소되면 더해지는 금액은 허가받은 금액에서 납부한 금액을 뺀 금액에 납부기한이 지난 날부터 취소 뒤 고지일까지의 기간과 연 1천분의 31을 곱해 계산한다">
  <rect x="0" y="0" width="1200" height="884" fill="#FBF7F0"/>

  <text x="48" y="58" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="36" font-weight="700" fill="#1A2B2A">납부유예, 달력이 먼저 닫히고 비용은 뒤에 붙습니다</text>
  <text x="48" y="92" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="18" fill="#4A5856">정보 기준일 2026년 10월 27일 · 종합부동산세법(시행 2026.1.1) · 같은 법 시행령(시행 2026.10.1)</text>

  <!-- 두 창구 -->
  <rect x="48" y="116" width="520" height="118" rx="10" fill="#F4EEE2" stroke="#C2873B" stroke-width="2"/>
  <text x="72" y="152" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="21" font-weight="700" fill="#0A5F58">먼저 닫히는 창구 : 9월 16일 ~ 30일</text>
  <text x="72" y="182" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="16" fill="#1A2B2A">공동명의 1주택자 신청 (법 제10조의2 제2항)</text>
  <text x="72" y="210" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="15" fill="#4A5856">이 신청을 거쳐야 유예 요건 제1호에 들어갑니다</text>

  <line x1="568" y1="175" x2="632" y2="175" stroke="#8A938F" stroke-width="3" stroke-dasharray="8 6"/>

  <rect x="632" y="116" width="520" height="118" rx="10" fill="#E3F0EE" stroke="#0E7C72" stroke-width="2"/>
  <text x="656" y="152" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="21" font-weight="700" fill="#0A5F58">본 창구 : 12월 1일 ~ 15일</text>
  <text x="656" y="182" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="16" fill="#1A2B2A">종합부동산세 납부기간 (법 제16조 제1항)</text>
  <text x="656" y="210" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="15" fill="#4A5856">신청과 허가 여부 통지가 이 보름 안에서 끝납니다</text>

  <!-- 납부기간 안의 두 마감 순서 -->
  <text x="800" y="300" text-anchor="middle" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="18" font-weight="700" fill="#C2873B">납부유예 신청 마감</text>
  <text x="800" y="322" text-anchor="middle" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="15" fill="#4A5856">법 제20조의2 제1항</text>
  <text x="1080" y="300" text-anchor="end" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="18" font-weight="700" fill="#0A5F58">분납 신청 마감</text>
  <text x="1080" y="322" text-anchor="end" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="15" fill="#4A5856">시행령 제16조 제2항</text>

  <rect x="120" y="368" width="960" height="24" fill="#E3F0EE" stroke="#0E7C72" stroke-width="2"/>
  <line x1="800" y1="332" x2="800" y2="416" stroke="#C2873B" stroke-width="3"/>
  <line x1="1080" y1="332" x2="1080" y2="416" stroke="#0A5F58" stroke-width="3"/>
  <circle cx="800" cy="380" r="7" fill="#C2873B"/>
  <circle cx="1080" cy="380" r="7" fill="#0A5F58"/>

  <text x="120" y="434" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="17" fill="#1A2B2A">12월 1일</text>
  <text x="1080" y="434" text-anchor="end" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="17" fill="#1A2B2A">12월 15일</text>
  <text x="440" y="434" text-anchor="middle" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="15" fill="#8A938F">허가 여부는 이 보름 안에 서면 통지 (시행령 제16조의2 제2항)</text>
  <text x="48" y="468" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="15" fill="#8A938F">눈금 위치는 두 마감의 순서를 보여주는 개념도입니다. 기산 방법과 공휴일 처리는 확인 범위 밖입니다</text>

  <!-- 이자상당가산액 산식 -->
  <text x="48" y="528" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="24" font-weight="700" fill="#1A2B2A">허가가 취소되면 더해지는 금액 (시행령 제16조의2 제3항)</text>

  <rect x="48" y="552" width="352" height="124" rx="10" fill="#F4EEE2" stroke="#E3DCCF" stroke-width="2"/>
  <text x="72" y="586" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="16" fill="#8A938F">제1호 : 남은 원금</text>
  <text x="72" y="620" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="19" fill="#1A2B2A">허가받은 금액에서</text>
  <text x="72" y="650" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="19" fill="#1A2B2A">납부한 금액을 뺀 금액</text>

  <text x="416" y="624" text-anchor="middle" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="30" font-weight="700" fill="#0E7C72">×</text>

  <rect x="432" y="552" width="352" height="124" rx="10" fill="#F4EEE2" stroke="#E3DCCF" stroke-width="2"/>
  <text x="456" y="586" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="16" fill="#8A938F">제2호 가목 : 기간</text>
  <text x="456" y="620" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="19" fill="#1A2B2A">납부기한이 지난 날부터</text>
  <text x="456" y="650" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="19" fill="#1A2B2A">취소 뒤 고지일까지</text>

  <text x="800" y="624" text-anchor="middle" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="30" font-weight="700" fill="#0E7C72">×</text>

  <rect x="816" y="552" width="336" height="124" rx="10" fill="#E3F0EE" stroke="#0E7C72" stroke-width="2"/>
  <text x="840" y="586" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="16" fill="#8A938F">제2호 나목 : 율</text>
  <text x="840" y="624" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="26" font-weight="700" fill="#0A5F58">연 1천분의 31</text>
  <text x="840" y="654" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="16" fill="#4A5856">연 3.1%</text>

  <rect x="48" y="700" width="1104" height="58" rx="10" fill="#F4EEE2" stroke="#B5462F" stroke-width="2"/>
  <text x="72" y="736" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="19" fill="#1A2B2A">납부지연가산세는 부과하지 않지만(제6항), 이 금액은 유예 세액과 함께 징수됩니다(제5항)</text>

  <text x="48" y="794" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="16" fill="#4A5856">가정 예시 : 남은 금액 300만원에 3년을 적용하면 27만 9천원 (연 단위로 환산한 개략치)</text>
  <text x="48" y="832" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="15" fill="#8A938F">이자율 근거 : 국세기본법 시행령 제43조의3 제2항, 같은 법 시행규칙 제19조의3 (시행 2026년 3월 20일)</text>
  <text x="48" y="858" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="15" fill="#8A938F">시행규칙이 개정되면 이 율은 바뀔 수 있습니다</text>
</svg>
