<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" width="1200" height="840" role="img" aria-label="간이지급명세서 제출 주기 대조와 2027년 전환 타임라인: 근로소득 간이지급명세서만 반기 제출로 기한이 지급일이 속하는 반기의 마지막 달의 다음 달 말일이고, 사업소득과 인적용역 기타소득 간이지급명세서, 일용근로소득 지급명세서는 매월 제출로 다음 달 말일이며, 정규 지급명세서는 다음연도 3월 10일. 근로소득분은 2027년 1월 지급분부터 매월로 바뀌어 2026년 하반기 지급분은 2027년 1월 말일, 첫 매월분은 2027년 2월 말일이 기한이고 전환 첫해에는 종전 반기 기한까지 제출하면 미제출 가산세 0.25%가 면제됩니다">
  <rect x="0" y="0" width="1200" height="840" fill="#FBF7F0"/>

  <g font-family="'IBM Plex Sans KR', system-ui, sans-serif">
    <text x="48" y="60" font-size="33" font-weight="700" fill="#1A2B2A">근로소득분만 아직 반기, 2027년 1월 지급분부터 매월</text>
    <text x="48" y="94" font-size="17" fill="#4A5856">국세청 소득자료별 제출안내·원천세 신고안내 기준. 정보 기준일 2026년 11월 6일</text>
    <line x1="48" y1="116" x2="1152" y2="116" stroke="#E3DCCF" stroke-width="2"/>

    <!-- 주기 대조 -->
    <rect x="48" y="140" width="1104" height="302" rx="14" fill="#F4EEE2" stroke="#E3DCCF" stroke-width="2"/>
    <text x="72" y="176" font-size="20" font-weight="700" fill="#0A5F58">소득자료별 제출 주기</text>
    <text x="586" y="176" font-size="16" font-weight="700" fill="#4A5856">주기</text>
    <text x="706" y="176" font-size="16" font-weight="700" fill="#4A5856">제출기한</text>
    <line x1="72" y1="192" x2="1128" y2="192" stroke="#E3DCCF" stroke-width="2"/>

    <rect x="64" y="202" width="1072" height="46" rx="8" fill="#E3F0EE" stroke="#0E7C72" stroke-width="2"/>
    <text x="80" y="232" font-size="17" font-weight="700" fill="#1A2B2A">간이지급명세서(근로소득, 상용근로자)</text>
    <text x="586" y="232" font-size="17" font-weight="700" fill="#B5462F">반기</text>
    <text x="706" y="232" font-size="16" fill="#1A2B2A">반기의 마지막 달의 다음 달 말일</text>

    <text x="80" y="284" font-size="17" fill="#1A2B2A">간이지급명세서(사업소득, 인적용역)</text>
    <text x="586" y="284" font-size="17" font-weight="700" fill="#0A5F58">매월</text>
    <text x="706" y="284" font-size="16" fill="#4A5856">지급일이 속하는 달의 다음 달 말일</text>

    <text x="80" y="320" font-size="17" fill="#1A2B2A">간이지급명세서(기타소득, 인적용역)</text>
    <text x="586" y="320" font-size="17" font-weight="700" fill="#0A5F58">매월</text>
    <text x="706" y="320" font-size="16" fill="#4A5856">2024년 1월 지급분부터 매월 전환</text>

    <text x="80" y="356" font-size="17" fill="#1A2B2A">일용근로소득 지급명세서</text>
    <text x="586" y="356" font-size="17" font-weight="700" fill="#0A5F58">매월</text>
    <text x="706" y="356" font-size="16" fill="#4A5856">지급일이 속하는 달의 다음 달 말일</text>

    <text x="80" y="392" font-size="17" fill="#1A2B2A">지급명세서(근로·퇴직·사업소득 등)</text>
    <text x="586" y="392" font-size="17" font-weight="700" fill="#4A5856">연 1회</text>
    <text x="706" y="392" font-size="16" fill="#4A5856">다음연도 3월 10일</text>

    <text x="80" y="424" font-size="15" fill="#8A938F">일급·시급이라도 같은 고용주에게 3개월(건설공사 1년) 이상 계속 고용되면 상용근로자로 봅니다</text>

    <!-- 타임라인 -->
    <text x="48" y="482" font-size="20" font-weight="700" fill="#0A5F58">2027년 전환 구간, 기한이 이렇게 이어집니다</text>
    <line x1="48" y1="502" x2="1152" y2="502" stroke="#E3DCCF" stroke-width="2"/>

    <rect x="48" y="520" width="258" height="196" rx="12" fill="#F4EEE2" stroke="#E3DCCF" stroke-width="2"/>
    <text x="72" y="558" font-size="22" font-weight="700" fill="#1A2B2A">2027년 1월 말</text>
    <text x="72" y="592" font-size="16" fill="#4A5856">2026년 하반기 지급분</text>
    <text x="72" y="618" font-size="16" font-weight="700" fill="#0A5F58">마지막 반기분</text>
    <text x="72" y="652" font-size="15" fill="#4A5856">같은 날 2026년 12월</text>
    <text x="72" y="674" font-size="15" fill="#4A5856">지급 매월 자료도 기한</text>
    <text x="72" y="700" font-size="14" fill="#8A938F">규칙에서 도출한 날짜</text>

    <rect x="330" y="520" width="258" height="196" rx="12" fill="#E3F0EE" stroke="#0E7C72" stroke-width="2"/>
    <text x="354" y="558" font-size="22" font-weight="700" fill="#1A2B2A">2027년 2월 말</text>
    <text x="354" y="592" font-size="16" fill="#4A5856">2027년 1월 지급분</text>
    <text x="354" y="618" font-size="16" font-weight="700" fill="#0A5F58">첫 매월분 기한</text>
    <text x="354" y="652" font-size="15" fill="#4A5856">반기 규칙이라면</text>
    <text x="354" y="674" font-size="15" fill="#4A5856">7월 말이던 자리</text>
    <text x="354" y="700" font-size="14" fill="#8A938F">국세청 적용 사례에 명시</text>

    <rect x="612" y="520" width="258" height="196" rx="12" fill="#F4EEE2" stroke="#E3DCCF" stroke-width="2"/>
    <text x="636" y="558" font-size="22" font-weight="700" fill="#1A2B2A">2027년 3월 10일</text>
    <text x="636" y="592" font-size="16" fill="#4A5856">2026년 귀속</text>
    <text x="636" y="618" font-size="16" font-weight="700" fill="#0A5F58">정규 지급명세서</text>
    <text x="636" y="652" font-size="15" fill="#4A5856">간이지급명세서와</text>
    <text x="636" y="674" font-size="15" fill="#4A5856">기한이 따로 있습니다</text>
    <text x="636" y="700" font-size="14" fill="#8A938F">다음연도 3월 10일</text>

    <rect x="894" y="520" width="258" height="196" rx="12" fill="#F4EEE2" stroke="#C2873B" stroke-width="2"/>
    <text x="918" y="558" font-size="22" font-weight="700" fill="#1A2B2A">2027년 7월 말</text>
    <text x="918" y="592" font-size="16" fill="#4A5856">2027년 상반기 지급분</text>
    <text x="918" y="618" font-size="16" font-weight="700" fill="#C2873B">한시 특례를 쓰면</text>
    <text x="918" y="652" font-size="15" fill="#4A5856">종전 반기 기한까지</text>
    <text x="918" y="674" font-size="15" fill="#4A5856">내면 미제출분 면제</text>
    <text x="918" y="700" font-size="14" fill="#8A938F">문언에서 도출한 예시</text>

    <!-- 가산세 변화 -->
    <rect x="48" y="736" width="1104" height="54" rx="10" fill="#E3F0EE" stroke="#0E7C72" stroke-width="2"/>
    <text x="72" y="770" font-size="17" fill="#1A2B2A">가산세율은 미제출·불분명 0.25%, 지연제출 0.125%로 같고, 지연제출로 보는 기간이 기한 후 3개월에서 1개월로 좁아집니다</text>

    <text x="48" y="820" font-size="14" fill="#8A938F">출처: 국세청 소득자료별 제출안내(근로소득·사업소득·기타소득·일용근로소득), 원천세 신고안내, 가산세 안내. 2027년 1월 1일 이후 적용 항목은 국세청이 개정 내용으로 안내하는 범위입니다.</text>
  </g>
</svg>
