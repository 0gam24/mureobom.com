<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" width="1200" height="840" role="img" aria-label="원천징수세액 반기별 납부 절차: 신청은 반기 직전월 1일부터 말일까지로 상반기 적용은 12월·하반기 적용은 6월, 승인 통지는 신청일이 속하는 반기의 다음 달 말일까지이고 기한 내 통지가 없으면 승인 간주, 납부는 상반기분 7월 10일·하반기분 다음 해 1월 10일. 대상은 직전 연도 상시고용인원 20명 이하 또는 종교단체">
  <rect x="0" y="0" width="1200" height="840" fill="#FBF7F0"/>

  <g font-family="'IBM Plex Sans KR', system-ui, sans-serif">
    <text x="48" y="64" font-size="35" font-weight="700" fill="#1A2B2A">반기별 납부는 승인 사항, 신청 창구는 한 달입니다</text>
    <text x="48" y="98" font-size="18" fill="#4A5856">요건을 갖춘 것과 승인을 받은 것은 별개예요. 소득세법 제128조 제2항, 같은 법 시행령 제186조 기준</text>
    <line x1="48" y1="122" x2="1152" y2="122" stroke="#E3DCCF" stroke-width="2"/>

    <!-- step 1 : 신청 -->
    <rect x="48" y="150" width="352" height="200" rx="14" fill="#E3F0EE" stroke="#0E7C72" stroke-width="2"/>
    <rect x="68" y="170" width="112" height="30" rx="15" fill="#0E7C72"/>
    <text x="124" y="191" font-size="16" font-weight="700" fill="#FBF7F0" text-anchor="middle">1 신청</text>
    <text x="68" y="242" font-size="22" font-weight="700" fill="#0A5F58">반기 직전월 1일~말일</text>
    <text x="68" y="274" font-size="17" fill="#1A2B2A">상반기 적용은 12월</text>
    <text x="68" y="300" font-size="17" fill="#1A2B2A">하반기 적용은 6월</text>
    <text x="68" y="328" font-size="15" fill="#8A938F">원천징수 관할세무서장에게 신청</text>

    <!-- step 2 : 승인 통지 -->
    <rect x="424" y="150" width="352" height="200" rx="14" fill="#F4EEE2" stroke="#E3DCCF" stroke-width="2"/>
    <rect x="444" y="170" width="148" height="30" rx="15" fill="#C2873B"/>
    <text x="518" y="191" font-size="16" font-weight="700" fill="#FBF7F0" text-anchor="middle">2 승인 통지</text>
    <text x="444" y="242" font-size="21" font-weight="700" fill="#0A5F58">신청일이 속하는 반기의</text>
    <text x="444" y="270" font-size="21" font-weight="700" fill="#0A5F58">다음 달 말일까지</text>
    <text x="444" y="302" font-size="17" fill="#B5462F">기한 내 통지가 없으면 승인 간주</text>
    <text x="444" y="328" font-size="15" fill="#8A938F">신고·납부 성실도 등을 고려해 결정</text>

    <!-- step 3 : 납부·신고 -->
    <rect x="800" y="150" width="352" height="200" rx="14" fill="#F4EEE2" stroke="#E3DCCF" stroke-width="2"/>
    <rect x="820" y="170" width="156" height="30" rx="15" fill="#0A5F58"/>
    <text x="898" y="191" font-size="16" font-weight="700" fill="#FBF7F0" text-anchor="middle">3 납부·신고</text>
    <text x="820" y="242" font-size="21" font-weight="700" fill="#0A5F58">상반기분 7월 10일</text>
    <text x="820" y="270" font-size="21" font-weight="700" fill="#0A5F58">하반기분 다음 해 1월 10일</text>
    <text x="820" y="302" font-size="17" fill="#1A2B2A">반기 마지막 달의 다음 달 10일</text>
    <text x="820" y="328" font-size="15" fill="#8A938F">원칙은 매월 다음 달 10일</text>

    <!-- 대상 요건 -->
    <rect x="48" y="376" width="552" height="264" rx="14" fill="#F4EEE2" stroke="#E3DCCF" stroke-width="2"/>
    <text x="72" y="414" font-size="20" font-weight="700" fill="#0A5F58">신청할 수 있는 원천징수의무자</text>
    <line x1="72" y1="430" x2="576" y2="430" stroke="#E3DCCF" stroke-width="2"/>
    <text x="72" y="462" font-size="17" font-weight="700" fill="#1A2B2A">제1호 · 직전 연도 상시고용인원 20명 이하</text>
    <text x="72" y="490" font-size="16" fill="#4A5856">매월 말일 인원 누계 나누기 월수, 소수점 이하 버림</text>
    <text x="72" y="516" font-size="16" fill="#4A5856">금융 및 보험업을 경영하는 자는 제외</text>
    <text x="72" y="552" font-size="17" font-weight="700" fill="#1A2B2A">제2호 · 종교단체</text>
    <text x="72" y="580" font-size="16" fill="#4A5856">상시 고용인원 기재 없이 신청할 수 있어요</text>
    <text x="72" y="614" font-size="15" fill="#8A938F">신규사업자는 신청일이 속하는 반기로 인원 산정</text>

    <!-- 매월 납부 잔존 -->
    <rect x="624" y="376" width="528" height="264" rx="14" fill="#F4EEE2" stroke="#E3DCCF" stroke-width="2"/>
    <text x="648" y="414" font-size="20" font-weight="700" fill="#0A5F58">반기 승인자도 매월 납부하는 세액</text>
    <line x1="648" y1="430" x2="1128" y2="430" stroke="#E3DCCF" stroke-width="2"/>
    <text x="648" y="462" font-size="16" fill="#1A2B2A">법인세법 제67조 처분 상여·배당·기타소득</text>
    <text x="648" y="490" font-size="16" fill="#1A2B2A">국제조세조정에 관한 법률 제13조·제22조 배당소득</text>
    <text x="648" y="518" font-size="16" fill="#1A2B2A">소득세법 제156조의5 제1항·제2항 세액</text>
    <text x="648" y="554" font-size="16" fill="#B5462F">이 세 가지는 반기별 납부 범위에서 제외</text>
    <text x="648" y="614" font-size="15" fill="#8A938F">근거: 소득세법 제128조 제2항 제1호부터 제3호</text>

    <!-- 신고서 기재 -->
    <rect x="48" y="664" width="1104" height="100" rx="12" fill="#E3F0EE" stroke="#0E7C72" stroke-width="2"/>
    <text x="72" y="702" font-size="19" font-weight="700" fill="#0A5F58">반기분 원천징수이행상황신고서 기재</text>
    <text x="72" y="736" font-size="16" fill="#1A2B2A">신고구분은 반기 · 귀속연월은 반기 개시월 · 지급연월은 반기 종료월 · 지급액은 6개월 합계액</text>

    <text x="48" y="798" font-size="15" fill="#8A938F">출처: 소득세법 제128조, 같은 법 시행령 제186조, 시행규칙 별지 제21호의2서식·제21호서식, 국세청 원천세 신고·납부기한 안내</text>
    <text x="48" y="822" font-size="15" fill="#8A938F">정보 기준일 2026년 11월 3일. 시행령은 시행 2026년 10월 1일 조문 기준이며 조문·서식은 개정될 수 있어요.</text>
  </g>
</svg>
