<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-label="고용보험 미적용자 출산급여 지원대상 4유형과 2026년 1월 1일 시행 변경 4건, 지급액 150만원과 신청기한 1년" font-family="'IBM Plex Sans KR', system-ui, sans-serif">
  <rect x="0" y="0" width="960" height="720" fill="#FBF7F0"/>

  <text x="44" y="50" font-size="27" font-weight="700" fill="#1A2B2A">고용보험 미적용자 출산급여, 어디서 갈리나</text>
  <text x="44" y="78" font-size="13.5" fill="#4A5856">정부24 서비스 안내(2026.05.08. 최종수정) · 고용노동부 변경 알림(2025.12.31. 게시, 2026.1.1. 시행) 기준</text>

  <rect x="44" y="98" width="872" height="58" rx="10" fill="#E3F0EE" stroke="#E3DCCF"/>
  <text x="66" y="133" font-size="15.5" fill="#0A5F58">입구 기준은 고용보험 가입 여부가 아니라 &#39;출산전후휴가급여를 받지 못하는 상태&#39;예요.</text>

  <text x="44" y="192" font-size="16.5" font-weight="700" fill="#1A2B2A">지원대상 4유형 (정부24 표기)</text>

  <g>
    <rect x="44" y="204" width="206" height="152" rx="10" fill="#F4EEE2" stroke="#E3DCCF"/>
    <rect x="44" y="204" width="206" height="30" rx="10" fill="#0E7C72"/>
    <text x="147" y="225" font-size="14.5" font-weight="700" fill="#FBF7F0" text-anchor="middle">1유형</text>
    <text x="62" y="258" font-size="13" fill="#1A2B2A">고용보험 피보험자이나</text>
    <text x="62" y="278" font-size="13" fill="#1A2B2A">피보험단위기간 180일</text>
    <text x="62" y="298" font-size="13" fill="#1A2B2A">미충족</text>
    <text x="62" y="324" font-size="12" fill="#C2873B">추가요건: 출산일 전일까지</text>
    <text x="62" y="342" font-size="12" fill="#C2873B">30일 이상 자격 유지</text>
  </g>

  <g>
    <rect x="266" y="204" width="206" height="152" rx="10" fill="#F4EEE2" stroke="#E3DCCF"/>
    <rect x="266" y="204" width="206" height="30" rx="10" fill="#0E7C72"/>
    <text x="369" y="225" font-size="14.5" font-weight="700" fill="#FBF7F0" text-anchor="middle">2유형</text>
    <text x="284" y="258" font-size="13" fill="#1A2B2A">고용보험법 적용제외</text>
    <text x="284" y="278" font-size="13" fill="#1A2B2A">사업의 근로자 또는</text>
    <text x="284" y="298" font-size="13" fill="#1A2B2A">적용 제외자</text>
    <text x="284" y="324" font-size="12" fill="#8A938F">예시: 월 60시간 미만</text>
    <text x="284" y="342" font-size="12" fill="#8A938F">근로자 등</text>
  </g>

  <g>
    <rect x="488" y="204" width="206" height="152" rx="10" fill="#F4EEE2" stroke="#E3DCCF"/>
    <rect x="488" y="204" width="206" height="30" rx="10" fill="#0E7C72"/>
    <text x="591" y="225" font-size="14.5" font-weight="700" fill="#FBF7F0" text-anchor="middle">3유형</text>
    <text x="506" y="258" font-size="13" fill="#1A2B2A">출산일 현재 피고용인</text>
    <text x="506" y="278" font-size="13" fill="#1A2B2A">없는 단독·공동</text>
    <text x="506" y="298" font-size="13" fill="#1A2B2A">사업자</text>
    <text x="506" y="324" font-size="12" fill="#C2873B">임신 진단 이후 1인</text>
    <text x="506" y="342" font-size="12" fill="#C2873B">채용까지는 인정</text>
  </g>

  <g>
    <rect x="710" y="204" width="206" height="152" rx="10" fill="#F4EEE2" stroke="#E3DCCF"/>
    <rect x="710" y="204" width="206" height="30" rx="10" fill="#0E7C72"/>
    <text x="813" y="225" font-size="14.5" font-weight="700" fill="#FBF7F0" text-anchor="middle">4유형</text>
    <text x="728" y="258" font-size="13" fill="#1A2B2A">근로자도 1인사업자도</text>
    <text x="728" y="278" font-size="13" fill="#1A2B2A">아닌 특수형태근로자,</text>
    <text x="728" y="298" font-size="13" fill="#1A2B2A">프리랜서 등</text>
    <text x="728" y="324" font-size="12" fill="#8A938F">사업자등록이 없어도</text>
    <text x="728" y="342" font-size="12" fill="#8A938F">해당될 수 있어요</text>
  </g>

  <text x="44" y="392" font-size="12.5" fill="#4A5856">공통 요건: 출산 전 18개월 중 3개월 이상 소득활동</text>

  <text x="44" y="432" font-size="16.5" font-weight="700" fill="#1A2B2A">2026년 1월 1일 시행, 새로 생긴 네 갈래</text>
  <rect x="44" y="444" width="872" height="162" rx="10" fill="#F4EEE2" stroke="#E3DCCF"/>

  <text x="66" y="476" font-size="14" font-weight="700" fill="#0A5F58">소득활동 확인</text>
  <text x="66" y="498" font-size="12.5" fill="#4A5856">세금 신고된 소득 기준으로 인정</text>
  <text x="500" y="476" font-size="14" font-weight="700" fill="#0A5F58">보조인력 채용</text>
  <text x="500" y="498" font-size="12.5" fill="#4A5856">임신 진단 이후 1인에 한하여 지원</text>
  <text x="66" y="532" font-size="14" font-weight="700" fill="#B5462F">특고·프리랜서</text>
  <text x="66" y="554" font-size="12.5" fill="#4A5856">사업주와 배우자·동거친족 관계면 지원 불가</text>
  <text x="500" y="532" font-size="14" font-weight="700" fill="#0A5F58">1인 자영업자</text>
  <text x="500" y="554" font-size="12.5" fill="#4A5856">신청인의 모든 사업장이 요건 충족해야</text>
  <text x="66" y="588" font-size="12.5" fill="#C2873B">적용 시점: 2026.1.1. 신청자부터, 단 &#39;소득 증빙 자료&#39;는 2월 1일 신청자부터</text>

  <g>
    <rect x="44" y="626" width="430" height="64" rx="10" fill="#E3F0EE" stroke="#E3DCCF"/>
    <text x="66" y="653" font-size="13" fill="#4A5856">지급액</text>
    <text x="66" y="677" font-size="17" font-weight="700" fill="#0A5F58">총 150만원 일괄 지급 (월 50만원 × 3월분)</text>
  </g>
  <g>
    <rect x="486" y="626" width="430" height="64" rx="10" fill="#E3F0EE" stroke="#E3DCCF"/>
    <text x="508" y="653" font-size="13" fill="#4A5856">신청기한</text>
    <text x="508" y="677" font-size="17" font-weight="700" fill="#0A5F58">출산일로부터 1년, 미신청 시 소멸</text>
  </g>

  <text x="44" y="712" font-size="11.5" fill="#8A938F">출처: 정부24 고용보험 미적용자 출산급여 서비스 안내, 고용노동부 주요 변경 사항 알림. 물어봄 정리.</text>
</svg>
