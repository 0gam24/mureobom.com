<svg viewBox="0 0 800 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="산재 휴업급여 지급 구조: 3일 이내 미지급, 4일부터 평균임금 70% 지급, 요양 2년 경과 후 중증이면 상병보상연금으로 전환. 상황별 지급률은 일반 70퍼센트, 저소득 90퍼센트, 부분휴업 차액의 80퍼센트.">
  <rect x="0" y="0" width="800" height="560" fill="#FBF7F0"/>

  <text x="40" y="46" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="26" font-weight="700" fill="#1A2B2A">산재 휴업급여, 이렇게 지급돼요</text>
  <text x="40" y="72" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="14" fill="#8A938F">산업재해보상보험법 제52조·제54조·제66조 기준</text>

  <!-- Timeline -->
  <text x="40" y="112" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="16" font-weight="700" fill="#0A5F58">요양 기간 흐름</text>
  <line x1="60" y1="150" x2="740" y2="150" stroke="#E3DCCF" stroke-width="4"/>

  <!-- step 1 -->
  <circle cx="140" cy="150" r="12" fill="#B5462F"/>
  <rect x="60" y="176" width="160" height="86" rx="10" fill="#F4EEE2" stroke="#E3DCCF" stroke-width="1.5"/>
  <text x="140" y="204" text-anchor="middle" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="15" font-weight="700" fill="#B5462F">1일 ~ 3일</text>
  <text x="140" y="228" text-anchor="middle" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="13" fill="#4A5856">대기 기간</text>
  <text x="140" y="248" text-anchor="middle" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="13" fill="#4A5856">휴업급여 미지급</text>

  <!-- step 2 -->
  <circle cx="400" cy="150" r="12" fill="#0E7C72"/>
  <rect x="300" y="176" width="200" height="86" rx="10" fill="#E3F0EE" stroke="#0E7C72" stroke-width="1.5"/>
  <text x="400" y="204" text-anchor="middle" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="15" font-weight="700" fill="#0A5F58">4일째부터</text>
  <text x="400" y="228" text-anchor="middle" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="13" fill="#1A2B2A">평균임금 x 70%</text>
  <text x="400" y="248" text-anchor="middle" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="13" fill="#4A5856">취업 못한 날마다 지급</text>

  <!-- step 3 -->
  <circle cx="660" cy="150" r="12" fill="#C2873B"/>
  <rect x="580" y="176" width="160" height="86" rx="10" fill="#F4EEE2" stroke="#E3DCCF" stroke-width="1.5"/>
  <text x="660" y="204" text-anchor="middle" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="15" font-weight="700" fill="#C2873B">요양 2년 경과</text>
  <text x="660" y="228" text-anchor="middle" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="13" fill="#4A5856">중증요양상태면</text>
  <text x="660" y="248" text-anchor="middle" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="13" fill="#4A5856">상병보상연금 전환</text>

  <!-- Rate comparison -->
  <text x="40" y="322" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="16" font-weight="700" fill="#0A5F58">상황별 지급률</text>

  <!-- bar: 일반 70 -->
  <text x="60" y="366" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="14" fill="#1A2B2A">일반</text>
  <rect x="180" y="352" width="378" height="22" rx="6" fill="#E3DCCF"/>
  <rect x="180" y="352" width="378" height="22" rx="6" fill="#0E7C72"/>
  <text x="570" y="369" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="14" font-weight="700" fill="#0A5F58">평균임금 70%</text>

  <!-- bar: 저소득 90 -->
  <text x="60" y="406" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="14" fill="#1A2B2A">저소득 근로자</text>
  <rect x="180" y="392" width="378" height="22" rx="6" fill="#E3DCCF"/>
  <rect x="180" y="392" width="378" height="22" rx="6" fill="#0A5F58"/>
  <text x="570" y="409" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="14" font-weight="700" fill="#0A5F58">평균임금 90%</text>

  <!-- bar: 부분휴업 80 -->
  <text x="60" y="446" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="14" fill="#1A2B2A">부분휴업</text>
  <rect x="180" y="432" width="336" height="22" rx="6" fill="#E3DCCF"/>
  <rect x="180" y="432" width="336" height="22" rx="6" fill="#C2873B"/>
  <text x="528" y="449" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="14" font-weight="700" fill="#C2873B">차액의 80%</text>

  <!-- bar: 고령자 -->
  <text x="60" y="486" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="14" fill="#1A2B2A">61세 이후</text>
  <rect x="180" y="472" width="294" height="22" rx="6" fill="#E3DCCF"/>
  <rect x="180" y="472" width="294" height="22" rx="6" fill="#8A938F"/>
  <text x="486" y="489" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="14" font-weight="700" fill="#4A5856">별표1 연령별 체감</text>

  <text x="40" y="534" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="12" fill="#8A938F">저소득 상한은 최저보상기준액의 80%, 하한은 최저임금액. 최저보상기준·최저임금은 연도별로 바뀌니 청구 시점에 확인하세요.</text>
</svg>
