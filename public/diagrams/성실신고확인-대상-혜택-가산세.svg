<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 660" font-family="'IBM Plex Sans KR', system-ui, sans-serif">
  <rect x="0" y="0" width="820" height="660" fill="#FBF7F0"/>

  <text x="30" y="44" font-size="26" font-weight="700" fill="#1A2B2A">성실신고확인 대상과 혜택·가산세</text>
  <text x="30" y="72" font-size="15" fill="#4A5856">2026년 신고분 기준, 소득세법 시행령 제133조·제81조의2, 조특법 제126조의6·제122조의3</text>

  <text x="30" y="112" font-size="17" font-weight="700" fill="#0A5F58">대상 수입금액 기준 (업종별 3구간)</text>

  <!-- Tier 1 -->
  <rect x="30" y="128" width="240" height="150" rx="12" fill="#F4EEE2" stroke="#E3DCCF" stroke-width="1"/>
  <circle cx="60" cy="160" r="16" fill="#0E7C72"/>
  <text x="60" y="166" font-size="16" font-weight="700" fill="#FBF7F0" text-anchor="middle">1</text>
  <text x="88" y="166" font-size="22" font-weight="700" fill="#1A2B2A">15억원 이상</text>
  <text x="50" y="205" font-size="14" fill="#4A5856">농업·임업·어업, 광업,</text>
  <text x="50" y="227" font-size="14" fill="#4A5856">도매·소매업,</text>
  <text x="50" y="249" font-size="14" fill="#4A5856">부동산매매업 등</text>

  <!-- Tier 2 -->
  <rect x="290" y="128" width="240" height="150" rx="12" fill="#F4EEE2" stroke="#E3DCCF" stroke-width="1"/>
  <circle cx="320" cy="160" r="16" fill="#0E7C72"/>
  <text x="320" y="166" font-size="16" font-weight="700" fill="#FBF7F0" text-anchor="middle">2</text>
  <text x="348" y="166" font-size="21" font-weight="700" fill="#1A2B2A">7.5억원 이상</text>
  <text x="310" y="205" font-size="14" fill="#4A5856">제조업, 숙박·음식점업,</text>
  <text x="310" y="227" font-size="14" fill="#4A5856">건설업, 운수·창고업,</text>
  <text x="310" y="249" font-size="14" fill="#4A5856">정보통신·금융보험업 등</text>

  <!-- Tier 3 -->
  <rect x="550" y="128" width="240" height="150" rx="12" fill="#F4EEE2" stroke="#E3DCCF" stroke-width="1"/>
  <circle cx="580" cy="160" r="16" fill="#0E7C72"/>
  <text x="580" y="166" font-size="16" font-weight="700" fill="#FBF7F0" text-anchor="middle">3</text>
  <text x="608" y="166" font-size="22" font-weight="700" fill="#1A2B2A">5억원 이상</text>
  <text x="570" y="205" font-size="14" fill="#4A5856">부동산임대업,</text>
  <text x="570" y="227" font-size="14" fill="#4A5856">전문·과학·기술서비스,</text>
  <text x="570" y="249" font-size="14" fill="#4A5856">교육·보건·개인서비스 등</text>

  <line x1="30" y1="308" x2="790" y2="308" stroke="#E3DCCF" stroke-width="1"/>

  <!-- Benefit panel -->
  <rect x="30" y="330" width="360" height="290" rx="12" fill="#E3F0EE" stroke="#0E7C72" stroke-width="1.5"/>
  <text x="50" y="366" font-size="18" font-weight="700" fill="#0A5F58">확인서를 제출하면 (혜택)</text>
  <text x="50" y="404" font-size="15" fill="#1A2B2A">신고·납부기한 6월 30일로 연장</text>
  <text x="66" y="426" font-size="13" fill="#4A5856">(일반 종소세 5월 31일보다 1개월 여유)</text>
  <text x="50" y="460" font-size="15" fill="#1A2B2A">확인비용 60% 세액공제</text>
  <text x="66" y="482" font-size="13" fill="#4A5856">(사업소득분 한도 120만원)</text>
  <text x="50" y="516" font-size="15" fill="#1A2B2A">의료비·교육비 세액공제 허용</text>
  <text x="66" y="538" font-size="13" fill="#4A5856">(사업자 예외, 적용기한 2026.12.31)</text>
  <text x="50" y="572" font-size="15" fill="#1A2B2A">월세 세액공제(부수 혜택)</text>
  <text x="50" y="604" font-size="13" fill="#8A938F">근거: 조특법 제126조의6·제122조의3</text>

  <!-- Penalty panel -->
  <rect x="430" y="330" width="360" height="290" rx="12" fill="#F4EEE2" stroke="#B5462F" stroke-width="1.5"/>
  <text x="450" y="366" font-size="18" font-weight="700" fill="#B5462F">확인서를 미제출하면 (불이익)</text>
  <text x="450" y="404" font-size="15" fill="#1A2B2A">성실신고확인서 미제출 가산세</text>
  <text x="450" y="440" font-size="20" font-weight="700" fill="#B5462F">산출세액(사업소득분) × 5%</text>
  <text x="450" y="470" font-size="13" fill="#4A5856">= 종합소득산출세액 ×</text>
  <text x="450" y="490" font-size="13" fill="#4A5856">   (사업소득금액 / 종합소득금액) × 5%</text>
  <text x="450" y="524" font-size="15" fill="#1A2B2A">세무조사 선정 가능성 상승</text>
  <text x="466" y="546" font-size="13" fill="#4A5856">('무조건 조사'는 아님, 선정 가능성)</text>
  <text x="450" y="580" font-size="15" fill="#1A2B2A">기한 연장·확인비용 공제도 못 받음</text>
  <text x="450" y="604" font-size="13" fill="#8A938F">근거: 소득세법 제81조의2</text>
</svg>
