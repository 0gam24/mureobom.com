<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 720" role="img" aria-label="상속채무 대응 3갈래와 3개월 기한. 상속이 시작되면 상속인은 상속개시를 안 날부터 3개월 안에 단순승인, 한정승인, 상속포기 중 하나를 선택합니다. 단순승인은 재산과 빚을 모두 무한 승계, 한정승인은 물려받은 재산 한도 안에서만 빚을 변제, 상속포기는 상속인 지위를 소급 포기합니다. 3개월을 넘기면 원칙적으로 단순승인으로 간주됩니다. 선순위가 모두 포기하면 빚은 후순위 상속인에게 넘어갑니다." font-family="'IBM Plex Sans KR', system-ui, sans-serif">
  <rect x="0" y="0" width="800" height="720" fill="#FBF7F0"/>

  <text x="40" y="48" font-size="24" font-weight="700" fill="#1A2B2A">물려받은 빚, 3개월 안에 세 갈래 중 선택</text>
  <text x="40" y="74" font-size="14" fill="#8A938F">민법 제1019조 제1025조 제1026조 제1028조 제1041조 제1042조 기준 (2026년)</text>

  <!-- Section A: 기한 타임라인 -->
  <rect x="40" y="96" width="720" height="150" rx="12" fill="#F4EEE2"/>
  <text x="60" y="126" font-size="16" font-weight="700" fill="#0A5F58">1. 기한: 상속개시를 안 날부터 3개월</text>

  <line x1="80" y1="176" x2="720" y2="176" stroke="#E3DCCF" stroke-width="2"/>
  <circle cx="120" cy="176" r="10" fill="#0E7C72"/>
  <text x="120" y="210" font-size="12" fill="#1A2B2A" text-anchor="middle">상속개시를</text>
  <text x="120" y="226" font-size="12" fill="#1A2B2A" text-anchor="middle">안 날</text>

  <rect x="130" y="166" width="440" height="20" rx="4" fill="#0E7C72"/>
  <text x="350" y="181" font-size="12" fill="#FBF7F0" text-anchor="middle">한정승인·상속포기 신고 가능 (3개월)</text>

  <circle cx="580" cy="176" r="10" fill="#B5462F"/>
  <text x="580" y="210" font-size="12" font-weight="700" fill="#B5462F" text-anchor="middle">3개월 경과</text>
  <text x="580" y="226" font-size="11" fill="#4A5856" text-anchor="middle">원칙적 단순승인 간주</text>
  <text x="700" y="181" font-size="11" fill="#8A938F" text-anchor="middle">제1026조</text>

  <!-- Section B: 3갈래 비교 -->
  <text x="40" y="286" font-size="16" font-weight="700" fill="#0A5F58">2. 세 갈래 비교</text>

  <!-- 단순승인 -->
  <rect x="40" y="300" width="226" height="180" rx="12" fill="#F4EEE2"/>
  <text x="60" y="330" font-size="16" font-weight="700" fill="#B5462F">단순승인</text>
  <text x="60" y="356" font-size="12" fill="#4A5856">재산과 빚 모두 승계</text>
  <text x="60" y="378" font-size="12" fill="#4A5856">내 재산으로도 무한 책임</text>
  <text x="60" y="400" font-size="12" fill="#4A5856">별도 신고 필요 없음</text>
  <text x="60" y="430" font-size="12" fill="#8A938F">제1025조</text>
  <text x="60" y="462" font-size="12" fill="#1A2B2A">빚 &lt; 재산일 때 유리</text>

  <!-- 한정승인 -->
  <rect x="287" y="300" width="226" height="180" rx="12" fill="#E3F0EE"/>
  <text x="307" y="330" font-size="16" font-weight="700" fill="#0A5F58">한정승인</text>
  <text x="307" y="356" font-size="12" fill="#4A5856">물려받은 재산 한도에서만</text>
  <text x="307" y="378" font-size="12" fill="#4A5856">빚 변제</text>
  <text x="307" y="400" font-size="12" fill="#4A5856">내 고유재산은 보전</text>
  <text x="307" y="430" font-size="12" fill="#8A938F">제1028조·제1030조</text>
  <text x="307" y="462" font-size="12" fill="#1A2B2A">재산목록 첨부해 신고</text>

  <!-- 상속포기 -->
  <rect x="534" y="300" width="226" height="180" rx="12" fill="#E3F0EE"/>
  <text x="554" y="330" font-size="16" font-weight="700" fill="#0A5F58">상속포기</text>
  <text x="554" y="356" font-size="12" fill="#4A5856">상속인 지위 자체 포기</text>
  <text x="554" y="378" font-size="12" fill="#4A5856">처음부터 상속인 아님</text>
  <text x="554" y="400" font-size="12" fill="#4A5856">(소급효)</text>
  <text x="554" y="430" font-size="12" fill="#8A938F">제1041조·제1042조</text>
  <text x="554" y="462" font-size="12" fill="#1A2B2A">가정법원에 포기 신고</text>

  <!-- Section C: 후순위 승계 흐름 -->
  <rect x="40" y="500" width="720" height="180" rx="12" fill="#F4EEE2"/>
  <text x="60" y="530" font-size="16" font-weight="700" fill="#0A5F58">3. 선순위가 모두 포기하면 빚은 후순위로</text>

  <rect x="70" y="556" width="150" height="52" rx="8" fill="#E3F0EE"/>
  <text x="145" y="580" font-size="13" font-weight="700" fill="#0A5F58" text-anchor="middle">1순위 직계비속</text>
  <text x="145" y="598" font-size="11" fill="#B5462F" text-anchor="middle">전원 포기</text>

  <text x="238" y="588" font-size="20" fill="#8A938F" text-anchor="middle">&#8594;</text>

  <rect x="256" y="556" width="150" height="52" rx="8" fill="#E3F0EE"/>
  <text x="331" y="580" font-size="13" font-weight="700" fill="#0A5F58" text-anchor="middle">2순위 직계존속</text>
  <text x="331" y="598" font-size="11" fill="#B5462F" text-anchor="middle">전원 포기</text>

  <text x="424" y="588" font-size="20" fill="#8A938F" text-anchor="middle">&#8594;</text>

  <rect x="442" y="556" width="150" height="52" rx="8" fill="#E3F0EE"/>
  <text x="517" y="580" font-size="13" font-weight="700" fill="#0A5F58" text-anchor="middle">3순위 형제자매</text>
  <text x="517" y="598" font-size="11" fill="#B5462F" text-anchor="middle">전원 포기</text>

  <text x="610" y="588" font-size="20" fill="#8A938F" text-anchor="middle">&#8594;</text>

  <rect x="628" y="556" width="112" height="52" rx="8" fill="#E3F0EE"/>
  <text x="684" y="580" font-size="13" font-weight="700" fill="#0A5F58" text-anchor="middle">4촌 이내</text>
  <text x="684" y="598" font-size="13" font-weight="700" fill="#0A5F58" text-anchor="middle">방계혈족</text>

  <text x="60" y="640" font-size="12" fill="#4A5856">한 명만 포기하면 그 몫이 같은 순위의 다른 가족에게 넘어가요(제1043조). 순위표는 제1000조.</text>
  <text x="60" y="662" font-size="12" fill="#4A5856">빚을 온전히 끊으려면 상속인 전원이 함께 판단하는 것이 안전해요.</text>

  <text x="40" y="704" font-size="11" fill="#8A938F">개별 사건의 판단은 가정법원·대한법률구조공단 상담을 확인하세요. 이 그림은 일반 정보예요.</text>
</svg>
