<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 660" font-family="'IBM Plex Sans KR', system-ui, sans-serif" role="img" aria-label="전세퇴거자금대출 한도 판단 흐름: 보증금 반환 목적 주담대는 LTV 담보 한도, DSR 상환능력 한도, 생활안정자금 목적 한도(2025년 6월 27일 기준 수도권·규제지역 최대 1억원) 세 가지를 모두 적용해 그중 가장 작은 값이 실제 한도가 되고, 규제지역 2주택 이상이면 취급이 막힐 수 있다">
  <rect x="0" y="0" width="760" height="660" fill="#FBF7F0"/>
  <text x="30" y="44" font-size="24" font-weight="700" fill="#1A2B2A">전세퇴거자금대출 한도 판단 흐름</text>
  <text x="30" y="70" font-size="13.5" fill="#4A5856">보증금 반환(생활안정자금) 목적 주택담보대출, 2026년 8월 현재 기준</text>

  <!-- start -->
  <rect x="230" y="92" width="300" height="58" rx="10" fill="#0E7C72"/>
  <text x="380" y="118" font-size="16" font-weight="700" fill="#FBF7F0" text-anchor="middle">내 소유 주택을 담보로</text>
  <text x="380" y="139" font-size="13" fill="#E3F0EE" text-anchor="middle">세입자 보증금 반환 목적 대출 신청</text>

  <line x1="380" y1="150" x2="380" y2="178" stroke="#8A938F" stroke-width="2"/>
  <polygon points="380,184 375,174 385,174" fill="#8A938F"/>

  <!-- three gates header -->
  <text x="30" y="212" font-size="14.5" font-weight="700" fill="#0A5F58">세 가지 한도를 동시에 계산해요</text>

  <!-- gate 1 -->
  <rect x="30" y="226" width="230" height="118" rx="10" fill="#F4EEE2" stroke="#E3DCCF" stroke-width="1.5"/>
  <text x="46" y="252" font-size="15" font-weight="700" fill="#1A2B2A">1. LTV 담보 한도</text>
  <text x="46" y="276" font-size="12.5" fill="#4A5856">주택가격 x 담보인정비율</text>
  <text x="46" y="296" font-size="12.5" fill="#4A5856">지역·규제 여부에 따라</text>
  <text x="46" y="316" font-size="12.5" fill="#4A5856">비율이 달라져요</text>
  <text x="46" y="336" font-size="11.5" fill="#8A938F">담보 가치가 정하는 천장</text>

  <!-- gate 2 -->
  <rect x="265" y="226" width="230" height="118" rx="10" fill="#F4EEE2" stroke="#E3DCCF" stroke-width="1.5"/>
  <text x="281" y="252" font-size="15" font-weight="700" fill="#1A2B2A">2. DSR 상환 한도</text>
  <text x="281" y="276" font-size="12.5" fill="#4A5856">기존 대출까지 합산한</text>
  <text x="281" y="296" font-size="12.5" fill="#4A5856">연 원리금 상환 부담이</text>
  <text x="281" y="316" font-size="12.5" fill="#4A5856">소득 대비 기준 이내</text>
  <text x="281" y="336" font-size="11.5" fill="#8A938F">소득이 정하는 천장</text>

  <!-- gate 3 -->
  <rect x="500" y="226" width="230" height="118" rx="10" fill="#E3F0EE" stroke="#0E7C72" stroke-width="1.5"/>
  <text x="516" y="252" font-size="15" font-weight="700" fill="#0A5F58">3. 생활안정자금 한도</text>
  <text x="516" y="276" font-size="12.5" fill="#4A5856">수도권·규제지역 소재</text>
  <text x="516" y="296" font-size="12.5" fill="#4A5856">주택 담보 시 최대 1억원</text>
  <text x="516" y="316" font-size="11.5" fill="#8A938F">2025년 6월 27일 기준,</text>
  <text x="516" y="333" font-size="11.5" fill="#8A938F">지방은 금융회사 자율</text>

  <!-- arrows down to smallest -->
  <line x1="145" y1="344" x2="145" y2="378" stroke="#8A938F" stroke-width="2"/>
  <line x1="380" y1="344" x2="380" y2="378" stroke="#8A938F" stroke-width="2"/>
  <line x1="615" y1="344" x2="615" y2="378" stroke="#8A938F" stroke-width="2"/>
  <line x1="145" y1="378" x2="615" y2="378" stroke="#8A938F" stroke-width="2"/>
  <line x1="380" y1="378" x2="380" y2="402" stroke="#8A938F" stroke-width="2"/>
  <polygon points="380,408 375,398 385,398" fill="#8A938F"/>

  <!-- result: smallest -->
  <rect x="200" y="414" width="360" height="60" rx="10" fill="#0E7C72"/>
  <text x="380" y="440" font-size="16" font-weight="700" fill="#FBF7F0" text-anchor="middle">셋 중 가장 작은 값 = 실제 대출 한도</text>
  <text x="380" y="461" font-size="12.5" fill="#E3F0EE" text-anchor="middle">반환할 보증금 범위 안에서만 실행돼요</text>

  <!-- multihouse warning branch -->
  <line x1="380" y1="474" x2="380" y2="500" stroke="#8A938F" stroke-width="2"/>
  <polygon points="380,506 375,496 385,496" fill="#8A938F"/>

  <rect x="90" y="512" width="580" height="76" rx="10" fill="#F4EEE2" stroke="#B5462F" stroke-width="1.5"/>
  <text x="110" y="538" font-size="14" font-weight="700" fill="#B5462F">규제지역 2주택 이상이면 취급 자체가 막힐 수 있어요</text>
  <text x="110" y="560" font-size="12.5" fill="#4A5856">수도권·규제지역 2주택 이상 보유 차주는 해당 지역 주택 담보 생활안정자금 목적</text>
  <text x="110" y="578" font-size="12.5" fill="#4A5856">주담대 취급이 금지돼요(2025년 6월 27일 기준). 지방 소재 주택은 금융회사 자율.</text>

  <text x="30" y="626" font-size="11.5" fill="#8A938F">규제와 한도는 시점·지역·은행에 따라 달라지므로 신청 전 금융회사와 공식 자료로 꼭 확인하세요.</text>
  <text x="30" y="646" font-size="11.5" fill="#8A938F">출처: 금융위원회 가계부채 관리 강화 방안(2025-06-27), 주택담보대출 LTV·DSR FAQ.</text>
</svg>
