<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 620" role="img" font-family="'IBM Plex Sans KR', system-ui, sans-serif">
  <title>양도소득세 필요경비 계산 구조와 인정 항목 대 불인정 항목 대조</title>
  <rect x="0" y="0" width="820" height="620" fill="#FBF7F0"/>

  <!-- 제목 -->
  <text x="40" y="46" font-size="24" font-weight="700" fill="#1A2B2A">양도차익 계산 구조와 필요경비 인정 범위</text>
  <text x="40" y="72" font-size="14" fill="#8A938F">소득세법 제97조·시행령 제163조 · 2026년 기준</text>

  <!-- 계산식 바 -->
  <rect x="40" y="92" width="740" height="72" rx="10" fill="#E3F0EE"/>
  <text x="60" y="126" font-size="17" font-weight="700" fill="#0A5F58">양도차익 =</text>
  <text x="60" y="150" font-size="14" fill="#1A2B2A">양도가액 − 취득가액 − 필요경비(자본적지출액 + 양도비용)</text>
  <text x="560" y="126" font-size="13" fill="#4A5856">취득가액은</text>
  <text x="560" y="146" font-size="13" fill="#4A5856">실지거래가액 우선 적용</text>

  <!-- 좌측: 인정 -->
  <rect x="40" y="188" width="360" height="360" rx="12" fill="#F4EEE2" stroke="#E3DCCF" stroke-width="1"/>
  <rect x="40" y="188" width="360" height="46" rx="12" fill="#0E7C72"/>
  <rect x="40" y="212" width="360" height="22" fill="#0E7C72"/>
  <text x="60" y="218" font-size="17" font-weight="700" fill="#FBF7F0">필요경비로 인정 (O)</text>

  <text x="60" y="272" font-size="14" font-weight="700" fill="#0A5F58">취득 부대비용</text>
  <text x="60" y="294" font-size="13" fill="#1A2B2A">취득세·등록면허세</text>
  <text x="60" y="314" font-size="13" fill="#1A2B2A">취득 시 중개수수료, 법무사보수</text>

  <text x="60" y="348" font-size="14" font-weight="700" fill="#0A5F58">자본적지출 (자산가치 증가)</text>
  <text x="60" y="370" font-size="13" fill="#1A2B2A">발코니 새시 설치, 방 확장</text>
  <text x="60" y="390" font-size="13" fill="#1A2B2A">난방·보일러 교체, 냉난방 설치</text>
  <text x="60" y="410" font-size="13" fill="#1A2B2A">재건축·개발부담금</text>

  <text x="60" y="444" font-size="14" font-weight="700" fill="#0A5F58">양도비용</text>
  <text x="60" y="466" font-size="13" fill="#1A2B2A">양도 시 중개수수료</text>
  <text x="60" y="486" font-size="13" fill="#1A2B2A">양도세 신고서 작성비용</text>
  <text x="60" y="506" font-size="13" fill="#1A2B2A">국민주택채권 매각차손</text>
  <text x="60" y="532" font-size="12" fill="#8A938F">※ 적격증빙 또는 지출 입증서류 필요</text>

  <!-- 우측: 불인정 -->
  <rect x="420" y="188" width="360" height="360" rx="12" fill="#F4EEE2" stroke="#E3DCCF" stroke-width="1"/>
  <rect x="420" y="188" width="360" height="46" rx="12" fill="#B5462F"/>
  <rect x="420" y="212" width="360" height="22" fill="#B5462F"/>
  <text x="440" y="218" font-size="17" font-weight="700" fill="#FBF7F0">인정 안 됨 (X)</text>

  <text x="440" y="272" font-size="14" font-weight="700" fill="#B5462F">수익적지출 (원상회복·유지)</text>
  <text x="440" y="294" font-size="13" fill="#1A2B2A">도배·장판, 벽지 교체</text>
  <text x="440" y="314" font-size="13" fill="#1A2B2A">싱크대 교체 등 단순 수선</text>

  <text x="440" y="348" font-size="14" font-weight="700" fill="#B5462F">보유·금융 비용</text>
  <text x="440" y="370" font-size="13" fill="#1A2B2A">대출이자</text>
  <text x="440" y="390" font-size="13" fill="#1A2B2A">재산세·종합부동산세 등 보유세</text>

  <text x="440" y="430" font-size="13" fill="#4A5856">이유: 자산가치를 현실적으로</text>
  <text x="440" y="450" font-size="13" fill="#4A5856">높이는 지출이 아니므로</text>
  <text x="440" y="470" font-size="13" fill="#4A5856">필요경비 정의에서 제외</text>

  <text x="440" y="510" font-size="12" fill="#8A938F">취득가액 불분명 시 환산취득가액,</text>
  <text x="440" y="528" font-size="12" fill="#8A938F">이때 필요경비는 개산공제(3% 등)</text>

  <!-- 하단 캡션 -->
  <text x="40" y="586" font-size="12" fill="#8A938F">출처: 소득세법 제97조, 시행령 제163조, 국세청 양도소득세 세액계산 안내 · 일반정보이며 개별 사안은 관할 세무서 확인</text>
</svg>
