<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" font-family="'IBM Plex Sans KR', system-ui, sans-serif">
  <rect x="0" y="0" width="820" height="520" fill="#FBF7F0"/>

  <text x="40" y="46" font-size="26" font-weight="700" fill="#1A2B2A">희망저축계좌 Ⅰ·Ⅱ와 청년내일저축계좌 비교</text>
  <text x="40" y="72" font-size="15" fill="#4A5856">대상·소득요건·적립 구조가 서로 다른 별개의 자산형성 사업이에요</text>

  <!-- Column 1: 희망저축계좌 Ⅰ -->
