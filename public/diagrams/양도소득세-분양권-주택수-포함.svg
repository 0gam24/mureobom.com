<svg viewBox="0 0 820 560" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Sans KR', system-ui, sans-serif" role="img" aria-label="분양권 두 기준일: 주택수 포함은 2021년 1월 1일 이후 취득분, 양도세율 강화는 2021년 6월 1일 이후 양도분. 분양권 양도세율은 1년 미만 70퍼센트, 1년 이상 60퍼센트.">
  <rect x="0" y="0" width="820" height="560" fill="#FBF7F0"/>

  <text x="40" y="52" font-size="26" font-weight="700" fill="#1A2B2A">분양권, 두 개의 기준일을 나눠 보세요</text>
  <text x="40" y="82" font-size="15" fill="#4A5856">주택수 포함(취득 시기)과 양도세율 강화(양도 시기)는 서로 다른 날짜로 판단해요</text>

  <!-- Panel 1: 주택수 포함 기준 -->
  <rect x="40" y="108" width="740" height="150" rx="14" fill="#F4EEE2"/>
  <rect x="40" y="108" width="8" height="150" rx="4" fill="#0E7C72"/>
  <text x="68" y="140" font-size="18" font-weight="700" fill="#0A5F58">1. 주택수 포함 여부 (취득 시기 기준)</text>

  <!-- before box -->
  <rect x="68" y="158" width="320" height="78" rx="10" fill="#FBF7F0" stroke="#E3DCCF" stroke-width="1.5"/>
  <text x="88" y="186" font-size="15" font-weight="700" fill="#1A2B2A">2020.12.31 이전 취득</text>
  <text x="88" y="212" font-size="14" fill="#4A5856">주택수에 포함되지 않음</text>
  <text x="88" y="230" font-size="13" fill="#8A938F">(종전 규정 적용)</text>

  <!-- after box -->
  <rect x="432" y="158" width="320" height="78" rx="10" fill="#E3F0EE" stroke="#0E7C72" stroke-width="1.5"/>
  <text x="452" y="186" font-size="15" font-weight="700" fill="#0A5F58">2021.1.1 이후 취득</text>
  <text x="452" y="212" font-size="14" fill="#1A2B2A">주택수에 포함</text>
  <text x="452" y="230" font-size="13" fill="#4A5856">(소득세법 제88조·제89조)</text>

  <text x="410" y="203" font-size="20" fill="#C2873B" text-anchor="middle">›</text>

  <!-- Panel 2: 양도세율 강화 -->
  <rect x="40" y="278" width="740" height="150" rx="14" fill="#F4EEE2"/>
  <rect x="40" y="278" width="8" height="150" rx="4" fill="#C2873B"/>
  <text x="68" y="310" font-size="18" font-weight="700" fill="#0A5F58">2. 분양권 양도세율 (양도 시기 기준)</text>
  <text x="68" y="334" font-size="14" fill="#4A5856">2021.6.1 이후 양도분부터 단기 단일세율 적용 (소득세법 제104조)</text>

  <rect x="68" y="350" width="340" height="62" rx="10" fill="#FBF7F0" stroke="#E3DCCF" stroke-width="1.5"/>
  <text x="88" y="378" font-size="14" fill="#4A5856">보유기간 1년 미만</text>
  <text x="388" y="390" font-size="26" font-weight="700" fill="#B5462F" text-anchor="end">70%</text>

  <rect x="432" y="350" width="320" height="62" rx="10" fill="#FBF7F0" stroke="#E3DCCF" stroke-width="1.5"/>
  <text x="452" y="378" font-size="14" fill="#4A5856">보유기간 1년 이상</text>
  <text x="732" y="390" font-size="26" font-weight="700" fill="#B5462F" text-anchor="end">60%</text>

  <!-- footer note -->
  <rect x="40" y="448" width="740" height="80" rx="14" fill="#E3F0EE"/>
  <text x="64" y="480" font-size="15" font-weight="700" fill="#0A5F58">한 문장 정리</text>
  <text x="64" y="504" font-size="14" fill="#1A2B2A">주택수 포함은 &#39;2021.1.1 이후 취득&#39;, 세율 강화는 &#39;2021.6.1 이후 양도&#39;로 기준일이 달라요.</text>
  <text x="64" y="522" font-size="13" fill="#8A938F">개인별 비과세 가부는 세대·보유·취득시기에 따라 다르니 국세청(126)·관할 세무서에 확인하세요.</text>
</svg>
