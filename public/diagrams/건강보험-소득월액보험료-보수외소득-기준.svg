<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 580" role="img" aria-labelledby="title desc" font-family="'IBM Plex Sans KR', system-ui, sans-serif">
  <title id="title">직장가입자 소득월액보험료 산정 기준과 소득평가율</title>
  <desc id="desc">보수 외 소득 연 2,000만원 초과분을 12개월로 나눠 소득평가율과 2026년 건강보험료율 7.19%를 곱해 소득월액보험료를 산정하며, 사업·이자·배당·기타소득은 100%, 연금·근로소득은 50%를 반영하고 월별 상한은 공단에서 확인. 지역가입자와 구분되는 별도 부과.</desc>

  <rect x="0" y="0" width="840" height="580" fill="#FBF7F0"/>

  <text x="32" y="46" font-size="24" font-weight="700" fill="#1A2B2A">직장인 보수외소득 건강보험료, 이렇게 매겨요</text>
  <text x="32" y="72" font-size="14" fill="#4A5856">월급 외 소득이 연 2,000만원을 넘으면 초과분에 소득월액보험료가 붙어요 (2026년 기준)</text>

  <!-- Formula flow -->
  <g font-size="13.5">
    <rect x="32" y="96" width="176" height="80" rx="12" fill="#E3F0EE" stroke="#0E7C72" stroke-width="1.5"/>
    <text x="120" y="124" text-anchor="middle" font-size="14" font-weight="700" fill="#0A5F58">1. 초과분 계산</text>
    <text x="120" y="146" text-anchor="middle" fill="#1A2B2A">연 보수외소득</text>
    <text x="120" y="164" text-anchor="middle" fill="#1A2B2A">- 2,000만원</text>

    <path d="M212 136 L240 136" stroke="#C2873B" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>

    <rect x="244" y="96" width="176" height="80" rx="12" fill="#F4EEE2" stroke="#0E7C72" stroke-width="1.5"/>
    <text x="332" y="124" text-anchor="middle" font-size="14" font-weight="700" fill="#0A5F58">2. 월 환산</text>
    <text x="332" y="146" text-anchor="middle" fill="#1A2B2A">÷ 12월</text>
    <text x="332" y="164" text-anchor="middle" fill="#1A2B2A">월 소득으로</text>

    <path d="M424 136 L452 136" stroke="#C2873B" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>

    <rect x="456" y="96" width="176" height="80" rx="12" fill="#F4EEE2" stroke="#0E7C72" stroke-width="1.5"/>
    <text x="544" y="124" text-anchor="middle" font-size="14" font-weight="700" fill="#0A5F58">3. 소득평가율</text>
    <text x="544" y="146" text-anchor="middle" fill="#1A2B2A">종류별 100%</text>
    <text x="544" y="164" text-anchor="middle" fill="#1A2B2A">또는 50%</text>

    <path d="M636 136 L664 136" stroke="#C2873B" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>

    <rect x="668" y="96" width="140" height="80" rx="12" fill="#E3F0EE" stroke="#0A5F58" stroke-width="1.5"/>
    <text x="738" y="124" text-anchor="middle" font-size="14" font-weight="700" fill="#0A5F58">4. 요율 적용</text>
    <text x="738" y="146" text-anchor="middle" fill="#1A2B2A">× 7.19%</text>
    <text x="738" y="164" text-anchor="middle" fill="#1A2B2A">= 월 보험료</text>
  </g>

  <!-- note bar -->
  <rect x="32" y="188" width="776" height="34" rx="8" fill="#F4EEE2" stroke="#C2873B" stroke-width="1.2"/>
  <text x="48" y="210" font-size="13" fill="#1A2B2A">월별 상한이 있어 무한정 오르지 않아요. 정확한 상한 금액과 내 보험료는 국민건강보험공단에서 확인하세요.</text>

  <!-- divider -->
  <line x1="32" y1="248" x2="808" y2="248" stroke="#E3DCCF" stroke-width="1.5"/>
  <text x="32" y="278" font-size="17" font-weight="700" fill="#1A2B2A">소득 종류별 소득평가율(반영 비율)</text>

  <!-- evaluation-rate table -->
  <g font-size="13">
    <rect x="32" y="292" width="388" height="38" fill="#0E7C72"/>
    <rect x="420" y="292" width="388" height="38" fill="#0E7C72"/>
    <text x="52" y="316" fill="#FBF7F0" font-weight="700">100% 반영</text>
    <text x="440" y="316" fill="#FBF7F0" font-weight="700">50% 반영</text>

    <rect x="32" y="330" width="388" height="44" fill="#F4EEE2"/>
    <rect x="420" y="330" width="388" height="44" fill="#F4EEE2"/>
    <text x="52" y="358" fill="#1A2B2A">사업 · 이자 · 배당 · 기타소득</text>
    <text x="440" y="358" fill="#1A2B2A">연금 · 근로소득</text>
  </g>

  <!-- divider 2 -->
  <line x1="32" y1="398" x2="808" y2="398" stroke="#E3DCCF" stroke-width="1.5"/>
  <text x="32" y="428" font-size="17" font-weight="700" fill="#1A2B2A">직장가입자 소득월액보험료 vs 지역가입자</text>

  <!-- comparison table -->
  <g font-size="12.5">
    <rect x="32" y="442" width="200" height="38" fill="#0E7C72"/>
    <rect x="232" y="442" width="288" height="38" fill="#0E7C72"/>
    <rect x="520" y="442" width="288" height="38" fill="#0E7C72"/>
    <text x="48" y="466" fill="#FBF7F0" font-weight="700">구분</text>
    <text x="248" y="466" fill="#FBF7F0" font-weight="700">직장가입자 소득월액보험료</text>
    <text x="536" y="466" fill="#FBF7F0" font-weight="700">지역가입자 보험료</text>

    <rect x="32" y="480" width="200" height="42" fill="#F4EEE2"/>
    <rect x="232" y="480" width="288" height="42" fill="#F4EEE2"/>
    <rect x="520" y="480" width="288" height="42" fill="#F4EEE2"/>
    <text x="48" y="506" fill="#0A5F58" font-weight="700">부과 대상</text>
    <text x="248" y="506" fill="#1A2B2A">보수 외 소득(연 2천만 초과분)</text>
    <text x="536" y="506" fill="#1A2B2A">세대의 소득 + 재산 전체</text>

    <rect x="32" y="522" width="200" height="42" fill="#FBF7F0"/>
    <rect x="232" y="522" width="288" height="42" fill="#FBF7F0"/>
    <rect x="520" y="522" width="288" height="42" fill="#FBF7F0"/>
    <text x="48" y="548" fill="#B5462F" font-weight="700">부담 주체</text>
    <text x="248" y="548" fill="#1A2B2A">본인 100%(사업주 분담 없음)</text>
    <text x="536" y="548" fill="#1A2B2A">본인 100%</text>
  </g>

  <text x="32" y="574" font-size="11.5" fill="#8A938F">자료: 국민건강보험법 시행령 제41조, 국민건강보험공단 안내, 보건복지부 2026년 요율 보도자료. 일반 정보.</text>

  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#C2873B"/>
    </marker>
  </defs>
</svg>
