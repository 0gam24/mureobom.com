<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" role="img" aria-labelledby="title desc" font-family="'IBM Plex Sans KR', system-ui, sans-serif">
  <title id="title">단기연체와 장기연체 등록 기준 비교, 상환 후 기록 보존 타임라인</title>
  <desc id="desc">단기연체는 30만원 30일 이상, 장기연체는 100만원 3개월(약 90일) 이상 등록. 상환해도 단일 단기연체이력은 1년(반복 연체는 3년), 법상 최장 5년 범위에서 공유됩니다.</desc>

  <rect x="0" y="0" width="760" height="620" fill="#FBF7F0"/>

  <text x="32" y="46" font-size="24" font-weight="700" fill="#1A2B2A">연체정보 등록 기준과 상환 후 보존 기간</text>
  <text x="32" y="72" font-size="14" fill="#4A5856">금융위 개인신용평가체계 종합 개선방안(2018-12-27 발표, 2019-01-14 시행) 기준 · 2026년 7월</text>

  <!-- 단기연체 패널 -->
  <rect x="32" y="96" width="340" height="188" rx="12" fill="#E3F0EE" stroke="#0E7C72" stroke-width="1.5"/>
  <text x="52" y="128" font-size="18" font-weight="700" fill="#0A5F58">단기연체</text>
  <text x="52" y="158" font-size="15" fill="#1A2B2A">등록·공유 기준</text>
  <text x="52" y="186" font-size="22" font-weight="700" fill="#0E7C72">30만원 이상 &amp; 30일 이상</text>
  <line x1="52" y1="204" x2="352" y2="204" stroke="#E3DCCF" stroke-width="1"/>
  <text x="52" y="230" font-size="14" fill="#4A5856">상환 후 연체이력 공유 기간</text>
  <text x="52" y="258" font-size="18" font-weight="700" fill="#C2873B">완제 후 1년 반영(반복 3년)</text>

  <!-- 장기연체 패널 -->
  <rect x="392" y="96" width="336" height="188" rx="12" fill="#F4EEE2" stroke="#B5462F" stroke-width="1.5"/>
  <text x="412" y="128" font-size="18" font-weight="700" fill="#B5462F">장기연체</text>
  <text x="412" y="158" font-size="15" fill="#1A2B2A">등록 기준</text>
  <text x="412" y="186" font-size="22" font-weight="700" fill="#B5462F">100만원 이상 &amp; 3개월 이상</text>
  <text x="412" y="210" font-size="13" fill="#8A938F">3개월 = 약 90일. 단기·장기 경계선</text>
  <line x1="412" y1="224" x2="708" y2="224" stroke="#E3DCCF" stroke-width="1"/>
  <text x="412" y="250" font-size="14" fill="#4A5856">법상 삭제 시한(사유 해소일 기준)</text>
  <text x="412" y="274" font-size="18" font-weight="700" fill="#1A2B2A">최장 5년 이내 삭제(법 제18조)</text>

  <!-- 타임라인 -->
  <text x="32" y="330" font-size="17" font-weight="700" fill="#1A2B2A">상환해도 바로 지워지지 않아요: 기록 흐름</text>

  <line x1="60" y1="392" x2="700" y2="392" stroke="#E3DCCF" stroke-width="4"/>

  <!-- 노드1 -->
  <circle cx="120" cy="392" r="13" fill="#0E7C72"/>
  <text x="120" y="397" font-size="13" font-weight="700" fill="#FBF7F0" text-anchor="middle">1</text>
  <text x="120" y="432" font-size="14" font-weight="700" fill="#1A2B2A" text-anchor="middle">연체 발생</text>
  <text x="120" y="452" font-size="12" fill="#4A5856" text-anchor="middle">금액·기일 초과</text>

  <!-- 노드2 -->
  <circle cx="310" cy="392" r="13" fill="#0E7C72"/>
  <text x="310" y="397" font-size="13" font-weight="700" fill="#FBF7F0" text-anchor="middle">2</text>
  <text x="310" y="432" font-size="14" font-weight="700" fill="#1A2B2A" text-anchor="middle">기준 충족 시 등록</text>
  <text x="310" y="452" font-size="12" fill="#4A5856" text-anchor="middle">신용정보원 집중, CB사 공유</text>

  <!-- 노드3 -->
  <circle cx="500" cy="392" r="13" fill="#C2873B"/>
  <text x="500" y="397" font-size="13" font-weight="700" fill="#FBF7F0" text-anchor="middle">3</text>
  <text x="500" y="432" font-size="14" font-weight="700" fill="#1A2B2A" text-anchor="middle">상환(사유 해소)</text>
  <text x="500" y="452" font-size="12" fill="#4A5856" text-anchor="middle">등록정보는 해제되나</text>

  <!-- 노드4 -->
  <circle cx="660" cy="392" r="13" fill="#B5462F"/>
  <text x="660" y="397" font-size="13" font-weight="700" fill="#FBF7F0" text-anchor="middle">4</text>
  <text x="660" y="432" font-size="14" font-weight="700" fill="#1A2B2A" text-anchor="middle">연체이력 보존</text>
  <text x="660" y="452" font-size="12" fill="#4A5856" text-anchor="middle">일정 기간 평가 반영</text>

  <!-- 하단 요약 박스 -->
  <rect x="32" y="486" width="696" height="104" rx="12" fill="#F4EEE2" stroke="#E3DCCF" stroke-width="1"/>
  <text x="52" y="516" font-size="15" font-weight="700" fill="#0A5F58">기억할 점</text>
  <text x="52" y="542" font-size="13.5" fill="#1A2B2A">· 소액·수일 지연은 등록 대상 아님(하한 30만원 &amp; 30일). '하루=신용불량'은 오해예요.</text>
  <text x="52" y="565" font-size="13.5" fill="#1A2B2A">· 갚아도 즉시 삭제 아님: 단일 단기연체이력 1년, 법상 최장 5년 범위에서 공유·평가 반영돼요.</text>
  <text x="52" y="583" font-size="12" fill="#8A938F">최근 5년 2건 이상 반복 연체는 3년으로 더 길게 유지될 수 있어요.</text>
</svg>
