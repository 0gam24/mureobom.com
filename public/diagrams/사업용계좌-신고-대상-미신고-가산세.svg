<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" font-family="'IBM Plex Sans KR', system-ui, sans-serif">
  <defs>
    <marker id="arw" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#4A5856"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="820" height="500" fill="#FBF7F0"/>

  <text x="30" y="40" font-size="22" font-weight="700" fill="#0A5F58">사업용계좌 신고·사용 가산세 판별 흐름</text>
  <text x="30" y="64" font-size="13" fill="#8A938F">복식부기의무자 여부부터 확인하고, 신고·사용 단계별로 가산세가 갈려요 (소득세법 제160조의5·제81조의8)</text>

  <!-- A: 복식부기의무자 -->
  <rect x="150" y="92" width="250" height="52" rx="10" fill="#E3F0EE" stroke="#0E7C72" stroke-width="1.5"/>
  <text x="275" y="124" text-anchor="middle" font-size="15" font-weight="600" fill="#1A2B2A">복식부기의무자인가요?</text>

  <!-- A -> 간편장부 (right) -->
  <line x1="400" y1="118" x2="500" y2="118" stroke="#4A5856" stroke-width="1.5" marker-end="url(#arw)"/>
  <text x="450" y="110" text-anchor="middle" font-size="12" fill="#4A5856">아니오</text>
  <rect x="505" y="92" width="285" height="52" rx="10" fill="#F4EEE2" stroke="#E3DCCF" stroke-width="1.5"/>
  <text x="647" y="115" text-anchor="middle" font-size="14" font-weight="600" fill="#1A2B2A">간편장부대상자</text>
  <text x="647" y="134" text-anchor="middle" font-size="13" fill="#4A5856">신고 의무 없음</text>

  <!-- A -> B down -->
  <line x1="275" y1="144" x2="275" y2="176" stroke="#4A5856" stroke-width="1.5" marker-end="url(#arw)"/>
  <text x="288" y="166" font-size="12" fill="#4A5856">예</text>

  <!-- B: 신고 여부 -->
  <rect x="150" y="178" width="250" height="52" rx="10" fill="#E3F0EE" stroke="#0E7C72" stroke-width="1.5"/>
  <text x="275" y="210" text-anchor="middle" font-size="15" font-weight="600" fill="#1A2B2A">6개월 안에 신고했나요?</text>

  <!-- B -> 미신고 가산세 (right) -->
  <line x1="400" y1="204" x2="500" y2="204" stroke="#4A5856" stroke-width="1.5" marker-end="url(#arw)"/>
  <text x="450" y="196" text-anchor="middle" font-size="12" fill="#4A5856">아니오</text>
  <rect x="505" y="166" width="285" height="98" rx="10" fill="#F4EEE2" stroke="#C2873B" stroke-width="1.5"/>
  <text x="520" y="188" font-size="13" font-weight="700" fill="#B5462F">미신고 가산세 = 아래 중 큰 금액</text>
  <text x="520" y="212" font-size="12" fill="#1A2B2A">① 수입금액 × 미신고기간/365 × 0.2%</text>
  <text x="520" y="234" font-size="12" fill="#1A2B2A">② 사용대상금액 합계 × 0.2%</text>
  <text x="520" y="254" font-size="11" fill="#8A938F">0.2% = 1천분의 2</text>

  <!-- B -> C down -->
  <line x1="275" y1="230" x2="275" y2="262" stroke="#4A5856" stroke-width="1.5" marker-end="url(#arw)"/>
  <text x="288" y="252" font-size="12" fill="#4A5856">예</text>

  <!-- C: 사용 여부 -->
  <rect x="150" y="264" width="250" height="52" rx="10" fill="#E3F0EE" stroke="#0E7C72" stroke-width="1.5"/>
  <text x="275" y="290" text-anchor="middle" font-size="15" font-weight="600" fill="#1A2B2A">대금·인건비·임차료를</text>
  <text x="275" y="308" text-anchor="middle" font-size="15" font-weight="600" fill="#1A2B2A">사업용계좌로 처리했나요?</text>

  <!-- C -> 미사용 가산세 (right) -->
  <line x1="400" y1="290" x2="500" y2="290" stroke="#4A5856" stroke-width="1.5" marker-end="url(#arw)"/>
  <text x="450" y="282" text-anchor="middle" font-size="12" fill="#4A5856">아니오</text>
  <rect x="505" y="272" width="285" height="52" rx="10" fill="#F4EEE2" stroke="#C2873B" stroke-width="1.5"/>
  <text x="647" y="295" text-anchor="middle" font-size="13" font-weight="700" fill="#B5462F">미사용 가산세</text>
  <text x="647" y="314" text-anchor="middle" font-size="12" fill="#1A2B2A">미사용금액 × 0.2%</text>

  <!-- C -> 최종 down -->
  <line x1="275" y1="316" x2="275" y2="348" stroke="#4A5856" stroke-width="1.5" marker-end="url(#arw)"/>
  <text x="288" y="338" font-size="12" fill="#4A5856">예</text>

  <!-- 최종: 가산세 없음 -->
  <rect x="150" y="350" width="250" height="52" rx="10" fill="#0E7C72" stroke="#0A5F58" stroke-width="1.5"/>
  <text x="275" y="382" text-anchor="middle" font-size="15" font-weight="700" fill="#FBF7F0">가산세 없음 (성실 이행)</text>

  <line x1="30" y1="432" x2="790" y2="432" stroke="#E3DCCF" stroke-width="1"/>
  <text x="30" y="458" font-size="12" fill="#4A5856">가산세는 종합소득 산출세액이 없어도 부과돼요 (제81조의8 제2항). 값은 해당 과세기간 기준으로 달라져요.</text>
  <text x="30" y="478" font-size="11" fill="#8A938F">출처: 소득세법 제160조의5·제81조의8(국가법령정보센터), 국세청 국세상담센터 Q&amp;A</text>
</svg>
