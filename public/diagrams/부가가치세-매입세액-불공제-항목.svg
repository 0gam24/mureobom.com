<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 690" role="img" aria-labelledby="t d" font-family="'IBM Plex Sans KR', system-ui, sans-serif">
  <title id="t">부가가치세 매입세액 불공제 항목 요약</title>
  <desc id="d">부가가치세법 제39조 기준 공제 안 되는 매입세액 6가지: 세금계산서 미수취(제1·2호), 사업 무관 지출(제4호), 비영업용 소형승용차(제5호), 기업업무추진비(제6호), 면세·토지 관련(제7호), 등록 전 매입세액(제8호). 각 항목의 근거 호와 예외 표시.</desc>

  <rect x="0" y="0" width="720" height="690" fill="#FBF7F0"/>

  <!-- header -->
  <text x="36" y="52" font-size="26" font-weight="700" fill="#1A2B2A">부가세 매입세액, 공제 안 되는 항목</text>
  <text x="36" y="80" font-size="15" fill="#4A5856">부가가치세법 제39조 기준 (2026년 현행)</text>

  <!-- formula strip -->
  <rect x="36" y="100" width="648" height="60" rx="10" fill="#E3F0EE"/>
  <text x="60" y="137" font-size="17" font-weight="600" fill="#0A5F58">납부세액 = 매출세액 − 공제 매입세액</text>
  <text x="430" y="137" font-size="14" fill="#4A5856">불공제가 늘면 납부세액도 늘어요</text>

  <!-- rows -->
  <!-- row template height 68, start y 180 -->
  <g>
    <rect x="36" y="180" width="648" height="60" rx="10" fill="#F4EEE2"/>
    <rect x="36" y="180" width="6" height="60" rx="3" fill="#B5462F"/>
    <text x="60" y="205" font-size="16" font-weight="600" fill="#1A2B2A">세금계산서 미수취·부실기재</text>
    <text x="60" y="227" font-size="13" fill="#4A5856">미발급·필요적 기재사항 누락·허위</text>
    <rect x="596" y="196" width="72" height="28" rx="14" fill="#0E7C72"/>
    <text x="632" y="215" font-size="13" font-weight="600" fill="#FBF7F0" text-anchor="middle">제1·2호</text>
  </g>

  <g>
    <rect x="36" y="252" width="648" height="60" rx="10" fill="#F4EEE2"/>
    <rect x="36" y="252" width="6" height="60" rx="3" fill="#B5462F"/>
    <text x="60" y="277" font-size="16" font-weight="600" fill="#1A2B2A">사업과 직접 관련 없는 지출</text>
    <text x="60" y="299" font-size="13" fill="#4A5856">본인 식대 등 사업 무관 지출</text>
    <rect x="608" y="268" width="60" height="28" rx="14" fill="#0E7C72"/>
    <text x="638" y="287" font-size="13" font-weight="600" fill="#FBF7F0" text-anchor="middle">제4호</text>
  </g>

  <g>
    <rect x="36" y="324" width="648" height="60" rx="10" fill="#F4EEE2"/>
    <rect x="36" y="324" width="6" height="60" rx="3" fill="#B5462F"/>
    <text x="60" y="349" font-size="16" font-weight="600" fill="#1A2B2A">비영업용 소형승용차 구입·유지</text>
    <text x="60" y="371" font-size="13" fill="#C2873B">예외: 영업용·화물차·경차·9인승 이상은 공제</text>
    <rect x="608" y="340" width="60" height="28" rx="14" fill="#0E7C72"/>
    <text x="638" y="359" font-size="13" font-weight="600" fill="#FBF7F0" text-anchor="middle">제5호</text>
  </g>

  <g>
    <rect x="36" y="396" width="648" height="60" rx="10" fill="#F4EEE2"/>
    <rect x="36" y="396" width="6" height="60" rx="3" fill="#B5462F"/>
    <text x="60" y="421" font-size="16" font-weight="600" fill="#1A2B2A">기업업무추진비(접대비) 관련</text>
    <text x="60" y="443" font-size="13" fill="#4A5856">거래처 접대·선물 등 유사 비용</text>
    <rect x="608" y="412" width="60" height="28" rx="14" fill="#0E7C72"/>
    <text x="638" y="431" font-size="13" font-weight="600" fill="#FBF7F0" text-anchor="middle">제6호</text>
  </g>

  <g>
    <rect x="36" y="468" width="648" height="60" rx="10" fill="#F4EEE2"/>
    <rect x="36" y="468" width="6" height="60" rx="3" fill="#B5462F"/>
    <text x="60" y="493" font-size="16" font-weight="600" fill="#1A2B2A">면세사업·토지 관련</text>
    <text x="60" y="515" font-size="13" fill="#4A5856">면세사업 투자, 토지 중개수수료·철거비</text>
    <rect x="608" y="484" width="60" height="28" rx="14" fill="#0E7C72"/>
    <text x="638" y="503" font-size="13" font-weight="600" fill="#FBF7F0" text-anchor="middle">제7호</text>
  </g>

  <g>
    <rect x="36" y="540" width="648" height="60" rx="10" fill="#F4EEE2"/>
    <rect x="36" y="540" width="6" height="60" rx="3" fill="#B5462F"/>
    <text x="60" y="565" font-size="16" font-weight="600" fill="#1A2B2A">사업자등록 신청 전 매입세액</text>
    <text x="60" y="587" font-size="13" fill="#C2873B">예외: 과세기간 종료 후 20일 내 등록 시 소급</text>
    <rect x="608" y="556" width="60" height="28" rx="14" fill="#0E7C72"/>
    <text x="638" y="575" font-size="13" font-weight="600" fill="#FBF7F0" text-anchor="middle">제8호</text>
  </g>

  <!-- footer note -->
  <text x="36" y="640" font-size="13" fill="#8A938F">적격증빙이 있어도 위 항목이면 공제되지 않아요 (증빙 요건과 제39조를 함께 확인)</text>
  <line x1="36" y1="656" x2="684" y2="656" stroke="#E3DCCF" stroke-width="1"/>
  <text x="36" y="678" font-size="12" fill="#8A938F">출처: 부가가치세법 제39조 · 국세청 안내 (일반정보)</text>
</svg>
