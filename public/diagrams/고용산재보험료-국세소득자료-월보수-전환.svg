<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="1200" height="850" role="img" aria-label="사회보험 4종이 실제 소득을 보험료에 반영하는 시점 비교. 고용·산재보험은 2027년 1월 1일부터 해당 연도 개인별 월 보수 기준으로 바뀐다">
  <rect x="0" y="0" width="1200" height="850" fill="#FBF7F0"/>

  <text x="48" y="64" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="38" font-weight="700" fill="#1A2B2A">사회보험 4종, 실제 소득이 보험료에 반영되는 시점</text>
  <text x="48" y="104" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="20" fill="#4A5856">2026년 10월 기준 · 고용·산재는 2027년 1월 1일 시행으로 자리를 옮깁니다 (법률 제21472호)</text>

  <!-- 헤더 -->
  <rect x="48" y="140" width="1104" height="48" fill="#0A5F58"/>
  <text x="68" y="171" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="18" font-weight="700" fill="#FBF7F0">보험</text>
  <text x="348" y="171" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="18" font-weight="700" fill="#FBF7F0">부과 기준</text>
  <text x="638" y="171" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="18" font-weight="700" fill="#FBF7F0">정산·조정 방식</text>
  <text x="918" y="171" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="18" font-weight="700" fill="#FBF7F0">근거 조문</text>

  <!-- 행 배경 -->
  <rect x="48" y="188" width="1104" height="130" fill="#F4EEE2" stroke="#E3DCCF" stroke-width="2"/>
  <rect x="48" y="318" width="1104" height="130" fill="#E3F0EE" stroke="#E3DCCF" stroke-width="2"/>
  <rect x="48" y="448" width="1104" height="130" fill="#F4EEE2" stroke="#E3DCCF" stroke-width="2"/>
  <rect x="48" y="578" width="1104" height="130" fill="#F4EEE2" stroke="#E3DCCF" stroke-width="2"/>

  <!-- 열 구분선 -->
  <line x1="328" y1="188" x2="328" y2="708" stroke="#E3DCCF" stroke-width="2"/>
  <line x1="618" y1="188" x2="618" y2="708" stroke="#E3DCCF" stroke-width="2"/>
  <line x1="898" y1="188" x2="898" y2="708" stroke="#E3DCCF" stroke-width="2"/>

  <!-- 1행: 고용·산재 (종전) -->
  <text x="68" y="234" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="20" font-weight="700" fill="#1A2B2A">고용보험·산재보험</text>
  <text x="68" y="266" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="16" fill="#8A938F">2026년 현재</text>
  <text x="348" y="234" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="19" fill="#1A2B2A">개인별 월평균보수</text>
  <text x="348" y="266" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="17" fill="#4A5856">전년도 기준</text>
  <text x="638" y="234" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="18" fill="#1A2B2A">매년 3월 15일</text>
  <text x="638" y="266" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="18" fill="#1A2B2A">보수총액 신고 후 정산</text>
  <text x="918" y="230" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="15" fill="#4A5856">법 제16조의3,</text>
  <text x="918" y="256" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="15" fill="#4A5856">제16조의10,</text>
  <text x="918" y="282" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="15" fill="#4A5856">제16조의9, 주요내용</text>

  <!-- 2행: 고용·산재 (2027.1.1) -->
  <text x="68" y="364" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="20" font-weight="700" fill="#0A5F58">고용보험·산재보험</text>
  <text x="68" y="396" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="16" font-weight="700" fill="#0E7C72">2027년 1월 1일 시행</text>
  <text x="348" y="364" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="19" font-weight="700" fill="#0A5F58">해당 연도</text>
  <text x="348" y="396" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="19" font-weight="700" fill="#0A5F58">개인별 월 보수</text>
  <text x="638" y="364" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="18" fill="#1A2B2A">매월 월 보수 신고</text>
  <text x="638" y="396" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="18" fill="#1A2B2A">국세 소득자료로 갈음</text>
  <text x="918" y="360" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="15" fill="#4A5856">법률 제21472호</text>
  <text x="918" y="386" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="15" fill="#4A5856">개정문·부칙</text>

  <!-- 3행: 건강보험 -->
  <text x="68" y="494" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="20" font-weight="700" fill="#1A2B2A">국민건강보험</text>
  <text x="348" y="494" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="19" fill="#1A2B2A">보수월액</text>
  <text x="348" y="526" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="17" fill="#4A5856">지급받는 보수 기준</text>
  <text x="638" y="494" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="17" fill="#1A2B2A">전년도 보수 총액 통보 후</text>
  <text x="638" y="524" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="17" fill="#1A2B2A">반환·추가징수 정산</text>
  <text x="918" y="490" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="15" fill="#4A5856">건강보험법 제70조,</text>
  <text x="918" y="516" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="15" fill="#4A5856">시행령 제35조·제39조</text>

  <!-- 4행: 국민연금 -->
  <text x="68" y="624" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="20" font-weight="700" fill="#1A2B2A">국민연금</text>
  <text x="348" y="624" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="19" fill="#1A2B2A">기준소득월액</text>
  <text x="348" y="656" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="17" fill="#4A5856">전년도 소득 기준</text>
  <text x="638" y="620" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="17" fill="#1A2B2A">정산 절차 대신</text>
  <text x="638" y="648" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="17" fill="#1A2B2A">매년 7월 기준소득월액</text>
  <text x="638" y="676" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="17" fill="#1A2B2A">재결정</text>
  <text x="918" y="620" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="15" fill="#4A5856">국민연금법</text>
  <text x="918" y="646" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="15" fill="#4A5856">시행령 제7조</text>

  <!-- 강조 테두리 (2행) -->
  <rect x="48" y="318" width="1104" height="130" fill="none" stroke="#0E7C72" stroke-width="3"/>

  <!-- 하단 강조 -->
  <rect x="48" y="718" width="1104" height="112" rx="14" fill="#F4EEE2" stroke="#C2873B" stroke-width="2"/>
  <text x="76" y="758" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="22" font-weight="700" fill="#0A5F58">보수총액 신고가 폐지되는 해에도 2026년분은 한 번 더</text>
  <text x="76" y="790" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="18" fill="#1A2B2A">2026년에 지급한 보수총액은 2027년 3월 15일까지 공단에 신고 (부칙 제2조).</text>
  <text x="76" y="818" font-family="'IBM Plex Sans KR', system-ui, sans-serif" font-size="18" fill="#4A5856">정산 조문(제16조의9)도 삭제가 아니라 국세 소득자료 조사 방식으로 개정됩니다.</text>
</svg>
